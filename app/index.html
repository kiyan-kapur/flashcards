{id:"lx1",ch:1,topic:"Study strategies",heat:"orange",
 q:"Your lecture compared three ways of capturing a reading. Which is most effective, and why?",
 o:["A complete transcript of everything in the section","A skeletal outline of the main points per section","Highlighting every sentence that seems important","Rereading the section twice in one sitting"],a:1,
 why:"A skeletal outline beats both a complete outline and a full transcript. The procedure is: read the whole section first, work out its organization, write down the main points per section, then use that outline as a cue to retrieve the supporting details from memory.",
 trap:"A transcript feels thorough, but verbatim transcribing is the documented pitfall of note-taking. The outline works because it forces you to retrieve the detail rather than reread it."},
{id:"lx2",ch:1,topic:"Study strategies",heat:"orange",
 q:"Students typically prefer typing notes to writing them by hand. Your lecture used this as an example of what?",
 o:["A genuine efficiency gain that research supports","Intuition and personal preference leading us astray","A difference that disappears once notes are reviewed","Evidence that note-taking format does not matter"],a:1,
 why:"Typing feels easier and more efficient, we like having devices handy, and students believe they can dodge the dangers of multitasking. Handwritten notes nevertheless come out ahead, especially when they are reviewed afterwards, because writing by hand encourages more active processing.",
 trap:"Option C inverts the finding. Reviewing makes the handwriting advantage larger, not smaller."},
{id:"lx3",ch:2,topic:"Ecological validity",heat:"orange",
 q:"Studies on whether background music harms reading comprehension were described as varying in ecological validity. What does that term mean?",
 o:["Whether the study can be replicated by other labs","How closely the study's conditions resemble real-world settings","Whether the sample represents the wider population","Whether the measure is consistent across testing occasions"],a:1,
 why:"Ecological validity is about how well a study's conditions and task match the situations the finding is meant to apply to. A lab study of memory for digit strings tells you less about studying for an exam than a study run in a real classroom.",
 trap:"Option C is representativeness of the sample and option D is reliability. Both are real concepts, and neither is what ecological validity means."},
{id:"lx4",ch:2,topic:"Data collection methods",heat:"orange",
 q:"Your lecture set out four ways psychologists collect data. Which pairing of method and its main limitation is correct?",
 o:["Self-report: expensive and hard to administer","Observation: participants may behave differently because they are watched","Physiological measures: highly reactive to being observed","Behaviour and performance measures: people cannot or will not tell the truth"],a:1,
 why:"The four methods are observation, self-report, behaviour or performance, and physiological. Observation risks participant reactivity plus observer bias or expectancy. Self-report is direct and cheap but people cannot or will not always tell the truth. Performance measures like reaction time are less reactive. Physiological measures are objective and less reactive but expensive.",
 trap:"Each wrong option here is a real limitation attached to the wrong method, which is exactly how this gets tested."},
{id:"lx5",ch:2,topic:"Operational definitions",heat:"orange",
 q:"Asked to operationally define aggression, four researchers each pick a different measure. What does this illustrate?",
 o:["One of them must be measuring the concept incorrectly","There is no single gold standard, so the definition must be stated and defended","Aggression cannot be studied scientifically","Operational definitions are unnecessary for well-known concepts"],a:1,
 why:"An operational definition specifies exactly how a concept is observed and measured in that study, and for most psychological constructs there is no single gold-standard measure. That is why the definition has to be made explicit rather than assumed.",
 trap:"Option A assumes one true measure exists. The point is the opposite: different defensible operationalisations can coexist, which is also why results sometimes disagree across studies."},
{id:"lx6",ch:1,topic:"Diversity in psychology",heat:"yellow",
 q:"Your lecture listed concrete harms that followed from psychology being conducted largely by one narrow group. Which is an example of such a harm?",
 o:["Studies became too difficult for general audiences to read","A diagnostic manual classified homosexuality as a disorder","Researchers stopped using experiments in favour of case studies","Psychology split into five separate pillars"],a:1,
 why:"The harms named include scientific racism, now-rejected claims about women's intellect, and a diagnostic manual that classified homosexuality as a disorder. The argument is that who does the science shapes what the science concludes.",
 trap:"This is tested as a concept, not as a name or a date. You need the kind of harm, not who said what or when."},
{id:"lx7",ch:4,topic:"Action potential",heat:"red",
 q:"Put the phases of an action potential in the order your lecture gave them.",
 o:["Repolarisation, depolarisation, refractory period, resting state","Depolarisation, repolarisation, refractory period, resting state","Refractory period, depolarisation, repolarisation, resting state","Depolarisation, refractory period, repolarisation, resting state"],a:1,
 why:"Depolarisation is the rise as sodium enters, repolarisation is the fall as potassium leaves, then there is a refractory period before the cell returns to its resting state.",
 trap:"Depolarisation and repolarisation are easy to swap under time pressure. Anchor on the fact that the cell starts negative, so it has to depolarise first."},
{id:"lx8",ch:4,topic:"Action potential",heat:"red",
 q:"During the refractory period, what is true?",
 o:["The action potential is larger than usual","Stimulation will not produce an action potential","The neuron fires continuously","Neurotransmitter cannot be released"],a:1,
 why:"The refractory period is a brief window during which stimulation will not trigger another action potential. It limits how fast a neuron can fire, which matters because firing rate is how intensity gets coded.",
 trap:"Option A contradicts all-or-none: the action potential has a fixed amplitude and never varies in size."},
{id:"lx9",ch:4,topic:"Action potential",heat:"orange",
 q:"Your lecture described propagation of the action potential. Which statement is accurate?",
 o:["It spreads outward in both directions from the middle of the axon","It moves along the axon like a wave, always in one direction","It jumps instantly to the axon terminal","It travels backwards from the terminal to the dendrites"],a:1,
 why:"The action potential propagates along the axon like a wave and always travels in one direction, from the cell body toward the axon terminals. In myelinated axons it hops node to node, which makes it faster.",
 trap:"Bidirectional spread is the intuitive guess if you picture a ripple. The refractory period behind the wave is part of what keeps it one-way."},
{id:"lx10",ch:4,topic:"Brain techniques",heat:"orange",
 q:"Your lecture split neuroimaging into structural and functional. Which pairing is right?",
 o:["MRI is functional; EEG is structural","MRI is structural; EEG is functional and detects fast responses in milliseconds","Both MRI and EEG are structural","Both MRI and EEG are functional"],a:1,
 why:"MRI uses magnetic fields and radio waves to image brain structure. EEG measures electrical activity at the surface of the brain and detects fast responses on the scale of milliseconds, so it is functional.",
 trap:"The letters are nearly the same, so the structural-versus-functional split is the thing to hold, not the acronym. fMRI is the functional member of the MRI family."},
{id:"lx11",ch:4,topic:"Brain techniques",heat:"orange",
 q:"Before surgery for severe epilepsy, a surgeon electrically stimulates points on the exposed cortex and the patient reports sights, sounds and feelings. What does this approach demonstrate?",
 o:["That imaging can localise function without intervening","That stimulating different areas reveals what those areas do","That lesions are required to establish function","That electrical stimulation is a treatment rather than a mapping tool"],a:1,
 why:"Stimulating different cortical areas and recording what the patient experiences was how much early mapping of function was done. It belongs to the manipulate-the-brain-and-observe-behaviour strategy, alongside lesions and TMS.",
 trap:"Option A describes imaging, which records rather than intervenes, and therefore supports weaker causal claims than stimulation does."},
{id:"lx12",ch:4,topic:"Lobes and deficits",heat:"orange",
 q:"A patient's eyes and basic visual pathways work normally and their memory is intact, but they cannot recognise familiar objects by sight. What is this, and how does it differ from cortical blindness?",
 o:["Cortical blindness; the two terms mean the same thing","Visual agnosia; the person sees but cannot recognise, whereas cortical blindness is loss of sight itself","Prosopagnosia; it only ever affects faces","Auditory agnosia; the deficit is in the temporal lobe"],a:1,
 why:"Agnosia is loss of the ability to recognise familiar objects, people, shapes, sounds or smells even though the primary senses and basic memory are working. Cortical blindness is loss of vision itself. They follow lesions at different points along the visual processing pathway.",
 trap:"Prosopagnosia is one specific agnosia, restricted to faces. Visual agnosia is the broader category, and the temporal lobe equivalent for sound is auditory agnosia, which pairs with cortical deafness the same way."},
{id:"lx13",ch:4,topic:"Deep structures",heat:"yellow",
 q:"Which structure was grouped with the limbic system in your lecture, alongside the amygdala and hippocampus?",
 o:["The cerebellum","The cingulate","The medulla","The pons"],a:1,
 why:"The cingulate was listed as part of the limbic system with the amygdala, which detects threat and biologically relevant ambiguity and helps form emotional memory, and the hippocampus, which handles acquisition of new memories.",
 trap:"The cerebellum, medulla and pons are all real structures with real jobs, balance and coordination, breathing and heart rate, and sleeping and waking, but none of them is limbic."},
{id:"c1",ch:2,topic:"Correlation",heat:"red",
 q:"A researcher surveys 300 students and finds that the more hours a student spends on their phone during lecture, the lower their exam score, r = −.43. In the same sample, hours of sleep and exam score correlate at r = +.31. Which statement is accurate?",
 o:["The phone finding is the stronger relationship, and it shows that phone use lowers exam scores","The phone finding is the stronger relationship, but neither result can establish a cause","The sleep finding is the stronger relationship, because positive correlations are stronger than negative ones","The two findings are equally strong, because both fall in the weak-to-moderate range"],a:1,
 why:"Strength is distance from zero, so .43 beats .31 regardless of sign. And no correlational study, however strong, can establish causation.",
 trap:"Option A gets the strength right and then takes the causal leap. That combination is the single most common way this question is failed."},
{id:"c2",ch:2,topic:"Correlation",heat:"red",
 q:"Ice cream sales and drowning deaths correlate at +.72 across the year. What is the best interpretation?",
 o:["Eating ice cream impairs swimming ability","A third variable, such as hot weather, drives both","The correlation is illusory and does not exist in the data","Drowning deaths cause an increase in ice cream sales"],a:1,
 why:"When A and B correlate, one of three things is true: A causes B, B causes A, or a third variable causes both. Here the third variable is obvious.",
 trap:"Option C confuses two different ideas. An illusory correlation is a false or coincidental relationship people believe in. This correlation is genuinely in the data, it just is not causal."},
{id:"c3",ch:2,topic:"Correlation",heat:"red",
 q:"In a correlation coefficient, the sign tells you ______ and the distance from zero tells you ______.",
 o:["the strength; the direction","the direction; the strength","whether there is causation; how reliable the finding is","statistical significance; effect size"],a:1,
 why:"Sign is direction, positive meaning both move together and negative meaning they move oppositely. Distance from zero is strength, so −.70 and +.70 are exactly equally strong.",
 trap:"Reversing these is the classic two-blank error, and it is what makes people rank +.31 above −.43."},
{id:"c4",ch:2,topic:"Correlation",heat:"red",
 q:"A parent is convinced their child's symptoms began right after a vaccination and concludes the vaccine caused them. Very large studies find no relationship at all. This belief is best described as:",
 o:["An illusory correlation","A negative correlation","A confound","A placebo effect"],a:0,
 why:"An illusory correlation is a false or coincidental relationship, and this is the textbook's headline example. Most symptoms of autism emerge around the same age children are vaccinated, which manufactures the appearance of a link.",
 trap:"A confound is a second variable that co-varies with an independent variable inside an experiment. It is not the word for a relationship someone wrongly believes exists."},
{id:"c5",ch:2,topic:"Correlation",heat:"red",
 q:"Four studies report a relationship with exam performance. Which represents the strongest relationship?",
 o:["r = +.28","r = −.61","r = +.45","r = −.09"],a:1,
 why:"Ignore the sign and read the distance from zero. .61 is the largest, so it is the strongest relationship, and its negative sign only tells you the variables move in opposite directions.",
 trap:"Picking +.45 because it is positive is exactly the misconception this item is built to catch."},
{id:"c6",ch:2,topic:"Correlation",heat:"red",
 q:"Teens who spend more time on social media report more depressive symptoms. Which conclusion is NOT justified by this finding?",
 o:["Social media use may increase depressive symptoms","Depressive symptoms may increase social media use","A third variable, such as poor sleep, may drive both","Reducing social media use would reduce depressive symptoms"],a:3,
 why:"The first three are the three legitimate readings of any correlation. The fourth is a prediction about what an intervention would do, which only an experiment can support.",
 trap:"Option D sounds like the responsible, practical takeaway, which is what makes it dangerous. A correlation gives you no licence to predict the effect of changing one variable."},

/* ---------- Ch 2: experiments (RED) ---------- */
{id:"e1",ch:2,topic:"IV and DV",heat:"red",
 q:"A researcher has half the participants drink caffeinated coffee and half drink decaf, then counts how many words each person recalls from a list. The independent variable is ______ and the dependent variable is ______.",
 o:["words recalled; type of coffee","type of coffee; words recalled","caffeine level; participant alertness","the participants; the word list"],a:1,
 why:"The independent variable is what the researcher manipulates, the dependent variable is what gets measured. The memory hook is “if I do X, people may do Y.” X is the IV, Y is the DV.",
 trap:"Option A is the straight reversal, and it is the most common distractor shape on this topic. The DV depends on the IV, which is where its name comes from."},
{id:"e2",ch:2,topic:"IV and DV",heat:"red",
 q:"A researcher asks whether feeling nervous makes people eat more chocolate. In this study, chocolate consumed is the:",
 o:["Independent variable","Dependent variable","Confounding variable","Operational definition"],a:1,
 why:"Chocolate is being measured as the outcome, so it is the dependent variable here. The same variable would be the IV if the question were whether eating chocolate makes people nervous.",
 trap:"This item tests whether you read the research question or just pattern-match the noun. A variable is not permanently an IV or a DV, its role depends on what is being asked."},
{id:"e3",ch:2,topic:"Confounds",heat:"red",
 q:"To test whether a funny video improves mood, a researcher shows the comedy to one group in a bright lounge with snacks, and a neutral documentary to another group in a windowless classroom. The main methodological problem is:",
 o:["The sample size is too small","A second variable, the setting, varies along with the video","Mood was not operationally defined","The researcher did not obtain informed consent"],a:1,
 why:"A confound is a second variable that changes along with the independent variable, so you cannot tell which one produced the effect. Everything other than the IV has to be held constant.",
 trap:"“Too few participants” is the standard wrong answer on confound questions. Adding participants would not fix this design at all, because the flaw is systematic, not random."},
{id:"e4",ch:2,topic:"Random assignment",heat:"red",
 q:"What is random assignment for?",
 o:["Making the sample representative of the wider population","Balancing pre-existing differences between groups, including ones the researcher cannot measure","Keeping participants unaware of which condition they are in","Ensuring the result reaches statistical significance"],a:1,
 why:"Sorting people into conditions by chance distributes pre-existing differences evenly, and it does this even for characteristics researchers cannot easily observe or measure.",
 trap:"Option A is random sampling, which is about who gets into the study at all. Random assignment is about what happens to them once they are in. Mixing these up is a very common error."},
{id:"e5",ch:2,topic:"Experimental control",heat:"red",
 q:"In a drug trial, neither the participants nor the researcher interacting with them knows who received the real medication. This design mainly controls for:",
 o:["Confounding variables in the physical environment","The expectations of both the participants and the experimenter","Bias in who was recruited into the study","Participants behaving unnaturally because they are observed"],a:1,
 why:"A double-blind design blocks expectation effects from both directions. Students told their rats were bred to be bright got faster-learning rats even though the rats were randomly assigned, purely through how they handled them.",
 trap:"Single-blind only blinds the participants and would not catch the experimenter's own expectations leaking into how they treat people."},
{id:"e6",ch:2,topic:"Placebo",heat:"red",
 q:"In a study, 41% of women taking a drug reported their sex lives had improved, and 43% taking an inert pill reported the same. The best conclusion is:",
 o:["The drug works, since 41% improved","The improvement is largely attributable to expectation rather than the drug itself","The study lacked a control group","The difference between 41% and 43% is statistically significant"],a:1,
 why:"A placebo is a fake treatment that isolates the effect of expectations. When the placebo group does just as well, expectation rather than the active ingredient is doing the work.",
 trap:"Option A quotes a real, impressive-sounding number. The whole point of a control group is that a number means nothing until you see what happened without the treatment."},
{id:"e7",ch:2,topic:"Study designs",heat:"red",
 q:"A psychologist wants to know whether a new study technique CAUSES better retention. Which design is required?",
 o:["A naturalistic observation of students studying","A survey with a large, representative sample","An experiment with random assignment to conditions","A correlational study of study habits and grades"],a:2,
 why:"Only an experiment permits a causal conclusion, because only there does the researcher manipulate the variable and randomly assign people to conditions.",
 trap:"A large representative sample makes a descriptive finding more generalizable, but no amount of sample size converts a descriptive or correlational design into a causal one."},
{id:"e8",ch:2,topic:"Statistics",heat:"red",
 q:"A study reports that a memory technique improved recall, p < .01. What does this tell you?",
 o:["The effect is large and practically important","A result this big is unlikely if there were truly no effect","The technique will work for 99% of students","The researcher has proven the hypothesis"],a:1,
 why:"Statistical significance is a statement about how likely the data would be if there were no real effect. It says nothing about the size of the effect.",
 trap:"Option A is the single biggest misconception in the chapter. A result can be significant and still be small and of little consequence in everyday life."},
{id:"e9",ch:2,topic:"Theory and hypothesis",heat:"orange",
 q:"“Anxiety will be measured as a participant's score on a twenty-item questionnaire.” This statement is a:",
 o:["Theory","Hypothesis","Operational definition","Confound"],a:2,
 why:"An operational definition specifies exactly how a concept is observed and measured in this particular study. It turns an abstract idea into something countable.",
 trap:"It looks like a hypothesis because it is precise, but it predicts nothing. It just tells you how one term will be pinned down."},
{id:"e10",ch:2,topic:"Theory and hypothesis",heat:"orange",
 q:"“People who are anxious about a threatening situation tend to seek out others facing the same threat.” This statement is a:",
 o:["Theory","Hypothesis","Operational definition","Replication"],a:1,
 why:"A hypothesis is a precise, testable statement derived from a theory, and it leads to specific predictions. This one sharpens the vague idea that misery loves company into something you could test.",
 trap:"A theory is the broader organized system of assumptions that the hypothesis is derived from. This statement is narrower than that and directly testable."},
{id:"e11",ch:2,topic:"Falsifiability",heat:"orange",
 q:"For a claim to be scientific, it must be stated so that:",
 o:["It can be confirmed by many supporting examples","It could be refuted if contrary evidence were found","Recognized experts in the field agree with it","It cannot be disproven by any observation"],a:1,
 why:"The principle of falsifiability requires that a scientist predict not just what will happen but what will not, taking the risk of being disconfirmed.",
 trap:"Option A describes confirmation, which is exactly what confirmation bias supplies for free. Piling up supporting examples is not a test."},
{id:"e12",ch:2,topic:"Sampling",heat:"orange",
 q:"A researcher recruits 3,000 participants from her university's introductory psychology pool. The most serious limitation is that:",
 o:["The sample is too small to detect an effect","The sample is convenient rather than representative","Random assignment was not used","The study has no operational definition"],a:1,
 why:"A sample's size is less critical than its representativeness. A small representative sample beats a huge biased one, and undergraduates are younger and more cognitively practised than the general population.",
 trap:"Three thousand sounds impressively large, which is the point of the item. Size is the thing people reach for, and it is the wrong axis."},
{id:"e13",ch:2,topic:"WEIRD samples",heat:"yellow",
 q:"Roughly 96% of published psychology studies draw their participants from about 12% of the world's population. The main problem this creates is that:",
 o:["The studies include too few participants overall","Conclusions about “people” may not generalize beyond an unusual slice of humanity","The studies cannot be replicated by other laboratories","The research violates informed consent requirements"],a:1,
 why:"WEIRD stands for Western, Educated, Industrialized, Rich and Democratic, and these subjects are described as some of the most psychologically unusual people on the planet.",
 trap:"This is a generalizability problem, not a statistical power problem. The studies may be perfectly well run and still describe a narrow population."},
{id:"e14",ch:2,topic:"Case studies",heat:"orange",
 q:"Researchers studied a girl who had been isolated from language until age thirteen in order to learn about critical periods. The main limitation of this kind of evidence is that:",
 o:["It cannot illustrate psychological principles vividly","Information is missing or hard to interpret, and one person may not represent a group","It cannot be conducted ethically under any circumstances","It requires deception of the participant"],a:1,
 why:"Case studies are usually sources of hypotheses rather than tests of them. Nobody knew this child's abilities before the isolation began, so the before-and-after comparison is unavailable.",
 trap:"Option A inverts a genuine strength. Case studies illustrate principles in a way statistics never can, which is exactly why they are so persuasive and so easy to over-read."},
{id:"e15",ch:2,topic:"Tests",heat:"yellow",
 q:"A test produces nearly identical scores each time a person takes it, but investigation shows it is really measuring vocabulary rather than the creativity it claims to assess. This test is:",
 o:["Valid but not reliable","Reliable but not valid","Both reliable and valid","Neither reliable nor valid"],a:1,
 why:"Reliability is consistency across time or scorers. Validity is whether the test measures what it claims. A test can be perfectly consistent about the wrong thing.",
 trap:"The two words get used interchangeably in everyday speech. Consistency is necessary but nowhere near sufficient."},
{id:"e16",ch:2,topic:"Surveys",heat:"yellow",
 q:"Which question wording is most likely to get honest reports of a sensitive behavior?",
 o:["“Have you ever cheated on an exam?”","“How many times have you cheated on an exam?”","“You wouldn't cheat on an exam, would you?”","“Do you agree that cheating is wrong?”"],a:1,
 why:"Asking how many times assumes the behavior and removes the shame, so respondents do not have to confess before answering. Asking whether they ever did it offers an easy, face-saving no.",
 trap:"Option A feels neutral and fair, which is why most people pick it. Neutral wording is not the same as wording that lowers the cost of telling the truth."},
{id:"e17",ch:2,topic:"Observation",heat:"orange",
 q:"Infants reliably cry when a parent leaves the room. From naturalistic observation alone, a researcher can:",
 o:["Conclude that the infant is emotionally attached to the parent","Describe the behavior but not choose between competing explanations for it","Establish that separation causes distress","Rule out learning as an explanation"],a:1,
 why:"Descriptive methods describe and predict behavior but cannot select one explanation over its competitors. The crying could reflect attachment, or it could be learned because crying summons an adult with a cookie.",
 trap:"Option C sounds cautious because it avoids naming attachment, but it is still a causal claim, and observation cannot deliver one."},
{id:"e18",ch:2,topic:"Ethics",heat:"yellow",
 q:"A study uses an actor who pretends to collapse, to see whether bystanders help. Participants cannot be told this in advance without ruining the study. What does the researcher owe them?",
 o:["Nothing further, since no physical harm occurred","A thorough debriefing afterwards explaining the true nature of the study and why deception was necessary","Payment proportional to the distress caused","A guarantee that the results will not be published"],a:1,
 why:"When deception is used it must be justified by the study's value with no feasible alternative, and a thorough debriefing afterwards is required.",
 trap:"The absence of physical harm does not discharge the obligation. Informed consent and debriefing are about respecting the participant's understanding, not only their body."},

/* ---------- Ch 4: neuron and action potential (RED) ---------- */
{id:"n1",ch:4,topic:"Neural communication",heat:"red",
 q:"Communication WITHIN a single neuron is ______, and communication BETWEEN neurons is ______.",
 o:["chemical; electrical","electrical; chemical","electrical; electrical","chemical; chemical"],a:1,
 why:"The action potential travels down the axon as an electrical impulse. At the terminal, neurotransmitter molecules cross the synaptic cleft, so the signal between cells is chemical.",
 trap:"This is the most swapped pair in the chapter. Anchor it on the fact that neurons never touch, so something physical has to cross the gap."},
{id:"n2",ch:4,topic:"Neuron structure",heat:"red",
 q:"In a diagram of a neuron, which structure receives incoming messages from other cells?",
 o:["The axon","The dendrites","The myelin sheath","The axon terminals"],a:1,
 why:"Dendrites are the antennas, receiving messages from as many as ten thousand other cells and passing them toward the cell body. The name comes from the Greek for little tree.",
 trap:"Axon terminals are at the other end of the same cell and do the sending. The signal order is dendrites, cell body, axon, axon terminals."},
{id:"n3",ch:4,topic:"Neuron structure",heat:"red",
 q:"A patient loses myelin from axons in the central nervous system and develops numbness, weakness and poor coordination. The most direct consequence of losing myelin is that:",
 o:["Neurons can no longer manufacture neurotransmitters","Signal conduction along the axon slows and becomes erratic","Dendrites can no longer receive input","The cell body loses its nucleus"],a:1,
 why:"Myelin insulates the axon, stops neighbouring cells interfering with each other, and lets the impulse hop from node to node, which is much faster. Lose it and signals become erratic.",
 trap:"Nothing about myelin loss touches the synapse directly, so the neurotransmitter option is a distractor built on a different stage of the process."},
{id:"n4",ch:4,topic:"Action potential",heat:"red",
 q:"A neuron receives a much stronger stimulus than usual. Compared with a weak stimulus that still reached threshold, the resulting action potential will be:",
 o:["Larger in magnitude","The same size, though the neuron may fire more often","Slower to travel down the axon","Inhibitory rather than excitatory"],a:1,
 why:"Firing is all-or-none, like flipping a light switch. Intensity is coded by how often the neuron fires, not by how big each firing is.",
 trap:"Option A imports intuition from everyday physical systems, where a harder push produces a bigger response. Neurons do not work that way."},
{id:"n5",ch:4,topic:"Action potential",heat:"red",
 q:"During an action potential, which of these happens FIRST?",
 o:["Potassium flows out of the cell","Sodium rushes into the cell","The cell returns to its resting potential","Neurotransmitter is released into the synaptic cleft"],a:1,
 why:"Inputs sum, and if they push the membrane to threshold, voltage-gated sodium channels open and sodium rushes in. Potassium flowing out comes afterwards and resets the cell.",
 trap:"Neurotransmitter release is the last step of the sequence, not the first, and it happens at the terminal rather than along the axon."},
{id:"n6",ch:4,topic:"Action potential",heat:"red",
 q:"At rest, the inside of a neuron is:",
 o:["Positively charged relative to the outside","Negatively charged relative to the outside","Electrically neutral","Charged only if the axon is myelinated"],a:1,
 why:"The resting neuron is polarized with a negative interior, around −70 mV, maintained by the sodium-potassium pump. Threshold sits around −55 mV.",
 trap:"If you remember only that sodium is positive and rushes in, it is easy to invert the resting state. The influx is what makes it positive, so it cannot have started that way."},
{id:"n7",ch:4,topic:"Action potential",heat:"red",
 q:"A neuron receives twelve excitatory inputs totalling +25 mV and eight inhibitory inputs totalling −10 mV. What happens?",
 o:["Nothing, because inhibitory input always blocks firing","The net input is +15 mV, which can carry the cell past threshold so it fires","The action potential produced will be 15 mV in size","The neuron fires twelve times, once per excitatory input"],a:1,
 why:"A neuron averages thousands of incoming messages and fires only if the net effect crosses threshold. Excitatory input makes firing more likely, inhibitory input less likely.",
 trap:"Option C is the all-or-none error wearing a different hat. The net input determines whether the cell fires, never how large the firing is."},
{id:"n8",ch:4,topic:"Synapse",heat:"red",
 q:"After neurotransmitter molecules have been released into the synaptic cleft, what commonly happens to the leftovers?",
 o:["They are destroyed by the next action potential","They may be reabsorbed by the sending neuron, a process called reuptake","They stay bound to the receiving neuron's receptors permanently","They enter the bloodstream and travel to the next neuron"],a:1,
 why:"Neurotransmitters bind to receptor sites much as a key fits a lock, and are then cleared, commonly by reuptake back into the sending cell.",
 trap:"Option D confuses neurotransmitters with hormones. Hormones travel through the bloodstream, neurotransmitters cross a gap measured in nanometres."},
{id:"n9",ch:4,topic:"Synapse",heat:"orange",
 q:"Why is inhibition essential in the nervous system?",
 o:["It speeds conduction along myelinated axons","Without it, excitation would be overwhelming and could produce convulsions","It allows neurons to make physical contact with one another","It converts chemical signals back into electrical ones"],a:1,
 why:"Inhibition is what makes coordinated movement and sleep possible. Without it the nervous system's excitation would be overwhelming.",
 trap:"Inhibition is easy to read as merely the absence of a signal. It is an active process with its own transmitters, and losing it is catastrophic rather than quiet."},
{id:"n10",ch:4,topic:"Neurotransmitters",heat:"orange",
 q:"A toxin blocks acetylcholine at the junction between nerve and muscle, producing paralysis. This substance is acting as:",
 o:["An acetylcholine agonist","An acetylcholine antagonist","A dopamine agonist","A reuptake inhibitor"],a:1,
 why:"An antagonist blocks a neurotransmitter, an agonist boosts or mimics it. Blocking acetylcholine at the neuromuscular junction stops muscle action, which is how curare and botulinum toxin work.",
 trap:"Agonist and antagonist are easy to reverse under time pressure. Antagonist shares its root with antagonise, which is to oppose."},
{id:"n11",ch:4,topic:"Neurotransmitters",heat:"orange",
 q:"A patient shows slowed movement, muscle stiffness, a masked facial expression and a resting tremor. This pattern is most associated with the loss of neurons producing:",
 o:["Serotonin","Dopamine","GABA","Glutamate"],a:1,
 why:"Dopamine is associated with reward, addiction and movement. Loss of dopamine-producing cells in the substantia nigra produces the motor signs of Parkinson's disease.",
 trap:"Serotonin is the mood transmitter, which makes it the reflex answer when a question describes a patient. Read for the symptoms: these are all motor."},
{id:"n12",ch:4,topic:"Neurotransmitters",heat:"orange",
 q:"Which is the main inhibitory neurotransmitter in the brain?",
 o:["Glutamate","Dopamine","GABA","Norepinephrine"],a:2,
 why:"GABA is the principal inhibitory transmitter and glutamate is the principal excitatory one. Both are spread throughout the brain rather than following specific pathways.",
 trap:"Glutamate is the exact opposite and sits right next to GABA in every list, which is precisely why it is the distractor."},

/* ---------- Ch 4: nervous system organisation ---------- */
{id:"a1",ch:4,topic:"Autonomic system",heat:"orange",
 q:"A scooter swerves toward you. Your heart pounds, your pupils widen and your palms sweat. Which division is responsible, and what is its role?",
 o:["Parasympathetic, the brake","Sympathetic, the accelerator","Somatic, voluntary movement","Central nervous system, higher processing"],a:1,
 why:"The sympathetic branch mobilizes the body for action, raising heart rate and blood pressure so you can fight, flee or cope. The car analogy is accelerator versus brake.",
 trap:"Both branches are autonomic, so naming the right system is not enough. You have to pick the right half of it."},
{id:"a2",ch:4,topic:"Autonomic system",heat:"orange",
 q:"Twenty minutes after the danger has passed, your heart rate settles back to normal and you feel calm. This is primarily the work of the:",
 o:["Sympathetic branch","Parasympathetic branch","Somatic nervous system","Spinal reflex arc"],a:1,
 why:"The parasympathetic branch slows things down and conserves and stores energy. It is the brake that follows the accelerator.",
 trap:"Because the whole episode started with a threat, it is tempting to attribute the entire arc to the sympathetic branch. Recovery is a separate, opposing process."},
{id:"a3",ch:4,topic:"Nervous system organisation",heat:"orange",
 q:"All of the following are part of the peripheral nervous system EXCEPT:",
 o:["The somatic nervous system","The sympathetic division","The spinal cord","The parasympathetic division"],a:2,
 why:"The central nervous system is brain plus spinal cord. Everything else, including the somatic and autonomic divisions and both autonomic branches, is peripheral.",
 trap:"The spinal cord carries peripheral traffic constantly, which makes it feel peripheral. Membership is about what it is, not what passes through it."},
{id:"a4",ch:4,topic:"Nervous system organisation",heat:"yellow",
 q:"You touch a hot pan and yank your hand back before you consciously register the pain. This is possible because:",
 o:["The brain processes pain faster than touch","The spinal cord can produce a reflex without waiting for the brain","The sympathetic branch bypasses the spinal cord","Pain signals travel on myelinated axons and touch signals do not"],a:1,
 why:"Spinal reflexes are automatic responses that the spinal cord runs on its own. The message reaches the cord, which fires the withdrawal command directly.",
 trap:"The conscious experience of pain arrives afterwards, which makes it feel like the brain must have acted first. The order of experience is not the order of processing."},

/* ---------- Ch 4: brain structures and lobes (RED) ---------- */
{id:"l1",ch:4,topic:"Lobes and deficits",heat:"red",
 q:"A patient describes a face's nose, eyes and mouth accurately but cannot say whose face it is, including in photographs of their own family. This condition is:",
 o:["Cortical blindness","Prosopagnosia","Hemispatial neglect","A general disorder of long-term memory"],a:1,
 why:"Prosopagnosia is a failure of face recognition specifically. Vision is intact, and so is memory in general. A dedicated face-processing area has been damaged.",
 trap:"Option D is the trap worth naming. If it were a memory problem the patient would fail on names and facts broadly, not just on faces presented visually."},
{id:"l1b",ch:4,topic:"Lobes and deficits",heat:"red",
 q:"Which lobe is listed as handling hearing, language comprehension, memory and face processing?",
 o:["Frontal","Parietal","Temporal","Occipital"],a:2,
 why:"The temporal lobe, sitting by the ears, carries the auditory cortex, Wernicke's area for language comprehension, memory, and face processing.",
 trap:"Occipital is tempting because occipital damage is also listed as causing trouble recognizing objects and people. Vision gets the image to you; the temporal lobe is where a face becomes a person you know."},
{id:"n13",ch:4,topic:"Neurogenesis",heat:"orange",
 q:"Two old certainties about the adult nervous system were overturned. Which statement is accurate?",
 o:["Neurogenesis means a damaged axon regrowing along its old path","Neurogenesis is the formation of new neurons, and it is a separate finding from the discovery that severed axons can regrow","Neurogenesis only occurs before birth","Neurogenesis is another name for neural plasticity"],a:1,
 why:"These are two distinct overturned beliefs. One is that severed central axons can regrow given the right chemicals. The other is neurogenesis, the birth of genuinely new neurons from stem cells, which happens in memory and learning areas and continues into adulthood.",
 trap:"Collapsing the two is easy because they were overturned together. Exercise, effortful mental activity and an enriched environment help neurogenesis; binge drinking, ageing and stress inhibit it, and nicotine can kill new cells."},
{id:"l2",ch:4,topic:"Lobes and deficits",heat:"red",
 q:"After a right-hemisphere stroke, a patient complains that her dessert is missing when it is sitting on the left of her tray, and applies makeup to only the right side of her face. Her intelligence is unaffected. This is:",
 o:["Prosopagnosia","Hemispatial neglect, most associated with parietal damage","Broca's aphasia","Akinetopsia"],a:1,
 why:"The parietal lobe handles spatial awareness, and right-parietal damage can leave a patient unable to attend to the left side of space. Asked to draw a house they typically omit the left side.",
 trap:"She can see the left side perfectly well. This is a disorder of attention to space, not of vision, which is why blindness options are wrong."},
{id:"l3",ch:4,topic:"Lobes and deficits",heat:"red",
 q:"Which lobe contains the primary visual cortex?",
 o:["Frontal","Temporal","Parietal","Occipital"],a:3,
 why:"The occipital lobe at the back of the head handles vision. Damage there can produce blind spots or difficulty recognizing objects.",
 trap:"Vision feels like it should live near the eyes at the front. It is processed at the opposite end of the brain."},
{id:"l4",ch:4,topic:"Lobes and deficits",heat:"red",
 q:"An iron rod destroyed part of a railway worker's prefrontal cortex. He survived, could still speak and remember, but his judgment, planning and temperament changed so much that friends said he was no longer himself. Which function does this illustrate?",
 o:["Occipital cortex and vision","Prefrontal cortex and reasoning, planning and impulse control","Cerebellum and balance","Hippocampus and forming new memories"],a:1,
 why:"The prefrontal cortex handles reasoning, decisions, planning and impulse control, and makes up roughly a third of the human cortex.",
 trap:"The fact that speech and memory survived is the diagnostic detail. It rules out the temporal and hippocampal options immediately."},
{id:"l5",ch:4,topic:"Hippocampus",heat:"red",
 q:"A patient had both hippocampi surgically removed to control severe seizures. Afterwards he could hold an intelligent conversation, recall his childhood and learn new motor skills, but could not remember meeting someone the day before. This shows the hippocampus is critical for:",
 o:["Balance and coordinated movement","Forming new long-term memories for facts and events","Retrieving memories formed in childhood","Producing fluent speech"],a:1,
 why:"The hippocampus binds the pieces of an experience into a single memory. Remove it and old memories and skill learning survive, but new facts and events cannot be laid down.",
 trap:"Option C is the precise inversion. He kept his old memories, which is exactly what tells you the hippocampus is for forming rather than storing them."},
{id:"l6",ch:4,topic:"Deep structures",heat:"orange",
 q:"Which structure serves as the brain's sensory relay station, routing incoming information to the appropriate higher areas?",
 o:["Hypothalamus","Thalamus","Amygdala","Medulla"],a:1,
 why:"The thalamus routes incoming sight, sound and touch to the right higher areas. The lateral geniculate nucleus, the visual relay, sits inside it.",
 trap:"The hypothalamus sits directly beneath it and the names differ by three letters. The hypothalamus runs drives and homeostasis, not sensory routing."},
{id:"l7",ch:4,topic:"Deep structures",heat:"orange",
 q:"Which sense does NOT relay through the thalamus?",
 o:["Vision","Hearing","Smell","Touch"],a:2,
 why:"Smell bypasses the thalamus, travelling via the olfactory bulb, which sits near emotion areas. That is the likely reason a particular odour can suddenly rekindle a vivid memory.",
 trap:"This same exception appears in both the brain chapter and the sensation chapter, which is a strong hint it is worth testing."},
{id:"l8",ch:4,topic:"Amygdala",heat:"orange",
 q:"The amygdala is often called the brain's fear centre. Which statement is most accurate?",
 o:["It responds only to threatening stimuli","It evaluates stimuli for biological importance, responding to positive, negative and merely interesting stimuli","It forms new long-term memories for facts and events","It regulates breathing and heart rate"],a:1,
 why:"The amygdala rapidly evaluates sensory information for biological importance and drives the initial approach-or-withdraw decision. In an outgoing person it fires more to happy faces, and when you are hungry it responds to food.",
 trap:"The fear-centre nickname is in wide circulation and the textbook pushes back on it directly, which makes it a fair target for a nuance question."},
{id:"l9",ch:4,topic:"Cerebellum",heat:"orange",
 q:"Damage to the cerebellum would most likely produce:",
 o:["Inability to form new memories","Clumsiness and poor balance","Loss of vision in one visual field","Loss of language comprehension"],a:1,
 why:"The cerebellum handles balance and smooth, coordinated movement, along with classical conditioning and simple skill memory.",
 trap:"Option A belongs to the hippocampus. Both structures are subcortical and both are involved in a kind of memory, which is what makes the pair confusable."},
{id:"l10",ch:4,topic:"Studying the brain",heat:"orange",
 q:"Which technique is best suited to showing WHERE activity occurs during a task, at some cost to precise timing?",
 o:["EEG","fMRI","TMS","The lesion method"],a:1,
 why:"fMRI measures blood-oxygen levels and gives good spatial location with weaker timing. EEG is the reverse, excellent timing from scalp electrodes but poor location.",
 trap:"EEG is the classic distractor because it is the one everyone pictures. Think of it as standing outside a stadium: you know something happened, not what or who."},
{id:"l11",ch:4,topic:"Studying the brain",heat:"orange",
 q:"A researcher wants to temporarily disrupt activity in one cortical region in a healthy volunteer, to see which ability drops out. Which approach fits?",
 o:["fMRI","PET","Transcranial magnetic stimulation","EEG"],a:2,
 why:"TMS uses a magnetic field to fire or disrupt neurons under the coil, revealing what a region does. Imaging techniques only record, they do not intervene.",
 trap:"The lesion method would answer the same question but cannot be used on humans for ethical reasons, which is exactly why non-destructive stimulation was developed."},
{id:"l12",ch:4,topic:"Plasticity",heat:"yellow",
 q:"In some people blind from early life, regions normally devoted to vision become active during listening tasks, and the more activation, the better their sound localization. This best illustrates:",
 o:["Neurogenesis","Neural plasticity","Localization of function","Lateralization"],a:1,
 why:"Plasticity is the brain's ability to rewire in response to experience. The visual cortex has the machinery for non-visual work and it stays dormant until it is needed.",
 trap:"Neurogenesis is the birth of new neurons, which is a different process. Here existing tissue is repurposed rather than new cells being made."},

/* ---------- Ch 5: sensation and perception (RED) ---------- */
{id:"s1",ch:5,topic:"Sensation vs perception",heat:"red",
 q:"Sensation is to ______ as perception is to ______.",
 o:["interpretation; detection","detection; interpretation","cortex; retina","top-down; bottom-up"],a:1,
 why:"Sensation is receptors detecting physical energy and converting it. Perception is the brain organizing and interpreting those signals to decide what they mean.",
 trap:"Option D is the sophisticated-sounding wrong answer. Sensation is closer to bottom-up and perception involves top-down processing, so that pairing is backwards as well as imprecise."},
{id:"s2",ch:5,topic:"Transduction",heat:"red",
 q:"The conversion of physical energy into neural signals is called:",
 o:["Perception","Transduction","Sensory adaptation","Accommodation"],a:1,
 why:"Every sense has a transduction step: light hits photoreceptors, sound bends hair cells, chemicals bind taste and smell receptors. After it, every sense speaks the same language, action potentials.",
 trap:"Accommodation is the lens changing shape to focus, which is also in this chapter and also a physical change, which is what makes it a usable distractor."},
{id:"s3",ch:5,topic:"Rods and cones",heat:"red",
 q:"You are outside at night and notice you can see a faint star better when you look slightly to the side of it than when you look directly at it. Why?",
 o:["Cones are concentrated in the periphery and handle dim light","There are no rods in the fovea, and rods are what handle dim light","The blind spot sits in the periphery of the retina","The lens focuses more sharply off-centre"],a:1,
 why:"Looking directly at something puts its image on the fovea, which is all cones and no rods. Cones need bright light, so a faint star vanishes there and reappears when its image falls on peripheral rods.",
 trap:"Option A has the right structure and the wrong cell type. Cones are the ones packed into the fovea."},
{id:"s4",ch:5,topic:"Rods and cones",heat:"red",
 q:"Why does colour drain out of your peripheral vision, and out of everything at night?",
 o:["Rods carry no colour information, and cones need bright light to fire","The optic nerve filters colour information out at the chiasm","Opponent channels shut down when light levels fall","The lens cannot accommodate properly in dim light"],a:0,
 why:"Rods work in dim light and in the periphery but give only shades of grey. Cones give colour but need bright light and are packed into the fovea.",
 trap:"It is easy to think the world simply looks grey at night because there is less light to see colour by. Rods have no colour information to give at all, at any light level."},
{id:"s5",ch:5,topic:"Rods and cones",heat:"red",
 q:"All of the following describe rods EXCEPT:",
 o:["There are roughly 120 million of them per eye","They operate in dim light","They are packed densely into the fovea","They provide no colour information"],a:2,
 why:"Rods are concentrated in the periphery and there are none in the fovea. It is cones, about six million per eye, that are packed into the fovea.",
 trap:"On EXCEPT items the natural instinct is to look for the statement that sounds wrong. Three of these are correct, so you have to positively verify each one."},
{id:"s6",ch:5,topic:"Colour vision",heat:"red",
 q:"You stare at a bright green square for twenty seconds, then look at a white wall and see a red afterimage. This is evidence for:",
 o:["Trichromatic theory, because three cone types are involved","Opponent-process theory, because colour channels work in opposing pairs","Sensory adaptation in the lens","A perceptual constancy"],a:1,
 why:"Opponent-process cells work as opposing pairs, red-green and blue-yellow. Pushing the red-green channel toward green fatigues it, and removing the stimulus makes it rebound to red.",
 trap:"Afterimages are always an opponent-process question. Trichromatic theory is correct about the retina but says nothing about why the rebound goes to the opposite colour."},
{id:"s7",ch:5,topic:"Colour vision",heat:"red",
 q:"Which statement about the two theories of colour vision is correct?",
 o:["Trichromatic theory has been disproven by afterimage research","Both are correct, describing different stages: trichromatic at the retina, opponent-process after it","Opponent-process explains colour blindness and trichromatic explains afterimages","They apply to different species rather than different stages"],a:1,
 why:"This looked like a century-long fight and was not one. Three cone types operate at the retina, and opposing channels operate after it.",
 trap:"Option C reverses the two pieces of evidence. Colour mixing and colour blindness are trichromatic evidence, afterimages are opponent-process evidence."},
{id:"s8",ch:5,topic:"Feature detectors",heat:"orange",
 q:"A cell in the primary visual cortex fires vigorously to a vertical bar of light and barely responds to the same bar rotated to horizontal. This cell is:",
 o:["A rod","A cone","An orientation-tuned feature detector","A ganglion cell in the retina"],a:2,
 why:"Feature detectors in V1 are tuned to edges at particular orientations. Different cells prefer different angles, and together they cover every orientation.",
 trap:"Rods and cones are receptors in the retina. Feature detectors are cortical cells, which is the distinction this item exists to test."},
{id:"s9",ch:5,topic:"Feature detectors",heat:"orange",
 q:"Why does the visual system devote so many cells to detecting edges rather than to flat, unchanging surfaces?",
 o:["Edges are brighter than flat surfaces","A flat surface carries almost no information, since knowing one patch tells you the rest","Edges are processed in the retina and flat regions are not","Flat surfaces are processed by rods rather than cones"],a:1,
 why:"All the information about where one thing stops and another begins lives at the edges, so the system spends its cells on boundaries and fills in between them. It is the same principle as sensory adaptation, coding change rather than steady states.",
 trap:"The filling-in step is why the watercolour illusion works: a thin coloured border makes a whole white region look tinted."},
{id:"s10",ch:5,topic:"Visual pathway",heat:"red",
 q:"A stimulus appears in your left visual field. Where does that information go?",
 o:["To the left hemisphere, from the left eye only","To the right hemisphere, from both eyes","To the right hemisphere, from the left eye only","Equally to both hemispheres"],a:1,
 why:"The left visual field is the left half of what you are looking at, and both eyes see it. Each eye splits its own image at the optic chiasm and sends half to each hemisphere.",
 trap:"“Left eye to right hemisphere” is described as the single most misunderstood point in the chapter. Cover one eye and you still see both fields."},
{id:"s11",ch:5,topic:"Psychophysics",heat:"yellow",
 q:"The absolute threshold is defined as the smallest amount of a stimulus a person can detect:",
 o:["100% of the time","50% of the time","75% of the time","More often than chance would predict"],a:1,
 why:"Both the absolute threshold and the difference threshold are defined at 50% detection, because detection is noisy rather than all-or-nothing.",
 trap:"The word absolute strongly implies certainty, which is exactly why the 50% detail gets tested."},
{id:"s12",ch:5,topic:"Psychophysics",heat:"yellow",
 q:"Adding one kilogram to a two-kilogram bag is instantly noticeable, but adding one kilogram to a fifty-kilogram bag is not. This illustrates:",
 o:["Sensory adaptation","Weber's law, that the just noticeable difference is a constant proportion of the original","The absolute threshold","Signal detection theory"],a:1,
 why:"The just noticeable difference is a constant proportion of the original stimulus, not a constant amount. Same kilogram, much smaller share.",
 trap:"Absolute threshold is about detecting something against nothing. This is about detecting a change between two things, which is the difference threshold."},
{id:"s13",ch:5,topic:"Sensory adaptation",heat:"yellow",
 q:"You stop noticing the hum of the refrigerator a few minutes after entering the kitchen. This is:",
 o:["Sensory adaptation","Inattentional blindness","Perceptual set","Signal detection"],a:0,
 why:"Receptors stop responding to an unchanging stimulus. The nervous system cares about change, not steady states, the same principle that makes edges so important in vision.",
 trap:"Inattentional blindness is missing something in plain sight because attention was elsewhere. Here nothing competed for your attention, the receptors simply stopped reporting."},
{id:"s14",ch:5,topic:"Visual specialisation",heat:"orange",
 q:"A patient can see objects and recognize faces, but can no longer perceive motion. The world appears as a series of still frames, which makes pouring tea nearly impossible. This is:",
 o:["Achromatopsia","Akinetopsia","Prosopagnosia","Hemispatial neglect"],a:1,
 why:"Motion has its own dedicated cortical area, and damage to it produces akinetopsia. The logic to carry into the exam is that if one visual ability can be lost on its own, it must have had its own machinery.",
 trap:"Achromatopsia is loss of colour with form intact, prosopagnosia is loss of face recognition. All three prove the same point about specialisation, so read which ability actually failed."},
{id:"s15",ch:5,topic:"Illusions",heat:"orange",
 q:"Illusions in which two identical lines appear to be different lengths are best understood as:",
 o:["Failures of the visual system","Normally correct perceptual rules applied to an unusual case","Evidence that depth is sensed directly rather than inferred","Errors occurring in the retina before the signal reaches the brain"],a:1,
 why:"Illusions are not glitches. Converging lines normally mean distance, so the brain enlarges the more distant-looking bar to preserve size constancy. The rule is right almost always.",
 trap:"Calling them failures is intuitive and is precisely the framing the chapter argues against. They are the system working correctly on an input it was not built for."},
{id:"s16",ch:5,topic:"Depth cues",heat:"yellow",
 q:"Which depth cue requires BOTH eyes?",
 o:["Linear perspective","Retinal disparity","Interposition","Texture gradient"],a:1,
 why:"Retinal disparity is the slight difference between the two eyes' images, and the bigger the difference, the closer the object. Convergence is the other binocular cue.",
 trap:"The quick test for the others is whether the cue survives in a photograph. Linear perspective, interposition and texture gradient all do, so they are monocular."},
{id:"s17",ch:5,topic:"Constancies",heat:"yellow",
 q:"A door swings open toward you. The image on your retina changes from a rectangle to a trapezoid, yet you continue to perceive a rectangular door. This is:",
 o:["Size constancy","Shape constancy","Closure","Figure and ground"],a:1,
 why:"The retinal image changes constantly and the object does not. Constancy is your brain holding the object steady anyway.",
 trap:"Closure is a Gestalt grouping principle about completing incomplete figures, which is a different phenomenon from keeping a changing image stable."},
{id:"s18",ch:5,topic:"Gestalt",heat:"yellow",
 q:"A scattered field of dots that all move together is perceived as one single object. Which Gestalt principle is this?",
 o:["Proximity","Similarity","Common fate","Closure"],a:2,
 why:"Common fate groups things that move in the same way. Gestalt principles are not rules the world follows, they are assumptions your brain makes, which is why they can be exploited.",
 trap:"Proximity and similarity are both about static properties, position and appearance. The defining feature here is shared motion."},
{id:"s19",ch:5,topic:"Hearing",heat:"yellow",
 q:"Transduction for hearing takes place in the:",
 o:["Eardrum","Ossicles","Cochlea","Auditory nerve"],a:2,
 why:"Air vibration becomes bone vibration becomes a fluid wave, and the fluid wave bends hair cells in the cochlea, which is where the signal becomes neural.",
 trap:"The eardrum and ossicles are mechanical stages, amplifying and transmitting. Transduction is specifically the conversion into neural signals."},
{id:"s20",ch:5,topic:"Perceptual set",heat:"yellow",
 q:"A person is told in advance that an ambiguous drawing shows a dog, and they promptly see a dog. This is:",
 o:["Inattentional blindness","Perceptual set","Sensory adaptation","A perceptual constancy"],a:1,
 why:"Perceptual set is a readiness to perceive one thing rather than another, created by expectation. It is top-down processing overriding ambiguous data.",
 trap:"Inattentional blindness is also an attention phenomenon, but it is about missing something present, not about biasing the interpretation of something you are looking straight at."},
{id:"s21",ch:5,topic:"Blind spot",heat:"orange",
 q:"There is a genuine hole in each eye's image where the optic nerve exits the retina, yet you never notice a hole in your vision. This is most often used as evidence that:",
 o:["The blind spot is too small to matter","Perception is constructed rather than simply received","The two eyes compensate for one another","The brain processes the visual field twice"],a:1,
 why:"There are no photoreceptors at that point, so the brain fills the gap with whatever surrounds it. That filling-in is the clearest everyday proof that what you experience is built, not recorded.",
 trap:"Option C is genuinely tempting because two eyes do help, but the effect persists with one eye closed, which is what makes the filling-in explanation necessary."},
{id:"s22",ch:5,topic:"Sensation vs perception",heat:"red",
 q:"Which of the following is an example of PERCEPTION rather than sensation?",
 o:["Photoreceptors in the retina responding to light","Hair cells in the cochlea bending in response to a fluid wave","Recognizing a friend's voice in a noisy room","Taste receptors binding a chemical from food"],a:2,
 why:"The first, second and fourth are receptors detecting and converting physical energy, which is sensation. Recognizing whose voice it is requires the brain to organize and interpret the signal.",
 trap:"All four involve a sense organ, which is what makes them look equivalent. The question is whether the step described is detection or interpretation."},
{id:"s23",ch:5,topic:"Smell",heat:"orange",
 q:"A particular perfume suddenly brings back a vivid childhood memory with unusual emotional force. The anatomical reason usually given is that:",
 o:["Smell receptors regenerate throughout life","Smell bypasses the thalamus and projects to areas near emotion and memory structures","Olfactory signals travel faster than other sensory signals","Smell is processed in both hemispheres simultaneously"],a:1,
 why:"Smell is the one sense that does not relay through the thalamus. It goes via the olfactory bulb, which sits near emotion areas, and that proximity is the usual explanation for the effect.",
 trap:"Speed is not the mechanism. It is which structures the signal passes close to on its way, which is also the same exception that appears in the brain chapter."}
];

const PSY_SA = [
{id:"sa1",ch:2,topic:"Correlation",heat:"red",
 q:"In two or three sentences, explain why a correlation between two variables cannot establish that one causes the other. Include one concrete example.",
 model:"A correlation only tells you that two measured variables move together, and there are always three readings available: A causes B, B causes A, or some third variable causes both. Ice cream sales and drowning deaths rise together because hot weather drives both, not because either causes the other. Because nothing was manipulated and nobody was randomly assigned, the design cannot rule out the alternatives.",
 points:["Names that correlation is a relationship between two measured variables","Gives all three possible readings, including the third-variable explanation","Supplies a concrete example","Connects the limitation to the absence of manipulation or random assignment"]},
{id:"sa2",ch:2,topic:"Experiments",heat:"red",
 q:"A researcher wants to test whether background music impairs reading comprehension. Identify the independent variable, the dependent variable, and one thing that must be held constant, and explain why holding it constant matters.",
 model:"The independent variable is the listening condition, music versus silence, since that is what the researcher manipulates. The dependent variable is reading comprehension, operationally defined as the score on a test taken after reading the passage. The passage itself must be held constant across both groups, because if one group read an easier text you could not tell whether any difference came from the music or from the reading material. That second variable would be a confound.",
 points:["Correctly identifies the manipulated variable as the IV","Correctly identifies the measured outcome as the DV, ideally with an operational definition","Names a specific variable to hold constant","Explains that letting it vary would confound the result"]},
{id:"sa3",ch:4,topic:"Neural communication",heat:"red",
 q:"Explain step by step what happens from the moment a neuron reaches threshold to the moment the next neuron receives a signal. State clearly where the signal is electrical and where it is chemical.",
 model:"Once summed inputs push the membrane to threshold, voltage-gated sodium channels open and sodium rushes in, producing an action potential that propagates down the axon. This stage is electrical, and it is all-or-none, so a stronger stimulus produces more frequent firing rather than a larger impulse. Potassium then flows out to reset the cell. When the impulse reaches the axon terminal, synaptic vesicles release neurotransmitter into the synaptic cleft, and the molecules bind to receptor sites on the receiving neuron much as a key fits a lock. This stage is chemical. Leftover transmitter is cleared, commonly by reuptake into the sending cell.",
 points:["Threshold triggers sodium influx","The action potential travels down the axon and is all-or-none","Potassium efflux resets the cell","Neurotransmitter crosses the synaptic cleft and binds receptors","Explicitly labels within-neuron as electrical and between-neuron as chemical"]},
{id:"sa4",ch:5,topic:"Colour vision",heat:"red",
 q:"Explain why both trichromatic theory and opponent-process theory are considered correct, and state which one accounts for afterimages and why.",
 model:"They describe two different stages of the same system rather than competing accounts. Trichromatic theory describes the retina, where three cone types are each most sensitive to a different wavelength and every colour is a ratio of how hard those three fire. Opponent-process theory describes what happens after the retina, where cells work in opposing pairs, red against green and blue against yellow, so one member being on means the other is off. Afterimages are opponent-process phenomena: staring at green fatigues the red-green channel while it is pushed toward green, and removing the stimulus lets it rebound to red.",
 points:["States that the two theories describe different stages, not rival claims","Places trichromatic at the retina with three cone types","Places opponent-process after the retina with opposing pairs","Attributes afterimages to opponent-process","Explains the rebound or fatigue mechanism"]},
{id:"sa5",ch:5,topic:"Illusions",heat:"orange",
 q:"A friend says “illusions prove your eyes can't be trusted.” Using what you know about perception, give a better explanation of what illusions actually show.",
 model:"Illusions are not failures of the eyes at all. The retina is flat, so depth has to be inferred from cues, and perception applies rules that are correct in almost every ordinary situation. An illusion is what happens when one of those normally reliable rules meets an unusual input. Converging lines normally signal distance, so the brain enlarges a more distant-looking object to preserve size constancy, and in a drawing where the lines are not really receding, that correction produces a visible error. Illusions are the system's usual shortcuts made visible, which is evidence that perception is constructed rather than passively received.",
 points:["Rejects the framing that illusions are a malfunction","Names that depth is inferred from cues rather than sensed directly","Explains the mechanism with a specific rule such as size constancy","Concludes that perception is constructive"]},
{id:"sa6",ch:4,topic:"Lobes and deficits",heat:"red",
 q:"A patient can no longer form new memories for facts and events after surgery, though his childhood memories and his ability to learn new motor skills are intact. Name the structure involved and explain what this pattern reveals about how memory is organized.",
 model:"The hippocampus was removed on both sides. The pattern shows that forming new long-term memories for facts and events is a separable function from storing old ones, since childhood memories survived intact, and separable again from skill learning, which also survived. That dissociation is the argument for localization of function: if one capacity can be lost while others remain, it must depend on its own machinery. It also shows the hippocampus is involved in laying memories down rather than serving as the warehouse where they are kept.",
 points:["Names the hippocampus","Notes that old memories were preserved","Notes that skill learning was preserved","Draws the conclusion that forming new declarative memories is a separate function","Ideally connects this to localization of function"]}
];
