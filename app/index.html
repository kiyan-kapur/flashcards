const MODES = ["cram","study","missed","interview"];
document.addEventListener("keydown", e=>{
  const t = e.target;
  if(t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT")) return;
  if(!modal.hidden){ if(e.key === "Escape") closeModal(); return; }
  const k = e.key.toLowerCase();
  if(e.key === "/"){ e.preventDefault(); openSearch(); return; }
  if(k === "escape" && mobile() && chatToggle.getAttribute("aria-expanded") === "true"){ chatToggle.click(); return; }
  if(k === "c"){ e.preventDefault(); if(mobile() && chatPane.hidden) chatToggle.click(); chatInput.focus(); return; }
  const nit = S.nav.item ? ITEMS[S.nav.item] : null;
  if(k === "escape" || k === "backspace"){
    if(S.nav.item){ const f=(ITEMS[S.nav.item]||{}).folder; S.nav={folder:f,item:null}; render(); }
    else if(S.nav.folder){ S.nav={folder:null,item:null}; render(); }
    return;
  }
  if(!nit) return;
  if(k === "m" && nit.kind === "deck"){
    const avail = DECKS[nit.deck].iv ? MODES : MODES.filter(x=>x!=="interview");
    setMode(avail[(avail.indexOf(S.mode)+1)%avail.length]); return;
  }
  if(k === "p"){ document.getElementById("btn-stats").click(); return; }
  if(k === "f"){ document.getElementById("btn-filters").click(); return; }
  if(nit.kind === "bank"){
    if(S.bank.view !== "practice") return;
    if(/^[1-9]$/.test(e.key)){ const el = paneCard.querySelector('[data-pick="'+(+e.key-1)+'"]'); if(el){ el.click(); e.preventDefault(); } return; }
    if(k === "r"){ const el = document.getElementById("bk-reveal"); if(el) el.click(); return; }
    if(k === "s"){ const el = document.getElementById("bk-star"); if(el) el.click(); return; }
    if(e.key === "Enter"){
      e.preventDefault();
      const ck = document.getElementById("bk-check");
      if(ck && !ck.disabled) ck.click(); else nextBank();
      return;
    }
    if(k === "n" || e.key === " "){ e.preventDefault(); nextBank(); return; }
    return;
  }
  if(nit.kind === "cram"){
    if(!S.cram || S.cram.done) return;
    const ref = S.cram.queue[S.cram.qi];
    if(ref.k === "m"){
      if(/^[1-9]$/.test(e.key) && !S.cram.checked){ const el = paneCard.querySelector('[data-cpick="'+(+e.key-1)+'"]'); if(el){ el.click(); e.preventDefault(); } return; }
      if(e.key === "Enter"){ e.preventDefault(); const el = document.getElementById(S.cram.checked ? "cr-next" : "cr-check"); if(el) el.click(); return; }
    }
    return;
  }
  if(nit.kind === "test"){
    if(!S.run || S.run.done || S.run.stage === "review") return;
    const t = testById(S.run.testId), q = qById(t, S.run.ids[S.run.qi]);
    if(e.key === "Enter"){
      e.preventDefault();
      if(S.run.qi === S.run.ids.length-1) S.run.stage = "review"; else S.run.qi++;
      render(); paneCard.scrollTop = 0; return;
    }
    if(/^[1-9]$/.test(e.key)){
      const n = +e.key - 1;
      if(q.type === "blanks"){
        const b = q.blanks[0];
        if(b && b.choices[n]){ const arr=(markOf(q.id)||[]).slice(); arr[0]=b.choices[n]; S.run.marks[q.id]=arr; render(); }
      } else if(q.opts[n]){ pick(q, q.opts[n][0]); }
      e.preventDefault();
    }
    return;
  }
  if(S.mode === "interview") return;
  if(S.qi >= S.queue.length) return;
  if(e.key === " " || e.key === "Enter"){
    e.preventDefault();
    if(!S.revealed){ S.revealed = true; render(); }
    return;
  }
  if(k === "j"){ next(); return; }
  if(S.revealed && ["1","2","3","4"].includes(e.key)){
    rate(S.queue[S.qi], ["again","hard","good","easy"][+e.key-1]);
  }
});

/* ===================== BOOT ===================== */
let sampleReady = false;
function start(carry){
  adopt(loadLocal());
  purgeOldCoach();
  if(carry && typeof carry.mode === "string"){
    S.mode = carry.mode; S.ivIdx = carry.ivIdx||0;
    if(carry.nav) S.nav = carry.nav;
  }
  if(!MODES.includes(S.mode)) S.mode = "cram";
  if(S.nav.item && ITEMS[S.nav.item] && ITEMS[S.nav.item].kind === "deck") setDeck(ITEMS[S.nav.item].deck);
  buildQueue();
  applyPane();
  render();
  paintFocus();
  if(S.focus.started) startFocusTick();
  // capabilities light up after first paint
  samplePromise = (async ()=>{
    try{
      const s = await window.claude?.use?.("sample");
      sampleNS = s || null;
    }catch(e){ sampleNS = null; }
    if(!sampleNS && getKey()) sampleNS = makeLocalSample(getKey());
    sampleReady = true;
    if(curCard) paintChat();
  })();
  (async ()=>{
    try{
      const db = await window.claude?.use?.("db");
      if(!db){ finishPurge(); return; }
      dbRoot = db;
      dbDoc = db.doc("progress/main");
      const snap = await dbDoc.get();
      // snapshot data is frozen; clone it so later edits to progress, notes and chats actually stick
      const remote = (snap && snap.exists) ? JSON.parse(JSON.stringify(snap.data())) : null;
      // Merge, never replace: this device's unsynced work and the account copy both survive.
      if(remote && mergeIn(remote)){ purgeOldCoach(); saveLocal(); if(S.nav.item && ITEMS[S.nav.item] && ITEMS[S.nav.item].kind === "deck") buildQueue(); render(); }
      if(S.rev > 0 || remote) pushNow();
      syncSideStores();
    }catch(e){ dbDoc = null; finishPurge(); }
  })();
}
try{
  window.claude?.hot?.snapshot?.(()=>({mode:S.mode, ivIdx:S.ivIdx, nav:S.nav}));
}catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(start);
else start(window.claude?.hot?.data ?? {});
</script>
