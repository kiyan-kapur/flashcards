/* ---------- spacing (Step 5) ----------
   Pure function so it can be simulated outside the page. Rules:
   - a stem never repeats inside 8 questions (relaxed only when fewer stems exist than the gap needs);
   - a variant does not repeat until every variant of its stem has been seen;
   - no more than 3 in a row from one week;
   - HARD stems weigh 3, MEDIUM 2, EASY 1; a HARD stem drops to 1 once each of its variants has been right with Sure or Fairly sure;
   - Just-in-Case slots in at 1 per jicEvery questions (mixed bank only). */
function v2Order(pool, o){
  const rnd = o.rand || Math.random, seen = o.seen || (()=>0), mastered = o.mastered || (()=>false);
  const W = {hard:3, medium:2, easy:1};
  const main = pool.filter(q=>q.level !== "jic"), jic = pool.filter(q=>q.level === "jic");
  const byStem = {}; main.forEach(q=> (byStem[q.stem] = byStem[q.stem] || []).push(q));
  const stems = Object.keys(byStem), used = {}, lastAt = {}, out = [];
  // Mixed bank: a stem never repeats inside 8. A single-level bank has only 8 or 9 stems, where a gap of 8 forces strict
  // rotation and some variants would never show, so it uses a gap of about 60% of its stems (5 or 6) instead.
  const gap = o.gap != null ? o.gap : Math.min(8, stems.length) - 1;
  const len = o.len || pool.length;
  const pickVariant = list => list.slice().sort((x,y)=>
    ((used[x.id]||0) - (used[y.id]||0)) || ((seen(x.id) + (used[x.id]||0)) - (seen(y.id) + (used[y.id]||0))) || (rnd() - .5))[0];
  const weekOf = id => (pool.find(q=>q.id===id) || {}).week;
  if(o.first){ const f = pool.find(q=>q.id===o.first); if(f){ out.push(f.id); used[f.id] = 1; if(f.stem) lastAt[f.stem] = 0; } }
  while(out.length < len){
    const pos = out.length;
    if(o.jicEvery && jic.length && (pos + 1) % o.jicEvery === 0){
      const j = pickVariant(jic); out.push(j.id); used[j.id] = (used[j.id]||0) + 1; continue;
    }
    if(!stems.length) break;
    const last3 = out.slice(-3).map(weekOf), wk = last3.length === 3 && last3.every(w=>w === last3[0]) ? last3[0] : null;
    const near = (s, g)=> lastAt[s] !== undefined && pos - lastAt[s] <= g;
    const fresh = s=> byStem[s].some(q=>!used[q.id]);
    // Prefer stems that still have an unseen variant this pass. Only if every such stem sits inside the gap does the gap
    // shrink, one step at a time, so a pass shows every variant before repeating any.
    let ok = [];
    for(let g = gap; g >= 1 && !ok.length; g--){
      ok = stems.filter(s=> !near(s, g) && fresh(s) && byStem[s][0].week !== wk);
      if(!ok.length) ok = stems.filter(s=> !near(s, g) && fresh(s));
    }
    if(!ok.length) ok = stems.filter(s=> !near(s, gap) && byStem[s][0].week !== wk);
    if(!ok.length) ok = stems.filter(s=> !near(s, gap));
    if(!ok.length) ok = [stems.slice().sort((a,b)=> (lastAt[a] ?? -1) - (lastAt[b] ?? -1))[0]];
    const wt = s=>{
      const l = byStem[s][0].level;
      let w = (l === "hard" && byStem[s].every(q=>mastered(q.id))) ? 1 : W[l];
      const left = byStem[s].filter(q=>!used[q.id]).length;
      w *= left ? left : 0.15;                                 // stems with more unseen variants go more often, so a pass covers every variant
      return w;
    };
    let tot = ok.reduce((t,s)=>t + wt(s), 0), r = rnd() * tot, s = ok[0];
    for(const k of ok){ r -= wt(k); if(r <= 0){ s = k; break; } }
    const v = pickVariant(byStem[s]);
    out.push(v.id); used[v.id] = (used[v.id]||0) + 1; lastAt[s] = pos;
  }
  return out;
}
function v2Mastered(id){ const c = (S.bankProg[id] || {}).conf || {}; return ((c.sure||{}).ok || 0) + ((c.fair||{}).ok || 0) > 0; }
function v2Build(b, keepAt){
  const nMain = b.questions.filter(q=>q.level !== "jic").length;
  S.bank.queue = v2Order(b.questions, {
    len: b.mixJic ? Math.max(60, nMain) : b.questions.length,
    seen: id=> (S.bankProg[id] || {}).seen || 0, mastered: v2Mastered,
    jicEvery: b.mixJic ? 6 : 0, first: keepAt,
    gap: b.mixJic ? undefined : Math.max(2, Math.ceil(new Set(b.questions.map(q=>q.stem)).size * 0.6))
  });
  S.bank.qi = 0; S.bank.sess = {sureOk:{}};
  S.bank.answered = false; S.bank.revealed = false; S.bank.choice = null; S.bank.sel = null; S.bank.finished = false;
}
// After each answer: a miss, a reveal or a "Guessing" brings the stem back 4 to 6 questions later as a DIFFERENT variant;
// right with "Sure" twice retires that variant for the session.
function v2After(q, ok, conf){
  const b = bankOf();
  if(!b || !b.v2 || !q.stem) return;
  const sess = S.bank.sess || (S.bank.sess = {sureOk:{}});
  const Q = S.bank.queue, here = S.bank.qi;
  if(!ok || conf === "guess"){
    const sibs = b.questions.filter(x=>x.stem === q.stem && x.id !== q.id);
    if(!sibs.length) return;
    const sib = sibs.slice().sort((x,y)=> ((S.bankProg[x.id]||{}).seen||0) - ((S.bankProg[y.id]||{}).seen||0) || Math.random() - .5)[0];
    // drop any copy of this stem already sitting in the next 6 slots so it is not seen twice
    for(let i = Math.min(Q.length - 1, here + 6); i > here; i--){ const x = b.questions.find(z=>z.id === Q[i]); if(x && x.stem === q.stem) Q.splice(i, 1); }
    Q.splice(Math.min(here + 4 + Math.floor(Math.random()*3), Q.length), 0, sib.id);
  } else if(conf === "sure"){
    sess.sureOk[q.id] = (sess.sureOk[q.id] || 0) + 1;
    if(sess.sureOk[q.id] >= 2) for(let i = Q.length - 1; i > here; i--) if(Q[i] === q.id) Q.splice(i, 1);
  }
}

/* ---------- Doubt Sheet: all BIO 13 history, void and new, worst concept first ---------- */
function doubtSheetRows(){
  const byId = {}; BIO13_Q.concat(BIO13_V2).forEach(q=> byId[q.id] = q);
  const G = {}, g = t=> G[t] || (G[t] = {topic:t, n:0, ok:0, sureWrong:0, rev:0, last:null, lastAt:-1, old:0});
  const logged = new Set();
  (S.attempts || []).forEach(a=>{
    const q = byId[a.id]; if(!q) return; logged.add(a.id);
    const r = g(q.topic);
    if(a.rev){ r.rev++; return; }
    r.n++; if(a.ok){ r.ok++; return; }
    if(a.conf === "sure") r.sureWrong++;
    if(a.at > r.lastAt){ r.lastAt = a.at; r.last = {q:q.q, chose:a.chose != null ? q.o[a.chose] : null, key:q.o[q.a]}; }
  });
  // Before this build the app kept per-question totals only, so old questions contribute their totals.
  BIO13_Q.forEach(q=>{
    const p = S.bankProg[q.id]; if(!p || logged.has(q.id) || !(p.seen || p.rev)) return;
    const r = g(q.topic);
    r.n += p.seen || 0; r.ok += p.ok || 0; r.rev += p.rev || 0; r.old += p.seen || 0;
    const c = (p.conf || {}).sure; if(c) r.sureWrong += (c.n - c.ok);
    if(p.last === "wrong" && p.choice != null && r.lastAt < 0 && !r.last) r.last = {q:q.q, chose:q.o[p.choice], key:q.o[q.a]};
  });
  return Object.values(G).filter(r=>r.n || r.rev).map(r=> Object.assign(r, {
    pct: r.n ? Math.round(r.ok / r.n * 100) : 0,
    sw: r.n ? Math.round(r.sureWrong / r.n * 100) : 0,
    score: (r.n - r.ok) + r.sureWrong + r.rev * 0.5      // a Sure-but-wrong counts double
  })).sort((a,b)=> b.score - a.score || a.pct - b.pct);
}
function doubtSheetMd(){
  const rows = doubtSheetRows();
  return "# BIO 0013 Exam 1 Doubt Sheet\n\nGenerated " + new Date().toISOString().slice(0,16).replace("T"," ") +
    " from every attempt, old bank and new. Worst first. A Sure answer that was wrong counts double.\n\n" +
    rows.map((r,i)=> "## " + (i+1) + ". " + r.topic + "\n\n- Seen " + r.n + " times, " + r.pct + "% correct, " + r.sw +
      "% Sure but wrong" + (r.rev ? ", revealed " + r.rev + " times" : "") + (r.old ? " (" + r.old + " from the retired bank, totals only)" : "") +
      (r.last && r.last.chose ? "\n- Last wrong answer: \"" + r.last.chose + "\"\n- Correct: \"" + r.last.key + "\"\n- On: " + r.last.q.replace(/\n+/g," ").slice(0,220) : "")
    ).join("\n\n") + "\n";
}

function mergeIn(r){

function rate(id, r){
  const p = P(id), now = Date.now();
  p.seen++; p.last = r;
  if(r === "again"){ p.lapses++; p.box = -1; p.due = now + 8*60000; }
  else if(r === "hard"){ p.box = Math.max(-1, p.box-1); p.due = now + 20*60000; }
  else if(r === "good"){ p.correct++; p.box = Math.min(p.box+1, LADDER.length-1); p.due = now + LADDER[p.box]*DAY; }
  else { p.correct++; p.box = Math.min(p.box+2, LADDER.length-1); p.due = now + LADDER[Math.max(1,p.box)]*DAY; }
  S.session.answered++; S.session[r]++;
  noteActivity(r === "good" || r === "easy");
  queueSave();
  // in-session repeat for the ones that didn't land
  if(r === "again" || r === "hard"){
    const gap = r === "again" ? 3 : 8;
    const at = Math.min(S.qi + gap, S.queue.length);
    S.queue.splice(at, 0, id);
  }
  next();
}
function mastery(id){ const p = S.prog[id]; return p && p.box >= 2; }
function isDue(id){ const p = S.prog[id]; return !p || p.box < 0 || p.due <= Date.now(); }

function F(){ return S.filtersByDeck[ACTIVE] || (S.filtersByDeck[ACTIVE] = {cats:null, pris:null}); }
function passFilter(c){
  const f = F();
  if(f.cats && f.cats.length && !f.cats.includes(c.cat)) return false;
  if(f.pris && f.pris.length && !f.pris.includes(c.pri)) return false;
  return true;
}
const CRAM_W = {us:12, boston:10, structure:9, math:8, units:8, scale:8, framework:7, error:6, sanity:6, assume:6, chains:5, aviation:3, locations:2};
function cramScore(c){
  const p = S.prog[c.id] || blank();
  const missed = p.last === "again" || p.last === "hard";
  let s = 0;
  if(p.last === "again") s += 100;
  else if(p.last === "hard") s += 70;
  else if(p.last === "easy") s -= 25;
  if(p.seen === 0) s += 25;
  if(p.seen > 0 && p.correct/p.seen < 0.6) s += 30;
  if(c.pri === "must") s += 30; else if(c.pri === "useful") s += 8;
  if(c.type === "anchor") s += 14;                       // core anchors lead a fresh cram pass
  if(missed && (c.cat === "math" || c.cat === "units")) s += 15;  // mental-math weakness next
  if(missed && c.cat === "structure") s += 10;
  s += CRAM_W[c.cat] || 4;
  if(p.box >= 3 && p.due > Date.now()) s -= 60;
  return s;
}
// keep a cram run from becoming eleven mental-math cards in a row
function interleave(ids){
  const pend = ids.slice(), out = [];
  let last = null, run = 0;
  while(pend.length){
    let pick = 0;
    for(let i=0;i<pend.length;i++){
      const cat = BY_ID[pend[i]].cat;
      if(cat !== last || run < 2){ pick = i; break; }
    }
    const id = pend.splice(pick,1)[0], cat = BY_ID[id].cat;
    run = (cat === last) ? run+1 : 1; last = cat;
    out.push(id);
  }
  return out;
}
function buildQueue(){
  const pool = DECK.filter(passFilter);
  if(S.mode === "cram"){
    S.queue = interleave(pool.slice().sort((a,b)=>cramScore(b)-cramScore(a)).map(c=>c.id));
  } else if(S.mode === "study"){
    const due = pool.filter(c=>S.prog[c.id] && S.prog[c.id].seen>0 && isDue(c.id))
                    .sort((a,b)=>(S.prog[a.id].due)-(S.prog[b.id].due));
    const fresh = pool.filter(c=>!S.prog[c.id] || S.prog[c.id].seen===0)
                      .sort((a,b)=>(a.pri==="must"?0:a.pri==="useful"?1:2)-(b.pri==="must"?0:b.pri==="useful"?1:2));
    S.queue = due.concat(fresh).map(c=>c.id);
  } else if(S.mode === "missed"){
    S.queue = pool.filter(c=>{
      const p = S.prog[c.id];
      return p && p.seen>0 && (p.last==="again" || p.last==="hard" || p.correct/p.seen < 0.6);
    }).sort((a,b)=>cramScore(b)-cramScore(a)).map(c=>c.id);
    S.queue = interleave(S.queue);
  }
  S.qi = 0; S.revealed = false;
}

/* ===================== QUESTION BANK ENGINE ===================== */
const LETTERS = ["A","B","C","D","E"];
const HEATS = {red:"Highest", orange:"High", yellow:"Medium", green:"Low"};

function bankOf(){ const it = ITEMS[S.nav.item]; return it && BANKS[it.bank]; }
function BP(qid){ return S.bankProg[qid] || (S.bankProg[qid] = {seen:0, ok:0, rev:0, last:null, star:false, choice:null}); }
function bpStatus(qid){
  const p = S.bankProg[qid];
  if(!p || (!p.seen && !p.rev)) return "unseen";
  return p.last === "correct" ? "correct" : (p.last === "revealed" ? "revealed" : "wrong");
}
function daysTo(iso){
  if(!iso) return null;
  const d = Math.ceil((new Date(iso).getTime() - Date.now()) / 86400000);
  return d;
}
function countdownText(iso){
  const d = daysTo(iso);
  if(d === null) return "";
  if(d < 0) return "past";
  if(d === 0) return "today";
  if(d === 1) return "tomorrow";
  return "in " + d + " days";
}

function bankFilter(q){
  const f = S.bank.filters;
  if(f.ch.length && !f.ch.includes(q.ch)) return false;
  if(f.heat.length && !f.heat.includes(q.heat)) return false;
  if(f.topic && q.topic !== f.topic) return false;
  if(f.status.length){
    const st = bpStatus(q.id);
    const starred = (S.bankProg[q.id] || {}).star;
    const hit = f.status.some(x => x === "starred" ? starred : x === st);
    if(!hit) return false;
  }
  if(f.q){
    const needle = f.q.toLowerCase();
    if(!(q.q + " " + q.topic + " " + q.o.join(" ")).toLowerCase().includes(needle)) return false;
  }
  return true;
}
const HEATW = {red:12, orange:8, yellow:4, green:1};
function bankScore(q){
  const p = S.bankProg[q.id] || {};
  let v = 0;
  if(p.last === "wrong") v += 100;
  else if(p.last === "revealed") v += 55;
  else if(!p.seen) v += 60;
  else if(p.seen && p.ok / p.seen < 0.6) v += 50;
  else if(p.seen === 1) v += 20;
  if(p.star) v += 15;
  return v + (HEATW[q.heat] || 2);
}
// Same stem (every fill-in of "Redacted Q7", text or diagram) counts as one family; otherwise the topic is the family.
function bankFamily(q){ const m = /Redacted Q(\d+)/.exec(q.src || ""); return m ? "stem" + m[1] : "topic:" + q.topic; }
function shuffleInPlace(a){ for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// Spaced interleave: keep priority order, but never repeat a family within the last FAM_GAP picks or a topic within TOPIC_GAP.
function spaceOut(ids, byId){
  const fams = new Set(ids.map(id=>bankFamily(byId[id]))), tops = new Set(ids.map(id=>byId[id].topic));
  const FAM_GAP = Math.min(8, Math.max(0, fams.size - 1)), TOPIC_GAP = Math.min(4, Math.max(0, tops.size - 1));
  const pend = ids.slice(), out = [];
  while(pend.length){
    const recentF = out.slice(-FAM_GAP).map(id=>bankFamily(byId[id])), recentT = out.slice(-TOPIC_GAP).map(id=>byId[id].topic);
    let pick = pend.findIndex(id=> !recentF.includes(bankFamily(byId[id])) && !recentT.includes(byId[id].topic));
    if(pick < 0) pick = pend.findIndex(id=> !recentF.includes(bankFamily(byId[id])));
    if(pick < 0) pick = 0;
    out.push(pend.splice(pick, 1)[0]);
  }
  return out;
}
function buildBankQueue(keepAt){
  const b = bankOf();
  { const f = S.bank.filters || {}; if(b.v2 && !S.bank.shuffle && !((f.ch||[]).length || (f.heat||[]).length || (f.status||[]).length || f.topic || f.q)){ v2Build(b, keepAt); return; } }
  const pool = b.questions.filter(bankFilter);
  const byId = {}; b.questions.forEach(q=>byId[q.id]=q);
  let ids;
  if(S.bank.shuffle){
    ids = shuffleInPlace(pool.map(q=>q.id));
  } else {
    // priority first (misses, unseen, shaky), but ties are shuffled so every session starts somewhere new
    const r = {}; pool.forEach(q=> r[q.id] = Math.random());
    ids = pool.slice().sort((x,y)=> (bankScore(y)-bankScore(x)) || (r[x.id]-r[y.id])).map(q=>q.id);
  }
  // One version per redacted stem per pass, so a pass never feels like the same question twice.
  // The best candidate (a miss, then unseen, then shaky) represents the stem; the other versions rotate in on later passes.
  // Filtered drills from Review keep everything you selected.
  const f = S.bank.filters || {};
  const filtered = (f.ch||[]).length || (f.heat||[]).length || (f.status||[]).length || f.topic || f.q;
  if(!filtered && !S.bank.shuffle){
    const seenFam = new Set(), keepFam = keepAt && byId[keepAt] ? bankFamily(byId[keepAt]) : null;
    ids = ids.filter(id=>{
      const fam = bankFamily(byId[id]);
      if(!fam.startsWith("stem")) return true;
      if(fam === keepFam) return id === keepAt;
      if(seenFam.has(fam)) return false;
      seenFam.add(fam); return true;
    });
  }
  if(S.bank.interleave) ids = spaceOut(ids, byId);
  S.bank.queue = ids;
  S.bank.qi = keepAt && ids.indexOf(keepAt) >= 0 ? ids.indexOf(keepAt) : 0;
  S.bank.answered = false; S.bank.revealed = false; S.bank.choice = null; S.bank.sel = null;
  S.bank.finished = false;
}

function answerBank(q, i){
  if(S.bank.answered || S.bank.revealed || i === null || i === undefined) return;
  const p = BP(q.id), ok = i === q.a;
  p.seen++; p.choice = i;
  if(ok){ p.ok++; p.last = "correct"; } else { p.last = "wrong"; }
  if(S.bank.conf){
    p.conf = p.conf || {};
    const c = p.conf[S.bank.conf] || (p.conf[S.bank.conf] = {n:0, ok:0});
    c.n++; if(ok) c.ok++;
  }
  noteActivity(ok);

/* ===================== LATE NIGHT CRAM ===================== */
function CP(id){ return S.cramProg[id] || (S.cramProg[id] = {seen:0, ok:0, last:null, best:0}); }
function cramItem(ref){ return ref.k === "m" ? CRAM_MCQ.find(x=>x.id===ref.id) : CRAM_SA.find(x=>x.id===ref.id); }
function buildCramQueue(onlyIds){
  const need = x => { const p = S.cramProg[x.id]; return !p || !p.seen ? 1 : (p.last === "correct" ? 3 : 0); };
  const pick = list => list.filter(x=>!onlyIds || onlyIds.includes(x.id))
    .map((x,i)=>({x,i})).sort((a,b)=> need(a.x) - need(b.x) || a.i - b.i).map(o=>o.x.id);
  const ms = pick(CRAM_MCQ), ss = pick(CRAM_SA), q = [];
  // two select-all questions, then one short answer, so the writing never piles up at the end
  while(ms.length || ss.length){
    if(ms.length) q.push({k:"m", id:ms.shift()});
    if(ms.length) q.push({k:"m", id:ms.shift()});
    if(ss.length) q.push({k:"s", id:ss.shift()});
  }
  S.cram = {queue:q, qi:0, sel:[], checked:false, text:"", grade:null, self:null, done:false, results:{}};
}
function cramReset(){ S.cram.sel = []; S.cram.checked = false; S.cram.text = ""; S.cram.grade = null; S.cram.self = null; }
function cramNext(){
  if(S.cram.qi + 1 >= S.cram.queue.length){ S.cram.done = true; }
  else { S.cram.qi++; cramReset(); }
  render(); paneCard.scrollTop = 0;
}
function cramRecord(id, frac){
  const p = CP(id);
  p.seen++;
  p.last = frac >= 1 ? "correct" : frac > 0 ? "partial" : "wrong";
  if(frac >= 1) p.ok++;
  p.best = Math.max(p.best||0, frac);
  S.cram.results[id] = p.last;
  noteActivity(frac >= 1); S.session.answered++;
  queueSave();
}
function scoreCram(q, sel){
  const right = q.o.map((o,i)=>o[1] ? i : -1).filter(i=>i>=0);
  const hits = sel.filter(i=>q.o[i][1]).length, bad = sel.filter(i=>!q.o[i][1]).length;
  if(hits === right.length && !bad) return 1;
  return Math.max(0, (hits - bad) / right.length);
}
function renderCram(){
  if(!S.cram || !S.cram.queue.length) buildCramQueue();
  if(S.cram.done) return renderCramDone();
  const ref = S.cram.queue[S.cram.qi], it = cramItem(ref);
  const counter = '<span class="counter">'+(S.cram.qi+1)+' / '+S.cram.queue.length+'</span>';
  if(ref.k === "m") return renderCramMCQ(it, counter);
  renderCramSA(it, counter);
}
function renderCramMCQ(q, counter){
  const c = S.cram, shown = c.checked;
  const frac = shown ? scoreCram(q, c.sel) : 0;
  const nRight = q.o.filter(o=>o[1]).length;
  const opts = q.o.map((o,i)=>{
    const picked = c.sel.includes(i);
    let cls = "opt multi", mk = "";
    if(shown){
      if(o[1] && picked){ cls += " correct"; mk = '<span class="mk">right</span>'; }
      else if(o[1]){ cls += " correct"; mk = '<span class="mk" style="color:var(--hard)">you missed this</span>'; }
      else if(picked){ cls += " chosen-wrong"; mk = '<span class="mk">wrong pick</span>'; }
    }
    return '<button class="'+cls+'" data-cpick="'+i+'" aria-checked="'+(!shown && picked)+'" role="checkbox"'+(shown?" disabled":"")+'>'+
      '<span class="badge">'+LETTERS[i]+'</span><span class="otext">'+esc(o[0])+
      (shown ? '<span style="display:block;font-size:13px;color:var(--muted);margin-top:4px">'+esc(o[2])+'</span>' : '')+
      '</span>'+mk+'</button>';
  }).join("");
  const verdict = !shown ? '' :
    '<div class="verdict"><span class="mark '+(frac>=1?"ok":frac>0?"part":"no")+'">'+(frac>=1?"✓":frac>0?"~":"✕")+'</span>'+
      (frac>=1 ? 'All '+nRight+' right, no wrong picks' : 'Partial credit: '+Math.round(frac*100)+'%. There '+(nRight===1?'was ':'were ')+nRight+' right answer'+(nRight===1?'':'s')+'.')+'</div>';
  paneCard.innerHTML =
    '<div class="test-wrap">'+
      '<div class="tagrow"><span class="tag must">Late night cram</span><span class="tag type">Select all that apply</span>'+
        '<span class="tag">Ch '+q.ch+' · '+esc(q.topic)+'</span>'+counter+'</div>'+
      '<div class="card"><div class="q"><div class="who">Question</div><p style="font-size:18px'+(q.level?';white-space:pre-line':'')+'">'+esc(q.q)+'</p></div></div>'+
      '<div class="opts">'+opts+'</div>'+
      verdict+
      '<div class="navrow">'+
        (shown ? '<button class="btn-primary" id="cr-next">Next</button>'
               : '<button class="btn-primary" id="cr-check"'+(c.sel.length?'':' disabled style="opacity:.45;cursor:default"')+'>Check answer</button>')+
        '<span class="spacer"></span><button class="ghost" id="cr-skip" style="padding:11px 14px">Skip</button></div>'+
      '<div class="hintline">'+(shown ? 'Every option has its reason underneath. Enter for next.'
        : 'Could be one right answer, could be all of them. Wrong picks cost you. Keys: 1 to 6 toggle · Enter check.')+'</div>'+
    '</div>';
  paneCard.querySelectorAll("[data-cpick]").forEach(b=> b.onclick = ()=>{
    if(c.checked) return;
    const i = +b.dataset.cpick, at = c.sel.indexOf(i);
    if(at >= 0) c.sel.splice(at,1); else c.sel.push(i);
    render();
  });
  const ck = document.getElementById("cr-check");
  if(ck) ck.onclick = ()=>{ if(!c.sel.length) return; c.checked = true; cramRecord(q.id, scoreCram(q, c.sel)); render(); };

function SP(id){ return S.saProg[id] || (S.saProg[id] = {done:0, hits:null, own:null, best:0}); }
function saQueue(){
  const b = bankOf();
  const list = (b.longs || []).slice();
  const score = function(x){
    const p = SP(x.id);
    // unattempted first, then weakest attempted; overlap and red topics float up within each band
    let v = p.done ? (1 - p.best / x.points.length) : 2;
    if(x.overlap) v += 0.15;
    if(x.heat === "red") v += 0.1;
    if(p.own === "parroted") v += 0.2;
    return v;
  };
  return list.sort(function(x,y){ return score(y) - score(x); }).map(function(x){ return x.id; });
}

function saSummary(){
  const b = bankOf(), longs = b.longs || [];
  const done = longs.filter(function(x){ return SP(x.id).done; });
  if(!done.length) return "";
  let hit = 0, tot = 0, parrot = 0;
  const byTopic = {};
  done.forEach(function(x){
    const p = SP(x.id);
    hit += p.best; tot += x.points.length;
    if(p.own === "parroted") parrot++;
    const t = byTopic[x.topic] || (byTopic[x.topic] = {h:0, n:0});
    t.h += p.best; t.n += x.points.length;
  });
  const worst = Object.entries(byTopic).sort(function(a,c){ return (a[1].h/a[1].n) - (c[1].h/c[1].n); })[0];
  return "After " + done.length + " short answers: " + Math.round(hit/tot*100) + "% of marking points. Weakest: " +
    worst[0] + " at " + Math.round(worst[1].h/worst[1].n*100) + "%." +
    (parrot ? " " + parrot + " answer" + (parrot===1?"":"s") + " read as parroted rather than explained in your own words." : "");
}

  }
  const btn = document.getElementById("sa-go");
  if(btn){ btn.textContent = "Grading…"; btn.disabled = true; }

    const g = await sampleNS.json(
      ((bankOf().ctx || PSY_CTX).grade) + " " +
      "Be a fair but exacting grader: credit a marking point if the substance is there even when the wording differs, and withhold it if the idea is absent or wrong. " +
      "Do not invent facts beyond the marking points and the model answer.\n\n" +
      "PROMPT: " + sa.q + "\n\nMARKING POINTS, in order:\n" + sa.points.map(function(x,i){return (i+1)+". "+x;}).join("\n") +
      "\n\nMODEL ANSWER: " + sa.model +

      "\"terms_missing\":[key terms a grader expects that he did not use, at most 4, empty array if none]," +
      "\"comment\":\"the single highest-value fix, one sentence, max 24 words\"}. No emojis, no em dashes.",
      {modelTier:"default"});

    S.drafts[sa.id] = null;

    if(g.terms_missing && g.terms_missing.length){
      const seen = p.terms || (p.terms = []);

function saWeak(){
  const b = bankOf(), longs = b.longs || [];
  return longs.map(function(sa){
    const p = S.saProg[sa.id];
    if(!p || !p.done) return null;
    const hits = p.bestHits || p.hits || [];
    const missed = sa.points.filter(function(pt,i){ return hits[i] !== true; });
    return {sa, p, score:p.best, total:sa.points.length, frac:p.best/sa.points.length, missed,
            terms:(p.terms||[])};
  }).filter(Boolean).filter(function(r){ return r.frac < 0.8 || r.p.own === "parroted"; })
    .sort(function(a,c){ return a.frac - c.frac; });
}
// Two different things, and conflating them is misleading on exam day:
// wrongNow = still wrong on the latest attempt. retried = got it wrong once but has since fixed it.
function mcqWeak(){
  const b = bankOf();
  const byTopic = {};
  b.questions.forEach(function(q){
    const p = S.bankProg[q.id];
    if(!p || !p.seen) return;
    const t = byTopic[q.topic] || (byTopic[q.topic] = {topic:q.topic, ch:q.ch, heat:q.heat, n:0, ok:0, wrongNow:0, retried:0});
    t.n += p.seen; t.ok += p.ok;
    if(p.last === "wrong") t.wrongNow++;
    else if(p.seen > p.ok) t.retried++;
  });
  const all = Object.values(byTopic);
  return {
    wrong: all.filter(function(t){ return t.wrongNow; }).sort(function(a,c){ return c.wrongNow - a.wrongNow; }),
    retried: all.filter(function(t){ return !t.wrongNow && t.retried; }).sort(function(a,c){ return c.retried - a.retried; })
  };
}
// Every question he asks the coach is a direct signal of what he does not understand, so it is kept and fed to the doubt sheet.
function askTopic(c){
  if(c.topic) return c.topic;
  if(c.cat && CATS[c.cat]) return CATS[c.cat].name;
  const m = /topic: (.+)$/.exec(c.linkText || "");
  if(m) return m[1];
  const parts = String(c.linkText || "").split(", ");
  return parts.length > 1 ? parts[parts.length-1] : "General";
}

             starter: Array.from(document.querySelectorAll('#chat-starters [data-ask]')).some(function(b){ return b.dataset.ask === text; })};

// One-time cleanup: Psych and CH 0002 coach history was exported to PDF, so each device drops its copy once.
// Coach history saved after this keeps saving normally, in every folder.
const PURGE_ID = "coach-purge-2026-10-05", PURGE_KEY = "drillroom.purge", PURGE_FOLDERS = {psy:true, ch0002:true};
let purgePending = false;
try{ purgePending = localStorage.getItem(PURGE_KEY) !== PURGE_ID; }catch(e){ purgePending = true; }
let ID_FOLDER = null;
function idFolders(){
  if(ID_FOLDER) return ID_FOLDER;
  const idx = {};
  Object.values(ITEMS).forEach(it=>{
    const put = arr => (arr || []).forEach(x=>{ if(x && x.id) idx[x.id] = it.folder; });
    if(it.kind === "bank" && BANKS[it.bank]){ const b = BANKS[it.bank]; put(b.questions); put(b.shorts); put(b.longs); put(b.essays); }
    else if(it.kind === "deck" && DECKS[it.deck]) put(DECKS[it.deck].cards);
    else if(it.kind === "cram"){ put(CRAM_MCQ); put(CRAM_SA); }
    else if(it.kind === "test"){ idx["t-" + it.test] = it.folder; }
  });
  return (ID_FOLDER = idx);
}
function chatFolder(k){
  const idx = idFolders(), key = String(k);
  const t = /^t-(.+?)-[^-]+$/.exec(key);
  if(t && idx["t-" + t[1]]) return idx["t-" + t[1]];
  const bare = key.replace(/^(bq|cr|es|sa)-/, "");
  return idx[bare.replace(/-(l|a)$/, "")] || idx[bare] || idx[key] || null;
}
function askFolder(a){ return (a && ITEMS[a.item] && ITEMS[a.item].folder) || (a && chatFolder(a.card)) || null; }
function purgeOldCoach(){
  if(!purgePending) return;
  Object.keys(S.chats).forEach(k=>{ if(PURGE_FOLDERS[chatFolder(k)]) delete S.chats[k]; });
  S.asks = S.asks.filter(a=> !PURGE_FOLDERS[askFolder(a)]);
  convos = S.chats;
}
function finishPurge(){
  if(!purgePending) return;
  purgePending = false;
  try{ localStorage.setItem(PURGE_KEY, PURGE_ID); }catch(e){}

function keepChats(){
  Object.keys(S.chats).forEach(k=>{ if(S.chats[k].length > CHAT_MAX) S.chats[k] = S.chats[k].slice(-CHAT_MAX); });
}
// Every coach thread is its own document in "chats", and every question asked is its own document in "asks",
// so history is never trimmed to fit the main progress document.
const CHAT_MAX = 120;
const chatDocId = k => String(k).replace(/[^A-Za-z0-9_\-.~:@+]/g, "_").slice(0, 190) || "chat";
const askDocId = a => String(a.at) + "-" + Array.from(String(a.q||"")).reduce((h,c)=> (h*31 + c.charCodeAt(0)) >>> 0, 7).toString(36);
const chatWrites = {};
function putChat(k){
  if(!dbRoot || !S.chats[k]) return;
  const msgs = S.chats[k].slice(-CHAT_MAX);
  const prev = chatWrites[k] || Promise.resolve();
  chatWrites[k] = prev.then(()=> dbRoot.collection("chats").doc(chatDocId(k)).set({key:k, msgs, updated:Date.now()})).catch(()=>{});
}
function putAsk(a){
  if(!dbRoot || !a) return Promise.resolve();
  return dbRoot.collection("asks").doc(askDocId(a)).set({at:a.at, item:a.item||"", card:a.card||"", topic:a.topic||"", stem:a.stem||"", q:a.q||"", a:a.a||"", starter:!!a.starter}).catch(()=>{});

async function syncSideStores(){
  if(!dbRoot) return;
  try{
    const snap = await dbRoot.collection("chats").limit(1000).get();
    const have = {};
    purgeOldCoach();
    snap.docs.forEach(d=>{
      const v = d.data(); if(!v || !v.key || !Array.isArray(v.msgs)) return;
      if(purgePending && PURGE_FOLDERS[chatFolder(v.key)]){ dbRoot.collection("chats").doc(d.id).delete().catch(()=>{}); return; }
      have[v.key] = true;
      const mine = S.chats[v.key];
      if(!mine || v.msgs.length >= mine.length) S.chats[v.key] = v.msgs.map(m=>({role:m.role, content:m.content}));
    });
    convos = S.chats;
    for(const k of Object.keys(S.chats)){ if(!have[k] && S.chats[k].length){ putChat(k); await chatWrites[k]; } }
  }catch(e){}
  try{
    const snap = await dbRoot.collection("asks").limit(1000).get();
    const key = a => a.at + "|" + a.q;
    const mine = new Set(S.asks.map(key)), remote = new Set();
    snap.docs.forEach(d=>{ const v = d.data(); if(!v) return;
      if(purgePending && PURGE_FOLDERS[askFolder(v)]){ dbRoot.collection("asks").doc(d.id).delete().catch(()=>{}); return; }
      remote.add(key(v)); if(!mine.has(key(v))){ S.asks.push(Object.assign({}, v)); mine.add(key(v)); } });
    S.asks.sort((x,y)=> x.at - y.at);
    for(const a of S.asks){ if(!remote.has(key(a))) await putAsk(a); }
  }catch(e){}
  finishPurge();
  saveLocal();
  if(curCard && !chatBusy) paintChat();
}

  if(btn){ btn.textContent = "Writing…"; btn.disabled = true; }
  if(st) st.textContent = "Building it from your actual misses…";
  const payload = weak.slice(0, 10).map(function(r){
    return "TOPIC: " + r.sa.topic + " (" + unitName(bankOf(), r.sa.ch) + "), scored " + r.score + "/" + r.total +
      (r.p.own === "parroted" ? ", and the answer read as parroted rather than explained in his own words" : "") +
      "\nPROMPT: " + r.sa.q +
      "\nMARKING POINTS HE FAILED TO MAKE:\n" + r.missed.map(function(m){ return "  - " + m; }).join("\n");
  }).join("\n\n") +
    (mweak.wrong.length ? "\n\nMULTIPLE-CHOICE TOPICS HE IS STILL GETTING WRONG: " + mweak.wrong.map(function(t){ return t.topic + " (" + t.wrongNow + "x)"; }).join(", ") : "") +
    (eweak.length ? "\n\nESSAYS UNDER 8/10:\n" + eweak.map(function(r){ return "  - " + r.x.q + " scored " + r.p.best + "/10" +
      (r.p.rubric ? ", missing: " + [r.p.rubric.position?"":"clear position", (r.p.rubric.class_points||0)>=3?"":"three class points", r.p.rubric.counter?"":"counterargument"].filter(Boolean).join(", ") : ""); }).join("\n") : "") +
    (asks.length ? "\n\nQUESTIONS HE ASKED THE AI TUTOR WHILE STUDYING (each one is something he did not understand; the most repeated topics matter most; generic button prompts are weaker signals than ones he typed):\n" +
      asksByTopic(asks).slice(0, 10).map(function(gr){ return "  TOPIC " + gr[0] + " (" + gr[1].length + " questions):\n" +
        gr[1].slice(-5).map(function(a){ return "    - " + (a.starter ? "[button] " : "") + a.q + (a.stem ? "  [about: " + a.stem.slice(0,120) + "]" : ""); }).join("\n"); }).join("\n") : "");
  try{
    const out = await sampleNS.json(
      "You are writing a last-minute revision sheet for " + ((bankOf().ctx || PSY_CTX).doubt) + ". "+
      "Below are the prompts he scored badly on, the exact marking points he failed to make, any topics or essays he is weak on, and the questions he asked his AI tutor. Treat repeated tutor questions as confusion and write an entry that resolves each one. "+
      "For each distinct weak area, write an entry. Be concrete and brief; he has minutes, not hours. "+
      "Do not invent facts, numbers or citations beyond what the marking points state. No emojis, no em dashes.\n\n"+
      payload+
      "\n\nReturn JSON only: an array of at most 8 objects, each "+
      "{\"area\":\"short name of the weak area, including the chapter\","+
      "\"why_you_missed\":\"one sentence naming the specific thing he left out, drawn from the failed marking points\","+
      "\"must_say\":\"two sentences maximum: exactly what a full-credit answer has to state for this topic\","+
      "\"key_terms\":[the specific terms a grader looks for here, 3 to 6 of them]}. "+
      "Order them worst first.",
      {modelTier:"default"});
    S.doubt = S.doubt || {}; S.doubt[bankOf().id] = {out: Array.isArray(out) ? out : (out.areas || []), at: Date.now()};
    queueSave();
  }catch(e){
    if(st) st.innerHTML = '<span style="color:var(--again)">'+esc(e && e.code === "rate_limited" ? "Rate limited. Try again in a moment." : "Could not generate. The missed marking points below still stand.")+'</span>';
  }
  render(); paneCard.scrollTop = 0;
}


/* ===================== MARKDOWN EXPORT (one file per subject) ===================== */
function mdEsc(t){ return String(t == null ? "" : t).replace(/\r/g,"").trim(); }
function mdQuote(t){ return mdEsc(t).split("\n").map(l=>"> "+l).join("\n"); }
function buildMarkdown(folderId){
  const f = folderById(folderId);
  if(!f) return "";
  const day = new Date().toISOString().slice(0,10);
  const L = [];
  L.push("# "+f.name+" · "+f.full+": Drill Room export", "");
  L.push("Exported "+day+" from Drill Room. Everything below is your own saved progress: misses, stars, notes, written answers, doubt sheets and every question you asked the coach.", "");
  f.items.forEach(id=>{
    const it = ITEMS[id]; if(!it) return;
    L.push("## "+it.name, "");
    if(it.kind === "bank"){
      const b = BANKS[it.bank]; if(!b) return;
      const qs = b.questions;
      const tried = qs.filter(q=>(S.bankProg[q.id]||{}).seen);
      const wrong = qs.filter(q=>(S.bankProg[q.id]||{}).last === "wrong");
      const right = qs.filter(q=>(S.bankProg[q.id]||{}).last === "correct");
      const starred = qs.filter(q=>(S.bankProg[q.id]||{}).star);
      L.push("- Multiple choice attempted: "+tried.length+" of "+qs.length, "- Right on last try: "+right.length, "- Still wrong: "+wrong.length, "- Starred: "+starred.length, "");
      const qblock = (q, withMine)=>{
        const p = S.bankProg[q.id] || {};
        const unit = unitName(b, q.ch);
        L.push("#### "+mdEsc(q.topic)+" ("+unit+(q.src ? ", "+q.src : "")+")", "", mdEsc(q.q), "");
        if(q.fig) L.push("*Figure:* "+mdEsc(q.fig.alt), "");
        if(withMine && (p.choice === 0 || p.choice)) L.push("- You chose: "+LETTERS[p.choice]+". "+mdEsc(q.o[p.choice]));
        L.push("- Correct: "+LETTERS[q.a]+". "+mdEsc(q.o[q.a]), "- Why: "+mdEsc(q.why));
        if(q.trap) L.push("- Trap: "+mdEsc(q.trap));
        if(S.notes[q.id]) L.push("- Your note: "+mdEsc(S.notes[q.id]));
        L.push("");
      };
      if(wrong.length){ L.push("### Still wrong", ""); wrong.forEach(q=>qblock(q, true)); }
      const starOnly = starred.filter(q=>!wrong.includes(q));
      if(starOnly.length){ L.push("### Starred", ""); starOnly.forEach(q=>qblock(q, false)); }
      const noted = qs.filter(q=>S.notes[q.id] && !wrong.includes(q) && !starOnly.includes(q));
      if(noted.length){ L.push("### Your notes", ""); noted.forEach(q=>L.push("- **"+mdEsc(q.topic)+"**: "+mdEsc(S.notes[q.id]))); L.push(""); }
      const longs = (b.longs||[]).filter(x=>(S.saProg[x.id]||{}).done);
      if(longs.length){
        L.push("### Short answers you wrote", "");
        longs.forEach(x=>{
          const p = S.saProg[x.id], hits = p.bestHits || p.hits || [];
          L.push("#### "+mdEsc(x.topic)+": best "+(p.best||0)+" of "+x.points.length+" points", "", mdEsc(x.q), "");
          if(p.text) L.push("Your answer:", "", mdQuote(p.text), "");
          if((p.best||0) < x.points.length){
            if(hits.length){ const missed = x.points.filter((pt,i)=>hits[i] !== true); L.push("Points still to nail:"); missed.forEach(m=>L.push("- "+mdEsc(m))); L.push(""); }
            else { L.push("Marking points (point-by-point detail was not saved for this attempt):"); x.points.forEach(m=>L.push("- "+mdEsc(m))); L.push(""); }
          }
          if(x.model) L.push("Full-credit answer:", "", mdQuote(x.model), "");
        });
      }
      const ess = (b.essays||[]).filter(x=>(S.saProg[x.id]||{}).done);
      if(ess.length){
        L.push("### Essays you wrote", "");
        ess.forEach(x=>{
          const p = S.saProg[x.id];
          L.push("#### "+mdEsc(x.topic)+(typeof p.best === "number" ? ": best "+p.best+" / 10" : ""), "", mdEsc(x.q), "");
          if(p.rubric) L.push("Rubric: "+[p.rubric.position?"position ✓":"no clear position", (p.rubric.class_points||0)+" class points", p.rubric.counter?"counterargument ✓":"no counterargument"].join(" · "), "");
          if(p.text) L.push("Your essay:", "", mdQuote(p.text), "");
        });
      }
      const dd = (S.doubt||{})[b.id];
      if(dd && dd.out && dd.out.length){
        L.push("### Doubt sheet (generated "+new Date(dd.at).toISOString().slice(0,10)+")", "");
        dd.out.forEach(a=>{
          L.push("#### "+mdEsc(a.area), "", mdEsc(a.why_you_missed), "", "**Say this:** "+mdEsc(a.must_say));
          if(a.key_terms && a.key_terms.length) L.push("", "Key terms: "+a.key_terms.map(mdEsc).join(", "));
          L.push("");
        });
      }
    } else if(it.kind === "cram"){
      const all = CRAM_MCQ.concat(CRAM_SA);
      const miss = all.filter(x=>{ const p = S.cramProg[x.id]; return p && p.seen && p.last !== "correct"; });
      L.push("- Attempted: "+all.filter(x=>(S.cramProg[x.id]||{}).seen).length+" of "+all.length, "- Not fully right yet: "+miss.length, "");
      miss.forEach(x=>{
        L.push("#### "+mdEsc(x.topic), "", mdEsc(x.q), "");
        if(x.o) L.push("Right answers: "+x.o.filter(o=>o[1]).map(o=>mdEsc(o[0])).join("; "), "");
        if(x.model){ const p = S.cramProg[x.id]; if(p.text) L.push("Your answer:", "", mdQuote(p.text), ""); L.push("Full-credit answer:", "", mdQuote(x.model), ""); }
      });
    } else if(it.kind === "deck"){
      const cards = DECKS[it.deck].cards;
      const shaky = cards.filter(c=>{ const p = S.prog[c.id]; return p && p.seen && (p.last === "again" || p.last === "hard"); });
      L.push("- Cards seen: "+cards.filter(c=>(S.prog[c.id]||{}).seen).length+" of "+cards.length, "- Still shaky (last rated Again or Hard): "+shaky.length, "");
      shaky.forEach(c=>L.push("- **"+mdEsc(c.q)+"** "+mdEsc(c.a)));
      if(shaky.length) L.push("");
    } else if(it.kind === "test"){
      const r = S.tests[it.test];
      L.push(r ? "- Best: "+fmtPts(r.best)+" / "+(r.bestTotal||"?")+" across "+r.attempts+" attempts" : "- Not taken yet", "");
    }
  });
  const asks = S.asks.filter(a=> ITEMS[a.item] && ITEMS[a.item].folder === folderId);
  L.push("## What you asked the coach ("+asks.length+")", "");
  if(!asks.length) L.push("Nothing asked yet.", "");
  asksByTopic(asks).forEach(([topic, list])=>{
    L.push("### "+mdEsc(topic)+" (asked "+list.length+"x)", "");
    list.forEach(a=>{
      L.push("- **"+new Date(a.at).toISOString().slice(0,16).replace("T"," ")+" UTC** "+(a.starter?"(button) ":"")+mdEsc(a.q));
      if(a.stem) L.push("  - On: "+mdEsc(a.stem));
      if(a.a) L.push("  - Coach: "+mdEsc(a.a).replace(/\n+/g," "));
    });
    L.push("");
  });
  return L.join("\n");
}
async function saveMarkdown(folderId){
  const f = folderById(folderId), md = buildMarkdown(folderId);
  if(!md) return;
  const name = "Drill Room - "+f.name+" - "+new Date().toISOString().slice(0,10)+".md";
  let dl = null; try{ dl = await window.claude?.use?.("downloads"); }catch(e){}
  if(dl){
    try{ await dl.save({filename:name, data:md}); toast("Saved "+name); return; }
    catch(e){ if(e && e.code === "declined") return; }
  }
  try{ await navigator.clipboard.writeText(md); toast("Download unavailable here, so the Markdown is on your clipboard."); }
  catch(e){ openModal("Markdown for "+f.name, '<textarea style="min-height:320px;width:100%">'+esc(md)+'</textarea><div class="hintline" style="text-align:left">Select all and copy.</div>'); }
}

function itemProgress(id){
  const it = ITEMS[id];
  if(it.kind === "deck"){
    const cards = DECKS[it.deck].cards;
    const solid = cards.filter(c=>{ const p = S.prog[c.id]; return p && p.box >= 2; }).length;
    return {done:solid, total:cards.length, label:solid + " / " + cards.length + " solid"};
  }
  if(it.kind === "bank"){
    const b = BANKS[it.bank];
    const done = b.questions.filter(q=>(S.bankProg[q.id]||{}).last === "correct").length;
    return {done, total:b.questions.length, label:done + " / " + b.questions.length + " right"};
  }
  if(it.kind === "cram"){
    const all = CRAM_MCQ.concat(CRAM_SA);
    const done = all.filter(x=>(S.cramProg[x.id]||{}).last === "correct").length;
    return {done, total:all.length, label:done + " / " + all.length + " right"};
  }
  const t = TESTS.find(x=>x.id===it.test), r = S.tests[it.test];
  const total = t ? t.qs.length : 0;
  return r ? {done:r.best, total, label:"best " + fmtPts(r.best) + " / " + total}
           : {done:0, total, label:"not taken"};
}
function folderProgress(f){
  let d = 0, t = 0;
  f.items.forEach(id=>{ const p = itemProgress(id); d += p.done; t += p.total; });
  return {d, t, pct: t ? Math.round(d/t*100) : 0};
}

/* ===================== RENDER: REDO TESTS ===================== */
const testById = id => TESTS.find(t=>t.id===id) || TESTS[0];
const qById = (t,qid) => t.qs.find(q=>q.id===qid);

function startRun(testId, onlyIds){
  const t = testById(testId);
  const ids = (onlyIds && onlyIds.length) ? onlyIds : t.qs.map(q=>q.id);
  S.run = {testId, ids, qi:0, marks:{}, done:false, result:null, stage:"quiz", partial:!!onlyIds};
  render();
}
function markOf(qid){ return S.run.marks[qid]; }
function answered(q){
  const m = markOf(q.id);
  if(!m) return false;
  if(q.type === "blanks") return m.length === q.blanks.length && m.every(v=>!!v);
  return m.length > 0;
}
function scoreQ(q, m){
  m = m || [];
  if(q.type === "single") return {pts: (m[0] === q.ans[0]) ? 1 : 0, state: (m[0] === q.ans[0]) ? "ok" : "no"};
  if(q.type === "multi"){
    const hits = m.filter(x=>q.ans.includes(x)).length;
    const miss = m.filter(x=>!q.ans.includes(x)).length;
    const exact = hits === q.ans.length && miss === 0;
    const pts = exact ? 1 : Math.max(0, (hits - miss) / q.ans.length);
    return {pts, state: exact ? "ok" : (pts > 0 ? "part" : "no")};
  }
  const right = q.blanks.filter((b,i)=> m[i] === b.ans).length;
  const pts = right / q.blanks.length;
  return {pts, state: pts === 1 ? "ok" : (pts > 0 ? "part" : "no")};
}
function gradeRun(){
  const t = testById(S.run.testId);
  const rows = S.run.ids.map(qid=>{
    const q = qById(t,qid), sc = scoreQ(q, markOf(qid));
    return {qid, pts:sc.pts, state:sc.state};
  });
  const got = rows.reduce((a,r)=>a+r.pts,0), total = rows.length;
  S.run.result = {rows, got, total, at:Date.now()};
  S.run.done = true; S.run.stage = "results";
  if(!S.run.partial){
    const rec = S.tests[t.id] || (S.tests[t.id] = {attempts:0, best:0, last:0});
    rec.attempts++; rec.last = got; rec.lastTotal = total;
    if(got > (rec.best||0)) rec.best = got;
    rec.bestTotal = total; rec.at = Date.now();
  }
  queueSave();
  render();
  paneCard.scrollTop = 0;
}
const fmtPts = n => (Math.round(n*100)/100).toString();
const optText = (q,id) => { const o = (q.opts||[]).find(x=>x[0]===id); return o ? o[1] : id; };
function answerText(q, m){
  m = m || [];
  if(!m.length) return "(left blank)";
  if(q.type === "blanks") return q.blanks.map((b,i)=> (m[i]||"—") + " " + b.label).join(", ");
  return m.slice().sort().map(id=> id + ". " + optText(q,id)).join("  ·  ");
}
function correctText(q){
  if(q.type === "blanks") return q.blanks.map(b=> b.ans + " " + b.label).join(", ");
  return q.ans.map(id=> id + ". " + optText(q,id)).join("  ·  ");
}

}

function dotsHTML(){
  const t = testById(S.run.testId);
  return '<div class="dots">' + S.run.ids.map((qid,i)=>{
    const st = i === S.run.qi ? "cur" : (answered(qById(t,qid)) ? "done" : "todo");
    return '<button data-go="'+i+'" data-st="'+st+'" aria-label="Question '+(i+1)+'">'+(i+1)+'</button>';
  }).join("") + '</div>';
}

function renderQuestion(){
  const t = testById(S.run.testId);
  const qid = S.run.ids[S.run.qi], q = qById(t,qid);
  const m = markOf(qid) || [];
  const last = S.run.qi === S.run.ids.length - 1;
  let body = "";
  if(q.type === "blanks"){
    body = '<div>' + q.blanks.map((b,i)=>
      '<div class="blankrow"><span class="bl">'+esc(b.label)+'</span>' +
      b.choices.map(c=>'<button class="chip" data-blank="'+i+'" data-val="'+esc(c)+'" aria-pressed="'+(m[i]===c)+'" style="'+(m[i]===c?'border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600':'')+'">'+esc(c)+'</button>').join("") +
      '</div>').join("") + '</div>';
  } else {
    const cls = q.type === "multi" ? "multi" : "single";
    body = '<div class="opts">' + q.opts.map(([id,txt])=>
      '<button class="opt '+cls+'" data-opt="'+id+'" aria-checked="'+(m.includes(id))+'" role="'+(q.type==="multi"?"checkbox":"radio")+'">'+
      '<span class="badge">'+id+'</span><span class="otext">'+esc(txt)+'</span></button>').join("") + '</div>';
  }
  paneCard.innerHTML =
    '<div class="test-wrap">'+
      '<div class="tagrow">'+
        '<span class="tag must">'+esc(t.title)+'</span>'+
        (q.tag ? '<span class="tag type">'+esc(q.tag)+'</span>' : '')+
        '<span class="tag">'+(q.type==="multi"?"Select all that apply":q.type==="blanks"?"Fill in the blanks":"Multiple choice")+'</span>'+
        '<span class="counter">Q '+(S.run.qi+1)+' / '+S.run.ids.length+'</span>'+
      '</div>'+
      dotsHTML()+
      '<div class="card"><div class="q"><div class="who">Question '+(S.run.qi+1)+'</div><p style="font-size:18px">'+esc(q.stem)+'</p></div></div>'+
      (q.fig ? '<div class="figbox"><img src="'+q.fig.src+'" alt="'+esc(q.fig.alt)+'"><div class="figcap">Figure from the original exam</div></div>' : '')+
      (q.note ? '<div class="note">'+esc(q.note)+'</div>' : '')+
      body+
      '<div class="navrow">'+
        '<button class="ghost" id="t-back" style="padding:11px 15px"'+(S.run.qi===0?' disabled':'')+'>Back</button>'+
        '<span class="spacer"></span>'+
        '<button class="btn-primary" id="t-next">'+(last ? "Review answers" : "Next")+'</button>'+
      '</div>'+
      '<div class="hintline">Nothing is marked until you submit. Keys: 1 to 4 to choose, Enter for next.</div>'+
    '</div>';

  paneCard.querySelectorAll("[data-opt]").forEach(b=> b.onclick = ()=> pick(q, b.dataset.opt));
  paneCard.querySelectorAll("[data-blank]").forEach(b=> b.onclick = ()=>{
    const arr = (markOf(qid) || []).slice();
    arr[+b.dataset.blank] = b.dataset.val;
    S.run.marks[qid] = arr; render();
  });
  paneCard.querySelectorAll("[data-go]").forEach(b=> b.onclick = ()=>{ S.run.qi = +b.dataset.go; render(); });
  const back = document.getElementById("t-back");
  if(back) back.onclick = ()=>{ if(S.run.qi>0){ S.run.qi--; render(); } };
  document.getElementById("t-next").onclick = ()=>{
    if(last){ S.run.stage = "review"; } else { S.run.qi++; }
    render(); paneCard.scrollTop = 0;
  };
  lockChat("Coach is off while a test is running, so you answer this one yourself. It comes back the moment you submit.");
}
function pick(q, id){
  const qid = q.id, cur = (markOf(qid) || []).slice();
  if(q.type === "multi"){
    const i = cur.indexOf(id);
    if(i >= 0) cur.splice(i,1); else cur.push(id);
    S.run.marks[qid] = cur;
  } else {
    S.run.marks[qid] = [id];
  }
  render();
}

function renderRunReview(){
  const t = testById(S.run.testId);
  const missing = S.run.ids.filter(qid=>!answered(qById(t,qid)));
  paneCard.innerHTML =
    '<div class="test-wrap">'+
      '<div class="tagrow"><span class="tag must">'+esc(t.title)+'</span><span class="tag type">Before you submit</span></div>'+
      '<div class="card"><div class="q"><div class="who">Check your answers</div>'+
        '<p style="font-size:19px">'+(missing.length ? missing.length + (missing.length===1?' question is':' questions are')+' still blank.' : 'All '+S.run.ids.length+' answered.')+'</p>'+

      '</div></div>'+
      dotsHTML()+
      '<div class="navrow">'+
        '<button class="ghost" id="t-backq" style="padding:11px 15px">Back to questions</button>'+
        '<span class="spacer"></span>'+
        '<button class="btn-primary" id="t-submit">Submit test</button>'+
      '</div>'+
    '</div>';
  paneCard.querySelectorAll("[data-go]").forEach(b=> b.onclick = ()=>{ S.run.qi = +b.dataset.go; S.run.stage="quiz"; render(); });
  document.getElementById("t-backq").onclick = ()=>{ S.run.stage="quiz"; render(); };

function renderResults(){
  const t = testById(S.run.testId);
  const r = S.run.result;
  const pct = Math.round((r.got / r.total) * 100);
  const wrong = r.rows.filter(x=>x.state !== "ok").map(x=>x.qid);
  const glyph = {ok:"✓", part:"~", no:"✕"};

    const q = qById(t,row.qid);

    return '<div class="res-q">'+
      '<div class="res-top"><span class="mark '+row.state+'">'+glyph[row.state]+'</span>'+
        '<span class="rq"><em>Question '+(S.run.ids.indexOf(row.qid)+1)+' · '+fmtPts(row.pts)+' / 1</em>'+esc(q.stem.length>150?q.stem.slice(0,148)+"…":q.stem)+'</span></div>'+
      '<div class="res-body">'+
        (q.fig ? '<div class="figbox" style="max-width:300px"><img src="'+q.fig.src+'" alt="'+esc(q.fig.alt)+'"></div>' : '')+
        '<div class="ab"><b>You said</b><span class="'+(row.state==="ok"?"yes":"nope")+'">'+esc(mine)+'</span></div>'+
        (row.state === "ok" ? '' : '<div class="ab"><b>Correct</b><span class="yes">'+esc(correctText(q))+'</span></div>')+
        '<div class="res-why">'+esc(q.why)+'</div>'+
        '<div><button class="chip" data-coach="'+row.qid+'">Ask the coach about this</button></div>'+
      '</div></div>';
  }).join("");
  paneCard.innerHTML =
    '<div class="test-wrap">'+
      '<div class="tagrow"><span class="tag must">'+esc(t.title)+'</span><span class="tag type">'+(S.run.partial?"Missed-only retry":"Full attempt")+'</span></div>'+
      '<div class="scorehead"><b class="num">'+fmtPts(r.got)+' / '+r.total+'</b><span>'+pct+'%'+(wrong.length? ' · '+wrong.length+' to review' : ' · clean sweep')+'</span></div>'+
      blocks+
      '<div class="navrow" style="flex-wrap:wrap">'+
        '<button class="btn-primary" id="t-retake">Retake this test</button>'+
        (wrong.length ? '<button class="ghost" id="t-missed" style="padding:11px 15px">Retry the '+wrong.length+' I missed</button>' : '')+
        '<button class="ghost" id="t-exit" style="padding:11px 15px">Back to folder</button>'+
      '</div>'+
    '</div>';
  document.getElementById("t-retake").onclick = ()=> startRun(t.id);
  const mb = document.getElementById("t-missed");
  if(mb) mb.onclick = ()=> startRun(t.id, wrong);
  document.getElementById("t-exit").onclick = ()=>{ const f = (ITEMS[S.nav.item]||{}).folder || null; S.run = null; S.nav = {folder:f, item:null}; render(); };
  paneCard.querySelectorAll("[data-coach]").forEach(b=> b.onclick = ()=>{
    const q = qById(t, b.dataset.coach);
    coachOnQuestion(t, q);
    if(mobile() && chatPane.hidden) chatToggle.click();
  });
  const first = r.rows.find(x=>x.state!=="ok");
  coachOnQuestion(t, qById(t, first ? first.qid : r.rows[0].qid));
}
function coachOnQuestion(t, q){
  syncChat({
    kind:"test", id:"t-"+t.id+"-"+q.id,
    q:q.stem,
    a:correctText(q),
    say:answerText(q, markOf(q.id)),
    why:q.why,
    trick:"",
    linkText:""
  });
}

/* ===================== COACH CHAT ===================== */
const ANCHORS = `US pop ~340M (use 350M) · households ~130M at ~2.5 people · labor force ~170M · college students ~20M · 50 states · all US restaurants ~1M.
Chains (US): Starbucks ~16k, McDonald's ~14k, Dunkin' ~10k, Taco Bell ~8k, Domino's ~7k, Chipotle ~4k, Panera ~2k.
Counts: supermarkets ~45k, hotels ~64k, bank branches ~70k, hospitals ~6k, Title IV colleges ~5.5k, commercial-service airports ~500.
Unknown-count defaults: national chain 5–15k, common local category 25–100k, institutions ~5k, airports ~500, all restaurants ~1M.
Boston: city ~670k (use 700k), Greater Boston ~5.0M, Tufts ~13k students, Logan ~44M pax/yr, ~120k pax/day, ~1,000 movements/day.
US aviation: FAA ~45k flights/day, airline passengers ~2.9M/day, scheduled US-airline flights ~27k/day, ~100–150 pax/flight (use 150).
Default assumptions: coffee/fast food open 14–18h (use 15) · restaurant ticket $10–25/person · cinema 4–5 showings/day · rideshare ~1.5 pax/ride · haircuts 4–8/person/year.
Mental math: 10% = shift one place · 5% = half of 10% · 20/30/70% = multiples of 10% · 25/75% = halvings · 1k×1k=1M · 2.4k×3k=7.2M · ÷1.5 = ×2 then ÷3 · 365→360 · 52→50.`;

const COACH = `You are a market-sizing interview coach. Your student is prepping for an AKPsi interview at Tufts and may be interviewing within a day. He must answer verbally in 60-90 seconds with no paper or calculator.

How to coach:
- Be direct and short. Under 110 words unless he asks for more. Plain prose, no bullet lists unless he asks, no headers.
- Teach logic and reasoning over trivia. If a number is better held as an order of magnitude, say so.
- Use the rounded interview-friendly anchors below. Never substitute a more precise statistic. If a figure is not below, say you are estimating and give a defensible order of magnitude.
- Show mental math as spoken steps ("10% is 35 million, so 30% is 105 million"), never as long multiplication.
- Insist on units after every number.
- If he has a workable structure but doubts one assumption, tell him to carry it through and flag it, not restart.
- Draw connections back to anchors he already knows instead of introducing new facts.
- No emojis. No em dashes. Never invent a statistic.

REFERENCE ANCHORS (the only figures you should state as known):
${ANCHORS}`;

const GRADER = `You are grading a market-sizing interview answer. Be brief and specific, the way a real interviewer gives feedback between questions. Do not nitpick a reasonable assumption. Judge structure first, arithmetic second. Reward a clean assumption carried through over a precise one fumbled. Penalize missing units and place-value errors. No emojis, no em dashes.`;

const TUTOR = `You are a biology and biochemistry tutor. Your student is a first-year Tufts student reviewing a graded exam question he has just answered. He can see the question, his answer, the correct answer, and a written explanation already.

How to tutor:
- Be direct and short. Under 120 words unless he asks for more. Plain prose, no bullet lists unless he asks, no headers.
- Do not just restate the explanation he already has. Go after the underlying concept, the reason the wrong options are wrong, or the trap that catches people.
- Use real values where they matter (pKa, electronegativity, base pairing rules) and say when a number is approximate.
- If he asks something you are not certain about, say so rather than inventing a fact.
- Connect it to things a first-year bio student already knows where that helps it stick.
- No emojis. No em dashes.`;

const BANK_LIVE = `You are a tutor sitting beside a student while he works a practice exam question. He has NOT answered it yet.

THE HARD RULE: do not tell him which option is correct, and do not narrow the options down to one. If he asks outright for the answer, tell him to press Reveal, which is always available, and offer to talk through it after.

What you should do instead:
- Ask him what the question is actually testing, or tell him what concept it turns on.
- If he gives you his reasoning, engage with it honestly. If it is wrong, say which step is wrong and why, without naming the right option.
- Point at the distinction that separates the plausible options, so he can make the call himself.
- Be short. Under 90 words. Plain prose, no bullet lists unless he asks, no headers.
- Never invent a fact. If something is outside what the question and the course material supports, say so.
- No emojis. No em dashes.`;

const BANK_AFTER = `You are a tutor going over a practice exam question the student has just answered or revealed. He can already see the correct option, a written explanation, and a note on the tempting wrong answer.

How to help:
- Do not simply restate the explanation he already has. Go after the underlying concept, why the other options fail, or the trap that catches people.
- If he got it wrong, name the specific reasoning error rather than just correcting the fact.
- Use real values where they matter and say when something is approximate.
- Be short. Under 120 words. Plain prose, no bullet lists unless he asks.
- Never invent a fact or a citation. If it is outside the source material, say so.
- No emojis. No em dashes.`;

const chatLog = document.getElementById("chat-log");
const chatCtx = document.getElementById("chat-ctx");
const chatInput = document.getElementById("chat-input");
const chatSend = document.getElementById("chat-send");
const starters = document.getElementById("chat-starters");
let curCard = null;

function lockChat(msg){
  curCard = null;
  chatInput.placeholder = "Ask about this card…";
  chatCtx.textContent = "locked";
  chatLog.innerHTML = '<div class="msg sys">' + esc(msg) + '</div>';
  starters.innerHTML = "";
  chatInput.disabled = true; chatSend.disabled = true;
}
function syncChat(c){
  chatInput.disabled = false; chatSend.disabled = false;
  chatInput.placeholder = /^(test|bank-)/.test(c.kind || "") ? "Ask about this question…" : "Ask about this card…";
  const changed = !curCard || curCard.id !== c.id;
  curCard = c;
  chatCtx.textContent = c.q.length > 40 ? c.q.slice(0,38)+"…" : c.q;
  if(changed) paintChat();
}
function paintChat(){
  const conv = convos[curCard.id] || [];
  if(!conv.length){
    const isQ = curCard && /^(test|bank-)/.test(curCard.kind || "");
    chatLog.innerHTML = `<div class="msg sys">${sampleNS===null && sampleReady
      ? "Coach is unavailable here. If you are running the standalone file, add your Anthropic API key with the key button in the top bar."
      : (curCard && curCard.kind === "bank-live"
         ? "Talk it through before you commit. The coach will not name the right option until you answer or hit Reveal."
         : isQ
         ? "Ask why the other options fail, what concept the question turns on, or for a similar question."
         : "Ask about this card: why the structure works, how to do the math out loud, or a harder version of the question.")}</div>`;
  } else {
    chatLog.innerHTML = conv.map(m=> m.role === "user"
      ? `<div class="msg you">${esc(m.content)}</div>`
      : `<div class="msg ai">${esc(m.content)}</div>`).join("");
  }
  const k = curCard && curCard.kind;
  const opts = k === "bank-live"
    ? ["What is this question testing?","Here is my reasoning, check it","Narrow it down for me","What concept do I need here?"]
    : (k === "test" || k === "bank-after")
    ? ["Why are the other options wrong?","Explain the underlying concept","What is the trap here?","Give me a similar question"]
    : ["Why this structure?","Walk the math out loud","Give me a harder version","What would the interviewer push on?"];
  starters.innerHTML = opts.map(o=>`<button class="chip" data-ask="${esc(o)}">${esc(o)}</button>`).join("");
  starters.querySelectorAll("[data-ask]").forEach(b=> b.onclick = ()=> ask(b.dataset.ask));
  chatLog.scrollTop = chatLog.scrollHeight;
}
async function ask(text){
  if(!text || !text.trim() || chatBusy || !curCard) return;
  if(!sampleReady && samplePromise){ try{ await samplePromise; }catch(e){} }
  const asked = logAsk(text);
  const ckey = curCard.id;
  if(!sampleNS){
    const conv = convos[curCard.id] || (convos[curCard.id]=[]);
    conv.push({role:"user",content:text});
    conv.push({role:"assistant",content:"Coach is unavailable in this view, so I can't answer that one. Use the memory hook and the connects-to links on the card."});
    paintChat(); return;
  }
  const conv = convos[curCard.id] || (convos[curCard.id]=[]);
  conv.push({role:"user", content:text});
  chatBusy = true; chatSend.disabled = true; chatInput.value = ""; paintChat();
  const bubble = document.createElement("div");
  bubble.className = "msg ai";
  bubble.innerHTML = `<span class="cursor"></span>`;
  chatLog.appendChild(bubble);
  chatLog.scrollTop = chatLog.scrollHeight;

  const kind = curCard.kind;
  const primer = kind === "test" ? TUTOR : kind === "bank-live" ? BANK_LIVE : kind === "bank-after" ? BANK_AFTER : COACH;
  const isTest = kind === "test" || kind === "bank-live" || kind === "bank-after";
  const ctx = isTest
    ? `THE EXAM QUESTION HE IS LOOKING AT
${curCard.linkText ? curCard.linkText + "\n" : ""}Question: ${curCard.q}
Correct answer: ${curCard.a}
What he answered: ${curCard.say}
The explanation available to him: ${curCard.why}`
    : `THE CARD HE IS LOOKING AT
Question: ${curCard.q}
Answer: ${curCard.a}
Ideal spoken answer: ${curCard.say}
Memory hook: ${curCard.trick || "(none)"}
Why it matters: ${curCard.why}`;
  const turns = conv.map((m,i)=> i === 0
    ? {role:"user", content:`${primer}\n\n${ctx}\n\nHis question: ${m.content}`}
    : {role:m.role, content:m.content});
  try{
    const out = await sampleNS(turns, {
      modelTier:"default", cache:false,
      onText: ({text})=>{ bubble.textContent = text; chatLog.scrollTop = chatLog.scrollHeight; }
    });
    conv.push({role:"assistant", content: out.text});
    asked.a = String(out.text||"").slice(0, 2500);
  }catch(e){
    const partial = e && e.text;
    conv.push({role:"assistant", content: partial || (e && e.code === "rate_limited"
      ? "Rate limited. Give it a few seconds and ask again."
      : "That didn't go through. Try once more.")});
    if(e && e.code === "not_granted"){ sampleNS = null; }
  }
  chatBusy = false; chatSend.disabled = false; paintChat();
  keepChats(); queueSave(); putChat(ckey); putAsk(asked);
}
chatSend.onclick = ()=> ask(chatInput.value);
chatInput.onkeydown = e=>{
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ask(chatInput.value); }
};
chatInput.oninput = ()=>{ chatInput.style.height = "auto"; chatInput.style.height = Math.min(140, chatInput.scrollHeight)+"px"; };

function statsHTML(){
  const musts = DECK.filter(c=>c.pri==="must");
  const seen = DECK.filter(c=>S.prog[c.id] && S.prog[c.id].seen>0);
  const mastered = DECK.filter(c=>mastery(c.id));
  const mustMastered = musts.filter(c=>mastery(c.id));
  const due = DECK.filter(c=>S.prog[c.id] && S.prog[c.id].seen>0 && isDue(c.id));
  const tot = seen.reduce((a,c)=>a+S.prog[c.id].seen,0);
  const ok = seen.reduce((a,c)=>a+S.prog[c.id].correct,0);
  const cats = Object.keys(CATS).map(k=>{
    const cs = DECK.filter(c=>c.cat===k);
    const m = cs.filter(c=>mastery(c.id)).length;
    return `<div class="catrow"><span>${esc(CATS[k].name)}</span><span class="track"><i style="width:${Math.round(m/cs.length*100)}%"></i></span><em>${m}/${cs.length}</em></div>`;
  }).join("");
  return `
    <div class="stats">
      <div class="stat"><b class="num">${mustMastered.length}/${musts.length}</b><span>Must-know solid</span></div>
      <div class="stat"><b class="num">${mastered.length}/${DECK.length}</b><span>Deck solid</span></div>
      <div class="stat"><b class="num">${due.length}</b><span>Due now</span></div>
      <div class="stat"><b class="num">${tot?Math.round(ok/tot*100):0}%</b><span>Hit rate</span></div>
    </div>
    <div>
      <div class="lbl" style="margin-bottom:9px">Solid by category</div>
      <div class="catlist">${cats}</div>
    </div>
    <div class="hintline" style="text-align:left">Solid means you have rated it Good or better a few times in a row. Progress is saved in this browser${dbDoc?" and synced to your account":""}.</div>
    <div><button class="ghost" id="reset-all" style="padding:8px 12px">Reset all progress</button></div>`;
}
function filtersHTML(){
  const cs = F().cats || [], ps = F().pris || [];
  const here = [...new Set(DECK.map(c=>c.cat))];
  const cat = here.map(k=>{
    const n = DECK.filter(c=>c.cat===k).length;
    return `<button data-cat="${k}" aria-pressed="${cs.includes(k)}">${esc(CATS[k].name)} <span style="opacity:.55">${n}</span></button>`;
  }).join("");
  const pHere = Object.keys(PRI).filter(k=>DECK.some(c=>c.pri===k));

/* ===================== FOCUS TIMER, STUDY LOG, CALIBRATION ===================== */
const MODES_F = {"25":{f:25,b:5,label:"25 / 5"}, "50":{f:50,b:10,label:"50 / 10"}, "flow":{f:0,b:0,label:"Flowtime"}};
let focusTick = null;
const today = ()=> new Date().toISOString().slice(0,10);
function logToday(){ const d = today(); return S.log[d] || (S.log[d] = {mins:0, answered:0, correct:0}); }
function noteActivity(correct){
  const l = logToday();
  l.answered++; if(correct) l.correct++;
}
function focusMs(){
  if(S.focus.phase === "idle") return 0;
  return S.focus.elapsed + (S.focus.started ? Date.now() - S.focus.started : 0);
}
function focusTarget(){
  const m = MODES_F[S.focus.mode];
  if(S.focus.mode === "flow") return 0;
  return (S.focus.phase === "break" ? m.b : m.f) * 60000;
}
function paintFocus(){
  const btn = document.getElementById("btn-focus");
  if(!btn) return;
  btn.classList.toggle("running", S.focus.phase === "focus" && !!S.focus.started);
  btn.classList.toggle("breaking", S.focus.phase === "break");
  if(S.focus.phase === "idle"){ btn.textContent = "Focus"; return; }
  const t = focusTarget();
  const ms = t ? Math.max(0, t - focusMs()) : focusMs();
  btn.textContent = (S.focus.phase === "break" ? "☕ " : "") + fmtClock(ms);
}
function startFocusTick(){
  if(focusTick) return;
  focusTick = setInterval(()=>{
    if(S.focus.phase === "idle" || !S.focus.started){ paintFocus(); return; }
    const t = focusTarget();
    if(t && focusMs() >= t) rollFocus();
    else paintFocus();
    const open = document.getElementById("fc-clock");
    if(open) drawFocusModal();
  }, 1000);
}
function bankMinutes(ms){
  const l = logToday();
  l.mins += Math.round(ms / 60000);
}
function rollFocus(){
  if(S.focus.phase === "focus"){
    bankMinutes(focusMs());
    S.focus.doneToday = (S.focus.day === today() ? S.focus.doneToday : 0) + 1;
    S.focus.day = today();
    S.focus.phase = "break"; S.focus.elapsed = 0; S.focus.started = Date.now();
    toast("Focus block done. Take " + MODES_F[S.focus.mode].b + " minutes.");
  } else {
    S.focus.phase = "focus"; S.focus.elapsed = 0; S.focus.started = Date.now();
    toast("Break over. Back in.");
  }
  queueSave(); paintFocus();
}
function toast(msg){
  let el = document.getElementById("toast");
  if(!el){
    el = document.createElement("div"); el.id = "toast";
    el.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:80;"+
      "background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:9px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow)";
    document.body.appendChild(el);
  }
  el.textContent = msg; el.hidden = false;
  clearTimeout(el._t); el._t = setTimeout(()=>{ el.hidden = true; }, 4000);
}
function focusStart(){
  if(S.focus.phase === "idle"){ S.focus.phase = "focus"; S.focus.elapsed = 0; }
  S.focus.started = Date.now();
  startFocusTick(); queueSave(); paintFocus(); drawFocusModal();
}
function focusPause(){
  if(!S.focus.started) return;
  S.focus.elapsed = focusMs();
  if(S.focus.phase === "focus") bankMinutes(Date.now() - S.focus.started);
  S.focus.started = 0;
  queueSave(); paintFocus(); drawFocusModal();
}
function focusReset(){
  if(S.focus.phase === "focus" && S.focus.started) bankMinutes(Date.now() - S.focus.started);
  S.focus = Object.assign(S.focus, {phase:"idle", started:0, elapsed:0});
  queueSave(); paintFocus(); drawFocusModal();
}
function streak(){
  let n = 0;
  for(let i=0;i<400;i++){
    const d = new Date(Date.now() - i*86400000).toISOString().slice(0,10);
    const e = S.log[d];
    if(e && (e.answered || e.mins)) n++;
    else if(i > 0) break;
  }
  return n;
}
function drawFocusModal(){
  const body = document.getElementById("modal-body");
  if(!body || modal.hidden || !document.getElementById("fc-clock")) return;
  const t = focusTarget();
  const ms = t ? Math.max(0, t - focusMs()) : focusMs();
  document.getElementById("fc-clock").textContent = fmtClock(ms);
  document.getElementById("fc-phase").textContent =
    S.focus.phase === "idle" ? "ready" : S.focus.phase === "break" ? "break" : (S.focus.started ? "focus" : "paused");
  const btn = document.getElementById("fc-go");
  if(btn) btn.textContent = S.focus.started ? "Pause" : (S.focus.phase === "idle" ? "Start" : "Resume");
}
function openFocus(){
  const l = logToday(), st = streak();
  const days = [];
  for(let i=13;i>=0;i--){
    const d = new Date(Date.now() - i*86400000).toISOString().slice(0,10);
    days.push({d, e:S.log[d] || {mins:0, answered:0}});
  }
  const peak = Math.max(1, ...days.map(x=>x.e.answered || 0));
  openModal("Focus",
    '<div><div class="bigclock" id="fc-clock">00:00</div><div class="phase" id="fc-phase">ready</div></div>'+
    '<div class="navrow" style="justify-content:center">'+
      '<button class="btn-primary" id="fc-go">Start</button>'+
      '<button class="ghost" id="fc-reset" style="padding:11px 15px">Reset</button>'+
    '</div>'+
    '<div><div class="lbl" style="margin-bottom:7px">Block length</div><div class="filters">'+
      Object.keys(MODES_F).map(k=>'<button data-fmode="'+k+'" aria-pressed="'+(S.focus.mode===k)+'">'+MODES_F[k].label+'</button>').join("")+
    '</div>'+
    '<div class="hintline" style="text-align:left">Flowtime runs a stopwatch and lets you break when you choose. The evidence is genuinely mixed: fixed blocks help mood and efficiency, but rigid 25/5 also makes fatigue climb faster than breaks you pick yourself.</div></div>'+
    '<div class="stats">'+
      '<div class="stat"><b class="num">'+st+'</b><span>Day streak</span></div>'+
      '<div class="stat"><b class="num">'+l.mins+'</b><span>Minutes today</span></div>'+
      '<div class="stat"><b class="num">'+l.answered+'</b><span>Answered today</span></div>'+
    '</div>'+
    '<div><div class="lbl" style="margin-bottom:7px">Questions answered, last 14 days</div>'+
      '<div class="logchart">'+days.map(x=>{
        const h = Math.round((x.e.answered||0)/peak*100);
        const cls = x.d === today() ? "today" : (x.e.answered ? "on" : "");
        return '<span class="'+cls+'" style="height:'+Math.max(2,h)+'%" title="'+x.d+': '+(x.e.answered||0)+'"></span>';
      }).join("")+'</div>'+
      '<div class="logaxis"><span>14d ago</span><span>today</span></div></div>');
  document.getElementById("fc-go").onclick = ()=>{ S.focus.started ? focusPause() : focusStart(); };
  document.getElementById("fc-reset").onclick = focusReset;
  modalBody.querySelectorAll("[data-fmode]").forEach(b=> b.onclick = ()=>{
    S.focus.mode = b.dataset.fmode; S.focus.phase = "idle"; S.focus.started = 0; S.focus.elapsed = 0;
    queueSave(); paintFocus(); openFocus();
  });
  drawFocusModal();
}
function calibrationHTML(){
  const b = bankOf();
  if(!b) return "";
  const agg = {sure:{n:0,ok:0}, fair:{n:0,ok:0}, guess:{n:0,ok:0}};
  b.questions.forEach(q=>{
    const c = (S.bankProg[q.id]||{}).conf;
    if(!c) return;
    ["sure","fair","guess"].forEach(k=>{ if(c[k]){ agg[k].n += c[k].n; agg[k].ok += c[k].ok; } });
  });
  const any = Object.values(agg).some(x=>x.n);
  if(!any) return '<div class="hintline" style="text-align:left">Rate your confidence before you answer and this will show whether your gut is calibrated.</div>';
  const label = {sure:"Said sure", fair:"Fairly sure", guess:"Guessing"};
  return ["sure","fair","guess"].map(k=>{
    const x = agg[k];
    if(!x.n) return "";
    const pct = Math.round(x.ok/x.n*100);
    const col = k === "sure" ? (pct >= 90 ? "var(--easy)" : "var(--again)") : "var(--accent)";
    return '<div class="calib"><span>'+label[k]+'</span><span class="track"><i style="display:block;height:100%;width:'+pct+'%;background:'+col+'"></i></span><em>'+pct+'% of '+x.n+'</em></div>';
  }).join("") +
  (agg.sure.n >= 5 && agg.sure.ok/agg.sure.n < 0.9
    ? '<div class="hintline" style="text-align:left;color:var(--again)">You are overconfident. When you feel sure you are wrong about '+Math.round((1-agg.sure.ok/agg.sure.n)*100)+'% of the time, which is exactly the feeling that makes people stop studying a topic too early.</div>'
    : '');
}

function registerBank(raw, persist){
  if(!raw || !Array.isArray(raw.questions) || !raw.questions.length) throw new Error("Needs a questions array with at least one question.");
  const id = raw.id || ("imp-" + Date.now().toString(36));
  const qs = raw.questions.map((q,i)=>{
    if(!q.q || !Array.isArray(q.o) || q.o.length < 2) throw new Error("Question " + (i+1) + " needs q and at least two options in o.");
    let a = q.a;
    if(typeof a === "string") a = LETTERS.indexOf(a.trim().toUpperCase());
    if(typeof a !== "number" || a < 0 || a >= q.o.length) throw new Error("Question " + (i+1) + " has no valid answer index.");
    return {id: id + "-" + (q.id || i), ch: q.ch || 0, topic: q.topic || "General",
            heat: ["red","orange","yellow","green"].includes(q.heat) ? q.heat : "orange",
            q: q.q, o: q.o, a,
            why: q.why || "No explanation was supplied with this question.",
            trap: q.trap || "No distractor note was supplied with this question."};
  });
  BANKS[id] = {id, name: raw.name || "Imported bank", course: raw.course || raw.name || "Imported",
               questions: qs, shorts: [], exam: raw.exam || null};
  ITEMS[id] = {kind:"bank", bank:id, folder:"imported", name: raw.name || "Imported bank",
               sub: qs.length + " questions" + (raw.course ? " · " + raw.course : ""), exam: raw.exam || null};
  let f = folderById("imported");
  if(!f){ f = {id:"imported", group:"Imported", name:"Imported", full:"Banks you pasted in", color:"#7A7F8A", items:[]}; FOLDERS.push(f); }
  if(!f.items.includes(id)) f.items.push(id);
  if(persist){ S.imported = (S.imported || []).filter(x=>x.id !== id).concat([Object.assign({}, raw, {id})]); queueSave(); }
  return id;
}

const KEYSTORE = "sizingdrill.key";
function getKey(){ try{ return localStorage.getItem(KEYSTORE) || ""; }catch(e){ return ""; } }
function setKey(v){ try{ v ? localStorage.setItem(KEYSTORE, v) : localStorage.removeItem(KEYSTORE); }catch(e){} }

// Minimal stand-in for the hosted `sample` capability, for when this file is opened
// from disk instead of claude.ai. Raw HTTP because a single self-contained page has
// no bundler and cannot import the official SDK.
function makeLocalSample(key){
  async function call(messages, opts){
    opts = opts || {};
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-opus-5",
        max_tokens: 2000,
        output_config: {effort: "low"},
        messages
      })
    });
    if(!res.ok){
      let detail = "";
      try{ detail = (await res.json()).error.message; }catch(e){}
      const err = new Error(detail || ("HTTP " + res.status));
      err.code = res.status === 401 ? "not_granted" : res.status === 429 ? "rate_limited" : "error";
      throw err;
    }
    const data = await res.json();
    const text = (data.content || []).filter(b=>b.type === "text").map(b=>b.text).join("");
    if(opts.onText) opts.onText({text, delta:text});   // no streaming in local mode
    return {text, truncated: data.stop_reason === "max_tokens"};
  }
  const fn = async (input, opts)=>{
    const messages = typeof input === "string" ? [{role:"user", content:input}] : input;
    return call(messages, opts);
  };
  fn.json = async (prompt, opts)=>{
    const out = await call([{role:"user", content:prompt}], opts || {});
    const t = out.text.trim().replace(/^```(?:json)?/, "").replace(/```$/, "").trim();
    try{ return JSON.parse(t); }
    catch(e){ const m = t.match(/\{[\s\S]*\}/); if(m) return JSON.parse(m[0]); throw e; }
  };
  fn.isLocal = true;
  return fn;
}
