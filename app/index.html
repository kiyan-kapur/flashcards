const PSY_SA2 = [
{id:"lx-s1",ch:2,topic:"Data collection methods",heat:"orange",overlap:true,
 q:"Your lecture set out four ways psychologists collect data. Name all four, give the main limitation of each, and then say which you would choose to study aggression in young children and why.",
 model:"The four are observation, self-report, behaviour or performance measures, and physiological measures. Observation lets you see the behaviour you actually care about, but it risks participant reactivity, people behaving differently because they know they are watched, and observer bias or expectancy on the researcher's side. Self-report is direct, cheap and easy, but people cannot or will not always tell you the truth. Performance measures such as reaction time are more objective and less reactive, but it is fair to ask whether they generalise to real behaviour. Physiological measures link biology to behaviour and are hard to fake, but they are expensive. For aggression in young children I would use observation, ideally in a natural setting with an unobtrusive observer, because young children are poor self-reporters and aggression is a behaviour you can directly see, while accepting that I need a clear operational definition since there is no single gold standard for measuring aggression.",
 points:["Names all four methods","Gives reactivity or observer bias as the limitation of observation","Gives that people cannot or will not tell the truth as the limitation of self-report","Notes generalisability for performance measures or cost for physiological measures","Chooses a method for the aggression example and justifies it, ideally mentioning an operational definition"]},
{id:"lx-s2",ch:4,topic:"Lobes and deficits",heat:"orange",overlap:true,cross:"Ch 4 and Ch 5",
 q:"A patient's eyes and early visual pathways are intact and their memory is normal, but they cannot recognise familiar objects by sight. Name the condition, explain how it differs from cortical blindness, and say what this dissociation tells you about how the visual system is organised.",
 model:"This is visual agnosia: the loss of the ability to recognise familiar objects despite the primary senses and basic memory working normally. Cortical blindness is different, because there the person has lost sight itself rather than the ability to identify what they can see. The two follow lesions at different points along the visual processing pathway. The fact that recognition can be lost while seeing survives is a dissociation, and it is evidence for localisation of function: if one visual ability can be knocked out on its own, it must depend on its own machinery. The same logic covers prosopagnosia for faces, akinetopsia for motion and achromatopsia for colour, and it has an auditory counterpart in auditory agnosia as distinct from cortical deafness.",
 points:["Names visual agnosia","States that sight itself is intact and it is recognition that fails","Contrasts cortical blindness as loss of vision itself","Notes the lesions sit at different points along the visual pathway","Draws the localisation of function conclusion from the dissociation, ideally with another example"]},
{id:"t1",ch:4,topic:"Brain techniques",heat:"red",overlap:true,
 q:"A researcher wants to know exactly WHEN, within the first half-second, the brain distinguishes a familiar face from a stranger's. A colleague suggests fMRI. Explain why fMRI is the wrong tool for that question, name the better one, and state the tradeoff you accept by switching.",
 model:"fMRI measures blood-oxygen changes, which gives good spatial location but poor timing, so it cannot resolve events on the scale of milliseconds. The right tool is EEG, and specifically an ERP, which records electrical activity time-locked to a particular stimulus and shows the neural steps of a thought in real time. The tradeoff is location: EEG has poor spatial resolution, like standing outside a stadium and knowing something happened without knowing what or who.",
 points:["Says fMRI measures blood oxygen or blood flow, not fast electrical activity","States fMRI is strong on location and weak on timing","Names EEG or ERP as the better tool","Says ERP is time-locked to a specific stimulus or event","Names the tradeoff: EEG loses spatial precision"]},
{id:"t2",ch:4,topic:"Brain techniques",heat:"red",overlap:true,
 q:"Name the two broad strategies for mapping the brain, place TMS and fMRI into the right one each, and then explain why TMS can support a causal claim that fMRI cannot.",
 model:"The two strategies are manipulating the brain and observing the behaviour that results, and manipulating behaviour and recording what the brain does. TMS belongs to the first: a magnetic field fires or disrupts neurons under the coil. fMRI belongs to the second: it only records activity while someone performs a task. Because TMS intervenes, a deficit that appears when a region is disrupted supports a causal claim about that region. fMRI shows activity accompanying a task, which is a correlation, and the same logic as correlation not establishing causation applies.",
 points:["Names both strategies, manipulate brain then observe behaviour, and manipulate behaviour then observe brain","Places TMS in the stimulation or manipulation category","Places fMRI in the recording or imaging category","Explains that TMS intervenes, so a resulting deficit supports causation","Explains that fMRI activity is correlational"]},
{id:"t3",ch:4,topic:"Brain techniques",heat:"orange",overlap:false,
 q:"A patient's family asks why the neurologist ordered an MRI rather than an fMRI. Explain the difference in your own words and say what each one is for.",
 model:"An MRI is structural: it images the physical anatomy of the brain, which is what you want when you are looking for damage, a tumour or atrophy. An fMRI is functional: it measures blood-oxygen levels while a person performs a task, so it shows which areas are active rather than what the tissue looks like. The family's question is about structure, so MRI is the right call.",
 points:["MRI is structural, showing anatomy","fMRI is functional, showing activity during a task","Mentions blood oxygen as what fMRI actually measures","Applies the distinction to the clinical question asked"]},
{id:"c1s",ch:2,topic:"Correlation and causation",heat:"red",overlap:true,
 q:"A headline reads: students who use their phones in lecture get lower grades. The study measured both variables in 300 students. Explain what this study can and cannot claim, give the three possible explanations for the relationship, and say what design would be needed to support the headline's implied claim.",
 model:"This is a correlational study: both variables were measured, neither was manipulated, so it can describe and predict a relationship but cannot establish cause. Three readings are available: phone use lowers grades, lower-performing or less engaged students use their phones more, or a third variable such as poor sleep or low motivation drives both. To support the causal claim you would need an experiment, manipulating phone use as the independent variable and randomly assigning students to conditions so pre-existing differences balance out.",
 points:["Identifies it as correlational, with both variables measured rather than manipulated","States it cannot establish causation","Gives all three explanations including a named third variable","Says an experiment is required","Names manipulation of an IV and random assignment"]},
{id:"c2s",ch:2,topic:"Correlation and causation",heat:"red",overlap:true,
 q:"Two findings: hours of sleep and exam score, r = +.31; hours of phone use and exam score, r = −.43. A classmate says the sleep result is the stronger relationship because it is positive. Correct them, and explain what the sign and the magnitude each tell you.",
 model:"They have confused direction with strength. The sign only tells you direction: positive means both variables move together, negative means one rises as the other falls. Strength is the distance from zero, so −.43 is the stronger relationship, and −.70 would be exactly as strong as +.70. Neither result shows causation, since both are correlations.",
 points:["Corrects the classmate explicitly","Sign indicates direction only","Distance from zero indicates strength","Concludes −.43 is stronger than +.31","Notes neither establishes causation"]},
{id:"d1s",ch:2,topic:"Study design flaws",heat:"red",overlap:true,
 q:"A researcher shows a comedy to one group in a sunny lounge with snacks, and a documentary to another group in a windowless classroom, then measures mood. They report the comedy group's mood was significantly higher, p < .05. Identify the design flaw, name the independent and dependent variables, and explain why the word significant does not settle the matter.",
 model:"The flaw is a confound: the setting varies along with the film, so you cannot tell whether the mood difference came from the comedy or from the sunny room and the snacks. The independent variable is the type of film, the dependent variable is the measured mood score, and everything else should have been held constant. Statistical significance only means a result this large is unlikely if there were truly no effect; it says nothing about how big or important the effect is, and it cannot rescue a confounded design.",
 points:["Names the confound as the setting co-varying with the IV","Correctly identifies the IV as film type","Correctly identifies the DV as the mood measure","Explains significance as unlikely-if-no-effect","States that significant does not mean large or important"]},
{id:"d2s",ch:2,topic:"Study design flaws",heat:"orange",overlap:false,
 q:"Explain the difference between random sampling and random assignment in your own words, and say which one protects against which problem.",
 model:"Random sampling is about who gets into the study at all, and it protects generalizability: a representative sample lets you extend the finding beyond the people you tested. Random assignment is about which condition each participant lands in once they are already in the study, and it balances pre-existing differences between groups, including characteristics a researcher cannot easily measure. Only random assignment supports a causal conclusion; a perfectly representative sample in a correlational study still cannot establish cause.",
 points:["Random sampling concerns who enters the study","Random sampling protects generalizability or representativeness","Random assignment concerns which condition participants receive","Random assignment balances pre-existing differences, including unmeasured ones","Links random assignment specifically to causal inference"]},
{id:"cs1",ch:2,topic:"Case studies",heat:"orange",overlap:true,
 q:"Your roommate watched a documentary about one severely neglected child and says it proves there is a critical period for language. Explain why that kind of evidence is persuasive but weak, and say what role case studies actually play in research.",
 model:"A case study is vivid, and it illustrates a psychological principle in a way that statistics never can, which is exactly why it persuades. But it is weak evidence: information is missing or hard to interpret, there is no record of the child's abilities before the isolation began, the writer's biases shape what gets noticed and reported, and one person may not represent a group. Case studies are usually sources of hypotheses rather than tests of them, so the right response is that it generates a question worth testing by other methods, not that it proves anything.",
 points:["Explains the persuasiveness: vivid, illustrates a principle memorably","Names missing information or the absence of a baseline","Names observer bias or unreliable recall","Notes one person may not represent a group","States that case studies are sources rather than tests of hypotheses"]},
{id:"s1s",ch:5,topic:"Sensation vs perception",heat:"red",overlap:true,
 q:"In your own words, distinguish sensation from perception, and then give one concrete piece of evidence that perception is constructed rather than simply received.",
 model:"Sensation is the receptors detecting physical energy and converting it into neural signals, which is transduction. Perception is the brain organizing and interpreting those signals to decide what they mean. Evidence that perception is constructed: there is a genuine hole in each eye's image where the optic nerve leaves the retina and there are no photoreceptors, yet you never see a hole, because the brain fills the gap with whatever surrounds it. Illusions make the same point, since they are normally correct rules applied to an unusual case.",
 points:["Sensation is detection and conversion of physical energy","Uses or explains the term transduction","Perception is interpretation or organization by the brain","Gives a concrete piece of evidence such as the blind spot, an illusion or perceptual set","Explains why that evidence shows construction rather than reception"]},
{id:"s2s",ch:5,topic:"Rods and cones",heat:"red",overlap:true,
 q:"You walk into a dark cinema and can barely see. Twenty minutes later you can make out faces, but everything looks grey. Explain what is happening at the level of the two photoreceptor types, and say why looking slightly to the side of a dim object helps you see it.",
 model:"Cones need bright light, carry colour, and are packed into the fovea; rods work in dim light, carry no colour information at all, and sit in the periphery with none in the fovea. In the dark the cones cannot fire, so vision falls to the rods, which is why everything is grey. Rods also take roughly twenty to thirty minutes to reach full sensitivity, which is dark adaptation and why vision keeps improving after you sit down. Looking directly at something puts its image on the fovea, which has no rods, so looking slightly to the side moves the image onto peripheral rods and makes a faint object easier to see.",
 points:["Cones need bright light, give colour, concentrated in the fovea","Rods work in dim light and carry no colour information","States there are no rods in the fovea","Explains dark adaptation over roughly twenty to thirty minutes","Explains off-centre viewing as putting the image on peripheral rods"]},
{id:"s3s",ch:5,topic:"Colour vision",heat:"red",overlap:true,
 q:"Stare at a green square for twenty seconds, then look at white paper and you see red. Explain which theory of colour vision accounts for this and why, and explain why the competing theory is not wrong.",
 model:"Afterimages are an opponent-process phenomenon. After the retina, colour is carried by cells working in opposing pairs, red against green and blue against yellow, so one member being on means the other is off. Staring at green fatigues that channel while it is pushed toward green, and removing the stimulus lets it rebound to red. Trichromatic theory is not wrong, it just describes an earlier stage: at the retina there are three cone types, each most sensitive to a different wavelength, and every colour is a ratio of how hard those three fire. The two theories describe two stages of one system.",
 points:["Attributes the afterimage to opponent-process theory","Names the opposing pairs, red-green and blue-yellow","Explains the fatigue or rebound mechanism","Places trichromatic theory at the retina with three cone types","States that both are correct at different stages"]},
{id:"s4s",ch:5,topic:"Hearing",heat:"orange",overlap:false,
 q:"Trace a sound from the outer ear to the auditory nerve, naming the structures it passes through, and state exactly where transduction happens and what transduction means.",
 model:"Sound is funnelled by the pinna down the auditory canal to the eardrum, which vibrates. The three ossicles, the hammer, anvil and stirrup, amplify that vibration and pass it to the oval window, which sets fluid moving inside the cochlea. Inside the cochlea the fluid wave bends hair cells, and that is where transduction happens: the conversion of physical energy into neural signals. From there the auditory nerve carries the signal to the temporal lobe. Everything before the cochlea is mechanical.",
 points:["Names the outer ear structures, pinna and auditory canal, and the eardrum","Names the ossicles as the middle-ear amplifying stage","Names the cochlea and the hair cells","States transduction occurs in the cochlea","Defines transduction as conversion of physical energy into neural signals"]},
{id:"n1s",ch:4,topic:"Neural communication",heat:"red",overlap:true,
 q:"Explain how a signal travels within a single neuron and then between two neurons. Say where it is electrical and where it is chemical, and explain what all-or-none means and why a stronger stimulus does not produce a bigger action potential.",
 model:"Within a neuron the signal is electrical. Incoming messages sum, and if they reach threshold, sodium channels open and sodium rushes in, producing an action potential that travels down the axon; potassium then flows out to reset the cell. Between neurons the signal is chemical: neurons never touch, so at the terminal synaptic vesicles release neurotransmitter into the synaptic cleft, and it binds receptors on the next cell much as a key fits a lock. All-or-none means the neuron either fires or it does not, like a light switch, and every action potential is the same size. A stronger stimulus therefore makes the neuron fire more often rather than harder, so intensity is coded by firing rate.",
 points:["States within-neuron communication is electrical","States between-neuron communication is chemical","Describes threshold and sodium entry, and ideally potassium exit","Names the synaptic cleft and neurotransmitter release","Explains all-or-none and that intensity is coded by firing rate"]},
{id:"n2s",ch:4,topic:"Neurotransmitters",heat:"orange",overlap:true,
 q:"A drug blocks acetylcholine at the junction between nerve and muscle. Predict the effect, say whether the drug is an agonist or an antagonist and why, and then contrast that with what the loss of dopamine-producing neurons produces.",
 model:"Blocking acetylcholine at the neuromuscular junction prevents muscle action, so the effect is paralysis. The drug is an antagonist, because an antagonist blocks a neurotransmitter while an agonist boosts or mimics it. Losing dopamine-producing neurons produces a different motor picture: the slowed movement, muscle stiffness, masked facial expression and resting tremor of Parkinson's disease. So both involve movement, but one blocks the signal to muscle directly and the other is the loss of a transmitter involved in reward and movement.",
 points:["Predicts paralysis or loss of muscle action","Identifies the drug as an antagonist","Defines antagonist as blocking, and ideally agonist as boosting or mimicking","Links dopamine loss to Parkinson's motor signs","Names at least two specific motor symptoms"]},
{id:"x1",ch:5,topic:"Visual pathway",heat:"red",overlap:true,cross:"Ch 4 and Ch 5",
 q:"Split-brain research depends on a fact about how the visual system is wired. State that wiring precisely, explain how it lets a researcher present information to only one hemisphere, and name one reason the findings may not generalize.",
 model:"The left visual field, meaning the left half of what you are looking at, projects to the right hemisphere, and the right visual field to the left hemisphere. Crucially it is the visual field, not the eye: both eyes see both fields, and each eye splits its own image at the optic chiasm, sending half to each side. Because of this, flashing a stimulus briefly to one visual field delivers it to a single hemisphere. In a split-brain patient, whose corpus callosum has been cut, the hemispheres cannot share it, so a word flashed to the right field reaches the language-dominant left hemisphere and can be named, while one flashed to the left field lands in the mute right hemisphere. The limitation is that these patients had epilepsy severe enough to require the surgery, so their brains were atypical to begin with.",
 points:["States left visual field to right hemisphere and vice versa","Explicitly corrects the eye-versus-field confusion, noting both eyes see both fields","Names the optic chiasm as the crossing point","Explains that flashing to one field isolates one hemisphere, with the left hemisphere handling language","Names the generalizability limit, atypical brains due to severe epilepsy"]},
{id:"x2",ch:2,topic:"Sampling",heat:"orange",overlap:true,cross:"Ch 1, 2 and 5",
 q:"A perception study finds a particular visual illusion works on 95% of participants, all undergraduates at one American university. Using what you know about sampling, explain what the researchers can and cannot claim, and name the broader problem this illustrates.",
 model:"This is a convenience sample, so the researchers can describe the effect in that population but cannot responsibly generalize it to people in general. A sample's size matters less than its representativeness, so recruiting more undergraduates at the same university would not fix it. The broader problem is that most published psychology draws on WEIRD participants, Western, Educated, Industrialized, Rich and Democratic, roughly 96% of studies from about 12% of the world's population, and those subjects are psychologically unusual rather than typical.",
 points:["Identifies it as a convenience sample","States the finding can be described but not generalized","Notes representativeness matters more than sample size","Names WEIRD and expands the acronym","Cites the scale of the problem, most studies from a small share of the world"]},
{id:"x3",ch:4,topic:"Experimental control",heat:"orange",overlap:true,cross:"Ch 2 and Ch 4",
 q:"A team wants to test whether a brain-stimulation technique improves memory. Describe how you would design the study so that neither expectation effects nor pre-existing differences between participants can explain the result. Name the specific controls.",
 model:"Randomly assign participants to conditions so that pre-existing differences, including ones you cannot measure, balance out across groups. Give the control group a sham stimulation that looks and feels identical but delivers nothing, so it functions as a placebo and isolates the effect of expectation. Run it double-blind, so that neither the participants nor the researcher interacting with them knows who received real stimulation, which blocks experimenter expectancy as well as participant expectancy. Operationally define memory in advance, for example as a score on a recall test, and hold everything else constant so the stimulation is the only thing that varies.",
 points:["Random assignment to conditions","Sham or placebo stimulation as the control","Double-blind, naming that the experimenter is blinded too","Explains why double-blind matters, experimenter expectancy","Operational definition of the memory outcome or holding other variables constant"]}
];

const CRAM_SA = [
{id:"cs1",ch:4,topic:"Action potential",frame:"Correct a friend",
 q:"Your friend says: “A harder punch sends a bigger signal down the nerve, that's why it hurts more.” Correct them using all-or-none and firing rate, then explain what the refractory period has to do with it.",
 model:"Each action potential is all-or-none: once the neuron reaches threshold it fires at full size, and a stronger stimulus never makes an individual impulse bigger. What a harder punch changes is how often the neurons fire, and possibly how many fire, so intensity is coded by firing rate. The refractory period is the brief window after firing when stimulation cannot trigger another action potential. That caps how fast a neuron can fire, which sets the ceiling on how intensity can be coded, and it also helps keep the impulse travelling one way down the axon.",
 points:["States all-or-none: every action potential is the same size","Says intensity is coded by firing rate, not impulse size","Defines the refractory period as a window where no new action potential can fire","Links the refractory period to limiting firing rate or keeping the signal one-way"]},
{id:"cs2",ch:4,topic:"Neurotransmitters",frame:"Predict",
 q:"Predict what happens in each case and name the transmitter involved: (a) a toxin blocks transmission at the junction between nerve and muscle, (b) the neurons producing a movement-related transmitter in the substantia nigra die off, (c) the brain's main inhibitory transmitter is badly reduced.",

{id:"cs3",ch:4,topic:"Lobes and deficits",frame:"Diagnose",

{id:"cs4",ch:4,topic:"Nervous system organisation",frame:"Walk it through",
 q:"A scooter swerves at you, you jerk back before you even feel scared, your heart pounds, and twenty minutes later you are calm again. Walk through which part of the nervous system handles each moment, and place each one on the map from central to peripheral.",
 model:"The jerk back is a spinal reflex: the message reaches the spinal cord, which fires the withdrawal command without waiting for the brain. The spinal cord and brain together make up the central nervous system. The pounding heart, widened pupils and sweating are the sympathetic branch, the accelerator, which mobilises the body for action. The calm twenty minutes later is the parasympathetic branch, the brake, slowing things down and conserving energy. Both branches belong to the autonomic nervous system, which with the somatic system makes up the peripheral nervous system.",
 points:["Identifies the jerk as a spinal reflex that runs without the brain","States the CNS is brain plus spinal cord","Assigns the pounding heart to the sympathetic branch","Assigns recovery to the parasympathetic branch","Places sympathetic and parasympathetic under autonomic, under peripheral, alongside somatic"]},
{id:"cs5",ch:4,topic:"Brain techniques",frame:"Pick the tool",
 q:"For each research goal, pick MRI, fMRI, EEG or TMS and justify it in one line: (a) check whether a patient has a tumour, (b) find where in the brain face processing happens, (c) catch the exact millisecond a word is recognised, (d) test whether a region is actually necessary for a task.",
 model:"(a) MRI, because it is structural and shows anatomy, which is what you need to spot a tumour. (b) fMRI, because it tracks blood oxygen and gives good spatial location of activity during a task. (c) EEG, ideally an ERP time-locked to the word, because it has millisecond timing even though location is poor. (d) TMS, because it temporarily disrupts the region, and if the ability drops out that supports a causal claim that recording methods cannot.",
 points:["(a) MRI, because it is structural","(b) fMRI, because it localises activity via blood oxygen","(c) EEG or ERP, because of millisecond timing","(d) TMS, because it intervenes","Notes that intervening supports causation while recording is correlational"]},
{id:"cs6",ch:4,topic:"Plasticity and neurogenesis",frame:"Myth-bust",
 q:"Someone says: “After childhood your brain is fixed. You can't grow new neurons and you can't rewire.” Take this apart using neurogenesis and plasticity, with an example of each, plus one thing that helps new neurons and one thing that hurts them.",
 model:"Both halves are wrong. Neurogenesis, the birth of genuinely new neurons from stem cells, continues into adulthood in areas involved in learning and memory. Exercise, effortful mental activity and an enriched environment help it, while stress, binge drinking and ageing inhibit it, and nicotine can kill new cells. Plasticity is the brain's ability to rewire in response to experience: in people blind from early life, visual cortex becomes active during listening tasks, and the more it activates, the better their sound localisation. So the adult brain both makes new cells and repurposes old ones.",
 points:["Defines neurogenesis as the birth of new neurons, continuing in adulthood","Defines plasticity as rewiring in response to experience","Gives a plasticity example such as visual cortex used for hearing in blind people","Names something that helps neurogenesis","Names something that inhibits neurogenesis"]},
{id:"cs7",ch:2,topic:"Correlation and causation",frame:"Critique the headline",
 q:"A news story: “Teens who sleep more get better grades, so schools should start later.” Critique the jump from finding to policy, and describe the study that would actually justify the policy.",
 model:"The finding is correlational: both sleep and grades were measured, not manipulated, so it shows a relationship and allows prediction but not cause. Three readings are open: more sleep improves grades, better students manage their time and sleep more, or a third variable such as motivation or family stability drives both. A policy assumes that changing sleep will change grades, which is a claim about an intervention. To justify it you would run an experiment: manipulate start time or sleep as the independent variable, randomly assign students to conditions so pre-existing differences balance out, hold other factors constant and measure grades as the dependent variable.",
 points:["Identifies the finding as correlational","Gives the reverse-direction and third-variable alternatives","Says a policy is a causal claim about an intervention","Calls for an experiment with a manipulated IV","Names random assignment"]},
{id:"cs8",ch:5,topic:"Transduction",frame:"Compare",
 q:"Pick two senses and trace each one from physical energy to neural signal, naming exactly where transduction happens. Then explain why smell is the odd one out on its way to the cortex.",
 model:"In vision, light passes through the lens to the retina, where photoreceptors, rods and cones, convert it into neural signals, so transduction happens in the retina. In hearing, air vibration moves the eardrum, the ossicles amplify it, fluid moves in the cochlea, and hair cells bending in that fluid are where transduction happens. After transduction every sense speaks the same language, action potentials. Most senses then relay through the thalamus on the way to the cortex, but smell bypasses it, travelling through the olfactory bulb near emotion and memory areas, which is the usual explanation for why a smell can trigger a vivid emotional memory.",
 points:["Defines transduction as converting physical energy into neural signals","Places transduction for one sense correctly, such as photoreceptors in the retina","Places transduction for a second sense correctly, such as hair cells in the cochlea","States smell bypasses the thalamus","Links the olfactory route to emotion or memory"]}
];

const EX_MCQ = [
{id:"x1",t:"Three-legged stool",q:"A state expands Medicaid to many more adults without raising its budget. Using the three-legged stool, what is the most likely consequence?",
 o:["Access rises and cost and quality are untouched","Access rises, but cost or quality has to give somewhere, for example lower provider payment that shrinks the pool of willing providers","Quality rises automatically because more people are covered","The stool framework does not apply to public programs"],a:1,
 why:"Access, quality and cost are linked: push one leg and the others move. Covering more people on a flat budget has to squeeze somewhere, and lower payment that drives providers away is the classic case."},
{id:"x2",t:"Financing",ex:true,q:"Which statement about how money enters the US health system is NOT accurate?",
 o:["Taxes fund Medicaid","Premiums fund employer-sponsored insurance","Employer-sponsored premiums are paid mostly by the employer and partly by the employee","Employer-sponsored insurance is financed mainly through federal income taxes"],a:3,
 why:"Financing is how money enters the system. Taxes fund the public programs; premiums, split between employer and employee, fund employer coverage."},
{id:"x3",t:"History",q:"Which event most directly explains why most working-age Americans get health insurance through a job?",
 o:["The creation of Medicaid","World War II wage and price controls","The Affordable Care Act","The Flexner Report"],a:1,
 why:"Wages were frozen, so employers competed for scarce workers with health benefits instead. A later tax ruling made those benefits tax-exempt and locked the system in. It was an accident, not a design."},
{id:"x4",t:"History",ex:true,q:"Each of the following helped establish or lock in employer-sponsored insurance EXCEPT:",
 o:["Union bargaining over benefits","The tax exclusion for employer health benefits","Wartime wage controls","Federal funding to build hospitals after World War II"],a:3,
 why:"Postwar hospital construction funding expanded hospital capacity. It had nothing to do with tying insurance to jobs."},
{id:"x5",t:"State regulation",ex:true,sample:true,q:"Health care is regulated largely at the state level for all of these reasons EXCEPT:",
 o:["Federalism leaves many responsibilities to the states","The Constitution gives the federal government limited health authority","Americans tend to distrust government, especially federal government","It is more difficult to get laws passed at the state level"],a:3,
 why:"The last option is false and runs opposite to the real dynamic. The three real reasons are federalism, limited federal constitutional authority, and distrust of government."},
{id:"x6",t:"Provider oversight",q:"A nurse practitioner moves from Massachusetts to New Hampshire. Before she can legally see patients there, what does she need?",

 why:"Legal permission for an individual is licensure. Accreditation, for example by the Joint Commission, is about facilities and organizations."},
{id:"x8",t:"Provider types",q:"A rural county has too few primary care doctors. Which workforce strategy expands access fastest?",
 o:["Increase medical school enrollment","Lean on nurse practitioners and physician assistants, whose training is shorter","Recruit more specialists to the county hospital","Require every physician to be board certified"],a:1,
 why:"NPs and PAs have a much shorter training pipeline, so they can expand primary care faster. More medical students still hit the residency bottleneck."},
{id:"x9",t:"Provider types",q:"Why does graduating more medical students not fully solve the physician shortage?",
 o:["Most graduates choose not to practice","Federally funded residency positions are capped, so graduates bottleneck at residency","Board certification exams are too difficult","Licensure is only granted to specialists"],a:1,
 why:"Every physician needs residency, and funded slots have not kept pace with population growth. The pipeline jams at residency, not at medical school."},
{id:"x10",t:"Hospitals",ex:true,sample:true,q:"All of the following are examples of community benefit EXCEPT:",
 o:["Free cancer screenings at a health fair","Health education classes","Charity care for patients who cannot pay","Charging private insurers more to subsidize care for the uninsured"],a:3,
 why:"That is cost-shifting, a pricing strategy. Community benefit is what justifies a nonprofit's tax exemption: screenings, education, charity care."},
{id:"x11",t:"Hospitals",ex:true,q:"A nonprofit hospital ends the year with revenue above its costs. Which of these is it NOT allowed to do with that money?",
 o:["Raise nurse salaries","Buy new imaging technology","Build a new wing","Distribute it to private owners or shareholders"],a:3,
 why:"Nonprofits earn a surplus, not a profit. They can reinvest it in salaries, technology and buildings, but they cannot hand it out to individuals."},
{id:"x12",t:"Hospitals",q:"Federal funding to build hospitals after World War II expanded capacity, including in rural areas. What was its major downside?",
 o:["It banned nonprofit hospitals","It permitted racially segregated hospitals","It created the Medicaid program","It required hospitals to provide charity care"],a:1,
 why:"It included a separate-but-equal provision. Full integration came only when hospitals needed Medicare and Medicaid money and had to meet civil-rights requirements to get it."},
{id:"x13",t:"Hospitals",q:"What finally pushed most US hospitals to desegregate?",
 o:["State licensure rules","Joint Commission accreditation","Needing Medicare and Medicaid funding, which required civil-rights compliance","Pressure from private insurers"],a:2,
 why:"Federal money gave the government leverage. Hospitals wanted the new program dollars and could be inspected for compliance."},
{id:"x14",t:"Individual vs employer",q:"Which of these is a DISADVANTAGE of employer-sponsored insurance?",
 o:["Premiums come out of pay before tax","Easy sign-up through work","Risk is pooled across a whole workforce","You have little choice over the type of plan"],a:3,
 why:"Your employer picks the menu. The other three are strengths: pre-tax payroll deductions, ease of enrollment, and a pooled group."},
{id:"x15",t:"Individual vs employer",q:"At a company, a cashier and an executive pay the same premium for the same plan. Which criticism of employer-sponsored insurance does this show?",
 o:["It is regressive, since the same dollar amount is a much bigger share of a low wage","Moral hazard","Cost-shifting","Gatekeeping"],a:0,
 why:"Equal premiums hit lower earners harder as a share of income, which is why some employers use salary-based sliding scales."},
{id:"x16",t:"Self vs fully insured",q:"A national retailer with stores in 30 states wants identical benefits everywhere and to avoid state benefit mandates. Which arrangement fits best?",
 o:["Fully insured","Self-insured","Buying individual marketplace plans for each worker","An indemnity plan"],a:1,
 why:"Self-insured plans fall under the federal law ERISA, so they escape most state regulation, including mandates. That is how a multistate employer gets uniform benefits."},
{id:"x17",t:"Self vs fully insured",ex:true,q:"All of these are true of a self-insured employer EXCEPT:",
 o:["It bears the claims risk itself","It hires an insurer only to administer the plan","It often buys reinsurance to cap catastrophic claims","It must cover every benefit its state mandates"],a:3,
 why:"Self-insured plans escape most state regulation under ERISA, so state mandated benefits do not apply to them. Fully insured plans do have to follow state mandates."},
{id:"x18",t:"Self vs fully insured",q:"A 40-person firm wants to carry no claims risk at all. What should it choose?",
 o:["Self-insure and skip reinsurance","A fully insured plan","Self-insure with reinsurance","No plan, and reimburse claims directly"],a:1,
 why:"Rule of thumb: no appetite for risk means fully insured, because then the insurer bears the claims risk. Small firms also lack the numbers that make claims predictable."},
{id:"x19",t:"Purpose of insurance",ex:true,q:"Which is NOT a core purpose of health insurance?",
 o:["Protecting households from catastrophic bills","Pooling risk so the healthy help pay for the sick","Replacing unpredictable bills with predictable premiums","Making every service free at the point of care"],a:3,
 why:"Insurance protects against catastrophe, pools risk and smooths spending. Cost sharing exists precisely because making care free would drive overuse."},
{id:"x20",t:"Insurance terms",q:"Jamal's plan has a $1,000 deductible and 20% coinsurance. His first visit of the year costs $400. How much does he pay?",
 o:["$80","$400","$0","$20"],a:1,
 why:"He hasn't met his deductible, so he pays the full $400. Coinsurance only starts once the deductible is met. The $80 option is the trap."},
{id:"x21",t:"Insurance terms",ex:true,q:"Which of these is NOT cost sharing?",
 o:["Deductible","Copayment","Coinsurance","Monthly premium"],a:3,
 why:"Cost sharing is what you pay when you use a service: deductible, copay, coinsurance. The premium is what you pay just to have coverage."},
{id:"x22",t:"Insurance terms",q:"Once Maya's plan made visits free, she started seeing a doctor for every minor cold. Which concept is this?",
 o:["Moral hazard","Cost-shifting","Gatekeeping","Reinsurance"],a:0,
 why:"Insured people use more care than they would if they paid the full price. Deductibles and copays exist partly to blunt this."},
{id:"x23",t:"Insurance terms",q:"Someone with a chronic illness is comparing plans. Which number protects them most in a bad year?",
 o:["The premium","The copay","The out-of-pocket maximum","The number of in-network doctors"],a:2,
 why:"The out-of-pocket maximum is the annual ceiling on what you pay. For someone who will use a lot of care, it is the most important number on the plan."},
{id:"x24",t:"Insurance terms",q:"What does a plan's network actually mean?",
 o:["Providers contracted with the plan at negotiated rates","A list of the highest-quality doctors in the area","Every licensed provider in the state","Providers accredited by the Joint Commission"],a:0,
 why:"A network is about price, not quality. In-network means the provider agreed to the plan's negotiated rates."},
{id:"x25",t:"Managed care",q:"What is the primary goal of managed care?",
 o:["Improving the quality of care","Expanding patient choice","Controlling costs","Increasing the number of providers"],a:2,
 why:"Managed care was invented to control cost, and it worked. Quality is the framing; cost control is the function."},
{id:"x26",t:"Managed care",sample:true,q:"Which best describes gatekeeping?",
 o:["An insurer denying a claim after care is delivered","A patient needing a referral from a primary care provider to see a specialist","A hospital screening patients in the emergency room","A state limiting who can be licensed"],a:1,
 why:"Primary care holds the gate to specialists. It is the classic HMO cost-control tool."},
{id:"x27",t:"HMO vs PPO",q:"Priya wants to book a dermatologist directly and keep seeing her doctor in another state. Which plan fits her best?",
 o:["HMO","EPO","PPO","A staff-model HMO"],a:2,
 why:"A PPO has no gatekeeper and covers out-of-network care at worse rates. An HMO requires referrals and covers out-of-network only in emergencies. An EPO has no out-of-network coverage."},
{id:"x28",t:"HMO vs PPO",ex:true,q:"Compared with a PPO, an HMO typically has all of the following EXCEPT:",
 o:["A lower premium","A narrower network","A primary care gatekeeper","Out-of-network coverage at a higher coinsurance"],a:3,
 why:"That describes a PPO. An HMO covers out-of-network care only in emergencies."},
{id:"x29",t:"Utilization review",q:"An insurer reviews an emergency visit after it happened to decide whether to pay. Which type of utilization review is this?",
 o:["Prospective","Concurrent","Retrospective","Step therapy"],a:2,
 why:"Review is sorted by timing. Prospective is before care, like prior authorization; concurrent is during, like a continued-stay review; retrospective is after, like a claims audit."},
{id:"x30",t:"Utilization controls",q:"A plan will pay for a brand-name drug only after the patient has tried a cheaper one and it hasn't worked. What is this control called?",
 o:["Step therapy","Prior authorization","Capitation","Gold carding"],a:0,
 why:"Step therapy is fail-first. Gold carding is the opposite kind of move: exempting clinicians with strong track records from prior authorization."},
{id:"x31",t:"Utilization controls",q:"A practice is paid a fixed amount per member per month, however much care each patient uses. What risk does this payment create?",
 o:["Overuse of services","Underuse of services","Higher administrative billing per visit","No financial risk for the practice"],a:1,
 why:"Under capitation, the provider bears the risk, and doing less saves money. Fee-for-service creates the opposite risk: overuse, because more services means more revenue."},
{id:"x32",t:"Managed care",ex:true,q:"All of the following are challenges of managed care EXCEPT:",
 o:["Denials or delays on necessary care","Administrative burden","Loss of clinician autonomy","A built-in incentive to provide more services than needed"],a:3,
 why:"Managed care's incentive runs the other way, toward less care. Pushing more services is the fee-for-service problem managed care was built to fix."},
{id:"x33",t:"Consumer-directed care",q:"Who is best suited to a high-deductible plan paired with an HSA?",
 o:["A person with diabetes who needs monthly care","A healthy 25-year-old who rarely sees a doctor","A family expecting a planned surgery","Anyone who wants the broadest network"],a:1,
 why:"Healthy, younger people keep the low premium and bank untaxed savings. Someone chronically ill empties the account every year and still faces the high deductible."},
{id:"x34",t:"Consumer-directed care",q:"An employer offers a consumer-directed plan alongside a comprehensive PPO. What usually happens?",
 o:["Everyone picks the cheaper plan and costs fall across the board","Healthy workers pick the consumer-directed plan and sick workers pick the PPO, so costs concentrate in the PPO","Sick workers pick the consumer-directed plan to save money","Nothing changes, because risk is still pooled"],a:1,
 why:"That's risk selection. The pool splits, the PPO gets sicker and more expensive, and the employer has to subsidize it. The ideal is one pooled plan."},
{id:"x35",t:"Consumer-directed care",ex:true,q:"Which statement about an HSA is NOT true?",
 o:["It is tax-advantaged","It requires a qualifying high-deductible plan","The employee owns the money","Only the employer can put money into it"],a:3,
 why:"Employer-only funding describes an HRA. With an HSA, the employee, the employer or both can contribute, and the employee owns it."},
{id:"x36",t:"Medicaid vs CHIP",q:"A state runs short of money mid-year. Which program can legally put eligible children on a waitlist?",
 o:["Medicaid","CHIP","Both","Neither"],a:1,
 why:"Medicaid is an entitlement: if you are eligible, you are in. CHIP is funded by a fixed block grant, so it can cap enrollment."},
{id:"x37",t:"Medicaid financing",q:"Under the federal matching formula, which state gets the highest federal share of its Medicaid costs?",
 o:["The state with the largest population","The state with the lowest per-person income","The state that spends the most on Medicaid","Every state gets the same share"],a:1,
 why:"The federal share, called FMAP, is higher for poorer states. It never drops below half."},
{id:"x38",t:"Coverage gap",q:"Maria is 30, has no children, is not disabled, and earns 90% of FPL in a state that did not expand Medicaid. What does she qualify for?",
 o:["Medicaid on income alone","Marketplace subsidies","Nothing","CHIP"],a:2,
 why:"She falls in the coverage gap. She is below the 100% FPL floor for subsidies and does not fit a categorical Medicaid group. In an expansion state, where Medicaid covers adults up to 138% FPL, she would be covered."},
{id:"x39",t:"Medicaid design",ex:true,q:"All of the following are true of Medicaid EXCEPT:",
 o:["It is jointly financed by federal and state governments","States run it within federal rules","It pays for long-term care in nursing homes","Eligibility is based on turning 65"],a:3,
 why:"That describes Medicare, which is age-based. Medicaid is based on income and category."},
{id:"x40",t:"Medicaid access",q:"Dr. Lee has decided to accept Medicaid patients. Which statement is true?",
 o:["She can choose which Medicaid patients to see","She must accept all Medicaid patients who come to her","The state can require every doctor to accept Medicaid","Medicaid pays her more than private insurance would"],a:1,
 why:"Participation is voluntary, but once a provider opts in, they must take all comers. Medicaid pays less than other insurers, which is why some providers opt out, and coverage without a willing provider is not access."},
{id:"x41",t:"Waivers",q:"A state wants to test a new way of running Medicaid. The design must be budget-neutral and will run for a few years. Which waiver fits?",
 o:["Section 1115","Section 1915","EMTALA","FMAP"],a:0,
 why:"Section 1115 research and demonstration waivers are the broadest and most common. Section 1915 waivers are mainly used for managed care."},
{id:"x42",t:"Recent developments",q:"Under the new Medicaid work and engagement requirements, what is expected to drive most of the coverage losses?",
 o:["People refusing to work","Administrative burden, as eligible people miss reporting steps","States leaving Medicaid entirely","A drop in the federal match"],a:1,
 why:"Most people who lose coverage are eligible and working. They fall off by missing paperwork, and six-month redeterminations add more chances to miss a step."},
{id:"x43",t:"Recent developments",ex:true,q:"The 2025 reconciliation law did all of the following to Medicaid EXCEPT:",
 o:["Required work or engagement requirements","Required eligibility checks every six months","Cut retroactive eligibility","Raised the federal match for the expansion population back to 100%"],a:3,
 why:"The law tightened the program. It did not increase the federal match."},
{id:"x44",t:"Medicaid managed care",q:"Why do states pay Medicaid managed care organizations a fixed amount per enrollee per month?",
 o:["To shift utilization risk onto the plan and make the state budget more predictable","To shift enrollment risk onto the plan","To guarantee broader provider networks","To remove the need for prior authorization"],a:0,
 why:"The plan takes on the risk of how much care enrollees use, not how many people enroll, and the state gets a predictable budget. The documented problems are thin networks and inappropriate prior authorization."},
{id:"x45",t:"Medicaid cost sharing",q:"Why might a state add a small copay for non-emergency ER visits by adult Medicaid enrollees?",
 o:["Mainly to raise revenue","Mainly to change behavior and discourage unnecessary ER use","Because federal law requires copays for everyone","To charge children and pregnant women"],a:1,
 why:"Cost sharing shifts some cost, but in Medicaid its bigger job is changing behavior. Children and pregnant women pay no cost sharing."},
{id:"x46",t:"Medicaid and immigrants",q:"An undocumented immigrant is seriously injured in a car crash. What care does Medicaid-related funding cover?",
 o:["Full Medicaid after a five-year wait","Emergency services only","Nothing at all","Full Medicaid immediately in every state"],a:1,
 why:"Undocumented immigrants get emergency services only. Hospitals must screen and stabilize anyone under EMTALA. Legal residents generally wait five years."}
];

EX_MCQ.forEach((q, n)=>{
  const target = [2,0,3,1][n % 4], shift = (target - q.a + 4) % 4;
  const o = q.o.slice(); q.o = o.map((_,i)=> o[(i - shift + 4) % 4]); q.a = target;
});

 o:["They argued it was less a universal right than a universal agreement: everyone pays in and everyone benefits","They argued Medicare only covers people who cannot afford private insurance","They argued the Constitution gives the federal government no role in health care","They argued Medicare is a charity program funded by donations"],a:0,
 why:"Medicare is accepted across the political spectrum because we all pay in and we all benefit. It is framed as a shared agreement, not an entitlement handed down. Good essay ammunition for the single-plan question."},
{id:"pw2",ch:1,topic:"Medicare and universal coverage",heat:"orange",src:"Quiz Q2",
 q:"Common ground is important in reaching consensus and passing policy. What common ground did the author find?",
 o:["That the same rules should apply to everyone","That the government should run every hospital","That employers should stop offering insurance","That health care should be paid entirely out of pocket"],a:0,
 why:"The shared value was fairness: one set of rules for everyone. It is the same logic as the universal-agreement framing of Medicare. Key taken from your poll answer; the other options are rebuilt."},
{id:"pw3",ch:2,topic:"Neighborhood nursing",heat:"orange",src:"Quiz Q3",
 q:"Which of the following statements best describes the program discussed in the podcast?",
 o:["A program of nurses and community health workers bringing primary care directly to people in their communities","A hospital program that sends specialists to patients' homes after surgery","An insurance plan that pays primary care doctors a bonus for every visit","A telehealth app that replaces in-person primary care"],a:0,
 why:"Neighborhood Nursing, modelled on Costa Rica, brings free preventive primary care into communities regardless of insurance. Its biggest US obstacle is fragmented financing: with many insurers covering one community, nobody clearly pays for prevention that benefits everyone. Check this one: your poll answer said rural communities, and your notes do not mention rural."},
{id:"pw4",ch:3,topic:"Fake employer insurance",heat:"orange",src:"Quiz Q5",
 q:"The podcast you listened to was primarily about:",
 o:["Health insurance being offered by a \"fake\" employer","A hospital overcharging uninsured patients","Medicaid expansion in a southern state","A union negotiating richer benefits"],a:0,
 why:"A couple left an ACA plan because subsidy repayment at tax time was unpredictable, and ended up in an allegedly fraudulent plan run through a fake employer. It ties to why ACA minimum standards exist: cheap plans look great until you need care, and healthy people leaving makes the real risk pool sicker."},
{id:"pw5",ch:3,topic:"Insurance trade-offs",heat:"orange",src:"Quiz Q8",
 q:"The game you played in class on Tuesday was meant to get you to think about:",
 o:["The trade-offs that individuals and employers make among aspects of health insurance","How hospitals set their prices","How Medicaid eligibility is determined","Why physicians choose specialties"],a:0,
 why:"Every plan trades features against each other: a lower premium buys a higher deductible and out-of-pocket maximum, and a broader network costs more. Employers make the same trade-offs when choosing what to offer."},
{id:"pw6",ch:4,topic:"Prior authorization",heat:"red",src:"Quiz Q9",
 q:"Prior authorization is best described as:",
 o:["A process insurers use to ensure patients truly need the clinical services their physician is ordering","A referral from a primary care doctor before seeing a specialist","A review of a claim after the care has been delivered","The permission a state gives a physician to practice"],a:0,
 why:"Prior authorization is prospective utilization review: approval before the care happens. A primary care referral is gatekeeping, an after-the-fact review is retrospective review, and state permission to practice is licensure."},
{id:"pw7",ch:4,topic:"Prior authorization",heat:"red",src:"Quiz Q10",
 q:"The article refers to a \"gold card,\" which means:",
 o:["The insurer has judged the physician to use services appropriately, so the physician is exempt from prior authorization","A premium plan with no deductible","A patient who has already hit their out-of-pocket maximum","Proof that a physician is board certified"],a:0,
 why:"Gold carding rewards clinicians with a strong track record by skipping prior authorization for them. It is a fix for the administrative burden prior auth creates."},
{id:"pw8",ch:5,topic:"Work requirements",heat:"red",src:"Quiz Q11",
 q:"The podcast you listened to used the term \"hand-up vs. hand-out,\" which refers to:",
 o:["Providing employment assistance and job training to people who may need help","Giving cash payments with no conditions attached","Requiring hospitals to treat anyone in an emergency","Letting states cap Medicaid enrollment with a waitlist"],a:0,
 why:"Supporters of work requirements frame them as a hand-up, helping people into work, rather than a hand-out. Key taken from your poll answer; the other options are rebuilt."},
{id:"pw9",ch:5,topic:"Work requirements",heat:"red",src:"Quiz Q12",
 q:"Which of the following is an unintended consequence of the Medicaid policy discussed in the podcast?",
 o:["People eligible for Medicaid may not return paperwork or understand what they must do to keep it","Enrollment rises sharply because more people find jobs","States receive a higher federal match","Hospitals stop treating emergency patients"],a:0,
 why:"The coverage losses come mostly from administrative burden: eligible, often working, people fall off by missing a reporting step. Six-month redeterminations add more chances to miss one."}
];

const BIO13_Q = [{"id": "b13-r1a", "ch": 1, "topic": "Definitions of life", "heat": "red", "q": "Researchers find an insect endosymbiont, Minimia, that cannot make its own ATP or build its own membranes and survives only inside host cells. Its genome mutates and natural selection acts on it across generations. Which is the best evaluation?", "o": ["Alive by both definitions, because it is made of a cell and evolves", "Alive by the NASA 1994 definition only: it is a chemical system capable of Darwinian evolution, but it fails the textbook requirement to carry out its own metabolism", "Alive by the textbook definition only, because it is cellular, but not by NASA because it depends on a host", "Alive by neither definition, because anything that depends on a host is not alive"], "a": 1, "why": "This is the course's Nasuia case. NASA 1994 asks only for a self-sustaining chemical system capable of Darwinian evolution. The textbook's five characteristics include doing its own metabolism, which this organism cannot.", "trap": "Being a cell is not enough for the textbook definition, and needing a host does not by itself rule out NASA's definition.", "src": "Redacted Q1 · fill-in A"}, {"id": "b13-r1b", "ch": 1, "topic": "Definitions of life", "heat": "red", "q": "A wildfire consumes fuel and oxygen, releases energy, grows, and spreads by throwing off embers that start new fires. Which is the best evaluation?", "o": ["Alive by neither definition: it has no cells and no heritable information, so it cannot undergo Darwinian evolution", "Alive by the NASA 1994 definition only, because it is a self-sustaining chemical system", "Alive by the textbook definition only, because it metabolizes, grows and reproduces", "Alive by both definitions, because it uses energy and reproduces"], "a": 0, "why": "The course key says a burning fire is alive by neither. It looks like metabolism and reproduction, but there are no cells and nothing heritable for selection to act on.", "trap": "Self-sustaining is only half of NASA's definition. Without Darwinian evolution it fails.", "src": "Redacted Q1 · fill-in B"}, {"id": "b13-r1c", "ch": 1, "topic": "Definitions of life", "heat": "red", "q": "A free-living, single-celled soil bacterium builds its own membranes, makes its own ATP, maintains a stable internal environment, responds to nutrients, reproduces, and evolves over generations. Which is the best evaluation?", "o": ["Alive by NASA 1994 only, because the textbook definition requires being made of more than one cell", "Alive by the textbook definition only, because NASA's definition applies only to life on other planets", "Alive by neither, because a single cell cannot be a self-sustaining system", "Alive by both definitions"], "a": 3, "why": "It meets every textbook characteristic and is a self-sustaining chemical system that evolves, so it satisfies NASA too.", "trap": "\"Made of more than one cell\" is NOT one of the five characteristics. Single-celled organisms count.", "src": "Redacted Q1 · fill-in C"}, {"id": "b13-r2a", "ch": 1, "topic": "Valence and formulas", "heat": "red", "q": "Silicon has 4 valence electrons, like carbon. What is the most likely formula of a stable molecule made of silicon and hydrogen?", "o": ["SiH4", "SiH2", "SiH3", "SiH6", "SiH"], "a": 0, "why": "Four valence electrons means silicon needs four more to fill its shell, so it forms four bonds, just like carbon in CH4.", "trap": "Do not count valence electrons as bonds. Bonds = electrons needed to fill the shell.", "src": "Redacted Q2 · fill-in A"}, {"id": "b13-r2b", "ch": 1, "topic": "Valence and formulas", "heat": "red", "q": "Phosphorus has 5 valence electrons, like nitrogen. What is the most likely formula of a stable molecule made of phosphorus and hydrogen?", "o": ["PH5", "PH2", "PH4", "PH3", "PH"], "a": 3, "why": "Five valence electrons means three are needed to fill the shell, so phosphorus forms three bonds, like nitrogen in NH3. That is a valence number of 3.", "trap": "PH5 confuses valence electrons (5) with valence number (bonds formed, 3).", "src": "Redacted Q2 · fill-in B"}, {"id": "b13-r2c", "ch": 1, "topic": "Valence and formulas", "heat": "red", "q": "Chlorine has 7 valence electrons, like fluorine. What is the most likely formula of a stable molecule made of carbon and chlorine?", "o": ["CCl2", "CCl4", "CCl7", "C4Cl", "CCl3"], "a": 1, "why": "Carbon forms 4 bonds. Chlorine needs one more electron, so it forms 1 bond. Four chlorines each bond once to one carbon.", "trap": "CCl7 uses chlorine's 7 valence electrons as a bond count.", "src": "Redacted Q2 · fill-in C"}, {"id": "b13-r3a", "ch": 1, "topic": "Water and polarity", "heat": "red", "q": "Which feature of water lets it form hydrogen bonds with ethanol (CH3CH2OH)?", "o": ["Water is nonpolar overall, so it mixes easily with ethanol's hydrocarbon part", "Water's hydrogen atoms form covalent bonds with ethanol's carbons", "Water dissociates completely into H+ and OH- ions that bind ethanol", "Water's hydrogens are bonded to carbon, which makes them strongly positive", "Oxygen is much more electronegative than hydrogen, so water's O carries a partial negative charge and its H atoms carry partial positive charges"], "a": 4, "why": "Hydrogen bonds need a hydrogen on an electronegative atom (O or N) and an electronegative acceptor with a lone pair. Water's polar O-H bonds give it both, and ethanol's -OH can partner with either.", "trap": "Water is polar because it is bent. A hydrogen bond is a noncovalent attraction, not a shared-electron bond.", "src": "Redacted Q3 · fill-in A"}, {"id": "b13-r3b", "ch": 1, "topic": "Water and polarity", "heat": "red", "q": "Which feature of water lets it surround and dissolve Na+ and Cl- ions?", "o": ["Water forms hydrogen bonds with Na+ by donating its hydrogens to the sodium", "Water molecules carry a full net charge that cancels the ions' charges", "Water is polar: the partially negative O faces Na+ and the partially positive H atoms face Cl-", "Water shares electrons covalently with Na+ and Cl-", "Water is nonpolar, so ions slip between its molecules"], "a": 2, "why": "Ions are stabilized by the partial charges on polar water. Each ion gets a shell of water oriented by charge.", "trap": "Na+ has no lone pair, so water cannot hydrogen bond to it. The attraction is to water's partial charges.", "src": "Redacted Q3 · fill-in B"}, {"id": "b13-r3c", "ch": 1, "topic": "Water and polarity", "heat": "red", "q": "Water readily forms hydrogen bonds with the N-H groups of a protein's backbone. Which feature of water makes this possible?", "o": ["Water's O has lone pairs and a partial negative charge, so it can accept a hydrogen bond from the partially positive H on N", "Water's oxygen is less electronegative than nitrogen, so water donates electrons to the nitrogen", "Water's two hydrogens cancel each other out, making water nonpolar", "London dispersion forces between water and N-H are stronger than hydrogen bonds", "Water forms a covalent bond with the nitrogen"], "a": 0, "why": "N-H is polar, so its H is a donor. Water's oxygen, partially negative with lone pairs, is the acceptor.", "trap": "Oxygen is MORE electronegative than nitrogen.", "src": "Redacted Q3 · fill-in C"}, {"id": "b13-r4a", "ch": 1, "topic": "London dispersion forces", "heat": "red", "q": "Methane (CH4), propane (C3H8) and hexane (C6H14) are all nonpolar. Their boiling points rise in that order. What is the best explanation?", "o": ["Larger hydrocarbons form more hydrogen bonds with each other", "Boiling breaks the C-H covalent bonds, and larger molecules have more of them", "Larger hydrocarbons are more polar", "Larger molecules have more electrons and more surface contact, so they form more London dispersion interactions that must be overcome to boil", "Larger hydrocarbons form ionic bonds with each other"], "a": 3, "why": "Boiling separates molecules. It breaks interactions between molecules, not bonds within them. For nonpolar molecules those interactions are London dispersion forces, which grow with size.", "trap": "Hydrocarbons cannot hydrogen bond: their H atoms are bonded to carbon.", "src": "Redacted Q4 · fill-in A"}, {"id": "b13-r4b", "ch": 1, "topic": "London dispersion forces", "heat": "red", "q": "Three hydrocarbons share the formula C5H12. The unbranched chain boils highest and the most compact, highly branched one boils lowest. What is the best explanation?", "o": ["The straight chain is heavier, so it needs more energy to boil", "Straight chains can lie alongside each other with more surface contact, so they form more London dispersion interactions", "Branched molecules form more hydrogen bonds, which lower the boiling point", "Branching breaks covalent bonds, so branched molecules fall apart more easily", "The straight chain is more polar than the branched ones"], "a": 1, "why": "Same formula means same mass and same number of electrons. The only difference is shape: more contact area means more dispersion attraction.", "trap": "\"Heavier\" cannot be right. They all have the same formula.", "src": "Redacted Q4 · fill-in B"}, {"id": "b13-r4c", "ch": 1, "topic": "London dispersion forces", "heat": "red", "q": "Decane (C10H22) boils far higher than butane (C4H10). A student says this proves decane forms hydrogen bonds. Which is the best evaluation?", "o": ["Correct: longer hydrocarbons have more hydrogens, so they form more hydrogen bonds", "Incorrect: decane boils higher because boiling breaks its stronger covalent bonds", "Correct: hydrogen bonds form between any two hydrogen atoms", "Incorrect: decane boils higher because it is ionic", "Incorrect: decane's H atoms are bonded to carbon so it cannot hydrogen bond. The higher boiling point comes from more London dispersion interactions along its longer chain"], "a": 4, "why": "A hydrogen on carbon carries almost no partial charge, so it cannot hydrogen bond. Chain length raises boiling point through dispersion forces.", "trap": "More hydrogens does not mean more hydrogen bonds if the H is bonded to C.", "src": "Redacted Q4 · fill-in C"}, {"id": "b13-r5a", "ch": 1, "topic": "Condensation and hydrolysis", "heat": "red", "q": "A student says: \"Digesting starch breaks glycosidic linkages by hydrolysis, so digestion produces water.\" Which is the best evaluation?", "o": ["Fully correct as stated", "Partly wrong: starch is held together by peptide bonds, not glycosidic linkages", "Partly wrong: the linkage and reaction are right, but hydrolysis consumes water rather than producing it", "Partly wrong: digestion breaks linkages by condensation, not hydrolysis", "Partly wrong: the linkage is wrong and the water effect is wrong"], "a": 2, "why": "Hydrolysis means splitting with water. Each linkage broken uses up one water molecule. Condensation is the reaction that releases water.", "trap": "Check all three slots separately: linkage, reaction, water.", "src": "Redacted Q5 · fill-in A"}, {"id": "b13-r5b", "ch": 1, "topic": "Condensation and hydrolysis", "heat": "red", "q": "A student says: \"Digesting proteins breaks ester linkages by hydrolysis, so digestion consumes water.\" Which is the best evaluation?", "o": ["Partly wrong: proteins are linked by peptide bonds, but hydrolysis consuming water is correct", "Fully correct as stated", "Partly wrong: the reaction should be condensation", "Partly wrong: hydrolysis produces water", "Partly wrong: the linkage, reaction and water effect are all wrong"], "a": 0, "why": "Linkages: proteins use peptide bonds, carbohydrates glycosidic, nucleic acids phosphodiester, lipids ester. The reaction and water slots are right.", "trap": "Ester is the lipid linkage.", "src": "Redacted Q5 · fill-in B"}, {"id": "b13-r5c", "ch": 1, "topic": "Condensation and hydrolysis", "heat": "red", "q": "A student says: \"Digesting triglycerides breaks ester linkages by condensation, so digestion consumes water.\" Which is the best evaluation?", "o": ["Fully correct as stated", "Partly wrong: triglycerides contain glycosidic linkages", "Partly wrong: digestion produces water", "Partly wrong: ester linkages and consuming water are right, but breaking them is hydrolysis, not condensation", "Partly wrong: triglycerides are not broken down during digestion"], "a": 3, "why": "Triglycerides are three fatty acids joined to glycerol by ester linkages. Digestion splits them with water, which is hydrolysis.", "trap": "Condensation builds polymers and releases water, so it cannot be the digestion step.", "src": "Redacted Q5 · fill-in C"}, {"id": "b13-r6a", "ch": 1, "topic": "Quaternary structure", "heat": "red", "q": "Enzyme D, from a gut bacterium, is a homodimer with 310 amino acids per subunit. The R group of lysine 88 on one subunit forms an ionic bond with the R group of aspartate 142 on the other subunit. A mutant with a different residue at position 88 folds normally but cannot dimerize and is inactive. What best explains this?", "o": ["Any change in primary structure must change every level of structure, so the mutant subunit must be misfolded", "Residue 88 sits at the surface where the subunits meet, so it contributes to quaternary structure but is not needed for each subunit's tertiary fold", "The mutation broke a peptide bond in the backbone, separating the subunits", "Dimerization depends on secondary structure, which is held by R-group ionic bonds", "The mutation changed residue 142 so it can no longer bond"], "a": 1, "why": "The stem says the mutant folds normally, so the tertiary structure is intact. Residue 88's job is an interaction between subunits, which is quaternary.", "trap": "A sequence change CAN change structure, but the stem tells you this one did not affect the fold. Secondary structure is backbone hydrogen bonds, not R groups.", "src": "Redacted Q6 · fill-in A (ionic)", "fig": {"src": "fig/b13-r6a.svg", "alt": "Skeletal structures, neutral form, no class labels: lysine (side chain four CH2 groups ending in NH2); aspartate (side chain CH2-COOH)."}}, {"id": "b13-r6b", "ch": 1, "topic": "Quaternary structure", "heat": "red", "q": "Enzyme D, from a gut bacterium, is a homodimer with 310 amino acids per subunit. The R group of leucine 88 on one subunit forms hydrophobic interactions with the R group of isoleucine 142 on the other subunit. A mutant with a different residue at position 88 folds normally but cannot dimerize and is inactive. What best explains this?", "o": ["Hydrophobic residues are always buried in the core, so changing leucine 88 must have unfolded the subunit", "The new residue at 88 formed a peptide bond with isoleucine 142", "Hydrophobic interactions stabilize only secondary structure", "The activity was lost because residue 88 is in the active site, and dimerization has nothing to do with it", "Leucine 88 is on a nonpolar patch of the subunit surface that packs against the partner subunit, so losing it disrupts quaternary structure without affecting the subunit's own fold"], "a": 4, "why": "Nonpolar surface patches are common at subunit interfaces. The fold is fine, per the stem, so the lost interaction must be between subunits.", "trap": "Not every hydrophobic residue is in the core. Interface residues can be nonpolar too.", "src": "Redacted Q6 · fill-in B (hydrophobic)", "fig": {"src": "fig/b13-r6b.svg", "alt": "Skeletal structures, neutral form, no class labels: leucine (side chain CH2-CH(CH3)2); isoleucine (side chain CH(CH3)-CH2-CH3)."}}, {"id": "b13-r6c", "ch": 1, "topic": "Quaternary structure", "heat": "red", "q": "Enzyme D, from a gut bacterium, is a homodimer with 310 amino acids per subunit. Cysteine 88 on one subunit forms a disulfide bond with cysteine 142 on the other subunit. A mutant with serine at position 88 folds normally but cannot dimerize and is inactive. What best explains this?", "o": ["Serine forms a stronger disulfide bond than cysteine, locking the subunits too tightly", "Removing cysteine 88 broke the peptide backbone of each subunit", "Serine has an -OH instead of -SH, so it cannot form the disulfide that links the two subunits. The bond holds quaternary structure, not the fold of each subunit", "The disulfide was holding the alpha helices of each subunit together", "Serine is hydrophobic, so the subunit misfolded"], "a": 2, "why": "Only two cysteines can form a disulfide, a covalent S-S bond between R groups. With serine at 88 that inter-subunit link is impossible.", "trap": "Serine is polar, not hydrophobic, and it has no sulfur.", "src": "Redacted Q6 · fill-in C (disulfide)", "fig": {"src": "fig/b13-r6c.svg", "alt": "Skeletal structures, neutral form, no class labels: cysteine (side chain CH2-SH); serine (side chain CH2OH)."}}, {"id": "b13-r7a", "ch": 1, "topic": "Quaternary structure", "heat": "red", "q": "Enzyme D, from a gut bacterium, is a homodimer with 310 amino acids per subunit. Lysine 88 on one subunit forms an ionic bond with aspartate 142 on the other. Which substitution at position 88 is LEAST likely to block dimerization?", "o": ["Arginine", "Glutamate", "Alanine", "Phenylalanine", "Serine"], "a": 0, "why": "The interaction needs a positive R group at 88 to pair with negative aspartate. Arginine is basic and positive at physiological pH, so the ionic bond can still form.", "trap": "Glutamate is the worst choice: negative next to negative aspartate repels.", "src": "Redacted Q7 · fill-in A (ionic)", "fig": {"src": "fig/b13-r7a.svg", "alt": "Two panels of skeletal structures, each an amino acid in its neutral form with no class labels. Top, 'In the wild-type dimer': lysine (side chain four CH2 groups ending in NH2) and aspartate (side chain CH2-COOH). Bottom, 'Possible substitutions at position 88 (alphabetical)': alanine (CH3), arginine (three CH2 groups then NH-C(=NH)-NH2), glutamate (CH2-CH2-COOH), phenylalanine (CH2 attached to a benzene ring), serine (CH2OH)."}}, {"id": "b13-r7b", "ch": 1, "topic": "Quaternary structure", "heat": "red", "q": "Enzyme D, from a gut bacterium, is a homodimer with 310 amino acids per subunit. Leucine 88 on one subunit forms hydrophobic interactions with isoleucine 142 on the other. Which substitution at position 88 is LEAST likely to block dimerization?", "o": ["Aspartate", "Lysine", "Serine", "Valine", "Glutamine"], "a": 3, "why": "Valine is nonpolar with a similar branched R group, so it can still pack against isoleucine.", "trap": "Charged or polar R groups would be stranded in a nonpolar interface.", "src": "Redacted Q7 · fill-in B (hydrophobic)", "fig": {"src": "fig/b13-r7b.svg", "alt": "Skeletal structures of free amino acids in their neutral form, no class labels. Top, 'In the wild-type dimer': leucine (side chain CH2-CH(CH3)2); isoleucine (side chain CH(CH3)-CH2-CH3). Bottom, 'Possible substitutions at position 88 (alphabetical)': aspartate (CH2-COOH); glutamine (CH2-CH2-C(=O)-NH2); lysine (four CH2 groups ending in NH2); serine (CH2OH); valine (CH(CH3)2)."}}, {"id": "b13-r7c", "ch": 1, "topic": "Quaternary structure", "heat": "red", "q": "Enzyme D, from a gut bacterium, is a homodimer with 310 amino acids per subunit. The -OH of serine 88 on one subunit forms a hydrogen bond with the amide group of asparagine 142 on the other. Which substitution at position 88 is LEAST likely to block dimerization?", "o": ["Alanine", "Threonine", "Valine", "Phenylalanine", "Leucine"], "a": 1, "why": "Threonine also has an -OH group, so it can donate or accept the same hydrogen bond.", "trap": "Alanine, valine, phenylalanine and leucine have only C-H in their R groups, so they cannot hydrogen bond.", "src": "Redacted Q7 · fill-in C (hydrogen bond)", "fig": {"src": "fig/b13-r7c.svg", "alt": "Skeletal structures of free amino acids in their neutral form, no class labels. Top, 'In the wild-type dimer': serine (side chain CH2OH); asparagine (side chain CH2-C(=O)-NH2). Bottom, 'Possible substitutions at position 88 (alphabetical)': alanine (CH3); leucine (CH2-CH(CH3)2); phenylalanine (CH2 attached to a benzene ring); threonine (CH(OH)-CH3); valine (CH(CH3)2)."}}, {"id": "b13-r8a", "ch": 1, "topic": "Protein structure and gels", "heat": "red", "q": "Enzyme D, from a gut bacterium, is a homodimer with 310 amino acids per subunit. Cysteine 88 on one subunit forms a disulfide bond with cysteine 142 on the other, and this is the only link between subunits. The enzyme has no other disulfide bonds. Which incubation would separate wild-type dimers into monomers that stay folded?", "o": ["Boiling with SDS", "A protease that cuts peptide bonds", "High salt", "Strong heat alone", "A mild reducing agent at room temperature"], "a": 4, "why": "A reducing agent breaks disulfide bonds specifically and leaves the noncovalent interactions that hold each subunit's fold.", "trap": "SDS and boiling denature the whole protein, so the monomers would not stay folded. High salt does not touch a covalent bond.", "src": "Redacted Q8 · fill-in A (disulfide)", "fig": {"src": "fig/b13-r8a.svg", "alt": "Skeletal structures, neutral form, no class labels: cysteine (side chain CH2-SH)."}}, {"id": "b13-r8b", "ch": 1, "topic": "Protein structure and gels", "heat": "red", "q": "Enzyme D, from a gut bacterium, is a homodimer with 310 amino acids per subunit. Lysine 88 on one subunit forms an ionic bond with aspartate 142 on the other, and this is the main link between subunits. Which incubation would most likely separate wild-type dimers into monomers that stay folded?", "o": ["A reducing agent", "Boiling with SDS", "High salt concentration, whose ions shield the charged R groups from each other", "A protease that cuts peptide bonds", "Adding more of the enzyme's substrate"], "a": 2, "why": "Ionic bonds are weakened when lots of dissolved ions crowd around the charged groups. That targets the interface without unfolding each subunit.", "trap": "A reducing agent only breaks disulfides, and there are none in this version.", "src": "Redacted Q8 · fill-in B (ionic)", "fig": {"src": "fig/b13-r8b.svg", "alt": "Skeletal structures, neutral form,
