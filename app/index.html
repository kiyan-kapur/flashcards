<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Drill Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --paper:#EDF1F3; --surface:#FFFFFF; --surface-2:#F4F8F9; --surface-3:#E7EDEF;
  --ink:#0E1A20; --muted:#556C78; --faint:#82959F;
  --line:#D2DDE2; --line-strong:#B4C4CB;
  --accent:#0E7C86; --accent-soft:#DAEEF0; --accent-ink:#065B63;
  --signal:#BE4F1B; --signal-soft:#FAE5D9;
  --again:#B5342A; --hard:#A15D16; --good:#0E7C86; --easy:#3B7529;
  --grid:rgba(14,26,32,.045);
  --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(14,26,32,.05), 0 10px 30px -18px rgba(14,26,32,.35);
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0B1115; --surface:#131C21; --surface-2:#18232A; --surface-3:#202E35;
    --ink:#E3ECF0; --muted:#9AAFB9; --faint:#6F868F;
    --line:#243239; --line-strong:#32444D;
    --accent:#45BFC9; --accent-soft:#103137; --accent-ink:#96E1E7;
    --signal:#EE8A4F; --signal-soft:#372316;
    --again:#E4756A; --hard:#DDA05A; --good:#45BFC9; --easy:#84C36D;
    --on-accent:#06181B;
    --grid:rgba(227,236,240,.04);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#0B1115; --surface:#131C21; --surface-2:#18232A; --surface-3:#202E35;
  --ink:#E3ECF0; --muted:#9AAFB9; --faint:#6F868F;
  --line:#243239; --line-strong:#32444D;
  --accent:#45BFC9; --accent-soft:#103137; --accent-ink:#96E1E7;
  --signal:#EE8A4F; --signal-soft:#372316;
  --again:#E4756A; --hard:#DDA05A; --good:#45BFC9; --easy:#84C36D;
  --on-accent:#06181B;
  --grid:rgba(227,236,240,.04);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 34px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  -webkit-font-smoothing:antialiased;
}
.num,.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100%;min-height:0}
header.bar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.bar-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:2px}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--faint)}
.modes{display:flex;gap:2px;background:var(--surface-3);padding:3px;border-radius:8px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.modes button{
  border:0;background:transparent;color:var(--muted);
  padding:5px 11px;border-radius:6px;font-size:13px;font-weight:500;white-space:nowrap
}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.ghost{
  border:1px solid var(--line);background:var(--surface);border-radius:7px;
  padding:5px 10px;font-size:12.5px;color:var(--muted)
}
.ghost:hover{border-color:var(--line-strong);color:var(--ink)}
.meter{height:3px;background:var(--surface-3)}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s ease}

/* ---------- main ---------- */
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:0}
main.solo{grid-template-columns:minmax(0,1fr)}
.pane{min-height:0;overflow-y:auto;overflow-x:hidden}
.card-pane{padding:20px 16px 26px}
.card-wrap{max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.tagrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag{
  font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;
  padding:3px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);background:var(--surface)
}
.tag.must{background:var(--signal-soft);border-color:transparent;color:var(--signal)}
.tag.useful{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.tag.est{background:var(--surface-3);border-color:transparent;color:var(--muted)}
.tag.type{border-style:dashed}
.counter{margin-left:auto;font-size:11.5px;color:var(--faint);letter-spacing:.04em}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden
}
.q{padding:26px 24px}
.q .who{
  font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin-bottom:10px
}
.q p{
  margin:0;font-family:"IBM Plex Serif",Georgia,serif;font-size:21px;line-height:1.38;
  text-wrap:pretty;letter-spacing:-.005em
}
.q .sub{margin-top:10px;font-family:"IBM Plex Sans",sans-serif;font-size:13.5px;color:var(--muted)}

.answer{border-top:1px solid var(--line);background:var(--surface-2)}
.ans-block{padding:18px 24px;border-bottom:1px solid var(--line)}
.ans-block:last-child{border-bottom:0}
.lbl{
  font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin-bottom:7px
}
.big{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:500;line-height:1.35;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.say{font-family:"IBM Plex Serif",Georgia,serif;font-style:italic;font-size:15.5px;line-height:1.5;color:var(--ink)}
.body-t{font-size:14px;line-height:1.55;color:var(--muted)}
.body-t strong{color:var(--ink);font-weight:600}
.trick{background:var(--accent-soft)}
.trick .lbl{color:var(--accent-ink)}
.trick .body-t{color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:20px;
  padding:3px 10px;font-size:11.5px;color:var(--muted)
}
.chip:hover{color:var(--accent-ink);border-color:var(--accent)}

.reveal{
  border:0;background:var(--ink);color:var(--paper);border-radius:var(--r);
  padding:13px;font-size:14px;font-weight:600;width:100%;letter-spacing:.01em
}
.reveal span{opacity:.55;font-weight:400;margin-left:6px;font-size:12.5px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{
  border:1px solid var(--line);background:var(--surface);border-radius:9px;
  padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:13.5px
}
.rate button small{font-weight:400;font-size:10.5px;color:var(--faint);font-family:"IBM Plex Mono",monospace}
.rate button:hover{border-color:currentColor}
.rate [data-r="again"]{color:var(--again)} .rate [data-r="hard"]{color:var(--hard)}
.rate [data-r="good"]{color:var(--good)} .rate [data-r="easy"]{color:var(--easy)}
.hintline{font-size:12px;color:var(--faint);text-align:center}

/* ---------- chat ---------- */
.chat-pane{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.chat-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.chat-head b{font-size:13px;font-weight:600}
.chat-head .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.chat-head .ctx{font-size:11px;color:var(--faint);margin-left:auto;text-align:right;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-log{flex:1;min-height:0;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.msg{font-size:14px;line-height:1.55;max-width:100%}
.msg.you{align-self:flex-end;background:var(--accent-soft);color:var(--accent-ink);padding:9px 12px;border-radius:12px 12px 3px 12px;max-width:85%}
.msg.ai{white-space:pre-wrap}
.msg.ai .cursor{display:inline-block;width:7px;height:15px;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.msg.sys{font-size:12.5px;color:var(--faint);border-left:2px solid var(--line);padding-left:10px}
.starters{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.chat-in{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
textarea{
  flex:1;resize:none;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);
  color:var(--ink);font:inherit;font-size:14px;padding:9px 11px;min-height:40px;max-height:140px
}
.send{border:0;background:var(--accent);color:var(--on-accent);border-radius:9px;padding:10px 13px;font-weight:600;font-size:13px}
.send:disabled{opacity:.45;cursor:default}

/* ---------- interview ---------- */
.iv-card{display:flex;flex-direction:column;gap:14px;max-width:660px;margin:0 auto}
.fb{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.fb-row{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:14px}
.fb-row:last-child{border-bottom:0}
.fb-row b{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);padding-top:3px;font-weight:600}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,14,18,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  width:100%;max-width:560px;max-height:82vh;overflow-y:auto
}
.sheet h3{margin:0;padding:15px 18px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;display:flex;align-items:center}
.sheet h3 button{margin-left:auto;border:0;background:transparent;color:var(--faint);font-size:18px;line-height:1;padding:0 2px}
.sheet .in{padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:var(--surface-2)}
.stat b{display:block;font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:500;letter-spacing:-.02em}
.stat span{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.09em}
.catlist{display:flex;flex-direction:column;gap:7px}
.catrow{display:grid;grid-template-columns:1fr 62px 42px;gap:10px;align-items:center;font-size:13px}
.catrow .track{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.catrow .track i{display:block;height:100%;background:var(--accent)}
.catrow em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);text-align:right}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 11px;font-size:12.5px;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
kbd{
  font-family:"IBM Plex Mono",monospace;font-size:11px;border:1px solid var(--line-strong);
  border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--surface-2);color:var(--muted)
}
.klist{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:13px;color:var(--muted)}
.klist div{display:flex;gap:8px;align-items:center}

.done{max-width:520px;margin:34px auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.done h2{margin:0;font-family:"IBM Plex Serif",Georgia,serif;font-size:26px;font-weight:600}
.done p{margin:0;color:var(--muted);font-size:14.5px;max-width:42ch}
.btn-primary{border:0;background:var(--accent);color:var(--on-accent);border-radius:9px;padding:11px 18px;font-weight:600;font-size:14px}


/* ---------- redo tests ---------- */
.test-wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.test-row{
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  padding:15px 16px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);text-align:left;width:100%
}
.test-row:hover{border-color:var(--accent)}
.test-row .meta{flex:1;min-width:0}
.test-row h4{margin:0 0 3px;font-size:15px;font-weight:600}
.test-row p{margin:0;font-size:13px;color:var(--muted)}
.test-row .score{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted);white-space:nowrap;text-align:right}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{
  width:27px;height:27px;border-radius:7px;border:1px solid var(--line);background:var(--surface);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint);padding:0
}
.dots button[data-st="done"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.dots button[data-st="cur"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.figbox{border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px;text-align:center}
.figbox img{display:block;margin:0 auto;max-width:100%;max-height:330px;height:auto;width:auto;border-radius:4px}
.figcap{font-size:11px;color:var(--faint);margin-top:7px;letter-spacing:.02em}
.note{
  border-left:2px solid var(--signal);background:var(--signal-soft);color:var(--signal);
  padding:9px 12px;border-radius:0 7px 7px 0;font-size:12.5px;line-height:1.45
}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:12px 14px;font-size:14.5px;line-height:1.45
}
.opt:hover{border-color:var(--line-strong)}
.opt .badge{
  flex:none;width:23px;height:23px;display:grid;place-items:center;
  border:1px solid var(--line-strong);font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);margin-top:1px
}
.opt.single .badge{border-radius:50%}
.opt.multi .badge{border-radius:6px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .badge{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt[aria-checked="true"] .otext{color:var(--accent-ink)}
.blankrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.blankrow:last-child{border-bottom:0}
.blankrow .bl{font-size:14.5px;min-width:96px}
.navrow{display:flex;gap:8px;align-items:center}
.navrow .spacer{flex:1}
.scorehead{
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px 20px;
  display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;box-shadow:var(--shadow)
}
.scorehead b{font-family:"IBM Plex Mono",monospace;font-size:34px;font-weight:500;letter-spacing:-.03em;line-height:1}
.scorehead span{font-size:13.5px;color:var(--muted)}
.res-q{border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden}
.res-top{display:flex;gap:11px;padding:13px 15px;align-items:flex-start}
.mark{
  flex:none;width:21px;height:21px;border-radius:50%;border:1.5px solid currentColor;
  display:grid;place-items:center;font-size:12px;font-weight:700;line-height:1;margin-top:1px
}
.mark.ok{color:var(--easy)} .mark.no{color:var(--again)} .mark.part{color:var(--hard)}
.res-top .rq{flex:1;min-width:0;font-size:14px;line-height:1.45}
.res-top .rq em{font-style:normal;color:var(--faint);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:3px}
.res-body{border-top:1px solid var(--line);padding:12px 15px;display:flex;flex-direction:column;gap:9px;background:var(--surface-2)}
.ab{display:grid;grid-template-columns:92px 1fr;gap:10px;font-size:13.5px;line-height:1.45}
.ab b{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);padding-top:3px;font-weight:600}
.ab .yes{color:var(--easy)} .ab .nope{color:var(--again)}
.res-why{font-size:13.5px;line-height:1.55;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}


.brand{border:0;background:transparent;padding:0;display:flex;align-items:baseline;cursor:pointer}
.crumbs{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);flex-wrap:wrap;min-width:0}
.crumbs button{border:0;background:transparent;padding:3px 6px;border-radius:6px;color:var(--muted);font-size:13px}
.crumbs button:hover{color:var(--ink);background:var(--surface-3)}
.crumbs i{font-style:normal;color:var(--faint);font-size:12px}
.crumbs .here{color:var(--ink);font-weight:600;padding:3px 2px}

/* ---------- library ---------- */
.lib{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.lib-group>h3{margin:0 0 11px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);font-weight:600}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.folder{
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 15px;
  text-align:left;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)
}
.folder:hover{border-color:var(--fc,var(--accent))}
.folder .ftop{display:flex;align-items:center;gap:10px}
.folder .tab{
  width:24px;height:18px;border-radius:2px 5px 5px 5px;background:var(--fc,var(--accent));
  position:relative;flex:none;opacity:.92
}
.folder .tab:after{
  content:"";position:absolute;top:-4px;left:0;width:11px;height:5px;
  border-radius:3px 3px 0 0;background:var(--fc,var(--accent))
}
.folder b{font-size:14.5px;font-weight:600;line-height:1.2}
.folder p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
.folder .bar{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.folder .bar i{display:block;height:100%;background:var(--fc,var(--accent))}
.folder .fmeta{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);font-family:"IBM Plex Mono",monospace}
.scope{border-left:2px solid var(--line-strong);padding:2px 0 2px 12px;font-size:12.5px;color:var(--muted);line-height:1.5}

/* ---------- question bank ---------- */
.heat{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.heat.red{background:#D0453A} .heat.orange{background:#D08A2E}
.heat.yellow{background:#C9B33C} .heat.green{background:#5BA05B}
.tag.heat-red{background:#FBE3E0;border-color:transparent;color:#9C2F26}
.tag.heat-orange{background:#FBEEDA;border-color:transparent;color:#8A5711}
.tag.heat-yellow{background:#F7F2D6;border-color:transparent;color:#7A6B12}
.tag.heat-green{background:#E2F0E2;border-color:transparent;color:#3D6B3D}

<script>
/* ============================ DECK ============================ */
const CATS = {
  us:{name:"US anchors"}, chains:{name:"Chain counts"}, locations:{name:"Location counts"},
  boston:{name:"Boston & Logan"}, aviation:{name:"US aviation"}, math:{name:"Mental math"},
  scale:{name:"Order of magnitude"}, structure:{name:"Top-down vs bottom-up"}, units:{name:"Unit discipline"},
  error:{name:"Find the mistake"}, sanity:{name:"Sanity checks"}, assume:{name:"Assumptions"},
  framework:{name:"Framework & delivery"},
  terms:{name:"Insurance terms"}, employer:{name:"Employer insurance"}, managed:{name:"Managed care"},
  medicaid:{name:"Medicaid & ACA"}, numbers:{name:"Numbers to know"}
};
const PRI = {must:"Must know", useful:"Useful", est:"Estimate, don't memorize"};
const TYPES = {
  anchor:"Anchor", magnitude:"Order of magnitude", math:"Mental math", approach:"Approach choice",
  units:"Unit discipline", mistake:"Find the mistake", sanity:"Sanity check",
  assumption:"Assumption", framework:"Framework",
  term:"Definition", rank:"Ranking", concept:"Concept", number:"Figure"
};

const MKT_CARDS = [
/* --- US core anchors --- */
{id:"us-pop",cat:"us",pri:"must",type:"anchor",
 q:"Roughly how many people live in the US?",
 a:"~340M. Round to 350M for the math.",
 say:"About 340 million. I'll round to 350 million to keep the math clean.",
 why:"Every top-down estimate starts here. The rounding isn't laziness: 350 makes 10% a clean 35 million, and no interviewer objects to a 3% round.",
 trick:"350 is the friendly one. 10% of 350M = 35M, which divides cleanly by 5 and 7.",
 linkText:"This is the root of the deck. Almost every other anchor either divides into 340M or scales off it.",
 links:[]},
{id:"us-households",cat:"us",pri:"must",type:"anchor",
 q:"How many households are there in the US, and how big is the average one?",
 a:"~130M households, ~2.5 people each.",
 say:"About 130 million households, averaging roughly 2.5 people, which squares with a population around 340 million.",
 why:"Use households, not people, for anything bought once per home: fridges, lawnmowers, internet plans, streaming subscriptions.",
 trick:"130M × 2.5 ≈ 325M. The two anchors check each other, so remembering one rebuilds the other.",
 linkText:"Same family as the US population card: population ÷ 2.5 gets you back to households.",
 links:["us-pop"]},
{id:"us-labor",cat:"us",pri:"must",type:"anchor",
 q:"How big is the US labor force?",
 a:"~170M workers.",
 say:"Around 170 million, so call it roughly half the population.",
 why:"Use it for anything sold per employee or per workplace: laptops, badges, commutes, lunch near an office.",
 trick:"Exactly half of 340M. Population, then cut in half.",
 linkText:"Third member of the population family: 340M people, 130M households, 170M workers.",
 links:["us-pop","us-households"]},
{id:"college-students",cat:"us",pri:"must",type:"anchor",
 q:"How many college students are there in the US?",
 a:"~20M.",
 say:"About 20 million college students.",
 why:"The anchor for anything student-facing: textbooks, dorms, student software, campus food.",
 trick:"20M students across ~5.5k colleges is ~3,600 per school. That feels right, big state schools pull the average up.",
 linkText:"Pairs with the ~5.5k colleges count. One is the numerator, the other the denominator.",
 links:["colleges-hospitals"]},
{id:"us-restaurants",cat:"us",pri:"must",type:"magnitude",
 q:"How many restaurants and foodservice outlets are there in the US?",
 a:"~1M, all types, not just chains.",
 say:"On the order of a million outlets, counting independents, not just chains.",
 why:"This is the ceiling for any food unit count. Any single chain is a rounding error against it.",
 trick:"1M outlets for 340M people = one per ~340 people. It's also ~60x Starbucks, which tells you chains are a thin slice of the market.",
 linkText:"Top rung of the order-of-magnitude ladder, and the number that puts every chain count in perspective.",
 links:["starbucks","tier-ladder"]},
{id:"states",cat:"us",pri:"est",type:"anchor",
 q:"You want to scale a state-level number nationally. What do you divide by, and what's an average state?",
 a:"50 states, ~7M people per state on average.",
 say:"Fifty states, so an average state is about 7 million people. I'd flag that the distribution is skewed, California and Texas are far above average.",
 why:"State scaling is a fast cross-check, but name the skew so the interviewer knows you know.",
 trick:"340M / 50 ≈ 7M. Greater Boston at 5M is a bit under an average state, which is useful gut calibration.",
 linkText:"Sits between the US population card and Greater Boston: it's how you get from one to the other.",
 links:["us-pop","greater-boston"]},

/* --- Mental math --- */
{id:"mm-10",cat:"math",pri:"must",type:"math",
 q:"What's 10% of any number, and why does that one move matter so much?",
 a:"Move the decimal one place left.",
 say:"10% of 350 million is 35 million.",
 why:"Every other percentage is built from the 10% move. Get this reflex and you never do long multiplication out loud.",
 trick:"Find 10% first, always. Then multiply it or halve it. Never attack a percentage head-on.",
 linkText:"The engine behind every percentage card that follows.",
 links:["us-pop"]},
{id:"mm-5",cat:"math",pri:"useful",type:"math",
 q:"5% of 350 million.",
 a:"17.5M (half of 35M).",
 say:"10% is 35 million, so 5% is 17.5 million.",
 why:"5% is the 10% move followed by a halving. Say both steps out loud, the interviewer grades the path, not the digit.",
 trick:"5% = half of 10%. 2.5% = half again.",
 linkText:"One step down from the 10% card. Same move, then halve.",
 links:["mm-10"]},
{id:"mm-multiples",cat:"math",pri:"useful",type:"math",
 q:"30% of 45,000. Then 70% of it.",
 a:"13,500 and 31,500.",
 say:"10% is 4,500, so 30% is 13,500 and 70% is 31,500.",
 why:"20/30/40/70% are all the 10% number multiplied. Never compute them directly.",
 trick:"Ladder from 10%: 4,500 → 13,500 → 31,500. Three times and seven times one building block.",
 linkText:"Same 10% engine, now multiplied instead of halved. The Find-the-Mistake card on 30% is this card's failure mode.",
 links:["mm-10","err-percent"]},
{id:"mm-quarters",cat:"math",pri:"useful",type:"math",
 q:"25% and 75% of 64,000.",
 a:"16,000 and 48,000.",
 say:"A quarter of 64 thousand is 16 thousand, three quarters is 48 thousand.",
 why:"Quarters are halvings, not percentage moves: halve, then halve again.",
 trick:"25% = halve twice. 75% = the whole minus one halve-twice.",
 linkText:"Cousin of the 5% card: both are halving moves, not decimal moves. And 64,000 is roughly the US hotel count.",
 links:["mm-5","hotels-banks"]},
{id:"mm-k-times-k",cat:"math",pri:"must",type:"math",
 q:"1,000 × 1,000. Then 1,000 × 1 million.",
 a:"1M, and 1B.",
 say:"A thousand times a thousand is a million; a thousand times a million is a billion.",
 why:"This is the unit ladder that keeps your zeros honest: k × k = M, k × M = B.",
 trick:"Each rung up is three zeros: k, M, B. Count rungs, never individual zeros.",
 linkText:"The foundation for every big-number multiply card, and the fix for the place-value mistake card.",
 links:["units-convert","err-place"]},
{id:"mm-2400x3000",cat:"math",pri:"useful",type:"math",
 q:"2,400 × 3,000.",
 a:"7.2M.",
 say:"2.4 thousand times 3 thousand: 2.4 times 3 is 7.2, and k times k is a million, so 7.2 million.",
 why:"The cheat sheet's canonical big-number drill. Strip to leading digits, multiply those, reattach the unit.",
 trick:"Small numbers first, units second. 2.4 × 3 = 7.2, then stamp on the M.",
 linkText:"Direct application of k × k = M.",
 links:["mm-k-times-k"]},
{id:"mm-div15",cat:"math",pri:"must",type:"math",
 q:"How do you divide by 1.5 in your head? Do 120,000 ÷ 1.5.",
 a:"×2 then ÷3 → 80,000.",
 say:"Dividing by 1.5 is doubling then dividing by three: 240 thousand over three is 80 thousand.",
 why:"You'll hit ÷1.5 the moment you use the 1.5-passengers-per-rideshare assumption.",
 trick:"÷1.5 = ×2 ÷3. Doubling first keeps you in whole numbers.",
 linkText:"Exists for one reason: the rideshare assumption card. And 120,000 is Logan's daily passenger count on purpose.",
 links:["rideshare","logan-day"]},
{id:"mm-annualize",cat:"math",pri:"must",type:"math",
 q:"How do you annualize a daily, weekly, and monthly figure in your head?",
 a:"×360 daily, ×50 weekly, ×12 monthly.",
 say:"I'll use 360 days rather than 365 to keep it clean, and 50 weeks rather than 52.",
 why:"Rounding 365 to 360 costs about 1.4% and buys clean division by 6, 9, and 12.",
 trick:"360 and 50: the sloppy-on-purpose calendar. Say you're rounding, then move.",
 linkText:"Used by every per-day number in the deck, and the fix for the Logan divide-by-12 mistake.",
 links:["mm-annual-example","err-logan"]},
{id:"mm-annual-example",cat:"math",pri:"useful",type:"math",
 q:"3 million units a day, annualized.",
 a:"~1.08B per year.",
 say:"3 million a day times 360 days is about 1.08 billion a year.",
 why:"3 × 36 = 108, then the units carry: millions × hundreds = billions.",
 trick:"3M × 360 → 3 × 36 = 108, shift for the extra zero: 1.08B.",
 linkText:"Not a random example: 3M/day is roughly US airline passengers, so this card doubles as an aviation drill.",
 links:["mm-annualize","airline-pax"]},
{id:"mm-pop-pct",cat:"math",pri:"must",type:"math",
 q:"30% of the US population.",
 a:"~105M people.",
 say:"10% of 350 million is 35 million, so 30% is 105 million people.",
 why:"The single most common calculation in a top-down sizing. Make it automatic.",
 trick:"35, 70, 105. The 10%-of-America ladder.",
 linkText:"The 10% card applied to the root anchor. If you only drill one arithmetic card, drill this one.",
 links:["mm-10","us-pop"]},
{id:"mm-store-scale",cat:"math",pri:"useful",type:"math",
 q:"450 units per store per day across 10,000 stores.",
 a:"4.5M units/day.",
 say:"450 a day times 10 thousand stores is 4.5 million units per day.",
 why:"The canonical bottom-up multiply: per-unit rate × unit count. Notice the answer keeps the per-day tag.",
 trick:"Multiply the small numbers, then add the k. 450 × 10k = 4.5M.",
 linkText:"The arithmetic engine of every bottom-up card, and 10k stores is deliberately the big-chain default.",
 links:["mm-k-times-k","dontknow-chain"]},
{id:"units-convert",cat:"units",pri:"useful",type:"units",
 q:"You're mid-calculation and you've lost track of the zeros. What do you do?",
 a:"Stop counting zeros. Convert everything to k, M, or B first, then multiply.",
 say:"Let me put that in millions so I don't drop a zero: 2.4 thousand times 3 thousand is 7.2 million.",
 why:"Place-value errors are the most common way a good structure produces an absurd answer, and the easiest to prevent.",
 trick:"Zeros are for computers, k/M/B are for humans. Convert, then multiply.",
 linkText:"The discipline version of k × k = M, and the direct antidote to the place-value mistake card.",
 links:["mm-k-times-k","err-place"]},

/* --- Chains --- */
{id:"starbucks",cat:"chains",pri:"must",type:"anchor",
 q:"Roughly how many Starbucks locations are there in the US?",
 a:"~16k.",
 say:"On the order of 16 thousand in the US, call it 15 to 16 thousand.",
 why:"The biggest of the big chains, and the one most likely to show up in a coffee sizing question.",
 trick:"Starbucks 16k > McDonald's 14k > Dunkin' 10k. The 10k-plus podium, in that order.",
 linkText:"Top of the chain tier ladder, and ~1/60th of all US restaurant outlets.",
 links:["mcdonalds","chain-tiers","us-restaurants"]},
{id:"mcdonalds",cat:"chains",pri:"must",type:"anchor",
 q:"Roughly how many McDonald's are there in the US?",
 a:"~14k.",
 say:"About 14 thousand, so on the order of 10 to 15 thousand.",
 why:"If you only remember one chain count, remember that giants sit in the low-to-mid teens of thousands.",
 trick:"Same tier as Starbucks, one notch down. Coffee beats burgers on US store count.",
 linkText:"Feeds the burgers-per-day bottom-up card, and if you blank on it the 5k-15k default covers you.",
 links:["starbucks","approach-burgers","dontknow-chain"]},
{id:"dunkin",cat:"chains",pri:"useful",type:"anchor",
 q:"How many Dunkin' locations are there in the US?",
 a:"~10k.",
 say:"Around 10 thousand, heavily concentrated in the Northeast.",
 why:"The floor of the 10k-plus tier, and the most relevant chain for a Boston-framed question.",
 trick:"Dunkin' is the round one: 10k exactly. It's a Boston company, so it's fair game at Tufts.",

/* --- Framework --- */
{id:"framework-steps",cat:"framework",pri:"must",type:"framework",
 q:"Before you start, how are you going to approach this?",
 a:"1) Define unit, geography, time period. 2) Top-down or bottom-up. 3) Two to four drivers. 4) Round aggressively. 5) Sanity-check in one sentence.",
 say:"Let me define what we're counting, pick an approach, lay out the equation, then plug in rounded numbers and sanity-check at the end.",
 why:"Saying the five steps buys you ten seconds of thinking time and signals structure before you've produced a single number.",
 trick:"Define, choose, drive, round, check. The first thing out of your mouth is a definition, never a number.",
 linkText:"The container for every other card: step 2 is the approach cards, step 5 is the sanity cards.",
 links:["approach-rule","sanity-technique","framework-units"]},
{id:"framework-units",cat:"units",pri:"must",type:"framework",
 q:"What has to come after every number you say out loud?",
 a:"The unit. “6.75 million passengers per day”, never “6.75 million”.",
 say:"That gives us about 6.75 million passenger-movements per day.",
 why:"Units are the cheapest credibility in the room, and the thing that stops you annualizing twice or mixing rides with riders.",
 trick:"A naked number is a wrong answer. Always: quantity, thing, per-time.",
 linkText:"Enforced by every units card and violated by three of the four mistake cards.",
 links:["units-flights","units-daily-annual","units-convert"]},
{id:"framework-drivers",cat:"framework",pri:"useful",type:"framework",
 q:"How many segments or drivers should your estimate have?",
 a:"Two to four. Don't over-segment.",
 say:"I'll keep this to three drivers so the math stays clean, and I can add segmentation if you'd like more precision.",
 why:"Extra segments multiply your error surface and burn your 90 seconds. Offering to segment further beats doing it unasked.",
 trick:"Three drivers, one equation, one answer. Complexity is not rigor.",
 linkText:"Why the haircuts card blends genders instead of splitting them.",
 links:["framework-steps","haircuts"]},
{id:"framework-dontrestart",cat:"framework",pri:"must",type:"framework",

 say:"I'll carry this assumption through and flag at the end that the answer is most sensitive to it.",

 trick:"Finish the sentence you started. Flag, don't restart.",
 linkText:"The behavioural twin of the don't-freeze card: one is about starting, this one is about not stopping.",

/* --- Approach choice --- */
{id:"approach-rule",cat:"structure",pri:"must",type:"approach",
 q:"How do you decide between top-down and bottom-up?",
 a:"Bottom-up when you know the unit count. Top-down when population and frequency are the drivers.",
 say:"If I have a credible unit count, like store or airport counts, I'll go bottom-up. If the behaviour is spread across everyone, I'll go top-down from population.",
 why:"Both are defensible. What gets graded is whether your choice follows from what you actually know.",
 trick:"Ask: do I know the denominator? Units known ⇒ bottom-up. People and frequency ⇒ top-down.",
 linkText:"Step 2 of the framework, and the rule the next four cards apply.",
 links:["framework-steps","tier-ladder"]},
{id:"approach-haircuts",cat:"structure",pri:"useful",type:"approach",
 q:"How many haircuts are purchased in the US each year? Which approach, and why?",
 a:"Top-down: population × haircuts per person per year. 340M × ~6 ≈ 2B/year.",
 say:"Top-down, because I don't know the salon count but I do know the population and roughly how often people get haircuts. 340 million times about 6 a year is roughly 2 billion.",
 why:"Anything everyone does at a personal frequency is a population question, not a store question.",
 trick:"Everyone does it ⇒ top-down. The rate per person is the thing you actually know.",
 linkText:"Contrast this with the McDonald's card: known unit count flips you to bottom-up.",
 links:["haircuts","approach-rule","approach-burgers"]},

 linkText:"The failure mode of the percentage-multiples drill.",

 trick:"k × k = M. If your answer came out in hundreds of thousands, you dropped a rung.",

/* --- Sanity checks --- */
{id:"sanity-technique",cat:"sanity",pri:"must",type:"sanity",
 q:"You've got a big number. How do you sanity-check it in one sentence?",
 a:"Convert it down to a per-store, per-person, or per-day unit you have intuition about.",
 say:"That works out to about 150 orders a day per restaurant, which feels plausible for a pizza place.",
 why:"Nobody has intuition about 3.5 billion. Everybody has intuition about 150 orders a day.",
 trick:"Divide back down until you reach a human-sized number, then judge that number.",
 linkText:"Step 5 of the framework, and the method all three sanity cards apply.",
 links:["framework-steps","sanity-pizza","sanity-starbucks"]},
{id:"sanity-pizza",cat:"sanity",pri:"useful",type:"sanity",
 q:"Your estimate implies each pizza restaurant does $3,000 of revenue a day. Unreasonable?",
 a:"No. At a ~$20 ticket that's ~150 orders/day, which is plausible.",
 say:"At around 20 dollars an order that's about 150 orders a day, roughly ten an hour over a 15-hour day, which is very reasonable.",
 why:"Two divisions turn an abstract dollar figure into an orders-per-hour rate anyone can judge.",
 trick:"Dollars → orders → orders per hour. Three steps down to something human.",
 linkText:"Uses the average-ticket and hours-open assumptions as its divisors.",
 links:["ticket","hours-open","sanity-technique"]},
{id:"sanity-starbucks",cat:"sanity",pri:"useful",type:"sanity",
 q:"Your estimate says the average Starbucks sells 2,000 drinks a day. Does that pass?",
 a:"It's high. Over 15 hours that's ~133/hour, more than two a minute all day.",
 say:"2,000 a day over 15 hours is about 130 an hour, over two a minute sustained, which is too high for an average store. I'd dial it back to maybe 600 to 800.",
 why:"Per-hour and per-minute conversions are the fastest way to catch an overstated throughput assumption.",
 trick:"Convert to per minute. If a store needs more than one transaction a minute all day, you're too high.",
 linkText:"The check on the Starbucks structure card, and why the units card used 40 drinks an hour, not 130.",
 links:["units-starbucks","approach-starbucks","sanity-technique"]},
{id:"sanity-haircuts",cat:"sanity",pri:"useful",type:"sanity",
 q:"You estimate about 5.5 million haircuts a day in the US. Plausible?",
 a:"Yes. 340M × 6/year ≈ 2B/year ≈ 5.5M/day.",
 say:"That's about 2 billion a year, or roughly six per person, which is exactly the assumption I started from, so it holds.",
 why:"The best sanity check often just runs your own equation backwards and confirms you didn't lose a factor.",
 trick:"Run it backwards to per person per year. If that number is absurd, so is your answer.",
 linkText:"Closes the loop on the haircuts frequency and top-down cards.",
 links:["haircuts","approach-haircuts","mm-annualize"]},

   why:"Lactate carries a carboxyl group, and a carboxylic acid has a pKa around 3.9. Physiological pH of about 7.4 sits far above that, so the group is deprotonated and has already released its proton into solution. More lactate means more free H+, and more free H+ means a lower pH. The hydroxyl on the middle carbon has a pKa near 15, so it stays protonated and contributes nothing. Worth knowing for later: exercise physiologists now attribute the acidosis mainly to H+ released by ATP hydrolysis rather than by lactate itself, but this question is testing functional groups, and on functional groups the carboxyl is the answer."},

  {id:"q2", type:"multi", tag:"HOQ",
   stem:"A hydrogen bond is likely to form between a hydrogen with a partial positive charge and which of the following functional groups that contain an atom with a partial negative charge? Select all that apply.",
   note:"Scored with credit for correct answers and a penalty for incorrect ones. Only select what you are sure of.",
   opts:[["A","Carbonyl group"],["B","Sulfhydryl group"],["C","Methyl group"],["D","Hydroxyl group"]],
   ans:["A","D"],
   why:"A hydrogen bond needs a hydrogen carrying a partial positive charge and an acceptor atom that is both electronegative and holding a lone pair. In practice that means oxygen or nitrogen. The carbonyl oxygen and the hydroxyl oxygen both qualify. Sulfur in a sulfhydryl group has an electronegativity of 2.58 against hydrogen's 2.20, so the S-H bond is barely polar and is not treated as a hydrogen bonding group here. A methyl group is only carbon and hydrogen, so it is nonpolar."},

  {id:"q3", type:"single", tag:"HOQ",
   stem:"Trypsin is a pancreatic enzyme that cleaves the peptide bonds of polypeptide chains on the carboxyl terminus side of basic amino acids. In other words, it cleaves the peptide bond on the side of the basic amino acid closer to the C-terminus of the protein or peptide. If trypsin was applied to this polypeptide chain, what would be the resulting products? The chain is shown in its non-ionized form. Disregard the labeled boxes.",
   fig:{src:"fig/q3-peptide.png", alt:"A tetrapeptide drawn N-terminus to C-terminus: lysine, tyrosine, aspartate, lysine, with labeled boxes A, B and C."},
   opts:[["A","A single amino acid and a tripeptide"],["B","Two dipeptides"],["C","Two single amino acids and a dipeptide"],["D","No change, it would remain a tetrapeptide"]],
   ans:["A"],
   why:"Read the side chains: the chain is Lys, Tyr, Asp, Lys. Trypsin cuts on the carboxyl side of basic residues, which here means the two lysines. The first lysine is the N-terminal residue, so cutting after it releases that one amino acid and leaves the tripeptide Tyr-Asp-Lys. The second lysine is already the C-terminal residue, so there is no peptide bond after it to cut. One cut, two products. The trap is forgetting that a basic residue sitting at the C-terminus gives you nothing."},

  {id:"q4", type:"single", tag:"HOQ",
   stem:"The following image shows the ribbon model of protein gp41, which is present within the Human Immunodeficiency Virus (HIV). What types of interactions stabilize the secondary structure shown in the image?",
   fig:{src:"fig/q4-gp41.png", alt:"Ribbon model of gp41 showing several long coiled alpha helices packed together."},
   opts:[["A","peptide bonds"],["B","covalent bonds"],["C","hydrogen bonds"],["D","disulfide bonds"]],
   ans:["C"],
   why:"Those coiled ribbons are alpha helices, and an alpha helix is secondary structure. Secondary structure is held together by hydrogen bonds between the backbone carbonyl oxygen of one residue and the amide hydrogen of a residue four positions further along the chain. Side chains take no part in it. Peptide bonds are primary structure, they link residues rather than fold them. Disulfide bonds are covalent links between cysteine side chains and belong to tertiary and quaternary structure."},

  {id:"q5", type:"single", tag:"HOQ",
   stem:"The protein Noelle consists of 4 polypeptide chains: 2 alpha subunits, and 2 beta subunits. Which of the following terms best classifies Noelle?",
   opts:[["A","homotetramer"],["B","heterotetramer"],["C","homodimer"],["D","heterodimer"]],
   ans:["B"],
   why:"Four polypeptide chains makes it a tetramer, and a dimer is out regardless of the rest. Two different kinds of chain, alpha and beta, makes it hetero rather than homo, since homo would require all four chains to be identical. This is exactly the architecture of hemoglobin, two alpha and two beta, which is the example worth anchoring the term to."},

  {id:"q6", type:"single", tag:"HOQ",
   stem:"Kevin was running a protein sample using SDS-PAGE but forgot to use sodium dodecyl sulfate (SDS) to treat his polypeptides. In his sample were three types of polypeptides at physiological pH. A: a polypeptide of length 80 composed only of alanine (methyl side chain). B: a polypeptide of length 100 composed only of glutamic acid (carboxyl side chain). C: a polypeptide of length 120 composed only of lysine (amine side chain). Which polypeptide would be furthest towards the bottom after running the gel?",
   opts:[["A","A"],["B","B"],["C","C"],["D","The polypeptides would all run the same distance."]],
   ans:["B"],
   why:"SDS does two jobs: it denatures the protein and it coats every chain in uniform negative charge so that migration depends only on size. Without it, each chain moves according to its own charge, and the gel runs toward the positive electrode at the bottom. Glutamate side chains are carboxyls with a pKa near 4.2, so at pH 7.4 they are deprotonated and the chain is strongly negative, carrying it furthest down. Lysine side chains are amines with a pKa near 10.5, so they are protonated and positive, and that chain migrates the wrong way. Alanine's methyl side chain carries no charge at all. Note that B wins despite not being the longest chain, which is precisely why SDS exists."},

  {id:"q7", type:"single", tag:"HOQ",
   stem:"Consider a hypothetical protein called Quixote. You have two samples of purified Quixote. One sample is prepared normally with SDS, heat and reducing agent, and loaded in Lane 1. The other is first treated with a chemical that covalently cross-links polypeptide chains in close contact, preventing treatment from affecting the quaternary structure, then also treated with SDS, heat and reducing agent, and loaded in Lane 2. After running the gel and staining with Coomassie, you observe the following. Which of the following must be true about Quixote?",
   fig:{src:"fig/q7-gel.png", alt:"SDS-PAGE gel. Ladder marks at 100, 75, 50, 25 and 10 kDa. Lane 1 shows a single band at about 25 kDa. Lane 2 shows a single band at about 60 kDa."},
   opts:[["A","Quixote is composed of one subunit and does not have any quaternary structure."],["B","Quixote is composed of at least two identical-size subunits."],["C","Quixote is composed of at least two different-sized subunits."]],
   ans:["B"],
   why:"Read Lane 1 first. A single band at about 25 kDa after full denaturation means every chain in the sample is the same size. Now Lane 2: cross-linking locked the subunits together before SDS and heat could pull them apart, and that band sits far higher, near 60 kDa. So the native protein is more than one chain, which rules out A, and since Lane 1 showed only one size, those chains must be identical in size, which rules out C. Different-sized subunits would have shown up as two separate bands in Lane 1. The cross-linked band does not have to land at exactly twice the mass, because cross-linked proteins migrate anomalously."},

  {id:"q8", type:"single",
   stem:"A single strand of a nucleic acid is shown below. Based on the structure, which of the following must be true regarding this nucleic acid? Ignore the labels for this question.",
   fig:{src:"fig/q8-nucleic.png", alt:"Three linked nucleotides with phosphate groups, five-membered sugars carrying hydrogen at the 2 prime position, and the bases cytosine, adenine and cytosine."},
   opts:[["A","The structure depicts a single strand of DNA"],["B","The structure depicts a single strand of RNA"],["C","The structure depicts an antisense nucleic acid"]],
   ans:["A"],
   why:"Look at the sugar, not the bases. Every ring in this strand carries a hydrogen at the 2 prime position rather than a hydroxyl, which makes it deoxyribose and therefore DNA. The only free hydroxyl is the 3 prime one at the bottom end. The bases shown are cytosine, adenine and cytosine, all of which appear in both DNA and RNA, so they cannot settle it either way. Antisense describes a relationship between a strand and a coding sequence, not anything visible in a structure, so it could never be determined from one strand on its own."},

  {id:"q9", type:"single", tag:"HOQ",
   stem:"Which of the following RNA sequences would be capable of forming a stem and loop structure between the underlined sections due to intra-strand base pairing? Take the underlined sections to be the first four and the last four bases of each sequence.",
   opts:[["A","5' ACGGUAGCCGU 3'"],["B","5' ACGGUAGGGCA 3'"],["C","5' ACGGUAGUGCC 3'"],["D","5' ACGGUAGACGG 3'"]],
   ans:["A"],
   why:"A stem-loop needs the two regions to be reverse complements so they can pair antiparallel. Every option starts 5'-ACGG-3'. For that to pair, the partner must read 3'-UGCC-5', which written the normal way round is CCGU. That is exactly the last four bases of option A: A with U, C with G, G with C, G with C. Every other option mismatches at one position or more. The mechanical trick is to write the second region backwards and then check it base by base against the first."},

  {id:"q10", type:"blanks", tag:"HOQ",
   stem:"A sample of DNA consists of 34% guanines. Which of the following would you assume to be true of the DNA as a result?",
   blanks:[{label:"cytosines", choices:["16%","32%","34%","68%"], ans:"34%"},
           {label:"adenines",  choices:["16%","32%","34%","68%"], ans:"16%"}],
   why:"Chargaff's rules. In double-stranded DNA guanine pairs with cytosine, so if G is 34% then C is 34% too. Together they account for 68% of the bases, which leaves 32% for adenine and thymine combined. Adenine pairs with thymine in equal amounts, so that 32% splits evenly and each is 16%."}
  ]
}];

{id:"p1",ch:1,topic:"Science vs pseudoscience",heat:"yellow",
 q:"A website promises to “reprogram your brain” in three days and permanently eliminate anxiety. This claim is best described as:",
 o:["Applied psychology","Psychobabble, pseudoscience dressed in psychological language","Basic research","A testable hypothesis"],a:1,
 why:"Psychobabble is pseudoscience covered by a veneer of psychological language, and quick-fix “reprogram your brain” promises are the textbook's own example of it.",
 trap:"Applied psychology is real science aimed at a practical problem. The giveaway here is the untestable, too-good-to-be-true promise, not the fact that it has a practical goal."},
{id:"p2",ch:1,topic:"Critical thinking",heat:"yellow",
 q:"Which of the following best describes critical thinking as the textbook defines it?",
 o:["Disagreeing with claims that seem wrong to you","Assessing claims on well-supported reasons and evidence rather than emotion or anecdote","Treating all opinions as equally valid until proven otherwise","Deferring to the most qualified expert available"],a:1,
 why:"Critical thinking is the ability and willingness to assess claims and make objective judgments on the basis of evidence, not emotion or anecdote. It is constructive as well as skeptical.",
 trap:"Option C is the open-mindedness trap the book calls out directly: being open-minded does not make every opinion equal. Your opinion, if it ignores reality, is not equal to any other."},
{id:"p3",ch:1,topic:"Five pillars",heat:"yellow",
 q:"A psychologist studies why people behave more aggressively in a crowd than they do alone. Which pillar of psychology is this?",
 o:["Biological","Cognitive","Social and personality","Mental and physical health"],a:2,
 why:"The social and personality pillar weighs the power of situations against stable traits, and the crowd-versus-alone comparison is the book's own example of studying violence from that pillar.",
 trap:"Cognitive is tempting because aggression involves interpreting others' actions, but that would be the cognitive pillar's angle, reading a neutral act as a provocation. Here the variable being manipulated is the situation."},
{id:"p4",ch:1,topic:"Study strategies",heat:"orange",
 q:"Which study strategy has the strongest evidence behind it?",
 o:["Rereading the chapter several times in one sitting","Highlighting key passages during your first read","Testing yourself on the material and spacing study across days","Transcribing the lecture as close to word for word as possible"],a:2,
 why:"Retrieval practice and spacing beat passive review. The 3R technique is read, recite, review, and the book explicitly says forget cramming and self-test weekly.",
 trap:"Rereading does help a little, but massed rereading in one sitting is the specific pitfall. It produces fluency that feels like knowledge."},
{id:"p5",ch:1,topic:"Study strategies",heat:"orange",
 q:"Massed rereading feels highly effective to most students but performs poorly. The best explanation is that it:",
 o:["Takes more time than other strategies","Creates overconfidence, a false sense of knowing","Only helps with application questions, not facts","Interferes with taking good notes"],a:1,
 why:"The documented pitfall of rereading is overconfidence. Material becomes easy to read, and students mistake that fluency for retrieval.",
 trap:"Time is not the issue. The problem is a mismatch between how well you think you know it and how well you can produce it without the page in front of you."},
{id:"p6",ch:1,topic:"Study strategies",heat:"orange",
 q:"A student pulls a flashcard out of the deck as soon as they get it right once. According to the evidence on flashcard use, the problem is:",
 o:["Flashcards only work for application-level material","Dropping cards too soon, before the fact has been retrieved correctly several times","Handwritten cards are less effective than typed ones","Flashcards are inherently a form of massed practice"],a:1,
 why:"Two documented pitfalls of flashcards are focusing on low-level information and dropping cards too soon. The recommended fix is to keep a card in the deck until you have got it right roughly three times.",
 trap:"Flashcards are rated good for factual material, so the issue is not the format. It is retiring a card on a single lucky retrieval."},
{id:"p7",ch:1,topic:"History of psychology",heat:"green",
 q:"What made the opening of the first psychology laboratory in 1879 significant?",
 o:["It proved that psychology is a form of common sense","It marked the point at which psychology became a formal experimental science","It introduced psychoanalysis to the study of the mind","It established the five pillars of the field"],a:1,
 why:"That laboratory was the birth of psychology as a formal science, and the first whose results were published in a scholarly journal. Its method was trained introspection.",
 trap:"Psychoanalysis came later and from a different tradition. The point being tested is the shift from armchair theorizing to the laboratory, not any particular school of thought."},
{id:"p8",ch:1,topic:"History of psychology",heat:"green",
 q:"A school of early psychology asked not what happens in the mind but what a behavior is FOR, how it helps a person adapt to their environment. That approach is:",
 o:["Structuralism","Functionalism","Psychoanalysis","Phrenology"],a:1,
 why:"Functionalism, influenced by Darwin, asked about the purpose and consequences of behavior rather than breaking experience into elements.",
 trap:"Structuralism is the one that broke experience into basic elements via introspection, and it faded because trained introspectors kept contradicting each other."},
{id:"p9",ch:1,topic:"Science vs pseudoscience",heat:"yellow",
 q:"A discredited nineteenth-century practice claimed traits could be read from bumps on the skull. When someone had the “stealing bump” but was honest, practitioners said other good bumps held the impulse in check. What makes this pseudoscience rather than science?",
 o:["It relied on physical measurement rather than self-report","The data could be used to support any conclusion, so nothing could ever refute it","It was developed before the first psychology laboratory","It studied personality rather than behavior"],a:1,
 why:"An idea has to be stated so that it could be refuted by contrary evidence. When every possible outcome confirms the theory, the theory is unfalsifiable and therefore not scientific.",
 trap:"Being old is not what makes it pseudoscience. Plenty of early ideas were wrong but testable. This one was built so that it could never be wrong."},
