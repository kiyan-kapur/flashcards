hemical interactions", "heat": "orange", "q": "A water-soluble globular protein folds in the cytoplasm. Which of the four amino acids drawn would most likely have its side chain buried in the protein's interior?", "o": ["Amino acid 1", "Amino acid 2", "Amino acid 3", "Amino acid 4"], "a": 1, "why": "In water, hydrophobic side chains cluster in the core, away from water, while polar and charged side chains face out. Amino acid 2 is leucine: its R group is an isobutyl group, only carbon and hydrogen, so it is nonpolar. 1 is serine (polar -OH), 3 is lysine (charged amino group at pH 7.4), 4 is aspartate (charged carboxyl group).", "trap": "Lysine's long carbon chain looks greasy, but it ends in an amino group that is charged at pH 7.4, so it prefers the surface.", "src": "Diagram · structure", "fig": {"src": "fig/b13d-8.svg", "alt": "Four amino acids in a 2 by 2 grid. 1: side chain CH2OH (serine). 2: side chain CH2-CH(CH3)2 (leucine). 3: side chain four CH2 groups ending in NH2 (lysine). 4: side chain CH2-COOH (aspartate)."}}, {"id": "b13-d9", "ch": 5, "topic": "Chemical interactions", "heat": "red", "q": "Which two side chains could form an ionic bond with each other in the tertiary structure of a protein at pH 7.4?", "o": ["1 and 3", "2 and 4", "1 and 2", "3 and 4", "2 and 3"], "a": 0, "why": "An ionic bond needs opposite full charges. At pH 7.4, aspartate's carboxyl group (1) is -COO- and lysine's amino group (3) is -NH3+. Serine (2) is polar but uncharged and valine (4) is nonpolar.", "trap": "Serine's -OH can hydrogen bond, but it carries no full charge, so it cannot form an ionic bond.", "src": "Diagram · structure", "fig": {"src": "fig/b13d-9.svg", "alt": "Four amino acids in a 2 by 2 grid. 1: side chain CH2-COOH (aspartate). 2: side chain CH2OH (serine). 3: side chain four CH2 groups ending in NH2 (lysine). 4: side chain CH(CH3)2 (valine)."}}, {"id": "b13-d10", "ch": 5, "topic": "Protein structure", "heat": "red", "q": "Which amino acid's side chain could form a covalent bond with another side chain of the same kind, a bond that a reducing agent would break?", "o": ["Amino acid 1", "Amino acid 2", "Amino acid 3", "Amino acid 4"], "a": 1, "why": "A disulfide bond forms between two sulfhydryl (-SH) groups. Only cysteine (2) has a free -SH. Reducing agents such as beta-mercaptoethanol break S-S back into two -SH.", "trap": "Methionine (1) contains sulfur too, but it is locked in a thioether (C-S-CH3) with no hydrogen on the S, so it cannot form a disulfide.", "src": "Diagram · structure", "fig": {"src": "fig/b13d-10.svg", "alt": "Four amino acids in a 2 by 2 grid. 1: side chain CH2-CH2-S-CH3 (methionine). 2: side chain CH2-SH (cysteine). 3: side chain CH2OH (serine). 4: side chain CH2 attached to a benzene ring carrying OH (tyrosine)."}}, {"id": "b13-d11", "ch": 5, "topic": "Monosaccharides", "heat": "orange", "q": "Which two of the sugars drawn are hexoses (six carbons)?", "o": ["1 and 3", "1 and 2", "2 and 3", "1 only", "3 and 4"], "a": 0, "why": "Count carbons, not ring members. 1 is a six-membered ring (five C plus O) with a CH2OH outside: 6 carbons. 2 is a five-membered ring (four C plus O) with one CH2OH: 5 carbons, a pentose. 3 is a five-membered ring whose carbon next to the ring O carries both an OH and a CH2OH, with another CH2OH on the other side: 4 ring carbons plus 2 outside = 6 carbons (fructose). 4 is a three-carbon open chain (glyceraldehyde).", "trap": "Sugar 3 has a five-membered ring, so it looks like a pentose. The two CH2OH groups outside the ring bring it to six carbons.", "src": "Diagram · structure", "fig": {"src": "fig/b13d-11.svg", "alt": "Four sugars in a 2 by 2 grid. 1: six-membered ring of five carbons and one oxygen, one CH2OH outside the ring, four OH groups (glucose). 2: five-membered ring of four carbons and one oxygen, one CH2OH outside, three OH groups (ribose). 3: five-membered ring of four carbons and one oxygen; the carbon beside the ring O carries an OH and a CH2OH, the other carbon beside the ring O carries a CH2OH (fructose). 4: open chain of three carbons: CH2OH, CHOH, CHO (glyceraldehyde)."}}, {"id": "b13-d12", "ch": 5, "topic": "Ring sugars", "heat": "red", "q": "The ring form of a monosaccharide is shown. How is its linear form classified?", "o": ["Ketohexose", "Aldohexose", "Aldopentose", "Ketopentose"], "a": 0, "why": "Find the anomeric carbon: the ring carbon bonded to the ring oxygen that also carries an -OH. Here it also carries a -CH2OH, so it is bonded to two other carbons. In the linear form that carbon is a ketone carbonyl, so this is a ketose. Count carbons: five in the ring plus the CH2OH = six. Ketohexose (this is fructose in its six-membered pyranose form).", "trap": "A six-membered ring usually means glucose and an aldohexose, but here the anomeric carbon carries a CH2OH instead of an H. That makes it a ketose.", "src": "Redacted Q15 · fill-in D (diagram)", "fig": {"src": "fig/b13d-12.svg", "alt": "A six-membered ring of five carbons and one oxygen. The carbon to one side of the ring oxygen carries both an OH and a CH2OH. The carbon on the other side of the ring oxygen is a plain CH2. The remaining three ring carbons each carry one OH."}}, {"id": "b13-d13", "ch": 5, "topic": "Linkages", "heat": "red", "q": "Cellulose is built from glucose units joined by beta(1 to 4) glycosidic linkages. Which disaccharide would partial hydrolysis of cellulose release?", "o": ["X, because the bond from its C1 points down, the beta position", "Either one, because both are two glucose units joined 1 to 4", "Neither, because hydrolysis of cellulose releases only single glucose units", "Y, because the bond from its C1 points up, the beta position"], "a": 3, "why": "In a standard Haworth projection of D-glucose the CH2OH on C5 points up. If the C1 bond (the OH, or here the bridging O) points down, opposite the CH2OH, the linkage is alpha, as in starch. If it points up, on the same side as the CH2OH, it is beta, as in cellulose. Y's bridge points up, so Y is the beta(1 to 4) disaccharide (cellobiose). X is alpha(1 to 4) (maltose). Partial hydrolysis leaves some disaccharides, so option D is out.", "trap": "Down is alpha, up is beta (relative to the CH2OH). Option A gets the picture right and the label wrong.", "src": "Diagram · Haworth", "fig": {"src": "fig/b13d-13.svg", "alt": "Two Haworth projections side by side, each a glucose ring with the ring O at the back right, CH2OH pointing up from C5, and OH groups at C2 (down), C3 (up) and C4 (down). In disaccharide X the bond from C1 to the bridging oxygen points DOWN, and that O connects to C4 of a second glucose. In disaccharide Y the bond from C1 to the bridging oxygen points UP, and that O connects to C4 of a second glucose."}}, {"id": "b13-d14", "ch": 5, "topic": "DNA vs RNA", "heat": "red", "q": "A short nucleic acid strand is shown. Ignore the labels X and Y. Based on the structure, which must be true?", "o": ["It is a strand of DNA, because it has a sugar-phosphate backbone", "It is double-stranded, because it contains two bases", "It is a strand of RNA, because its sugars carry a 2' OH and one base is uracil", "It is a strand of DNA, because it contains adenine"], "a": 2, "why": "Two features say RNA. Each sugar has an -OH on its 2' carbon (the ring carbon next to the one carrying the base); DNA's deoxyribose has only H there. And the first base is a single-ring pyrimidine with two C=O groups and no methyl: uracil, which is found in RNA. A sugar-phosphate backbone and adenine appear in both DNA and RNA.", "trap": "Adenine and the phosphodiester backbone are shared by DNA and RNA, so they cannot tell them apart. Look at the 2' carbon and for uracil versus thymine.", "src": "Diagram · structure", "fig": {"src": "fig/b13d-14.svg", "alt": "Two nucleotides joined by a phosphodiester bond. At end X a phosphate is attached to the 5' CH2 of the first sugar. The first sugar is a five-membered ring with an OH on its 2' carbon and carries uracil (a single ring with two C=O and an N-H, no methyl). Its 3' carbon links through O-P(=O)(OH)-O to the 5' CH2 of the second sugar. The second sugar also has a 2' OH and carries adenine (a double ring with an NH2). End Y is the free 3' OH on the second sugar."}}, {"id": "b13-d15", "ch": 5, "topic": "Nucleic acids", "heat": "red", "q": "Look at the ends labeled X and Y on the same strand. Which statement is correct?", "o": ["X is the 5' end, and the sequence read 5' to 3' is AU", "X is the 5' end, and the sequence read 5' to 3' is UA", "X is the 3' end, and the sequence read 5' to 3' is AU", "X is the 3' end, and the sequence read 5' to 3' is UA"], "a": 1, "why": "X is a phosphate attached to the CH2 that sticks out of the first sugar ring: that CH2 is the 5' carbon, so X is the 5' end. Y is a free -OH on a ring carbon that is not bonded to the base and not the 2' position: the 3' carbon, so Y is the 3' end. Reading from X to Y, the bases are uracil then adenine: 5'-UA-3'.", "trap": "Sequences are always written 5' to 3'. Reading from Y back to X gives AU, but that is 3' to 5'.", "src": "Diagram · structure", "fig": {"src": "fig/b13d-15.svg", "alt": "The same dinucleotide. X labels the phosphorus of a phosphate attached to the 5' CH2 of the uracil-bearing sugar. Y labels the free OH on the 3' carbon of the adenine-bearing sugar. The two sugars are joined by a phosphodiester from the 3' carbon of the uracil nucleotide to the 5' carbon of the adenine nucleotide."}}, {"id": "b13-d16", "ch": 5, "topic": "Nucleotides", "heat": "orange", "q": "Which base is a pyrimidine found in DNA but not in RNA?", "o": ["Base 1", "Base 2", "Base 3", "Base 4", "Base 5"], "a": 3, "why": "Pyrimidines have one ring (cytosine, thymine, uracil). Purines have two fused rings (adenine, guanine), so 1 and 2 are out. Of the single-ring bases, 3 is cytosine (an NH2, found in both DNA and RNA), 4 is thymine (two C=O and a methyl group, DNA only) and 5 is uracil (two C=O, no methyl, RNA only).", "trap": "Uracil and thymine look almost identical. The CH3 on thymine is the giveaway.", "src": "Diagram · structure", "fig": {"src": "fig/b13d-16.svg", "alt": "Five nitrogenous bases. 1: double ring with NH2 (adenine). 2: double ring with C=O and NH2 (guanine). 3: single ring with NH2 and one C=O (cytosine). 4: single ring with two C=O and a CH3 (thymine). 5: single ring with two C=O and no CH3 (uracil)."}}, {"id": "b13-d17", "ch": 5, "topic": "Lipids", "heat": "red", "q": "Which of these molecules would spontaneously form a bilayer when mixed with water?", "o": ["Molecule 1", "Molecule 2", "Molecule 3", "Molecule 4"], "a": 1, "why": "A bilayer needs an amphipathic molecule with a polar head and two hydrophobic tails, giving a roughly cylindrical shape that packs into sheets. Molecule 2 is a phospholipid: glycerol with two fatty acid tails and a charged phosphate-choline head. Molecule 1 is a triglyceride with three tails and no polar head, so it pools as oil. Molecule 3 is cholesterol, which sits inside membranes but cannot form one alone. Molecule 4 is a single fatty acid, which forms micelles, not bilayers.", "trap": "The fatty acid has a polar head and a tail, but with only one tail it is cone-shaped and forms micelles.", "src": "Diagram · structure", "fig": {"src": "fig/b13d-17.svg", "alt": "Four lipids. 1: glycerol esterified to three fatty acid chains (a triglyceride). 2: glycerol with two fatty acid chains and a polar head group: a phosphate linked to choline, whose nitrogen carries a positive charge (a phospholipid). 3: four fused rings with one OH and a hydrocarbon tail (cholesterol). 4: a single 16-carbon saturated chain ending in COOH (palmitic acid)."}}, {"id": "b13-d18", "ch": 5, "topic": "Fatty acids", "heat": "red", "q": "Which fatty acid would have the lowest melting point?", "o": ["Fatty acid 1", "Fatty acid 2", "Fatty acid 3", "Fatty acid 4"], "a": 3, "why": "Melting point rises with stronger London dispersion forces between tails, which come from more contact. Two levers lower it: a shorter tail (less surface) and a cis double bond (the kink stops tight packing). 1 is long and saturated (highest), 2 is long but kinked, 3 is short but straight, and 4 is both short and kinked, so it melts lowest.", "trap": "Fatty acid 2 has a kink, but with 18 carbons it still packs more contact than a short, kinked 12-carbon chain.", "src": "Diagram · structure", "fig": {"src": "fig/b13d-18.svg", "alt": "Four fatty acids. 1: 18 carbons, all single bonds (straight). 2: 18 carbons with one cis double bond in the middle (kinked). 3: 12 carbons, all single bonds (straight). 4: 12 carbons with one cis double bond (kinked)."}}, {"id": "b13-d19", "ch": 5, "topic": "SDS-PAGE", "heat": "red", "q": "Hormone H is made as pro-H, a single 15 kDa chain. An activating enzyme hydrolyses two peptide bonds and removes a 4 kDa middle segment. The two end pieces (a 5 kDa N-terminal piece and a 6 kDa C-terminal piece) stay attached by a single disulfide bond, the only disulfide in any form of H. The released 4 kDa segment is not degraded and does not bind mature H. Samples are run on SDS-PAGE with heat, next to a size ladder (MW). Purified mature H is prepared WITH reducing agent. Which lane shows the band pattern you would see?", "o": ["Lane 1", "Lane 2", "Lane 3", "Lane 4"], "a": 2, "why": "Mature H is the 5 kDa and 6 kDa end pieces held together only by one disulfide bond. Reducing agent breaks that bond, and SDS plus heat unfold everything, so the two pieces run separately: bands at 6 and 5 kDa. That is lane 3. The 4 kDa segment is not in a purified mature H sample.", "trap": "Lane 1 (one band at 11) is the same sample run WITHOUT reducing agent. The disulfide is the only thing holding the pieces together.", "src": "Redacted Q11 · fill-in C (gel)", "fig": {"src": "fig/b13d-19.svg", "alt": "SDS-PAGE gel with a ladder (MW) at 25, 20, 15, 10 and 5 kDa. Lane 1: one band at 11 kDa. Lane 2: one band at 15 kDa. Lane 3: two bands, at 6 and 5 kDa. Lane 4: two bands, at 11 and 4 kDa."}}, {"id": "b13-d20", "ch": 5, "topic": "SDS-PAGE", "heat": "red", "q": "Hormone H is made as pro-H, a single 15 kDa chain. An activating enzyme hydrolyses two peptide bonds and removes a 4 kDa middle segment. The two end pieces (a 5 kDa N-terminal piece and a 6 kDa C-terminal piece) stay attached by a single disulfide bond, the only disulfide in any form of H. The released 4 kDa segment is not degraded and does not bind mature H. Samples are run on SDS-PAGE with heat, next to a size ladder (MW). Halfway through activation, half of the pro-H molecules have been fully processed and half are untouched. This mixture is prepared WITHOUT reducing agent. Which lane shows the band pattern?", "o": ["Lane 1", "Lane 2", "Lane 3", "Lane 4"], "a": 3, "why": "Three species are present: untouched pro-H (15 kDa), mature H whose two pieces stay joined by the intact disulfide (11 kDa), and the released middle segment (4 kDa). Without reducing agent: 15, 11 and 4. That is lane 4.", "trap": "Lane 1 (15, 6, 5, 4) is the same mixture WITH reducing agent, which splits the 11 kDa form into 6 and 5.", "src": "Redacted Q12 · fill-in C (gel)", "fig": {"src": "fig/b13d-20.svg", "alt": "SDS-PAGE gel with a ladder (MW) at 25, 20, 15, 10 and 5 kDa. Lane 1: bands at 15, 6, 5 and 4 kDa. Lane 2: bands at 11 and 4 kDa. Lane 3: bands at 6, 5 and 4 kDa. Lane 4: bands at 15, 11 and 4 kDa."}}, {"id": "b13-d21", "ch": 5, "topic": "Quaternary structure", "heat": "red", "q": "Protein Rho was purified. Lane 1: Rho treated with SDS, heat and reducing agent. Lane 2: Rho first treated with a chemical that covalently cross-links polypeptide chains in close contact, then with SDS, heat and reducing agent. Based on the gel, which is true of Rho?", "o": ["It is a heterotetramer of two 30 kDa and two 20 kDa subunits", "It is a heterodimer of one 30 kDa and one 20 kDa subunit", "It is a homotetramer of four 25 kDa subunits", "It has no quaternary structure, and the 30 and 20 kDa bands are fragments of one chain"], "a": 0, "why": "Lane 1 shows the separated subunits: two different sizes, 30 and 20 kDa. Lane 2 shows the whole cross-linked complex at 100 kDa. The complex must be built from those two subunit sizes, with at least one of each: 30a + 20b = 100 only works as two of each. So Rho is a heterotetramer, alpha2 beta2.", "trap": "A 30 plus 20 heterodimer would cross-link to 50 kDa, not 100.", "src": "Diagram · gel", "fig": {"src": "fig/b13d-21.svg", "alt": "SDS-PAGE gel with a ladder (MW) at 150, 100, 75, 50, 37, 25, 20 and 15 kDa. Lane 1: two bands, at 30 and 20 kDa. Lane 2: one band at 100 kDa."}}, {"id": "b13-d22", "ch": 5, "topic": "SDS-PAGE", "heat": "red", "q": "Protein Z was run on SDS-PAGE. Lane 1: SDS and heat, NO reducing agent. Lane 2: SDS, heat AND reducing agent. Which must be true of Z?", "o": ["It is two polypeptides of the same size held together only by hydrophobic interactions", "It is a single 80 kDa chain with an internal disulfide bond", "It is a single 40 kDa chain that runs at 80 kDa when no reducing agent is present", "It is two polypeptides of the same size (about 40 kDa) linked by at least one disulfide bond"], "a": 3, "why": "SDS and heat break every non-covalent interaction. If Z were held together only by hydrophobic interactions, lane 1 would already show 40. It stays at 80 until reducing agent is added, so the chains are joined covalently by a disulfide. Reduction gives one band at 40, so both chains are about 40 kDa. Same size, though the gel cannot prove they are identical in sequence.", "trap": "An internal disulfide inside one chain would not change its length on SDS-PAGE, so a single 80 kDa chain would still run at about 80 after reduction.", "src": "Diagram · gel", "fig": {"src": "fig/b13d-22.svg", "alt": "SDS-PAGE gel with a ladder (MW) at 150, 100, 75, 50, 37 and 25 kDa. Lane 1 (no reducing agent): one band at 80 kDa. Lane 2 (with reducing agent): one band at 40 kDa."}}, {"id": "b13-d23", "ch": 5, "topic": "Protein structure and gels", "heat": "red", "q": "Three polypeptides, each 60 amino acids long, are loaded in the well of a gel run WITHOUT SDS at pH 7.4: poly-aspartate (all aspartate), poly-alanine (all alanine) and poly-arginine (all arginine). Look carefully at where the electrodes are. Which polypeptide travels farthest toward the bottom of this gel?", "o": ["Poly-aspartate", "Poly-alanine", "Poly-arginine", "All three travel the same distance, because they are the same length"], "a": 2, "why": "Without SDS, a polypeptide moves according to its own charge. At pH 7.4, aspartate side chains are negative, arginine side chains are positive and alanine is neutral. In this gel the NEGATIVE electrode is at the bottom, so the positively charged poly-arginine is pulled down the gel. Poly-aspartate moves up toward the positive electrode, and poly-alanine barely moves.", "trap": "In a normal SDS-PAGE setup the positive electrode is at the bottom and negative molecules run down. Here the electrodes are flipped, and there is no SDS to give every chain the same negative charge.", "src": "Diagram · gel", "fig": {"src": "fig/b13d-23.svg", "alt": "A vertical gel with the sample well near the top. The POSITIVE electrode (+) is at the TOP of the gel and the NEGATIVE electrode (-) is at the BOTTOM. An arrow points toward the bottom."}}, {"id": "b13-d24", "ch": 5, "topic": "Reaction coordinate diagrams", "heat": "red", "q": "Which reaction is spontaneous but would occur at a useful rate in a cell ONLY if an enzyme were present?", "o": ["Diagram 1", "Diagram 2", "Diagram 3", "Diagram 4"], "a": 0, "why": "Spontaneous means products sit lower than reactants (negative delta G): diagrams 1 and 3. Diagram 3's barrier is only 10 (60 to 70), so it already runs fast. Diagram 1's barrier is 70 (40 to 110), so it is favorable but slow until an enzyme lowers the activation energy.", "trap": "Diagram 2 has a big barrier too, but its products are higher than its reactants. An enzyme cannot make an endergonic reaction spontaneous.", "src": "Redacted Q25 · fill-in D (diagram)", "fig": {"src": "fig/b13d-24.svg", "alt": "Four reaction coordinate diagrams on the same free-energy scale from 0 to 120. Diagram 1: reactants at 40, peak at 110, products at 10. Diagram 2: reactants at 20, peak at 100, products at 70. Diagram 3: reactants at 60, peak at 70, products at 20. Diagram 4: reactants at 30, peak at 75, products at 60."}}, {"id": "b13-d25", "ch": 5, "topic": "Reaction coordinate diagrams", "heat": "red", "q": "Which reaction has the largest activation energy for the forward reaction?", "o": ["Diagram 1", "Diagram 2", "Diagram 3", "Diagram 4"], "a": 1, "why": "Activation energy is peak minus REACTANTS, not the height of the peak. Diagram 1: 110 - 40 = 70. Diagram 2: 100 - 20 = 80. Diagram 3: 70 - 60 = 10. Diagram 4: 75 - 30 = 45. Diagram 2 is largest.", "trap": "Diagram 1 has the highest peak, but its reactants also start higher, so its climb is smaller.", "src": "Redacted Q25 · fill-in E (diagram)", "fig": {"src": "fig/b13d-25.svg", "alt": "Four reaction coordinate diagrams on the same free-energy scale from 0 to 120. Diagram 1: reactants at 40, peak at 110, products at 10. Diagram 2: reactants at 20, peak at 100, products at 70. Diagram 3: reactants at 60, peak at 70, products at 20. Diagram 4: reactants at 30, peak at 75, products at 60."}}, {"id": "b13-d26", "ch": 5, "topic": "Energy coupling", "heat": "red", "q": "Which reactions could occur in a cell only if coupled to a favorable reaction such as ATP hydrolysis?", "o": ["Diagrams 2 and 4", "Diagrams 1 and 3", "Diagrams 1 and 2", "Diagram 2 only"], "a": 0, "why": "Coupling is needed when the reaction is endergonic: products higher than reactants. Diagram 2 goes from 20 to 70 and diagram 4 goes from 30 to 60. Both have positive delta G. Diagram 4's barrier (45) is smaller than diagram 2's (80), but a smaller barrier only makes a reaction faster, never favorable.", "trap": "Picking diagram 2 alone confuses a high barrier with an unfavorable reaction. A barrier is a rate problem, which an enzyme fixes. A positive delta G is an energy problem, which only coupling fixes.", "src": "Redacted Q25 · fill-in F (diagram)", "fig": {"src": "fig/b13d-26.svg", "alt": "Four reaction coordinate diagrams on the same free-energy scale from 0 to 120. Diagram 1: reactants at 40, peak at 110, products at 10. Diagram 2: reactants at 20, peak at 100, products at 70. Diagram 3: reactants at 60, peak at 70, products at 20. Diagram 4: reactants at 30, peak at 75, products at 60."}}, {"id": "b13-d27", "ch": 5, "topic": "Enzyme mechanism", "heat": "red", "q": "Which arrow represents the change in free energy (delta G) of the reaction, and how does adding the enzyme affect it?", "o": ["Arrow c; the enzyme makes it more negative", "Arrow c; the enzyme does not change it", "Arrow a; the enzyme lowers it", "Arrow b; the enzyme lowers it"], "a": 1, "why": "Delta G is the difference between products and reactants: arrow c. Both curves start and end at the same levels, so the enzyme leaves delta G unchanged. What it changes is the height of the barrier, from arrow a to arrow b.", "trap": "Arrows a and b are activation energies. An enzyme lowers activation energy, never delta G, so it cannot change where the equilibrium lies.", "src": "Diagram · energy", "fig": {"src": "fig/b13d-27.svg", "alt": "One reaction coordinate diagram with two curves, no numbers on the axis. Reactants sit higher than products (exergonic). The solid curve (no enzyme) has a tall peak; the dashed curve (with enzyme) has a lower peak. Arrow a runs from the reactant level up to the solid peak. Arrow b runs from the reactant level up to the dashed peak. Arrow c runs from the reactant level down to the product level. Arrow d runs from the product level up to the solid peak."}}, {"id": "b13-d28", "ch": 5, "topic": "Enzyme mechanism", "heat": "orange", "q": "Which arrow shows the activation energy of the forward reaction when the enzyme is present?", "o": ["Arrow b", "Arrow a", "Arrow c", "Arrow d"], "a": 0, "why": "Activation energy runs from the reactants up to the top of the barrier on the path being taken. With the enzyme that is the dashed curve's peak, so it is arrow b. Arrow a is the uncatalyzed activation energy, c is delta G, and d is the activation energy of the uncatalyzed REVERSE reaction.", "trap": "Arrow d also climbs to a peak, but it starts from the products, so it belongs to the reverse reaction.", "src": "Diagram · energy", "fig": {"src": "fig/b13d-28.svg", "alt": "One reaction coordinate diagram with two curves, no numbers on the axis. Reactants sit higher than products (exergonic). The solid curve (no enzyme) has a tall peak; the dashed curve (with enzyme) has a lower peak. Arrow a runs from the reactant level up to the solid peak. Arrow b runs from the reactant level up to the dashed peak. Arrow c runs from the reactant level down to the product level. Arrow d runs from the product level up to the solid peak."}}, {"id": "b13-d29", "ch": 5, "topic": "Enzyme regulation", "heat": "red", "q": "An enzyme's rate was measured at increasing substrate concentrations with no inhibitor, with inhibitor P, or with inhibitor Q. Which inhibitor most likely competes with the substrate for the active site?", "o": ["Inhibitor P", "Inhibitor Q", "Both P and Q", "Neither, because both lower the rate"], "a": 0, "why": "A competitive inhibitor fights the substrate for the same active site. Flood the system with substrate and the substrate wins, so the rate climbs back toward the uninhibited maximum. That is P's curve. Q caps the rate at about 50 no matter how much substrate is added, which is the signature of an inhibitor binding elsewhere (allosteric).", "trap": "Both curves are below the uninhibited one at low substrate. The tell is what happens at HIGH substrate.", "src": "Diagram · graph", "fig": {"src": "fig/b13d-29.svg", "alt": "Graph of reaction rate (y, 0 to 110) against substrate concentration (x, 0 to 60) with a dashed line at rate 100. No inhibitor (solid): rises steeply and levels off near 100 (about 97 at x = 60). Inhibitor P (dashed): rises more slowly but keeps climbing toward 100 (about 88 at x = 60). Inhibitor Q (dotted): rises steeply but levels off at about 50 and never goes higher."}}, {"id": "b13-d30", "ch": 5, "topic": "Enzyme regulation", "heat": "orange", "q": "Using the same graph: inhibitor Q was found bound to the enzyme at the same time as the substrate. Which statement best fits the curve for Q?", "o": ["Q raises the enzyme's maximum rate, consistent with an allosteric activator", "Q is competitive, because the rate still rises as substrate increases", "Q must be denaturing the substrate, because the rate is halved", "Adding more substrate cannot restore the uninhibited maximum rate, consistent with Q binding an allosteric site"], "a": 3, "why": "Q and the substrate bind at the same time, so they are not competing for one site. Q binds elsewhere and changes the enzyme's shape so that fewer active sites work. Extra substrate cannot outcompete something that is not in the active site, so the curve plateaus at about half the uninhibited maximum. That is allosteric inhibition, as in the pumpkinase and frostenin problem.", "trap": "Every inhibited curve still rises with substrate at first. Competitive inhibition specifically means high substrate recovers the full maximum.", "src": "Diagram · graph", "fig": {"src": "fig/b13d-30.svg", "alt": "Graph of reaction rate (y, 0 to 110) against substrate concentration (x, 0 to 60) with a dashed line at rate 100. No inhibitor (solid): rises steeply and levels off near 100 (about 97 at x = 60). Inhibitor P (dashed): rises more slowly but keeps climbing toward 100 (about 88 at x = 60). Inhibitor Q (dotted): rises steeply but levels off at about 50 and never goes higher."}}, {"id": "b13-d31", "ch": 5, "topic": "Enzymes and structure", "heat": "orange", "q": "The graph shows reaction rate versus temperature for a human enzyme and for the same kind of enzyme from a hot-spring bacterium. Which best explains why the human enzyme's rate is zero at 55 °C?", "o": ["Heat hydrolyses its peptide bonds, breaking it into free amino acids", "At 55 °C molecules move too slowly to reach the active site", "Heat breaks the hydrogen bonds and other weak interactions that hold its shape, so the active site no longer fits the substrate", "The enzyme is used up by the reaction at high temperature"], "a": 2, "why": "Rate rises with temperature at first because molecules collide more often. Past the optimum (about 40 °C for the human enzyme), the extra energy breaks the weak non-covalent interactions holding the secondary and tertiary structure. The protein denatures and the active site loses its shape. The bacterial enzyme's structure is more heat-stable, so it holds until about 80 °C. The peptide bonds, the primary structure, survive denaturation.", "trap": "Denaturation unfolds a protein but does not cut its backbone. Breaking peptide bonds takes hydrolysis.", "src": "Diagram · graph", "fig": {"src": "fig/b13d-31.svg", "alt": "Graph of reaction rate (y) against temperature from 0 to 100 °C. Human enzyme (solid): rises to a peak of about 95 near 40 °C, then drops steeply to zero by about 52 °C. Hot-spring bacterium enzyme (dashed): zero below about 35 °C, rises to a peak of about 95 near 78 °C, then drops to zero by about 90 °C."}}, {"id": "b13-d32", "ch": 5, "topic": "Enzymes and structure", "heat": "orange", "q": "Pepsin passes from the stomach (pH 2) into the small intestine (pH 8). Based on the graph, what happens to its activity, and why?", "o": ["It rises, because there are fewer H+ ions to block the active site", "It falls to near zero, because the change in H+ concentration changes the charges on its R groups and disrupts the interactions that hold its shape", "It stays the same, because pH affects only the substrate", "It falls to near zero, because pH 8 hydrolyses its peptide bonds"], "a": 1, "why": "The graph shows pepsin's activity near zero at pH 8. pH changes how many H+ ions are around, which changes whether amino and carboxyl R groups are protonated. That shifts their charges and breaks ionic bonds and hydrogen bonds that hold the enzyme's shape and active site. Trypsin, adapted to pH 8, works there instead.", "trap": "A pH change alters charges, not the covalent backbone. No peptide bonds are broken.", "src": "Diagram · graph", "fig": {"src": "fig/b13d-32.svg", "alt": "Graph of reaction rate (y) against pH from 0 to 12. Pepsin (solid): narrow peak of about 95 at pH 2, near zero above pH 5. Trypsin (dashed): narrow peak of about 95 at pH 8, near zero below pH 5 and above pH 11."}}, {"id": "b13-d33", "ch": 5, "topic": "pH and equilibrium", "heat": "red", "q": "In the blood, CO2 + H2O <-> H2CO3 is at equilibrium. At time t, extra H2CO3 is added. Which graph shows how the concentration of CO2 responds?", "o": ["Graph A", "Graph B", "Graph C", "Graph D"], "a": 1, "why": "Adding a product pushes the equilibrium to the left (Le Chatelier). Some of the added H2CO3 converts back to CO2 + H2O, so CO2 rises. The rise is gradual, as the reaction runs, and settles at a new, higher level: graph B. Graph A's instant jump is what you would see if CO2 itself were added.", "trap": "Graph C shifts the wrong way. Adding a product means making more reactant, not less.", "src": "Diagram · graph", "fig": {"src": "fig/b13d-33.svg", "alt": "Four small graphs of CO2 concentration against time, each with a dashed line at time t. Graph A: flat, then an instant vertical jump at t to a higher flat level. Graph B: flat, then a smooth gradual rise after t to a new higher flat level. Graph C: flat, then a gradual fall after t to a lower flat level. Graph D: flat throughout."}}, {"id": "b13-d34", "ch": 5, "topic": "Osmosis and tonicity", "heat": "red", "q": "Red blood cells are placed in three beakers. In which beaker will the cells lose water and shrink?", "o": ["Beaker A", "Beaker B", "Beaker C", "None, because water moves equally in both directions in every beaker"], "a": 2, "why": "Water moves by osmosis toward the side with more solute, because NaCl cannot cross. Beaker C (600 mOsm) is hypertonic to the cells (300 mOsm inside), so water leaves the cells and they shrink. Beaker B is isotonic (no net change). In beaker A (hypotonic) water rushes in and the cells swell and may burst.", "trap": "Water does not move toward the side with less solute. It moves toward more solute, which is the side with less free water.", "src": "Diagram · membrane", "fig": {"src": "fig/b13d-34.svg", "alt": "Three beakers, each holding one red blood cell. Beaker A: 150 mOsm NaCl. Beaker B: 300 mOsm NaCl. Beaker C: 600 mOsm NaCl. Caption: each cell starts at about 300 mOsm inside, and the membrane is not permeable to NaCl."}}, {"id": "b13-d35", "ch": 5, "topic": "Osmosis and tonicity", "heat": "orange", "q": "In the U-tube, side 1 holds 0.2 M sucrose and side 2 holds 0.8 M sucrose, separated by a membrane that lets water through but not sucrose. The levels start equal. What happens?", "o": ["The level on side 2 rises, because water moves toward the higher solute concentration", "The level on side 1 rises, because water moves toward the lower solute concentration", "Sucrose moves from side 2 to side 1 until both are 0.5 M, and the levels stay equal", "Nothing changes, because the membrane blocks sucrose"], "a": 0, "why": "Sucrose cannot cross, so only water moves. It moves by osmosis from side 1 (more free water, less solute) to side 2 (less free water, more solute), so side 2's level rises.", "trap": "Option C describes what would happen if the membrane let sucrose through. This one does not.", "src": "Diagram · membrane", "fig": {"src": "fig/b13d-35.svg", "alt": "A U-shaped tube divided at the bottom by a membrane that passes water but not sucrose. Left arm (side 1): 0.2 M sucrose. Right arm (side 2): 0.8 M sucrose. Liquid levels start equal."}}, {"id": "b13-d36", "ch": 5, "topic": "Energy coupling", "heat": "red", "q": "In a plant cell, an H+/sucrose symporter moves one H+ and one sucrose molecule into the cell together. Neither moves without the other. The gradients are shown. Which statement is true?", "o": ["Both H+ transport and sucrose transport are exergonic", "Both H+ transport and sucrose transport are endergonic", "H+ transport is endergonic and sucrose transport is exergonic", "H+ transport is exergonic and sucrose transport is endergonic"], "a": 3, "why": "Read each gradient separately. H+ is concentrated outside and moves in, down its gradient: exergonic, it releases energy. Sucrose is concentrated inside and also moves in, so it goes up its gradient: endergonic. The symporter couples them, using the energy released by H+ flowing in to pay for pulling sucrose in. This is the same logic as the sodium-glucose cotransporter.", "trap": "Both molecules move in the same direction, but direction is not the point. What matters is each one's own gradient.", "src": "Diagram · membrane", "fig": {"src": "fig/b13d-36.svg", "alt": "A membrane with a symporter protein. Outside the cell: many H+ ions and few sucrose (S) molecules. Inside the cell: few H+ ions and many sucrose molecules. Two arrows through the symporter protein (labeled beside it) both point inward, labeled H+ and S, with the note '1 H+ and 1 S enter together'."}}, {"id": "b13-d37", "ch": 5, "topic": "Membrane transport", "heat": "orange", "q": "Three transport processes, 1 to 3, are shown across one membrane. Which correctly classifies them?", "o": ["1 facilitated diffusion, 2 active transport, 3 simple diffusion", "1 simple diffusion, 2 facilitated diffusion, 3 active transport", "1 active transport, 2 facilitated diffusion, 3 simple diffusion", "1 facilitated diffusion, 2 simple diffusion, 3 active transport"], "a": 0, "why": "1: Na+ moves from high to low concentration through a channel protein. It goes down its gradient but needs the protein because ions cannot cross the hydrophobic core: facilitated diffusion. 2: Ca2+ moves from low (inside) to high (outside), against its gradient, powered by ATP hydrolysis: active transport. 3: O2 is small and nonpolar, crossing the bilayer directly down its gradient: simple diffusion.", "trap": "Needing a protein does not make transport active. Active means moving against a gradient with an energy input.", "src": "Diagram · membrane", "fig": {"src": "fig/b13d-37.svg", "alt": "A membrane with three processes. 1: a channel protein; Na+ is concentrated outside and an arrow shows Na+ moving inward through the channel. 2: a pump protein with ATP to ADP + Pi written directly beneath it; Ca2+ is concentrated outside and an arrow shows Ca2+ moving from inside to outside. 3: no protein; O2 is concentrated outside and an arrow shows O2 crossing the bilayer directly inward."}}, {"id": "b13-d38", "ch": 5, "topic": "Protein structure", "heat": "red", "q": "Panels I to IV show the four levels of structure of one protein. A sample is boiled with SDS and a reducing agent. Which levels survive?", "o": ["I only", "I and II", "I, II and III", "None of them"], "a": 0, "why": "SDS plus heat disrupts all non-covalent interactions: hydrogen bonds (which hold the helix and sheet in II), hydrophobic and ionic interactions (III and IV). Reducing agent breaks the disulfide bonds (the S-S in III). Only the peptide bonds of the primary sequence (I) survive.", "trap": "Secondary structure feels basic, but it is held by hydrogen bonds between backbone atoms, and SDS plus heat breaks those too.", "src": "Diagram · structure levels", "fig": {"src": "fig/b13d-38.svg", "alt": "Four panels. I: an amino acid sequence written N-Met-Lys-Cys-Ala-Leu-Glu-Gly-Cys-Val-Ser-...-C. II: a coiled alpha helix and three arrows of a beta sheet. III: a single chain folded into a 3D shape with an S-S bond. IV: four folded chains packed together."}}, {"id": "b13-d39", "ch": 5, "topic": "Chemical interactions", "heat": "red", "q": "Which numbered interaction would be broken by a reducing agent such as beta-mercaptoethanol?", "o": ["Interaction 1", "Interaction 2", "Interaction 3", "Interaction 4"], "a": 1, "why": "Reducing agents break disulfide bonds, the covalent S-S links between two cysteines. That is interaction 2. 1 is ionic, 3 is hydrophobic and 4 is a hydrogen bond; none of them is a covalent bond a reducing agent targets.", "trap": "Disulfides are the only covalent bonds holding tertiary and quaternary structure. Everything else is non-covalent.", "src": "Diagram · interactions", "fig": {"src": "fig/b13d-39.svg", "alt": "Two backbone segments (thick horizontal lines) with four side-chain interactions between them. 1: CH2-COO- from the top chain facing +H3N-(CH2)4 from the bottom chain (aspartate and lysine, ionic). 2: CH2-S-S-CH2 joining the chains (disulfide). 3: CH(CH3)2 facing CH(CH3)2 (two valines, hydrophobic). 4: CH2-O-H from the top chain, dotted to the C=O of a CH2-C(=O)-NH2 on the bottom chain (serine and asparagine, hydrogen bond)."}}, {"id": "b13-d40", "ch": 5, "topic": "Chemical interactions", "heat": "orange", "q": "The protein is moved into a buffer with a very high salt concentration. Which numbered interaction is most directly weakened?", "o": ["Interaction 1", "Interaction 2", "Interaction 3", "Interaction 4"], "a": 0, "why": "Salt ions crowd around charged groups and shield them from each other, weakening ionic bonds between oppositely charged side chains. Interaction 1 is an ionic bond between a negative carboxylate (aspartate) and a positive amino group (lysine).", "trap": "Hydrogen bonds involve partial charges and can be affected a little, but full charges paired in an ionic bond are the direct target of salt.", "src": "Diagram · interactions", "fig": {"src": "fig/b13d-40.svg", "alt": "Two backbone segments (thick horizontal lines) with four side-chain interactions between them. 1: CH2-COO- from the top chain facing +H3N-(CH2)4 from the bottom chain (aspartate and lysine, ionic). 2: CH2-S-S-CH2 joining the chains (disulfide). 3: CH(CH3)2 facing CH(CH3)2 (two valines, hydrophobic). 4: CH2-O-H from the top chain, dotted to the C=O of a CH2-C(=O)-NH2 on the bottom chain (serine and asparagine, hydrogen bond)."}}];

const BIO13_V2 = [{"id": "v2-q8-1", "stem": 8, "level": "hard", "vi": 1, "vn": 4, "week": 2, "lo": "W2: chemical interactions shape proteins; four levels of structure and what stabilises each", "topic": "Quaternary structure: what breaks an interface", "q": "Enzyme D, from a gut bacterium, is a homodimer. Each subunit is a single polypeptide chain of 310 amino acids. Where the two subunits contact each other, the R group of lysine 88 on one subunit forms an ionic bond with the R group of aspartate 142 on the other subunit. Each subunit's fold is held by a hydrophobic core and hydrogen bonds, and Enzyme D has no disulfide bonds. The structures of the named amino acids are shown below.\n\nThe wild-type Enzyme D is incubated under each of the following conditions. Which is most likely to cause the dimers to separate into monomers, while the monomers remain folded?", "o": ["Boiling in SDS", "Adding trypsin, which hydrolyzes peptide bonds", "Adding a high concentration of NaCl", "Heating to 95 °C without SDS"], "a": 2, "why": "The interface is one ionic bond between a positive R group (lysine's amine) and a negative R group (aspartate's carboxyl). Lots of dissolved ions crowd around those charges and shield them from each other, so the subunits let go, while the hydrophobic core and hydrogen bonds inside each subunit stay intact. Note: high salt is the standard chemistry answer; it was not in the course handouts.", "om": ["Separates AND unfolds: SDS plus heat disrupts the noncovalent interactions inside each subunit too.", "Confuses separating subunits with cutting the backbone. Peptide bonds are inside each chain, not between the subunits.", "Correct. Salt shields the opposite charges and weakens the ionic bond at the interface without touching the fold.", "Heat is not selective. It disrupts the weak interactions that hold each subunit's tertiary structure, so the monomers unfold."], "flip": "If the interface had been a disulfide bond, salt would do nothing and the answer would be a reducing agent.", "fig": {"src": "fig/v2/q8-1.svg", "alt": "Skeletal structures, neutral form, alphabetical: aspartate (side chain CH2-COOH) and lysine (side chain four CH2 groups ending in NH2)."}}, {"id": "v2-q8-2", "stem": 8, "level": "hard", "vi": 2, "vn": 4, "week": 2, "lo": "W2: chemical interactions shape proteins; four levels of structure and what stabilises each", "topic": "Quaternary structure: what breaks an interface", "q": "Enzyme D, from a gut bacterium, is a homodimer. Each subunit is a single polypeptide chain of 310 amino acids. Where the two subunits contact each other, the R group of cysteine 88 on one subunit forms a disulfide bond with the R group of cysteine 142 on the other subunit. These cross-subunit disulfides are the only disulfide bonds in the enzyme. Each subunit's fold is held by a hydrophobic core and hydrogen bonds. The structures of the named amino acids are shown below.\n\nThe wild-type Enzyme D is incubated under each of the following conditions. Which is most likely to cause the dimers to separate into monomers, while the monomers remain folded?", "o": ["Adding a high concentration of NaCl", "Boiling in SDS", "Lowering the pH to 3", "Adding a reducing agent (such as DTT) at room temperature, without SDS", "Adding trypsin, which hydrolyzes peptide bonds"], "a": 3, "why": "Two cysteine R groups joined across the interface form a disulfide, which is a covalent bond. Only a reducing agent breaks it. Because each subunit's fold relies on noncovalent interactions alone, breaking the disulfide releases monomers that are still folded.", "om": ["Salt shields charges, so it weakens ionic bonds. A disulfide is covalent, and salt does not break it.", "Course trap: SDS plus heat unfolds each subunit but does NOT break disulfide bonds. The chains stay linked AND unfold.", "pH changes the charge on acidic and basic R groups, which matters for ionic bonds, not covalent disulfides.", "Correct. The reducing agent breaks the S-S bond, ace.", "This separates the subunits, but SDS plus heat also unfolds every monomer.", "Wrong macromolecule: glycosidic linkages join sugars, not amino acids."], "flip": "If positions 88 and 142 had both been cysteine, DTT would have been the right call.", "fig": {"src": "fig/v2/q8-3.svg", "alt": "Skeletal structures, neutral form, alphabetical: arginine and aspartate."}}, {"id": "v2-q8-4", "stem": 8, "level": "hard", "vi": 4, "vn": 4, "week": 2, "lo": "W2: chemical interactions shape proteins; four levels of structure and what stabilises each", "topic": "Quaternary structure: what breaks an interface", "q": "Enzyme D, from a gut bacterium, is a homodimer. Each subunit is a single polypeptide chain of 310 amino acids. Where the two subunits contact each other, the R group of glutamate 88 on one subunit forms an ionic bond with the R group of lysine 142 on the other subunit. Enzyme D contains no disulfide bonds. Each subunit's fold is held by a hydrophobic core and hydrogen bonds. The structures of the named amino acids are shown below.\n\nThe wild-type Enzyme D is incubated under each of the following conditions. Which is most likely to separate the dimers into monomers AND unfold the monomers?", "o": ["Adding a high concentration of NaCl", "Adding a reducing agent at room temperature", "Adding trypsin, which hydrolyzes peptide bonds", "Boiling in SDS"], "a": 3, "why": "This one reverses the usual logic: you want everything noncovalent gone. SDS plus heat disrupts the ionic bond at the interface and the hydrophobic core and hydrogen bonds inside each subunit. Enzyme D has no disulfides, so nothing covalent holds the chains together or in shape.", "om": ["Reverses the logic: salt separates the dimers but leaves each monomer folded. This question wants both.", "There are no disulfides in Enzyme D, so a reducing agent has nothing to break.", "Cutting peptide bonds destroys the chains rather than giving intact, unfolded monomers.", "Correct. SDS plus heat breaks the inter tion vs hydrolysis", "topic": "Protease cut sites and peptide orientation", "q": "A newly discovered protease, snipase, hydrolyzes peptide bonds on the C-terminal side of aromatic amino acids. If the tetrapeptide shown below is fully digested by snipase, what products form? (Residues are numbered 1 to 4 starting from the N-terminus.)", "o": ["Residue 1 as a free amino acid, plus a tripeptide of residues 2-4", "A tripeptide of residues 1-3, plus residue 4 as a free amino acid", "No change: the tetrapeptide stays intact", "Two dipeptides: residues 1-2 and residues 3-4"], "a": 3, "why": "Aromatic means a ring in the R group. Only residue 2 has one. Its C-terminal side is the bond between residues 2 and 3, so one cut gives two dipeptides. Residue 4 is large and nonpolar, but it has no ring, so it is not aromatic.", "om": ["That is the N-terminal side of the aromatic residue. The question says C-terminal side.", "Treated the large nonpolar residue 4 as aromatic. Aromatic means a ring, not just hydrophobic.", "Missed the ring on residue 2.", "Correct. One cut, after residue 2."], "flip": "If the aromatic residue had been residue 4, its C-terminal side would have no peptide bond and nothing would be cut.", "fig": {"src": "fig/v2/q10-3.svg", "alt": "Bond-line tetrapeptide, neutral form, free amino group at one end and free carboxyl group at the other. No residue labels.", "coach": "For the coach only: reading from the N-terminus the residues are Ser-Phe-Gly-Leu. Never name them unless he is stuck identifying an R group, and never name the products."}}, {"id": "v2-q10-4", "stem": 10, "level": "hard", "vi": 4, "vn": 5, "week": 2, "lo": "W2: orient an amino acid and polypeptide; condensation vs hydrolysis", "topic": "Protease cut sites and peptide orientation", "q": "A newly discovered protease, snipase, hydrolyzes peptide bonds on the C-terminal side of basic amino acids. If the tetrapeptide shown below is fully digested by snipase, what products form? (Residues are numbered  tripeptide of residues 2-4", "Two dipeptides: residues 1-2 and residues 3-4", "Residues 1 and 4 as free amino acids, plus a dipeptide of residues 2-3", "A tripeptide of residues 1-3, plus residue 4 as a free amino acid", "Four free amino acids"], "a": 2, "why": "Two residues are basic: residue 1 (R group ending in a nitrogen-rich group) and residue 3 (R group ending in an amine). Cutting on the C-terminal side of each breaks the 1-2 bond and the 3-4 bond. That releases residues 1 and 4 and leaves 2-3 as a dipeptide.", "om": ["Found only the first basic residue. Residue 3 is basic too.", "That is cutting on the N-terminal side of the basic residues.", "Correct. Two cuts: after residue 1 and after residue 3.", "Found only residue 3 as basic and missed residue 1.", "The bond between residues 2 and 3 is not on the C-terminal side of a basic residue, so it stays."], "flip": "If snipase cut on the N-terminal side instead, only the bond between residues 2 and 3 would be cut, giving two dipeptides.", "fig": {"src": "fig/v2/q10-5.svg", "alt": "Bond-line tetrapeptide, neutral form, free amino group at one end and free carboxyl group at the other. No residue labels.", "coach": "For the coach only: reading from the N-terminus the residues are Arg-Ala-Lys-Gly. Never name them unless he is stuck identifying an R group, and never name the products."}}, {"id": "v2-q11-1", "stem": 11, "level": "hard", "vi": 1, "vn": 3, "week": 2, "lo": "W2: SDS-PAGE", "topic": "SDS-PAGE: disulfides and reducing agent", "q": "Hormone H is made as a single, inactive polypeptide called pro-H (30 kDa). To activate it, an enzyme hydrolyzes two peptide bonds, removing a 6 kDa segment from the middle of the chain. The two remaining pieces (14 kDa and 10 kDa) stay attached to each other by a single disulfide bond, forming mature H. This is the only disulfide bond present in any form of Hormone H. The released 6 kDa segment does not associate with mature H but persists in the cell and is not degraded.\n\nSamples were analyzed by SDS-PAGE and stained so that all H-derived polypeptides are visible. The gel below shows a molecular weight ladder and five possible band patterns (lanes A to E).\n\nPurified mature H is boiled in SDS with a reducing agent. Which lane best represents the expected result?", "o": ["Lane A", "Lane B", "Lane C", "Lane D", "Lane E"], "a": 3, "why": "Mature H is two chains (14 and 10 kDa) held by one disulfide. SDS plus heat unfolds them and the reducing agent breaks the disulfide, so the two chains run separately: two bands, at 14 and 10 kDa. The segment was removed before purification, so it is absent.", "om": ["Forgot that the reducing agent breaks the disulfide holding the two pieces together.", "Mature H is not pro-H: the middle segment has been cut out.", "The sample is purified mature H; the released segment is not in it.", "Correct. Two chains, two sizes, two bands.", "Kept the disulfide intact and added a segment that is not in a purified sample."], "flip": "Without the reducing agent, the disulfide survives SDS and heat, so you would see one band at 24 kDa.", "fig": {"src": "fig/v2/q11-1.svg", "alt": "SDS-PAGE gel: ladder 50, 40, 30, 25, 20, 15, 10, 5 kDa. lane A: 24 kDa; lane B: 30 kDa; lane C: 14, 10, 6 kDa; lane D: 14, 10 kDa; lane E: 24, 6 kDa"}}, {"id": "v2-q11-2", "stem": 11, "level": "hard", "vi": 2, "vn": 3, "week": 2, "lo": "W2: SDS-PAGE", "topic": "SDS-PAGE: disulfides and reducing agent", "q": "Hormone H is made as a single, inactive polypeptide called pro-H (40 kDa). To activate it, an enzyme hydrolyzes two peptide bonds, removing a 8 kDa segment from the middle of the chain. The two remaining pieces (20 kDa and 12 kDa) stay attached to each other by a single disulfide bond, forming mature H. This is the only disulfide bond present in any form of Hormone H. The released 8 kDa segment does not associate with mature H but persists in the cell and is not degraded.\n\nSamples were analyzed by SDS-PAGE and stained so that all H-derived polypeptides are visible. The gel below shows a molecular weight ladder and five possible band patterns (lanes A to E).\n\nPurified mature H is boiled in SDS without a reducing agent. Which lane best represents the expected result?", "o": ["Lane A", "Lane B", "Lane C", "Lane D", "Lane E"], "a": 2, "why": "SDS and heat unfold proteins but do not break disulfide bonds; only a reducing agent does. Mature H's two pieces stay linked, so it runs as one polypeptide of 20 + 12 = 32 kDa.", "om": ["Course trap: assumed SDS and heat break the disulfide. They do not.", "Mature H is not pro-H: the 8 kDa segment has been removed.", "Correct. One linked unit, one band at 32 kDa.", "The sample is purified mature H; the segment is not in it.", "Two errors: broke the disulfide without a reducing agent and added the segment."], "flip": "With a reducing agent added, the disulfide breaks and you would see two bands, at 20 and 12 kDa.", "fig": {"src": "fig/v2/q11-2.svg", "alt": "SDS-PAGE gel: ladder 50, 40, 30, 25, 20, 15, 10, 5 kDa. lane A: 20, 12 kDa; lane B: 40 kDa; lane C: 32 kDa; lane D: 32, 8 kDa; lane E: 20, 12, 8 kDa"}}, {"id": "v2-q11-3", "stem": 11, "level": "hard", "vi": 3, "vn": 3, "week": 2, "lo": "W2: SDS-PAGE", "topic": "SDS-PAGE: band count = distinct sizes", "q": "Hormone H is made as a single, inactive polypeptide called pro-H (30 kDa). To activate it, an enzyme hydrolyzes two peptide bonds, removing a 8 kDa segment from the middle of the chain. The two remaining pieces (11 kDa and 11 kDa) stay attached to each other by a single disulfide bond, forming mature H. This is the only disulfide bond present in any form of Hormone H. The released 8 kDa segment does not associate with mature H but persists in the cell and is not degraded.\n\nSamples were analyzed by SDS-PAGE and stained so that all H-derived polypeptides are visible. The gel below shows a molecular weight ladder and five possible band patterns (lanes A to E).\n\nPurified mature H is boiled in SDS with a reducing agent. Which lane best represents the expected result?", "o": ["Lane A", "Lane B", "Lane C", "Lane D", "Lane E"], "a": 1, "why": "The reducing agent breaks the disulfide, so the two pieces run separately. But they are the same size, and SDS-PAGE sorts only by size, so both land in one band at 11 kDa. Number of bands = number of different sizes, not number of chains.", "om": ["Forgot that the reducing agent breaks the disulfide.", "Correct. Two chains, one size, one band (holding twice the protein).", "The sample is purified mature H; the 8 kDa segment is not in it.", "Kept the disulfide intact and added a segment that is not in the sample.", "That is pro-H, which has been processed."], "flip": "If the pieces had been 12 and 10 kDa instead, you would see two bands.", "fig": {"src": "fig/v2/q11-3.svg", "alt": "SDS-PAGE gel: ladder 50, 40, 30, 25, 20, 15, 10, 5 kDa. lane A: 22 kDa; lane B: 11 kDa; lane C: 11, 8 kDa; lane D: 22, 8 kDa; lane E: 30 kDa"}}, {"id": "v2-q12-1", "stem": 12, "level": "hard", "vi": 1, "vn": 5, "week": 2, "lo": "W2: SDS-PAGE", "topic": "SDS-PAGE: mixtures during processing", "q": "Hormone H is made as a single, inactive polypeptide called pro-H (30 kDa). To activate it, an enzyme hydrolyzes two peptide bonds, removing a 6 kDa segment from the middle of the chain. The two remaining pieces (14 kDa and 10 kDa) stay attached to each other by a single disulfide bond, forming mature H. This is the only disulfide bond present in any form of Hormone H. The released 6 kDa segment does not associate with mature H but persists in the cell and is not degraded.\n\nSamples were analyzed by SDS-PAGE and stained so that all H-derived polypeptides are visible. The gel below shows a molecular weight ladder and five possible band patterns (lanes A to E).\n\nA sample is taken halfway through the activation reaction, when only some of the pro-H has been processed (assume both peptide bonds in any one pro-H molecule are cut at the same moment). It is boiled in SDS without a reducing agent. Which lane best represents the expected result?", "o": ["Lane A", "Lane B", "Lane C", "Lane D", "Lane E"], "a": 4, "why": "Halfway means three kinds of H polypeptide are present: unprocessed pro-H (30), mature H (14 + 10 held by the disulfide, which SDS and heat do not break, so 24) and the released segment (6), which persists. Three sizes, three bands.", "om": ["Forgot the pro-H that has not been processed yet.", "Forgot the 6 kDa segment, which persists and is not degraded.", "Broke the disulfide without a reducing agent. SDS and heat leave it intact.", "That is the start of the reaction, before any processing.", "Correct. Pro-H, mature H and the segment."], "flip": "With a reducing agent, mature H would split into 14 and 10, giving four bands: 30, 14, 10 and 6.", "fig": {"src": "fig/v2/q12-1.svg", "alt": "SDS-PAGE gel: ladder 50, 40, 30, 25, 20, 15, 10, 5 kDa. lane A: 24, 6 kDa; lane B: 30, 24 kDa; lane C: 30, 14, 10, 6 kDa; lane D: 30 kDa; lane E: 30, 24, 6 kDa"}}, {"id": "v2-q12-2", "stem": 12, "level": "hard", "vi": 2, "vn": 5, "week": 2, "lo": "W2: SDS-PAGE", "topic": "SDS-PAGE: mixtures during processing", "q": "Hormone H is made as a single, inactive polypeptide called pro-H (40 kDa). To activate it, an enzyme hydrolyzes two peptide bonds, removing a 8 kDa segment from the middle of the chain. The two remaining pieces (20 kDa and 12 kDa) stay attached to each other by a single disulfide bond, forming mature H. This is the only disulfide bond present in any form of Hormone H. The released 8 kDa segment does not associate with mature H but persists in the cell and is not degraded.\n\nSamples were analyzed by SDS-PAGE and stained so that all H-derived polypeptides are visible. The gel below shows a molecular weight ladder and five possible band patterns (lanes A to E).\n\nA sample is taken halfway through the activation reaction, when only some of the pro-H has been processed (assume both peptide bonds in any one pro-H molecule are cut at the same moment). It is boiled in SDS with a reducing agent. Which lane best represents the expected result?", "o": ["Lane A", "Lane B", "Lane C", "Lane D", "Lane E"], "a": 0, "why": "Halfway: pro-H, mature H and the segment are all present. The reducing agent breaks mature H's disulfide, so its pieces run separately at 20 and 12. Pro-H is one continuous chain; breaking its disulfide does not change its size, so it stays at 40. The 8 kDa segment persists.", "om": ["Correct. Pro-H, both pieces and the segment.", "Ignored the reducing agent: it does break mature H's disulfide.", "Forgot the pro-H that has not been processed yet.", "Forgot the segment, which persists.", "Forgot both the unprocessed pro-H and the segment."], "flip": "Without the reducing agent, mature H would stay together at 32 kDa: bands at 40, 32 and 8.", "fig": {"src": "fig/v2/q12-2.svg", "alt": "SDS-PAGE gel: ladder 50, 40, 30, 25, 20, 15, 10, 5 kDa. lane A: 40, 20, 12, 8 kDa; lane B: 40, 32, 8 kDa; lane C: 20, 12, 8 kDa; lane D: 40, 20, 12 kDa; lane E: 20, 12 kDa"}}, {"id": "v2-q12-3", "stem": 12, "level": "hard", "vi": 3, "vn": 5, "week": 2, "lo": "W2: SDS-PAGE", "topic": "SDS-PAGE: mixtures during processing", "q": "Hormone H is made as a single, inactive polypeptide called pro-H (30 kDa). To activate it, an enzyme hydrolyzes two peptide bonds, removing a 6 kDa segment from the middle of the chain. The two remaining pieces (14 kDa and 10 kDa) stay attached to each other by a single disulfide bond, forming mature H. This is the only disulfide bond present in any form of Hormone H. The released 6 kDa segment does not associate with mature H but persists in the cell and is not degraded.\n\nSamples were analyzed by SDS-PAGE and stained so that all H-derived polypeptides are visible. The gel below shows a molecular weight ladder and five possible band patterns (lanes A to E).\n\nA sample is taken at the moment the activating enzyme is added, before any pro-H has been processed. It is boiled in SDS with a reducing agent. Which lane best represents the expected result?", "o": ["Lane A", "Lane B", "Lane C", "Lane D", "Lane E"], "a": 2, "why": "No processing has happened yet, so only pro-H exists. The reducing agent breaks disulfides, not peptide bonds, and pro-H is one continuous chain, so it runs as a single 30 kDa band.", "om": ["Treated the reducing agent as if it cut peptide bonds. It only breaks disulfides.", "That is a fully processed sample without a reducing agent.", "Correct. Only pro-H, one band.", "That is a halfway sample without a reducing agent.", "That is a halfway sample with a reducing agent."], "flip": "At the end of the reaction with a reducing agent, you would see 14, 10 and 6 kDa bands and no pro-H.", "fig": {"src": "fig/v2/q12-3.svg", "alt": "SDS-PAGE gel: ladder 50, 40, 30, 25, 20, 15, 10, 5 kDa. lane A: 14, 10, 6 kDa; lane B: 24, 6 kDa; lane C: 30 kDa; lane D: 30, 24, 6 kDa; lane E: 30, 14, 10, 6 kDa"}}, {"id": "v2-q12-4", "stem": 12, "level": "hard", "vi": 4, "vn": 5, "week": 2, "lo": "W2: SDS-PAGE", "topic": "SDS-PAGE: mixtures during processing", "q": "Hormone H is made as a single, inactive polypeptide called pro-H (36 kDa). To activate it, an enzyme hydrolyzes two peptide bonds, removing a 10 kDa segment from the middle of the chain. The two remaining pieces (15 kDa and 11 kDa) stay attached to each other by a single disulfide bond, forming mature H. This is the only disulfide bond present in any form of Hormone H. The released 10 kDa segment does not associate with mature H but persists in the cell and is not degraded.\n\nSamples were analyzed by SDS-PAGE and stained so that all H-derived polypeptides are visible. The gel below shows a molecular weight ladder and five possible band patterns (lanes A to E).\n\nA sample is taken after the activation reaction has finished, when all of the pro-H has been processed. It is boiled in SDS without a reducing agent. Which lane best represents the expected result?", "o": ["Lane A", "Lane B", "Lane C", "Lane D", "Lane E"], "a": 3, "why": "All pro-H is processed, so none is left. Mature H stays together without a reducing agent (15 + 11 = 26). The 10 kDa segment is not degraded and is still in the sample, so it gives its own band.", "om": ["That is a halfway sample: no pro-H is left at the end.", "Forgot the segment. The stem says it persists and is not degraded.", "Broke the disulfide without a reducing agent.", "Correct. Mature H plus the persisting segment.", "Broke the disulfide and forgot the segment."], "flip": "With a reducing agent, you would see 15, 11 and 10 kDa bands.", "fig": {"src": "fig/v2/q12-4.svg", "alt": "SDS-PAGE gel: ladder 50, 40, 30, 25, 20, 15, 10, 5 kDa. lane A: 36, 26, 10 kDa; lane B: 26 kDa; lane C: 15, 11, 10 kDa; lane D: 26, 10 kDa; lane E: 15, 11 kDa"}}, {"id": "v2-q12-5", "stem": 12, "level": "hard", "vi": 5, "vn": 5, "week": 2, "lo": "W2: SDS-PAGE", "topic": "SDS-PAGE: mixtures during processing", "q": "Hormone H is made as a single, inactive polypeptide called pro-H (32 kDa). To activate it, an enzyme hydrolyzes two peptide bonds, removing a 6 kDa segment from the middle of the chain. The two remaining pieces (16 kDa and 10 kDa) stay attached to each other by a single disulfide bond, forming mature H. This is the only disulfide bond present in any form of Hormone H. The released 6 kDa segment does not associate with mature H but persists in the cell and is not degraded.\n\nSamples were analyzed by SDS-PAGE and stained so that all H-derived polypeptides are visible. The gel below shows a molecular weight ladder and five possible band patterns (lanes A to E).\n\nA sample is taken halfway through the activation reaction, when only some of the pro-H has been processed (assume both peptide bonds in any one pro-H molecule are cut at the same moment). It is boiled in SDS with a reducing agent. Which lane best represents the expected result?", "o": ["Lane A", "Lane B", "Lane C", "Lane D", "Lane E"], "a": 1, "why": "A reducing agent breaks disulfide bonds, not peptide bonds. Pro-H is a single continuous chain, so even with its disulfide broken it still runs at 32 kDa. Mature H splits into 16 and 10, and the 6 kDa segment persists.", "om": ["Ignored the reducing agent: mature H's disulfide breaks.", "Correct. Pro-H at full size, both pieces and the segment.", "Forgot the pro-H that has not been processed yet.", "Forgot the segment, which persists.", "Shrank pro-H: a reducing agent cannot remove the segment from pro-H, because that takes hydrolysis of peptide bonds."], "flip": "Without a reducing agent: 32, 26 and 6 kDa.", "fig": {"src": "fig/v2/q12-5.svg", "alt": "SDS-PAGE gel: ladder 50, 40, 30, 25, 20, 15, 10, 5 kDa. lane A: 32, 26, 6 kDa; lane B: 32, 16, 10, 6 kDa; lane C: 16, 10, 6 kDa; lane D: 32, 16, 10 kDa; lane E: 26, 16, 10, 6 kDa"}}, {"id": "v2-q15-1", "stem": 15, "level": "hard", "vi": 1, "vn": 5, "week": 3, "lo": "W3: classify monosaccharides", "topic": "Ring sugars: aldose or ketose, how many carbons", "q": "Glucose is shown below in its ringed form. How would it be classified in its linear form?", "o": ["Aldopentose", "Aldohexose", "Ketopentose", "Ketohexose"], "a": 1, "why": "Count every carbon: five in the ring plus the CH2OH outside it = 6, a hexose. The anomeric carbon (bonded to both the ring O and an OH) also carries an H, so in the linear form it was the aldehyde carbon (C1). Aldohexose.", "om": ["Counted only the ring carbons and missed the CH2OH carbon outside the ring.", "Correct. 6 carbons, aldehyde at the anomeric carbon.", "Two errors: the anomeric carbon has an H, and there are 6 carbons.", "The anomeric carbon carries an H, so it came from an aldehyde, not a ketone."], "flip": "If the anomeric carbon had carried a CH2OH instead of an H, it would have been a ketose.", "fig": {"src": "fig/v2/q15-1.svg", "alt": "Ring structure with every carbon labelled with its hydrogens, the ring oxygen, every OH and every CH2OH. Stereochemistry not shown."}}, {"id": "v2-q15-2", "stem": 15, "level": "hard", "vi": 2, "vn": 5, "week": 3, "lo": "W3: classify monosaccharides", "topic": "Ring sugars: aldose or ketose, how many carbons", "q": "Fructose is shown below in its ringed form. How would it be classified in its linear form?", "o": ["Aldopentose", "Aldohexose", "Ketopentose", "Ketohexose"], "a": 3, "why": "The five-membered ring holds four carbons and the ring O. Two CH2OH groups sit outside it, giving 6 carbons. The anomeric carbon carries an OH and a CH2OH but no H, so it was a ketone carbon (C2). Ketohexose.", "om": ["Ring-size trap, plus the anomeric carbon has no H. A five-membered ring is not five carbons.", "The anomeric carbon has no H, so it was a ketone, not an aldehyde.", "Ring-size trap: the ring has 4 carbons and two CH2OH carbons sit outside it, so 6 in total.", "Correct. 6 carbons, ketone at the anomeric carbon."], "flip": "If one of the carbons outside the ring were missing, it would have been a ketopentose.", "fig": {"src": "fig/v2/q15-2.svg", "alt": "Ring structure with every carbon labelled with its hydrogens, the ring oxygen, every OH and every CH2OH. Stereochemistry not shown."}}, {"id": "v2-q15-3", "stem": 15, "level": "hard", "vi": 3, "vn": 5, "week": 3, "lo": "W3: classify monosaccharides", "topic": "Ring sugars: aldose or ketose, how many carbons", "q": "Ribose is shown below in its ringed form. How would it be classified in its linear form?", "o": ["Aldopentose", "Aldohexose", "Ketopentose", "Ketohexose"], "a": 0, "why": "Four ring carbons plus one CH2OH outside = 5 carbons. The anomeric carbon has an H, so it was an aldehyde. Aldopentose.", "om": ["Correct. 5 carbons, aldehyde at the anomeric carbon.", "Counted the ring O as a carbon. The ring has 4 carbons.", "The anomeric carbon has an H, so it was an aldehyde.", "Two errors: the anomeric carbon has an H, and there are only 5 carbons."], "flip": "If the anomeric carbon carried a CH2OH and no H, it would be a ketose, and you would count that extra carbon.", "fig": {"src": "fig/v2/q15-3.svg", "alt": "Ring structure with every carbon labelled with its hydrogens, the ring oxygen, every OH and every CH2OH. Stereochemistry not shown."}}, {"id": "v2-q15-4", "stem": 15, "level": "hard", "vi": 4, "vn": 5, "week": 3, "lo": "W3: classify monosaccharides", "topic": "Ring sugars: aldose or ketose, how many carbons", "q": "Sugar R is shown below in its ringed form. How would it be classified in its linear form?", "o": ["Aldopentose", "Aldohexose", "Ketopentose", "Ketohexose"], "a": 2, "why": "The ring holds four carbons and the ring O. Only one CH2OH sits outside, on the anomeric carbon, which has no H, so it was a ketone carbon. The CH2 on the other side of the ring O is a ring carbon, not a CH2OH. 4 + 1 = 5 carbons. Ketopentose.", "om": ["The anomeric carbon has no H, so it was a ketone.", "Two errors: no H on the anomeric carbon, and only 5 carbons.", "Correct. 5 carbons, ketone at the anomeric carbon.", "Assumed a fructose-like ring always means 6 carbons. Only one carbon sits outside this ring."], "flip": "If there had been a second CH2OH outside the ring, it would have been a ketohexose like fructose.", "fig": {"src": "fig/v2/q15-4.svg", "alt": "Ring structure with every carbon labelled with its hydrogens, the ring oxygen, every OH and every CH2OH. Stereochemistry not shown."}}, {"id": "v2-q15-5", "stem": 15, "level": "hard", "vi": 5, "vn": 5, "week": 3, "lo": "W3: classify monosaccharides", "topic": "Ring sugars: aldose or ketose, how many carbons", "q": "Tuftsose, a sugar made by a deep-sea bacterium, is shown below in its ringed form. How would it be classified in its linear form?", "o": ["Aldopentose", "Aldohexose", "Ketopentose", "Ketohexose"], "a": 1, "why": "The ring is five-membered, but that does not make it a pentose. Count every carbon: four in the ring plus a two-carbon side chain (a CH with an OH, then a CH2OH) outside = 6. The anomeric carbon has an H, so it was an aldehyde. Aldohexose.", "om": ["Ring-size trap: a five-membered ring is not five carbons. Count the side chain.", "Correct. 6 carbons, aldehyde at the anomeric carbon.", "Two errors: the anomeric carbon has an H, and the side chain adds two carbons.", "The anomeric carbon has an H, so it was an aldehyde."], "flip": "If the side chain had been a single CH2OH, it would have been an aldopentose like ribose.", "fig": {"src": "fig/v2/q15-5.svg", "alt": "Ring structure with every carbon labelled with its hydrogens, the ring oxygen, every OH and every CH2OH. Stereochemistry not shown."}}, {"id": "v2-q22-1", "stem": 22, "level": "hard", "vi": 1, "vn": 3, "week": 4, "lo": "W4: how enzymes speed reactions", "topic": "Transition-state analogs", "q": "Enzymes speed up reactions by binding and stabilizing the transition state. Researchers design a stable molecule that has the same shape and charge distribution as the transition state of the reaction catalyzed by enzyme E, but it cannot be converted to product. What effect would this molecule most likely have when added to enzyme E and its substrate?", "o": ["It binds the active site weakly, because the active site is shaped to fit the substrate", "It binds the active site more tightly than the substrate does and acts as a competitive inhibitor, slowing the reaction", "It speeds up the reaction by giving the enzyme a ready-made transition state", "It makes ΔG of the reaction less negative, so less product forms at equilibrium", "It binds a separate allosteric site and activates the enzyme"], "a": 1, "why": "The active site binds the transition state more tightly than the substrate; that tight binding is what stabilizes it and lowers the activation energy. A stable look-alike gets that tight binding but cannot react, so it sits in the active site and blocks substrate: a strong competitive inhibitor. ΔG is unchanged.", "om": ["The active site fits the transition state best, not the substrate. That is how enzymes stabilize it.", "Correct. Tight binding in the active site, competitive inhibition, lower rate.", "The analog never turns into product. It occupies the active site, so less substrate is converted.", "Enzymes and inhibitors change rate, never ΔG.", "It mimics something that binds in the active site, so it competes there."], "flip": "If the molecule had resembled the substrate instead, it would still be a competitive inhibitor, but a weaker one, because the active site binds the substrate less tightly than the transition state."}, {"id": "v2-q22-2", "stem": 22, "level": "hard", "vi": 2, "vn": 3, "week": 4, "lo": "W4: how enzymes speed reactions", "topic": "Transition-state analogs", "q": "HIV protease hydrolyzes peptide bonds in viral proteins. Enzymes speed up reactions by binding and stabilizing the transition state. A drug company designs a stable molecule that mimics the transition state of peptide bond hydrolysis by HIV protease but contains no bond the enzyme can break. What is the most likely effect on the rate at which HIV protease cuts viral proteins?", "o": ["The rate increases, because the enzyme no longer has to bend the substrate into the transition state", "The rate increases, because stabilizing the transition state lowers the activation energy", "The rate decreases, because the mimic binds the active site tightly and keeps viral proteins out", "The rate is unchanged, because the mimic cannot be cut"], "a": 2, "why": "Peptide bond hydrolysis is exergonic but slow without a catalyst, because its activation energy is high. HIV protease speeds it up by binding the transition state tightly. A stable mimic takes that tight-binding spot and never leaves as product, so fewer active sites are free for viral proteins. The rate drops. This is the idea behind several real HIV drugs.", "om": ["Speeds-up trap: the mimic is never converted to product, so the enzyme gains nothing from holding it.", "True for a real transition state, but this molecule is a dead end that occupies the active site.", "Correct. Competitive inhibition by a transition-state mimic.", "Not being cut is exactly why it stays bound and blocks the site."], "flip": "If the question had asked what happens to ΔG of peptide bond hydrolysis, the answer would be no change."}, {"id": "v2-q22-3", "stem": 22, "level": "hard", "vi": 3, "vn": 3, "week": 4, "lo": "W4: how enzymes speed reactions", "topic": "Transition-state analogs", "q": "Enzymes speed up reactions by binding and stabilizing the transition state. Researchers add a stable transition-state analog to a reaction catalyzed by enzyme E, at a concentration that occupies about half of the enzyme's active sites. Which statement about the reaction is correct?", "o": ["ΔG of the reaction becomes less negative, so less product forms", "The equilibrium shifts toward the substrate", "The analog lowers the activation energy further, so the reaction speeds up", "The enzyme is used up as it converts the analog to product", "ΔG is unchanged; the reaction runs more slowly because fewer active sites are free to bind substrate"], "a": 4, "why": "Enzymes, and molecules that block them, change only how fast a reaction reaches equilibrium. They never change ΔG or where equilibrium lies. The analog blocks the active sites it occupies, so the rate drops while ΔG stays the same.", "om": ["Changes-ΔG trap: inhibitors change rate, not ΔG.", "Equilibrium position is set by ΔG, which no inhibitor changes.", "Speeds-up trap: the analog occupies active sites and cannot react.", "The analog cannot react, and enzymes are not consumed.", "Correct. Same ΔG, lower rate."], "flip": "If the question had asked about the rate with twice as much analog, the rate would drop further; ΔG would still not change."}, {"id": "v2-q23-1", "stem": 23, "level": "hard", "vi": 1, "vn": 4, "week": 4, "lo": "W4: coupling unfavourable to favourable processes", "topic": "Energy coupling", "q": "Cells make molecule Z with the enzyme Z synthase:\nReaction 1: X + Y → Z + H2O   ΔG = +20 kJ/mol\nReaction 2: ATP + H2O → ADP + Pi   ΔG = −30 kJ/mol\nZ synthase binds X, Y and ATP together in its active site. It transfers a phosphate from ATP to X, forming X-P, and Y then displaces the phosphate to make Z. (ΔG values are for conditions in the cell.)\n\nThe cell has plenty of ATP, X and Y. Will Z accumulate?", "o": ["No. Reaction 1 has a positive ΔG, so it cannot happen in a cell", "Yes. The enzyme lowers ΔG of reaction 1 until it is negative", "Yes. The reactions are linked through the shared intermediate X-P, so the overall ΔG is +20 + (−30) = −10 kJ/mol", "No. The energy from ATP hydrolysis is released as heat and cannot be used"], "a": 2, "why": "Coupling works when one enzyme links the two reactions through a shared intermediate (X-P). Then you add the ΔG values: +20 + (−30) = −10 kJ/mol. Negative overall, so Z is made and accumulates.", "om": ["Ignores coupling: an unfavourable reaction can run when it is linked to a favourable one.", "Enzymes lower activation energy, never ΔG.", "Correct. Linked reactions, negative sum.", "That happens only when ATP is hydrolyzed separately. Here the enzyme links the two reactions."], "flip": "If reaction 1 had a ΔG of +40 kJ/mol, the sum would be +10 and Z would not accumulate."}, {"id": "v2-q23-2", "stem": 23, "level": "hard", "vi": 2, "vn": 4, "week": 4, "lo": "W4: coupling unfavourable to favourable processes", "topic": "Energy coupling", "q": "Cells make molecule Z with the enzyme Z synthase:\nReaction 1: X + Y → Z + H2O   ΔG = +42 kJ/mol\nReaction 2: ATP + H2O → ADP + Pi   ΔG = −30 kJ/mol\nZ synthase binds X, Y and ATP together in its active site. It transfers a phosphate from ATP to X, forming X-P, and Y then displaces the phosphate to make Z. (ΔG values are for conditions in the cell.)\n\nThe cell has plenty of ATP, X and Y. Will Z accumulate?", "o": ["Yes. ATP hydrolysis is strongly exergonic, so any reaction coupled to it goes forward", "No. Even coupled, the overall ΔG is +42 + (−30) = +12 kJ/mol, so the overall reaction is not spontaneous", "Yes. /* ---------- per-attempt log: one row per Check or Reveal ---------- */
function logAttempt(q, chose, ok, revealed){
