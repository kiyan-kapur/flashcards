 no class labels: lysine (side chain four CH2 groups ending in NH2); aspartate (side chain CH2-COOH)."}}, {"id": "b13-r8c", "ch": 1, "topic": "Protein structure and gels", "heat": "red", "q": "Enzyme D, from a gut bacterium, is a homodimer with 310 amino acids per subunit. Cysteine 88 on one subunit forms a disulfide bond with cysteine 142 on the other, and this is the only link between subunits. The enzyme has no other disulfide bonds. Which treatment would NOT separate the subunits?", "o": ["A reducing agent alone", "A reducing agent with SDS and heat", "SDS and heat with no reducing agent", "A reducing agent at 37 °C"], "a": 2, "why": "SDS and heat break noncovalent interactions, but a disulfide is covalent. Without a reducing agent the two chains stay joined.", "trap": "This is the classic SDS-PAGE trap: SDS does not break disulfides.", "src": "Redacted Q8 · fill-in C (disulfide, NOT)", "fig": {"src": "fig/b13-r8c.svg", "alt": "Skeletal structures, neutral form, no class labels: cysteine (side chain CH2-SH)."}}, {"id": "b13-r9a", "ch": 1, "topic": "Functional group charges", "heat": "red", "q": "Molecule Q has one amino group, one carboxyl group on its alpha carbon, and a second carboxyl group on its R group. What is its net charge at physiological pH (about 7.4)?", "o": ["-2", "-1", "0", "+1"], "a": 1, "why": "At pH 7.4 amino groups are protonated (+1) and carboxyl groups are deprotonated (-1 each). +1 - 1 - 1 = -1.", "trap": "Count every ionizable group, including the one on the R group.", "src": "Redacted Q9 · fill-in A", "fig": {"src": "fig/b13-r9a.svg", "alt": "Skeletal structure, neutral (non-ionized) form, no charges shown: aspartic acid: an alpha carbon carrying NH2, COOH and a CH2-COOH side chain."}}, {"id": "b13-r9b", "ch": 1, "topic": "Functional group charges", "heat": "red", "q": "Molecule Q is the tripeptide Lys-Ala-Glu, with a free N-terminal amino group and a free C-terminal carboxyl group. What is its net charge at physiological pH?", "o": ["+1", "0", "-1", "+2", "-2"], "a": 1, "why": "N-terminus +1, lysine R group +1, glutamate R group -1, C-terminus -1. The total is 0. Groups in peptide bonds are not charged.", "trap": "Only the terminal amino and carboxyl groups are free. Internal ones are tied up in peptide bonds.", "src": "Redacted Q9 · fill-in B", "fig": {"src": "fig/b13-r9b.svg", "alt": "Skeletal structure, neutral (non-ionized) form, no charges shown: the tripeptide Lys-Ala-Glu: free NH2 at the N-terminus, lysine side chain ending in NH2, alanine CH3, glutamate side chain CH2-CH2-COOH, free COOH at the C-terminus."}}, {"id": "b13-r9c", "ch": 1, "topic": "Functional group charges", "heat": "red", "q": "Molecule Q has two amino groups, one carboxyl group and one hydroxyl group. What is its net charge at physiological pH?", "o": ["+2", "0", "-1", "+1"], "a": 3, "why": "Each amino group is +1 and the carboxyl is -1. The hydroxyl does not ionize at physiological pH, so the total is +1.", "trap": "The hydroxyl group is polar but uncharged.", "src": "Redacted Q9 · fill-in C", "fig": {"src": "fig/b13-r9c.svg", "alt": "Skeletal structure, neutral (non-ionized) form, no charges shown: 5-hydroxylysine: an alpha carbon carrying NH2 and COOH, and a side chain CH2-CH2-CH(OH)-CH2-NH2."}}, {"id": "b13-r10a", "ch": 1, "topic": "Protease cut sites", "heat": "red", "q": "The protease snipase cuts peptide bonds on the C-terminal side of basic amino acids (lysine, arginine). What are the products when N-Arg-Gly-Lys-Phe-C is fully digested?", "o": ["A single amino acid and a tripeptide", "Two dipeptides", "Two single amino acids and a dipeptide", "Four single amino acids", "No change, the tetrapeptide stays intact"], "a": 2, "why": "Cut after Arg (between Arg and Gly) and after Lys (between Lys and Phe). The products are Arg, Gly-Lys and Phe.", "trap": "C-terminal side means the bond AFTER the basic residue, toward the C-terminus.", "src": "Redacted Q10 · fill-in A", "fig": {"src": "fig/b13-r10a.svg", "alt": "Skeletal structure of the tetrapeptide N-Arg-Gly-Lys-Phe-C in its neutral (non-ionized) form, with the free backbone NH2 (N-terminus) and the free COOH (C-terminus) visible. No cut site is marked."}}, {"id": "b13-r10b", "ch": 1, "topic": "Protease cut sites", "heat": "red", "q": "The protease snipase cuts peptide bonds on the N-terminal side of aromatic amino acids (phenylalanine, tyrosine, tryptophan). What are the products when N-Phe-Ala-Tyr-Gly-C is fully digested?", "o": ["Two dipeptides", "Two single amino acids and a dipeptide", "A single amino acid and a tripeptide", "Four single amino acids", "No change, the tetrapeptide stays intact"], "a": 0, "why": "Phe is the N-terminal residue, so there is no bond on its N-terminal side to cut. Tyr's N-terminal side is the Ala-Tyr bond. The products are Phe-Ala and Tyr-Gly.", "trap": "A target at the very end of the chain has no bond on that side to cut.", "src": "Redacted Q10 · fill-in B", "fig": {"src": "fig/b13-r10b.svg", "alt": "Skeletal structure of the tetrapeptide N-Phe-Ala-Tyr-Gly-C in its neutral (non-ionized) form, with the free backbone NH2 (N-terminus) and the free COOH (C-terminus) visible. No cut site is marked."}}, {"id": "b13-r10c", "ch": 1, "topic": "Protease cut sites", "heat": "red", "q": "The protease snipase cuts peptide bonds on the C-terminal side of acidic amino acids (aspartate, glutamate). What happens when N-Ala-Ser-Gly-Asp-C is fully digested?", "o": ["No change: aspartate is the C-terminal residue, so there is no bond on its C-terminal side", "A single amino acid and a tripeptide", "Two dipeptides", "Two single amino acids and a dipeptide"], "a": 0, "why": "The only acidic residue is at the C-terminus. There is no peptide bond after it, so snipase has nothing to cut.", "trap": "Always check where the target residue sits before cutting.", "src": "Redacted Q10 · fill-in C", "fig": {"src": "fig/b13-r10c.svg", "alt": "Skeletal structure of the tetrapeptide N-Ala-Ser-Gly-Asp-C in its neutral (non-ionized) form, with the free backbone NH2 (N-terminus) and the free COOH (C-terminus) visible. No cut site is marked."}}, {"id": "b13-r11a", "ch": 1, "topic": "SDS-PAGE", "heat": "red", "q": "Hormone H is made as pro-H, a single 15 kDa chain. An activating enzyme hydrolyses two peptide bonds and removes a 4 kDa middle segment. The two end pieces (a 5 kDa N-terminal piece and a 6 kDa C-terminal piece) stay attached by a single disulfide bond, the only disulfide in any form of H. The released 4 kDa segment is not degraded and does not bind mature H. Samples are run on SDS-PAGE with heat. Purified mature H is prepared WITHOUT reducing agent. What band pattern appears?", "o": ["Two bands, at 5 and 6 kDa", "One band at 11 kDa", "One band at 15 kDa", "Bands at 11 and 4 kDa", "Three bands, at 6, 5 and 4 kDa"], "a": 1, "why": "Mature H is the 5 and 6 kDa pieces joined by a disulfide. SDS and heat do not break disulfides, so it runs as one 11 kDa unit.", "trap": "Without reducing agent, disulfide-linked chains run together.", "src": "Redacted Q11 · fill-in A (no reducing agent)", "fig": {"src": "fig/b13-r11a.svg", "alt": "Schematic, not a gel. Top: pro-H drawn as one 15 kDa bar from N to C, split into a 5 kDa N-terminal piece, a 4 kDa middle segment and a 6 kDa C-terminal piece, with arrows at the two peptide bonds the activating enzyme hydrolyses and a dashed S–S line joining the 5 and 6 kDa pieces. Bottom, after activation: the 5 and 6 kDa pieces still joined by the S–S, and the 4 kDa segment released on its own."}}, {"id": "b13-r11b", "ch": 1, "topic": "SDS-PAGE", "heat": "red", "q": "Hormone H is made as pro-H, a single 15 kDa chain. An activating enzyme hydrolyses two peptide bonds and removes a 4 kDa middle segment. The two end pieces (a 5 kDa N-terminal piece and a 6 kDa C-terminal piece) stay attached by a single disulfide bond, the only disulfide in any form of H. The released 4 kDa segment is not degraded and does not bind mature H. Samples are run on SDS-PAGE with heat. Purified mature H is prepared WITH reducing agent. What band pattern appears?", "o": ["One band at 11 kDa", "One band at 15 kDa", "Bands at 11 and 4 kDa", "Bands at 15, 6 and 5 kDa", "Two bands, at 5 and 6 kDa"], "a": 4, "why": "The reducing agent breaks the only disulfide, so the 5 and 6 kDa pieces run separately. Purified mature H contains no pro-H or free segment.", "trap": "The 4 kDa segment was removed during purification, so it is not in this sample.", "src": "Redacted Q11 · fill-in B (with reducing agent)", "fig": {"src": "fig/b13-r11b.svg", "alt": "Schematic, not a gel. Top: pro-H drawn as one 15 kDa bar from N to C, split into a 5 kDa N-terminal piece, a 4 kDa middle segment and a 6 kDa C-terminal piece, with arrows at the two peptide bonds the activating enzyme hydrolyses and a dashed S–S line joining the 5 and 6 kDa pieces. Bottom, after activation: the 5 and 6 kDa pieces still joined by the S–S, and the 4 kDa segment released on its own."}}, {"id": "b13-r12a", "ch": 1, "topic": "SDS-PAGE", "heat": "red", "q": "Hormone H is made as pro-H, a single 15 kDa chain. An activating enzyme hydrolyses two peptide bonds and removes a 4 kDa middle segment. The two end pieces (a 5 kDa N-terminal piece and a 6 kDa C-terminal piece) stay attached by a single disulfide bond, the only disulfide in any form of H. The released 4 kDa segment is not degraded and does not bind mature H. Samples are run on SDS-PAGE with heat. Halfway through activation, half the pro-H molecules have been fully processed and half are untouched. This mixture is prepared WITHOUT reducing agent. What band pattern appears?", "o": ["Bands at 15, 6, 5 and 4 kDa", "Bands at 11 and 4 kDa only", "Bands at 15, 11 and 4 kDa", "One band at 15 kDa", "Bands at 6, 5 and 4 kDa"], "a": 2, "why": "Untouched pro-H runs at 15. Processed H stays joined by its disulfide at 11. The released segment persists at 4.", "trap": "The middle segment is not degraded, so it shows up as its own band.", "src": "Redacted Q12 · fill-in A (no reducing agent)", "fig": {"src": "fig/b13-r12a.svg", "alt": "Schematic, not a gel. Top: pro-H drawn as one 15 kDa bar from N to C, split into a 5 kDa N-terminal piece, a 4 kDa middle segment and a 6 kDa C-terminal piece, with arrows at the two peptide bonds the activating enzyme hydrolyses and a dashed S–S line joining the 5 and 6 kDa pieces. Bottom, after activation: the 5 and 6 kDa pieces still joined by the S–S, and the 4 kDa segment released on its own."}}, {"id": "b13-r12b", "ch": 1, "topic": "SDS-PAGE", "heat": "red", "q": "Hormone H is made as pro-H, a single 15 kDa chain. An activating enzyme hydrolyses two peptide bonds and removes a 4 kDa middle segment. The two end pieces (a 5 kDa N-terminal piece and a 6 kDa C-terminal piece) stay attached by a single disulfide bond, the only disulfide in any form of H. The released 4 kDa segment is not degraded and does not bind mature H. Samples are run on SDS-PAGE with heat. Halfway through activation, half the pro-H molecules have been fully processed and half are untouched. This mixture is prepared WITH reducing agent. What band pattern appears?", "o": ["Bands at 15, 6, 5 and 4 kDa", "Bands at 15, 11 and 4 kDa", "Bands at 6, 5 and 4 kDa only", "Bands at 11, 6 and 5 kDa", "One band at 15 kDa"], "a": 0, "why": "Pro-H is still one continuous chain (15). Reducing it breaks its internal disulfide, but no peptide bonds, so its mass is unchanged. Processed H splits into 6 and 5, and the segment stays at 4.", "trap": "Reducing pro-H does not fragment it, because its pieces are still joined by peptide bonds.", "src": "Redacted Q12 · fill-in B (with reducing agent)", "fig": {"src": "fig/b13-r12b.svg", "alt": "Schematic, not a gel. Top: pro-H drawn as one 15 kDa bar from N to C, split into a 5 kDa N-terminal piece, a 4 kDa middle segment and a 6 kDa C-terminal piece, with arrows at the two peptide bonds the activating enzyme hydrolyses and a dashed S–S line joining the 5 and 6 kDa pieces. Bottom, after activation: the 5 and 6 kDa pieces still joined by the S–S, and the 4 kDa segment released on its own."}}, {"id": "b13-r13a", "ch": 1, "topic": "Nucleic acids", "heat": "red", "q": "A viral genome contains A 30%, T 30%, G 20%, C 20%. What is the best-supported conclusion?", "o": ["Single-stranded DNA", "Double-stranded RNA", "Single-stranded RNA", "Double-stranded DNA", "It cannot be DNA, because A does not equal G"], "a": 3, "why": "T present means DNA. A = T and G = C (Chargaff's rule) fits base pairing, so it is double-stranded.", "trap": "Chargaff pairs A with T and G with C, not A with G.", "src": "Redacted Q13 · fill-in A"}, {"id": "b13-r13b", "ch": 1, "topic": "Nucleic acids", "heat": "red", "q": "A viral genome contains A 22%, U 22%, G 28%, C 28%. What is the best-supported conclusion?", "o": ["Double-stranded DNA", "Single-stranded RNA", "Double-stranded RNA", "Single-stranded DNA"], "a": 2, "why": "Uracil means RNA. A = U and G = C is what base pairing produces, so double-stranded is best supported.", "trap": "U replaces T in RNA. Matching pair percentages point to double-stranded.", "src": "Redacted Q13 · fill-in B"}, {"id": "b13-r13c", "ch": 1, "topic": "Nucleic acids", "heat": "red", "q": "A viral genome contains A 31%, T 18%, G 22%, C 29%. What is the best-supported conclusion?", "o": ["Double-stranded DNA", "Single-stranded DNA", "Single-stranded RNA", "Double-stranded RNA"], "a": 1, "why": "T means DNA. A does not equal T and G does not equal C, so the bases are not paired: single-stranded.", "trap": "Chargaff's rule only holds for double-stranded genomes.", "src": "Redacted Q13 · fill-in C"}, {"id": "b13-r14a", "ch": 1, "topic": "Nucleic acids", "heat": "red", "q": "Four 8-base ssDNA strands are all written 5' to 3'. I: GATTCAGC   II: CTAAGTCG   III: GCTGAATC   IV: TTGACCAA. Which two can form a fully paired double helix?", "o": ["I and II", "II and III", "I and III", "I and IV", "II and IV"], "a": 2, "why": "Partners must be antiparallel reverse complements. Reverse-complement I: complement CTAAGTCG, read backwards gives GCTGAATC, which is III.", "trap": "II is the complement written in the SAME direction (parallel). It looks right but cannot pair antiparallel.", "src": "Redacted Q14 · fill-in A"}, {"id": "b13-r14b", "ch": 1, "topic": "Nucleic acids", "heat": "red", "q": "Each strand below is written 5' to 3'. Which one can form a fully paired double helix with a second copy of itself?", "o": ["ATTGGTTA", "GGCCTTAA", "ACGTTGCA", "AGAATTCT"], "a": 3, "why": "A self-complementary strand equals its own reverse complement. AGAATTCT: complement TCTTAAGA, reversed AGAATTCT. Match.", "trap": "ATTGGTTA reads the same backwards, but that is not self-complementary. Its reverse complement is TAACCAAT.", "src": "Redacted Q14 · fill-in B"}, {"id": "b13-r14c", "ch": 1, "topic": "Nucleic acids", "heat": "red", "q": "One ssDNA strand is 5'-CATGGACT-3'. Which strand, written 5' to 3', forms a fully paired helix with it?", "o": ["GTACCTGA", "TCAGGTAC", "AGTCCATG", "AGTGCATG"], "a": 2, "why": "Complement CATGGACT to get GTACCTGA, then reverse it to write 5' to 3': AGTCCATG.", "trap": "GTACCTGA is the parallel decoy, TCAGGTAC is just reversed, and AGTGCATG has one mismatch.", "src": "Redacted Q14 · fill-in C"}, {"id": "b13-r15a", "ch": 1, "topic": "Monosaccharides", "heat": "red", "q": "A sugar ring has six members: five carbons and one oxygen. The carbon to the right of the ring oxygen carries an -OH and an -H. The carbon to the left of the ring oxygen carries a -CH2OH outside the ring. How is the linear form classified?", "o": ["Aldopentose", "Aldohexose", "Ketohexose", "Ketopentose"], "a": 1, "why": "Count ALL carbons: five in the ring plus the -CH2OH makes six, a hexose. The anomeric carbon has an H, so it came from an aldehyde, making it an aldose.", "trap": "Counting only ring carbons gives five, which is the aldopentose trap.", "src": "Redacted Q15 · fill-in A", "fig": {"src": "fig/b13-r15a.svg", "alt": "A six-membered ring of five carbons and one oxygen (Haworth projection, ring O at the back right). The carbon to the right of the ring oxygen carries an OH (down) and an H (up). The carbon to the left of the ring oxygen carries a CH2OH (up) and an H. The other three ring carbons each carry one OH and one H. No carbon numbers or sugar names are shown."}}, {"id": "b13-r15b", "ch": 1, "topic": "Monosaccharides", "heat": "red", "q": "A sugar ring has five members: four carbons and one oxygen. The carbon to the right of the ring oxygen carries an -OH and a -CH2OH. The carbon to the left of the ring oxygen carries another -CH2OH. How is the linear form classified?", "o": ["Ketohexose", "Aldopentose", "Ketopentose", "Aldohexose"], "a": 0, "why": "Four ring carbons plus two -CH2OH groups gives six carbons. The anomeric carbon carries a carbon (CH2OH) rather than an H, so the carbonyl was internal: a ketone. That is fructose.", "trap": "A five-membered ring is not automatically a pentose.", "src": "Redacted Q15 · fill-in B", "fig": {"src": "fig/b13-r15b.svg", "alt": "A five-membered ring of four carbons and one oxygen (Haworth projection, ring O at the back). The carbon to the right of the ring oxygen carries an OH (up) and a CH2OH (down). The carbon to the left of the ring oxygen carries a CH2OH (up) and an H. The two front carbons each carry one OH and one H. No carbon numbers or sugar names are shown."}}, {"id": "b13-r15c", "ch": 1, "topic": "Monosaccharides", "heat": "red", "q": "A sugar ring has five members: four carbons and one oxygen. The carbon to the right of the ring oxygen carries an -OH and an -H. The carbon to the left of the ring oxygen carries a -CH2OH. How is the linear form classified?", "o": ["Aldotetrose", "Ketopentose", "Ketohexose", "Aldopentose"], "a": 3, "why": "Four ring carbons plus one -CH2OH gives five carbons. The anomeric carbon carries an H, so it came from an aldehyde. That is ribose.", "trap": "Four ring carbons tempt aldotetrose. Add the carbon outside the ring.", "src": "Redacted Q15 · fill-in C", "fig": {"src": "fig/b13-r15c.svg", "alt": "A five-membered ring of four carbons and one oxygen (Haworth projection, ring O at the back). The carbon to the right of the ring oxygen carries an OH (up) and an H (down). The carbon to the left of the ring oxygen carries a CH2OH (up) and an H. The two front carbons each carry one OH and one H. No carbon numbers or sugar names are shown."}}, {"id": "b13-r16a", "ch": 1, "topic": "Carbohydrate functions", "heat": "red", "q": "All of the following are functions of carbohydrates in organisms EXCEPT:", "o": ["Short-term energy storage, such as glycogen and starch", "Structural support, such as cellulose in plant cell walls", "Storing and transmitting genetic information", "Cell-cell recognition, such as sugar chains on the cell surface"], "a": 2, "why": "Genetic information is stored in nucleic acids. Carbohydrates store energy, build structures, and serve as recognition markers.", "trap": "DNA contains a sugar, but the information is carried by the sequence of bases. That is a nucleic acid job.", "src": "Redacted Q16 · fill-in A"}, {"id": "b13-r16b", "ch": 1, "topic": "Carbohydrate functions", "heat": "red", "q": "Around mile 20, a marathoner suddenly \"hits the wall\" and can barely keep running. What is the best explanation?", "o": ["The runner's cellulose reserves have run out", "Muscle glycogen, the stored glucose polymer used for quick energy, has been depleted", "Muscle triglycerides have converted into glycogen", "The runner's starch stores in the liver have been used up"], "a": 1, "why": "Glycogen is the animal storage polysaccharide. When muscle glycogen runs out, quick energy supply drops sharply.", "trap": "Animals store glycogen, not starch. Starch is the plant storage form.", "src": "Redacted Q16 · fill-in B"}, {"id": "b13-r16c", "ch": 1, "topic": "Carbohydrate functions", "heat": "red", "q": "Red blood cells of people with type A or B blood carry one extra sugar on a surface sugar chain, added by an enzyme. Type O lacks it. What function do these sugar chains serve?", "o": ["Cell recognition: they act as identity markers on the cell surface", "Energy storage for the red blood cell", "Structural support for the plasma membrane", "Increasing membrane fluidity"], "a": 0, "why": "Surface sugar chains are recognition tags. The immune system reads them, which is why blood types matter for transfusions. The extra sugar is attached by condensation.", "trap": "These chains are too small to matter for energy or structure.", "src": "Redacted Q16 · fill-in C"}, {"id": "b13-r17a", "ch": 1, "topic": "Membrane permeability", "heat": "red", "q": "A steroid hormone normally crosses the plasma membrane on its own. Chemists attach a charged phosphate group so the drug will act only on receptors outside the cell. What effect does this have?", "o": ["It crosses faster, because charged groups are attracted to the membrane", "It still crosses freely, because steroids always cross membranes", "It is now actively pumped into cells by the phosphate group", "The modified hormone can no longer diffuse through the bilayer unaided, because the charged group cannot pass the hydrophobic core"], "a": 3, "why": "The bilayer's interior is nonpolar. Small nonpolar molecules cross; charged ones do not cross unaided.", "trap": "A steroid core is no longer enough once a charged group is attached.", "src": "Redacted Q17 · fill-in A"}, {"id": "b13-r17b", "ch": 1, "topic": "Membrane permeability", "heat": "red", "q": "A steroid hormone normally crosses the plasma membrane on its own. To help it enter cells more readily, chemists attach a short nonpolar hydrocarbon chain. What is the most likely effect?", "o": ["It now needs a channel protein, because it is larger", "It can no longer cross, because hydrocarbons are repelled by the bilayer", "It still crosses unaided, likely even more readily, because it remains nonpolar", "It must now be actively transported"], "a": 2, "why": "Adding nonpolar character keeps it compatible with the hydrophobic core, so unaided diffusion continues.", "trap": "Hydrocarbons are attracted to the nonpolar core of the bilayer, not repelled by it.", "src": "Redacted Q17 · fill-in B"}, {"id": "b13-r17c", "ch": 1, "topic": "Membrane permeability", "heat": "red", "q": "A steroid hormone normally crosses the plasma membrane on its own. To make it dissolve better in blood, chemists attach a glucose molecule. What is the most likely trade-off?", "o": ["It crosses faster, because glucose has a transporter", "It dissolves better in water but crosses the membrane less easily, because glucose's many -OH groups are polar", "There is no change, because the steroid part dominates", "It becomes charged and is pumped in by ATP"], "a": 1, "why": "More -OH groups mean more hydrogen bonding with water, which is good for blood solubility but bad for passing the nonpolar core.", "trap": "A transporter for free glucose would not recognize a steroid with glucose attached.", "src": "Redacted Q17 · fill-in C"}, {"id": "b13-r18a", "ch": 1, "topic": "Osmosis and tonicity", "heat": "red", "q": "Road salt washes into the soil beside a highway and the roadside plants wilt. What is the best explanation?", "o": ["Salt ions diffused into the root cells and made them burst", "The soil became hypotonic, so water rushed into the roots", "Na+ and Cl- crossed the bilayer freely and poisoned the cells", "The soil water became hypertonic to the root cells, so water left the cells by osmosis and they plasmolyzed", "The cells actively pumped water out to get rid of the salt"], "a": 3, "why": "Water moves by osmosis from low solute to high solute. Salty soil has more solute, so water flows out of the cells and the membrane pulls away from the wall (plasmolysis).", "trap": "Ions do not cross the bilayer freely, and salty soil is hypertonic, not hypotonic.", "src": "Redacted Q18 · fill-in A"}, {"id": "b13-r18b", "ch": 1, "topic": "Osmosis and tonicity", "heat": "red", "q": "Road salt washes into a garden and earthworms near the road dehydrate and die. What is the best explanation?", "o": ["Salt entered the worms by diffusion and caused them to swell", "The salty soil was hypotonic, so water flooded the worms' cells", "Salt froze the soil water, so the worms could not drink", "The worms' body fluids were hypotonic to the salty soil water, so they lost water by osmosis"], "a": 3, "why": "Water leaves the side with less solute. The worms' fluids had less solute than the salty soil, so water left them.", "trap": "If the worm is hypotonic, the surroundings are hypertonic. Water flows toward more solute.", "src": "Redacted Q18 · fill-in B"}, {"id": "b13-r18c", "ch": 1, "topic": "Osmosis and tonicity", "heat": "red", "q": "A student says road salt kills roadside grass \"because salt makes the soil hypotonic, so water rushes into the roots until the cells burst.\" Which is the best evaluation?", "o": ["Correct as stated", "Incorrect: the cells burst because salt is actively pumped in", "Incorrect: salt makes the soil hypertonic, so water leaves the root cells and they plasmolyze", "Incorrect: salt has no effect on water movement, only on nutrients"], "a": 2, "why": "Salt increases solute outside the cells: hypertonic. Water moves out. Plant cells also have walls, so they rarely burst.", "trap": "Hypotonic means less solute. Adding salt does the opposite.", "src": "Redacted Q18 · fill-in C"}, {"id": "b13-r19a", "ch": 1, "topic": "Membrane fluidity", "heat": "red", "q": "Organisms keep their membranes fluid as conditions change. Species A's phospholipid tails are 40% unsaturated and mostly 16 carbons long. Species B's tails are 40% unsaturated and mostly 22 carbons long. Which species most likely lives in near-freezing Antarctic water, and why?", "o": ["Species B: longer tails contain more double bonds, which add kinks", "Species B: longer tails pack more tightly, which stops the membrane freezing solid", "Species A: shorter tails have fewer van der Waals contacts with neighbouring tails, so the membrane stays fluid in the cold", "It cannot be determined, because both have the same percentage of unsaturated tails", "Species A: shorter tails form more hydrogen bonds with water"], "a": 2, "why": "With unsaturation equal, tail length decides. Shorter tails have less surface to interact, so they stay fluid at low temperature.", "trap": "Length and unsaturation are separate levers. Either one can decide the question.", "src": "Redacted Q19 · fill-in A"}, {"id": "b13-r19b", "ch": 1, "topic": "Membrane fluidity", "heat": "red", "q": "Species X's phospholipid tails are 75% unsaturated and Species Y's are 25% unsaturated. Both average 18 carbons. Which species most likely lives on a warm tropical reef, and why?", "o": ["Species Y: more saturated tails are straight and pack tightly, keeping the membrane from becoming too fluid in the heat", "Species X: the kinks from double bonds help tails pack tightly in warm water", "Species Y: saturated tails contain kinks that add fluidity", "Species X: unsaturated tails form covalent bonds with each other in the heat"], "a": 0, "why": "Warm conditions push membranes toward too fluid. Saturated tails maximize packing and van der Waals interactions to counter that.", "trap": "Double bonds (unsaturation) create kinks that LOOSEN packing.", "src": "Redacted Q19 · fill-in B"}, {"id": "b13-r19c", "ch": 1, "topic": "Membrane fluidity", "heat": "red", "q": "Species P's tails are 70% unsaturated and mostly 14 carbons. Species Q's tails are 30% unsaturated and mostly 22 carbons. Which most likely lives in a hot spring, and why?", "o": ["Species P: shorter, unsaturated tails pack the most tightly", "Species Q: longer tails contain more kinks", "Species P: unsaturated tails hydrogen bond to each other in heat", "Species Q: its more saturated, longer tails pack tightly with more van der Waals contacts, so the membrane does not become too fluid"], "a": 3, "why": "Both levers point the same way: more saturated and longer means tighter packing, the right choice for heat.", "trap": "Unsaturated and short both mean more fluid, which suits the cold.", "src": "Redacted Q19 · fill-in C"}, {"id": "b13-r20a", "ch": 1, "topic": "Entropy", "heat": "red", "q": "Which process DECREASES the entropy of the system?", "o": ["Ice melting", "Pumping ions across a membrane to build a concentration gradient", "NaCl dissolving in water", "Hydrolysis of a polysaccharide into glucose monomers", "Ions diffusing down their concentration gradient"], "a": 1, "why": "Building a gradient concentrates particles on one side, which is a more ordered arrangement, so ΔS is negative. That is why it costs energy.", "trap": "Building a gradient is the reverse of diffusion. Dissipating a gradient increases entropy; building one decreases it.", "src": "Redacted Q20 · fill-in A"}, {"id": "b13-r20b", "ch": 1, "topic": "Entropy", "heat": "red", "q": "Which process INCREASES the entropy of the system?", "o": ["Condensation of amino acids into a polypeptide", "Building a proton gradient across a membrane", "Liquid water freezing into ice", "Glucose monomers joining into glycogen", "Hydrolysis of a protein into free amino acids"], "a": 4, "why": "Breaking one large molecule into many small, free molecules increases the number of possible arrangements.", "trap": "Condensation, polymerizing, freezing and building gradients all create order.", "src": "Redacted Q20 · fill-in B"}, {"id": "b13-r20c", "ch": 1, "topic": "Entropy", "heat": "red", "q": "A cell is placed in a hypotonic solution and water moves into it by osmosis. What happens to the entropy of the system (the cell plus the solution)?", "o": ["It increases, because the solute concentration difference is dissipating", "It decreases, because the cell is becoming more ordered as it fills", "It stays the same, because water is only moving", "It decreases, because osmosis requires energy"], "a": 0, "why": "Osmosis is spontaneous movement that evens out a concentration difference. Evening out = more disorder = ΔS positive.", "trap": "Osmosis is passive. It requires no energy input.", "src": "Redacted Q20 · fill-in C"}, {"id": "b13-r21a", "ch": 1, "topic": "Thermodynamics", "heat": "red", "q": "A newly made protein folds spontaneously into its specific shape in water. Which statement best describes the thermodynamics?", "o": ["ΔG is negative: the chain itself becomes more ordered, but burying hydrophobic R groups frees ordered water, so total entropy increases", "ΔG is positive, because the folded protein is more ordered than the unfolded chain", "ΔG is negative, so folding must happen instantly", "The entropy of the universe decreases, which is allowed because the reaction is spontaneous", "ΔG is zero, because folding is reversible"], "a": 0, "why": "Look beyond the chain to the water. The hydrophobic effect: releasing caged water molecules drives the entropy increase that makes folding favorable.", "trap": "Spontaneous says nothing about speed. And the entropy of the universe can never decrease in a spontaneous process.", "src": "Redacted Q21 · fill-in A"}, {"id": "b13-r21b", "ch": 1, "topic": "Thermodynamics", "heat": "red", "q": "Phospholipids added to water assemble spontaneously into a bilayer. Which statement best describes the thermodynamics?", "o": ["The process is nonspontaneous, because a bilayer is more ordered than scattered lipids", "The process is driven by covalent bonds forming between the tails", "The process is spontaneous (ΔG < 0), driven largely by the increase in water's entropy when water no longer has to order itself around the nonpolar tails", "The process requires ATP, because it decreases entropy"], "a": 2, "why": "Same logic as protein folding. Hiding the tails from water releases ordered water, so total entropy rises.", "trap": "The tails attract by weak noncovalent interactions, not covalent bonds.", "src": "Redacted Q21 · fill-in B"}, {"id": "b13-r21c", "ch": 1, "topic": "Thermodynamics", "heat": "red", "q": "ATP hydrolysis has a large negative ΔG, yet ATP in a test tube of pure water breaks down extremely slowly. Which statement best explains this?", "o": ["The ΔG must actually be positive in water", "A negative ΔG means the reaction is favorable, not fast. It has a high activation energy, so without an enzyme it is slow", "ATP hydrolysis only happens inside cells, never in a test tube", "Water inhibits the reaction by lowering ΔG"], "a": 1, "why": "Spontaneity (ΔG) and rate (activation energy) are independent. Enzymes speed reactions up by lowering the activation energy.", "trap": "Spontaneous does not mean fast.", "src": "Redacted Q21 · fill-in C"}, {"id": "b13-r22a", "ch": 1, "topic": "Enzyme mechanism", "heat": "red", "q": "Enzymes bind and stabilize the transition state of their reaction. Researchers design a stable molecule with the same shape and charge distribution as enzyme T's transition state. What happens when it is added to enzyme T and its substrate?", "o": ["It speeds up the reaction by lowering the activation energy even further", "It makes the reaction more favorable by making ΔG more negative", "It is quickly converted to product and released", "It binds an allosteric site and switches the enzyme on", "It binds the active site very tightly and acts as a potent competitive inhibitor, slowing the reaction"], "a": 4, "why": "The active site is shaped to fit the transition state best, so a stable mimic binds tighter than the substrate and blocks the site.", "trap": "Nothing that binds the enzyme changes ΔG. And a stable analog cannot finish the reaction, so it just sits there.", "src": "Redacted Q22 · fill-in A"}, {"id": "b13-r22b", "ch": 1, "topic": "Enzyme mechanism", "heat": "red", "q": "A transition-state analog is added to enzyme T. Which statement about its effect is correct?", "o": ["The reaction's ΔG becomes positive", "The equilibrium shifts toward products", "The reaction slows, but its ΔG and equilibrium position are unchanged", "The enzyme is permanently denatured", "The reaction speeds up because the enzyme is saturated"], "a": 2, "why": "Inhibitors affect rate only. ΔG depends on reactants and products, and enzymes or inhibitors cannot change it.", "trap": "Rate and thermodynamics are separate.", "src": "Redacted Q22 · fill-in B"}, {"id": "b13-r22c", "ch": 1, "topic": "Enzyme mechanism", "heat": "red", "q": "A stable molecule resembling the substrate's transition state inhibits enzyme T. Where does it bind, and how does it inhibit?", "o": ["At an allosteric site, changing the enzyme's shape", "On the substrate, blocking it from binding", "In the active site, competing with substrate", "In the active site, covalently breaking the enzyme's peptide bonds"], "a": 2, "why": "It mimics what the active site binds best, so it occupies the active site. That is competitive inhibition.", "trap": "Allosteric inhibitors bind a different site. A transition-state analog targets the active site.", "src": "Redacted Q22 · fill-in C"}, {"id": "b13-r23a", "ch": 1, "topic": "Energy coupling", "heat": "red", "q": "Cells make zorbine with the enzyme zorbase. Reaction 1: X + Y → zorbine, ΔG = +4.0 kcal/mol. Reaction 2: ATP → ADP + Pi, ΔG = -7.3 kcal/mol. Zorbase binds X, Y and ATP together in its active site. ATP is plentiful. Will zorbine accumulate?", "o": ["No: reaction 1 has a positive ΔG, and enzymes cannot change that", "Yes: the enzyme couples the reactions, so the overall ΔG is -3.3 kcal/mol", "Yes: ATP hydrolysis anywhere in the cell supplies the energy", "No: the overall ΔG is +11.3 kcal/mol"], "a": 1, "why": "Coupling works when one enzyme links both reactions. Add the ΔGs: +4.0 + (-7.3) = -3.3, so the coupled reaction is favorable.", "trap": "Add the ΔG values with their signs.", "src": "Redacted Q23 · fill-in A"}, {"id": "b13-r23b", "ch": 1, "topic": "Energy coupling", "heat": "red", "q": "Same reactions: X + Y → zorbine (+4.0 kcal/mol) and ATP → ADP + Pi (-7.3 kcal/mol). In a mutant, zorbase can no longer bind ATP. ATP is still hydrolyzed by other enzymes elsewhere in the cell. Will zorbine accumulate?", "o": ["No: ATP hydrolyzed separately just releases heat, so reaction 1 stays at +4.0 and is unfavorable", "Yes: the cell's total ΔG is still negative", "Yes: zorbase lowers the activation energy, which makes reaction 1 favorable", "No: zorbase is now denatured"], "a": 0, "why": "Energy only transfers when both reactions happen together in the same active site. Separate ATP hydrolysis is not coupled.", "trap": "A negative ΔG somewhere else in the cell does not pay for this reaction.", "src": "Redacted Q23 · fill-in B"}, {"id": "b13-r23c", "ch": 1, "topic": "Energy coupling", "heat": "red", "q": "Same reactions: X + Y → zorbine (+4.0 kcal/mol) and ATP → ADP + Pi (-7.3 kcal/mol). Zorbase is present and normal, but the cell has run out of ATP. Will zorbine accumulate?", "o": ["Yes: zorbase speeds the reaction up enough to make product", "Yes: the enzyme lowers ΔG to a negative value", "No: zorbase only works in reverse", "No: without ATP to couple, reaction 1 is unfavorable, and an enzyme alone cannot make it favorable"], "a": 3, "why": "Enzymes change rate, never direction. With no ATP there is nothing to pay the +4.0.", "trap": "Lowering activation energy does not change ΔG.", "src": "Redacted Q23 · fill-in C"}, {"id": "b13-r24a", "ch": 1, "topic": "Enzyme limits", "heat": "red", "q": "A reaction has a ΔG of about +5 kcal/mol. A startup claims its new enzyme is so efficient that the reaction will run forward on its own with no energy input. Which is the best evaluation?", "o": ["Plausible: very efficient enzymes can make any reaction spontaneous", "Plausible, if the enzyme is present in large amounts", "Impossible: enzymes lower activation energy but cannot change ΔG, so an unfavorable reaction stays unfavorable", "Impossible, because enzymes cannot speed up reactions"], "a": 2, "why": "Enzymes change the path (activation energy), not the start and end points (ΔG). Running uphill needs coupling.", "trap": "Enzymes CAN speed reactions. They cannot reverse an uphill one.", "src": "Redacted Q24 · fill-in A"}, {"id": "b13-r24b", "ch": 1, "topic": "Enzyme limits", "heat": "red", "q": "A reaction has a ΔG of about -6 kcal/mol but runs very slowly without help. A startup claims its enzyme speeds the reaction up a millionfold. Which is the best evaluation?", "o": ["Impossible: enzymes cannot speed reactions by more than a few fold", "Plausible: enzymes can speed favorable reactions enormously by lowering the activation energy", "Impossible: a reaction with negative ΔG is already as fast as it can be", "Plausible, but only because the enzyme makes ΔG more negative"], "a": 1, "why": "Speeding up is exactly what enzymes do. Rate enhancements of a million times or more are common.", "trap": "Negative ΔG does not mean fast. And the enzyme leaves ΔG unchanged.", "src": "Redacted Q24 · fill-in B"}, {"id": "b13-r24c", "ch": 1, "topic": "Enzyme limits", "heat": "red", "q": "A reaction has a ΔG of about -6 kcal/mol. A startup claims its enzyme makes the reaction release -12 kcal/mol per reaction and push all reactants completely to product. Which is the best evaluation?", "o": ["Impossible: an enzyme cannot change the energy released or the equilibrium position, only how fast equilibrium is reached", "Plausible: better enzymes release more energy", "Plausible: enzymes shift equilibrium toward products", "Impossible, because enzymes are used up in reactions"], "a": 0, "why": "ΔG and equilibrium are set by reactants and products. An enzyme speeds both directions equally, so the equilibrium position is unchanged.", "trap": "Enzymes are not consumed, and they do not shift equilibrium.", "src": "Redacted Q24 · fill-in C"}, {"id": "b13-r25a", "ch": 1, "topic": "Reaction coordinate diagrams", "heat": "red", "q": "Four reaction coordinate diagrams share one free-energy scale (arbitrary units). Diagram 1: reactants 50, peak 60, products 20. Diagram 2: reactants 50, peak 120, products 20. Diagram 3: reactants 10, peak 90, products 40. Diagram 4: reactants 70, peak 75, products 30. Which reaction could occur at a useful rate in a cell ONLY if an enzyme is present?", "o": ["Diagram 1", "Diagram 3", "Diagram 4", "Diagram 2"], "a": 3, "why": "Diagram 2 is downhill (ΔG = 20 - 50 = -30) but has a huge hump (activation energy 70). An enzyme lowers the hump.", "trap": "Diagram 3 is uphill. An enzyme never rescues an uphill reaction. It needs coupling.", "src": "Redacted Q25 · fill-in A", "fig": {"src": "fig/b13-r25a.svg", "alt": "Four reaction coordinate diagrams on one shared free-energy scale from 0 to 140. Diagram 1: reactants 50, peak 60, products 20. Diagram 2: reactants 50, peak 120, products 20. Diagram 3: reactants 10, peak 90, products 40. Diagram 4: reactants 70, peak 75, products 30."}}, {"id": "b13-r25b", "ch": 1, "topic": "Reaction coordinate diagrams", "heat": "red", "q": "Same four diagrams. 1: reactants 50, peak 60, products 20. 2: reactants 50, peak 120, products 20. 3: reactants 10, peak 90, products 40. 4: reactants 70, peak 75, products 30. Which reaction could occur in a cell only if coupled to a favorable reaction such as ATP hydrolysis?", "o": ["Diagram 2", "Diagram 1", "Diagram 3", "Diagram 4"], "a": 2, "why": "ΔG = products minus reactants. Only diagram 3 goes uphill (40 - 10 = +30), so it needs energy paid in by coupling.", "trap": "A high peak alone means slow, not unfavorable.", "src": "Redacted Q25 · fill-in B", "fig": {"src": "fig/b13-r25b.svg", "alt": "Four reaction coordinate diagrams on one shared free-energy scale from 0 to 140. Diagram 1: reactants 50, peak 60, products 20. Diagram 2: reactants 50, peak 120, products 20. Diagram 3: reactants 10, peak 90, products 40. Diagram 4: reactants 70, peak 75, products 30."}}, {"id": "b13-r25c", "ch": 1, "topic": "Reaction coordinate diagrams", "heat": "red", "q": "Same four diagrams. 1: reactants 50, peak 60, products 20. 2: reactants 50, peak 120, products 20. 3: reactants 10, peak 90, products 40. 4: reactants 70, peak 75, products 30. Which has the largest activation energy for the forward reaction?", "o": ["Diagram 2", "Diagram 3", "Diagram 1", "Diagram 4"], "a": 1, "why": "Activation energy = peak minus reactants. 1: 10. 2: 70. 3: 80. 4: 5.", "trap": "Diagram 2 has the highest absolute peak, but activation energy is measured from where the reactants start.", "src": "Redacted Q25 · fill-in C", "fig": {"src": "fig/b13-r25c.svg", "alt": "Four reaction coordinate diagrams on one shared free-energy scale from 0 to 140. Diagram 1: reactants 50, peak 60, products 20. Diagram 2: reactants 50, peak 120, products 20. Diagram 3: reactants 10, peak 90, products 40. Diagram 4: reactants 70, peak 75, products 30."}}, {"id": "b13-w1", "ch": 2, "topic": "Protease cut sites", "heat": "red", "q": "Trypsin cuts on the C-terminal side of lysine and arginine. What are the products when N-Gly-Lys-Arg-Ser-C is fully digested?", "o": ["A dipeptide and two single amino acids", "A single amino acid and a tripeptide", "Two dipeptides", "Four single amino acids"], "a": 0, "why": "Cut after Lys (Lys|Arg) and after Arg (Arg|Ser). The products are Gly-Lys, Arg and Ser.", "trap": "Two adjacent targets give you a free single amino acid between the cuts.", "src": "Weak spot · trypsin", "fig": {"src": "fig/b13-w1.svg", "alt": "Skeletal structure of the tetrapeptide N-Gly-Lys-Arg-Ser-C in its neutral (non-ionized) form, with the free backbone NH2 (N-terminus) and the free COOH (C-terminus) visible. No cut site is marked."}}, {"id": "b13-w2", "ch": 2, "topic": "Peptide orientation", "heat": "red", "q": "A tetrapeptide is drawn with a free carboxyl group (COO-) on the LEFT end and a free amino group (NH3+) on the RIGHT end. Which way does the sequence read from N-terminus to C-terminus?", "o": ["Left to right", "It cannot be determined from the drawing", "From the middle outward", "Right to left"], "a": 3, "why": "The N-terminus is the end with the free amino group, wherever it is drawn. Here that is the right end.", "trap": "Do not assume left is the N-terminus. Find the free NH3+.", "src": "Weak spot · N and C ends", "fig": {"src": "fig/b13-w2.svg", "alt": "Skeletal structure of a tetrapeptide in ionized form: a free COO- at the far LEFT end and a free NH3+ at the far RIGHT end, joined by three peptide bonds. Side chains, from the right-hand residue: none (glycine), CH3 (alanine), CH2OH (serine), CH(CH3)2 (valine)."}}, {"id": "b13-w3", "ch": 2, "topic": "Peptide orientation", "heat": "red", "q": "In a polypeptide, which statement about a single amino acid residue is correct?", "o": ["Its R group is part of the peptide bond", "The peptide bond links two R groups", "Its alpha carbon is bonded to an H, an R group, the backbone N on one side and the backbone carbonyl carbon on the other", "Its alpha carbon carries the carbonyl oxygen"], "a": 2, "why": "The alpha carbon is the central carbon, holding H and R. The peptide bond joins the carbonyl C of one residue to the N of the next.", "trap": "R groups stick out from the backbone. They are never in the peptide bond.", "src": "Weak spot · N and C ends"}, {"id": "b13-w4", "ch": 2, "topic": "Ring sugars", "heat": "red", "q": "When linear glucose cyclizes into a six-membered ring, what happens to the oxygen of the carbonyl group on C1?", "o": ["It becomes the ring oxygen", "It becomes the -OH on C1, the anomeric carbon", "It is released as water", "It moves to C6"], "a": 1, "why": "The C5 hydroxyl attacks the carbonyl carbon. The C5 oxygen becomes the ring oxygen, and the old carbonyl O picks up an H to become the new -OH on C1.", "trap": "This is your known miss: the carbonyl O does NOT become the ring oxygen.", "src": "Weak spot · ring formation"}, {"id": "b13-w5", "ch": 2, "topic": "Ring sugars", "heat": "red", "q": "When glucose forms its six-membered ring, where does the ring oxygen come from?", "o": ["The oxygen of the hydroxyl group on C5", "The carbonyl oxygen on C1", "A water molecule", "The oxygen on C6"], "a": 0, "why": "C5's -OH oxygen bonds to C1, closing the ring through that oxygen.", "trap": "Carbonyl O becomes the OH; C5's O becomes the ring O.", "src": "Weak spot · ring formation"}, {"id": "b13-w6", "ch": 2, "topic": "Ring sugars", "heat": "red", "q": "In the six-membered ring form of glucose, how do you spot the carbon that was the carbonyl carbon in the linear form?", "o": ["It is the carbon carrying the -CH2OH group", "It is the carbon farthest from the ring oxygen", "It is the only carbon with two hydrogens", "It is the carbon bonded to both the ring oxygen and an -OH (the anomeric carbon)"], "a": 3, "why": "The anomeric carbon (C1 in glucose) is the one flanked by the ring O and an -OH: the old carbonyl C.", "trap": "The carbon with -CH2OH attached is C5, on the other side of the ring O.", "src": "Weak spot · ring formation"}, {"id": "b13-w7", "ch": 2, "topic": "SDS-PAGE", "heat": "red", "q": "A protein has two identical 30 kDa subunits joined only by a disulfide bond. It is run on SDS-PAGE with SDS and heat but NO reducing agent. Where is the band?", "o": ["30 kDa", "Two bands, at 30 and 60 kDa", "60 kDa", "No band, because SDS digests the protein"], "a": 2, "why": "SDS and heat break noncovalent interactions but not disulfides, so the subunits stay joined: 60 kDa.", "trap": "Only a reducing agent breaks disulfide bonds.", "src": "Weak spot · reducing agent"}, {"id": "b13-w8", "ch": 2, "topic": "SDS-PAGE", "heat": "red", "q": "A protein has two identical 30 kDa subunits held together only by hydrogen bonds and hydrophobic interactions. It is run on SDS-PAGE with SDS and heat but NO reducing agent. Where is the band?", "o": ["60 kDa", "30 kDa", "Two bands, at 30 and 60 kDa", "15 kDa"], "a": 1, "why": "Those interactions are noncovalent, and SDS plus heat break them, so the subunits separate even without reducing agent.", "trap": "A reducing agent is only needed when disulfides hold the subunits.", "src": "Weak spot · reducing agent"}, {"id": "b13-w9", "ch": 2, "topic": "SDS-PAGE", "heat": "red", "q": "Three proteins of the same size are run on a gel WITHOUT SDS, with the positive electrode at the bottom. Their net charges are -5, 0 and +3. Which runs farthest toward the bottom?", "o": ["The -5 protein", "The +3 protein", "The 0 protein", "All run the same distance, because they are the same size"], "a": 0, "why": "Without SDS, native charge decides. The most negative protein is pulled hardest toward the positive electrode. +3 moves the wrong way and 0 barely moves.", "trap": "Same size only means same migration when SDS has coated everything with the same charge.", "src": "Weak spot · gel without SDS"}, {"id": "b13-w10", "ch": 2, "topic": "SDS-PAGE", "heat": "red", "q": "A protein run with SDS, heat and reducing agent gives one band at 25 kDa. The same protein chemically cross-linked first, then run the same way, gives one band at about 50 kDa. What must be true?", "o": ["The protein is a single 50 kDa chain", "The protein has two subunits of different sizes", "The subunits are held together by disulfide bonds", "The protein has at least two subunits of identical size"], "a": 3, "why": "A single 25 kDa band means every chain is the same size. Cross-linking locked them together, revealing a multi-subunit protein. This is the course's Quixote question.", "trap": "Nothing here tells you what normally holds the subunits together.", "src": "Weak spot · cross-linking"}, {"id": "b13-w11", "ch": 2, "topic": "Quaternary structure", "heat": "red", "q": "A functional protein is made of three identical polypeptide chains. How is it classified?", "o": ["Heterotrimer", "Homodimer", "Homotrimer", "Heterotetramer"], "a": 2, "why": "Three chains is a trimer. All identical makes it homo.", "trap": "Homo = all chains identical; hetero = at least two different kinds.", "src": "Weak spot · naming"}, {"id": "b13-w12", "ch": 2, "topic": "Quaternary structure", "heat": "red", "q": "A protein is made of two 15 kDa alpha chains and two 17 kDa beta chains, held together noncovalently. All of the following are true EXCEPT:", "o": ["It has quaternary structure", "It is a homodimer", "It is a heterotetramer", "On SDS-PAGE with reducing agent it would show two bands"], "a": 1, "why": "Four chains of two kinds is a heterotetramer, like hemoglobin. SDS-PAGE separates the chains into a 15 band and a 17 band.", "trap": "Read EXCEPT. You are looking for the false statement.", "src": "Weak spot · naming"}, {"id": "b13-w13", "ch": 2, "topic": "Fatty acids", "heat": "red", "q": "Which fatty acid has the LOWEST melting point?", "o": ["18 carbons, 2 double bonds", "18 carbons, 0 double bonds", "12 carbons, 0 double bonds", "22 carbons, 1 double bond"], "a": 0, "why": "Double bonds add kinks that disrupt packing, which matters most here. Two double bonds at 18 carbons beat a short saturated chain. This is the linoleic acid case.", "trap": "Shortness helps, but the 12-carbon saturated chain still packs straight.", "src": "Weak spot · melting point levers"}, {"id": "b13-w14", "ch": 2, "topic": "Fatty acids", "heat": "red", "q": "Two saturated fatty acids have 12 and 20 carbons. Which has the lower melting point, and why?", "o": ["The 20-carbon one: longer chains have more kinks", "The 12-carbon one: it has more double bonds", "They melt at the same temperature, because both are saturated", "The 12-carbon one: shorter chains have fewer van der Waals contacts to break"], "a": 3, "why": "With unsaturation equal, length decides. Shorter means less contact, which means lower melting point.", "trap": "Saturated means no double bonds at all, so neither has kinks.", "src": "Weak spot · melting point levers"}, {"id": "b13-w15", "ch": 2, "topic": "pH and equilibrium", "heat": "red", "q": "A carboxyl group is in equilibrium: ~COOH ⇌ ~COO- + H+. What happens at pH 2?", "o": ["The equilibrium shifts right, so most groups are ~COO-", "Nothing changes, because pH does not affect functional groups", "The equilibrium shifts left, so most groups are ~COOH and uncharged", "The carboxyl group gains a positive charge"], "a": 2, "why": "pH 2 means a lot of H+. Adding product (H+) pushes the equilibrium back toward reactants: protonated, neutral COOH.", "trap": "Your known miss: low pH shifts it LEFT, not right.", "src": "Weak spot · Le Chatelier"}, {"id": "b13-w16", "ch": 2, "topic": "pH and equilibrium", "heat": "red", "q": "An amino group is in equilibrium: ~NH3+ ⇌ ~NH2 + H+. What happens at pH 12?", "o": ["The equilibrium shifts left, so most groups are ~NH3+", "The equilibrium shifts right, so most groups are ~NH2 and uncharged", "The amino group becomes negatively charged", "Nothing changes"], "a": 1, "why": "High pH means very little H+. Removing a product pulls the equilibrium to the right.", "trap": "Low H+ means groups lose protons; high H+ means they keep or gain them.", "src": "Weak spot · Le Chatelier"}, {"id": "b13-w17", "ch": 2, "topic": "Entropy", "heat": "red", "q": "A cell uses ATP to pump Ca2+ out of its cytoplasm, building a large concentration gradient. What is the sign of ΔS for the ion movement itself?", "o": ["Negative: concentrating ions on one side is a more ordered arrangement", "Positive: ions are moving, so disorder increases", "Zero: the ions are only changing location", "Positive, because ATP is used"], "a": 0, "why": "Building a gradient is the opposite of diffusion. It concentrates particles, decreasing entropy, which is why it needs energy coupled from ATP.", "trap": "Your known miss: building a gradient DECREASES entropy.", "src": "Weak spot · gradients"}, {"id": "b13-w18", "ch": 2, "topic": "Polysaccharides", "heat": "red", "q": "Humans digest starch but not cellulose, even though both are polymers of glucose. What is the best explanation?", "o": ["Cellulose is made of fructose, not glucose", "Cellulose is held together by peptide bonds", "Starch has more hydrogen bonds than cellulose", "Starch has alpha glycosidic linkages and cellulose has beta linkages. The different linkage gives a different shape, and our enzymes fit only the alpha form"], "a": 3, "why": "Same monomer, different linkage geometry. Alpha linkages make a helix; beta linkages make straight chains our amylase cannot fit.", "trap": "The answer must be about alpha vs beta linkages and shape.", "src": "Weak spot · starch vs cellulose"}, {"id": "b13-w19", "ch": 2, "topic": "Polysaccharides", "heat": "red", "q": "Why does cellulose form strong structural fibers while starch does not?", "o": ["Alpha linkages make cellulose coil into a tight helix", "Cellulose has covalent bonds between chains", "Beta linkages make straight chains that lie side by side and hydrogen bond to neighbouring chains in a strong network", "Cellulose contains phosphate groups that form ionic bonds"], "a": 2, "why": "Straight beta-linked chains can line up and hydrogen bond along their length. Starch's alpha linkages make helices that cannot pack into fibers.", "trap": "The strength comes from many hydrogen bonds between chains, not covalent cross-links.", "src": "Weak spot · starch vs cellulose"}, {"id": "b13-t1", "ch": 3, "topic": "pH and membranes", "heat": "orange", "q": "A drug's only ionizable group is a carboxyl (~COOH ⇌ ~COO- + H+). Where is the drug most able to cross cell membranes unaided?", "o": ["In blood at pH 7.4, where it is mostly charged", "In the stomach at pH 2, where it is mostly protonated and uncharged", "Equally at both pH values, because pH does not affect membranes", "Neither, because carboxyl groups are always charged"], "a": 1, "why": "At low pH the equilibrium shifts left to neutral COOH, and uncharged molecules pass the nonpolar core more easily.", "trap": "Charge blocks unaided crossing, and pH decides the charge.", "src": "Toughest · combines pH + membranes"}, {"id": "b13-t2", "ch": 3, "topic": "Energy coupling", "heat": "orange", "q": "The Na+/glucose symporter moves glucose into a cell against its gradient. If the Na+ gradient is abolished so Na+ is equal on both sides, what happens to glucose uptake against its gradient?", "o": ["It stops, because Na+ moving down its gradient was what paid for moving glucose up its gradient", "It continues, because the symporter is a protein", "It speeds up, because Na+ no longer competes", "It continues, using ATP bound directly to glucose"], "a": 0, "why": "Na+ transport is exergonic, glucose transport is endergonic, and the coupled process works only while Na+ has a gradient to run down.", "trap": "A transport protein does not supply energy by itself.", "src": "Toughest · symporter"}, {"id": "b13-t3", "ch": 3, "topic": "Thermodynamics", "heat": "orange", "q": "A reaction releases heat (ΔH < 0) but is nonspontaneous (ΔG > 0). What must be true?", "o": ["Its entropy increases", "Its ΔG must actually be negative", "It will become spontaneous if an enzyme is added", "Its entropy decreases enough to outweigh the heat released"], "a": 3, "why": "ΔG = ΔH - TΔS. With ΔH negative, ΔG can only be positive if -TΔS is large and positive, meaning ΔS is negative.", "trap": "This exact combination is in the course key: exothermic yet endergonic means entropy decreases.", "src": "Toughest · signs"}, {"id": "b13-t4", "ch": 3, "topic": "Enzyme regulation", "heat": "orange", "q": "Molecule R slows enzyme Q. R binds a site far from the active site, and adding a large excess of substrate does not restore the rate. What kind of inhibitor is R?", "o": ["A competitive inhibitor", "A transition-state analog", "An allosteric inhibitor that changes the enzyme's shape", "A cofactor"], "a": 2, "why": "Binding away from the active site, with substrate unable to outcompete it, points to an allosteric effect on the enzyme's shape.", "trap": "Competitive inhibitors are overcome by more substrate.", "src": "Toughest · inhibitor type"}, {"id": "b13-t5", "ch": 3, "topic": "SDS-PAGE", "heat": "orange", "q": "A 40 kDa single-chain protein has a disulfide bond between two cysteines near opposite ends. A protease cuts one peptide bond in the loop between them, making 15 and 25 kDa pieces. On SDS-PAGE WITHOUT reducing agent, what does the cut protein show?", "o": ["Two bands, at 15 and 25 kDa", "One band at about 40 kDa", "One band at 25 kDa", "Three bands, at 15, 25 and 40 kDa"], "a": 1, "why": "The disulfide still holds the two pieces together, so they run as one unit. With reducing agent you would see 15 and 25.", "trap": "A cut backbone stays joined if a disulfide bridges the cut.", "src": "Toughest · protease + disulfide"}, {"id": "b13-t6", "ch": 3, "topic": "Hydrogen bonds", "heat": "orange", "q": "Which pair can form a hydrogen bond?", "o": ["The H of a hydroxyl group and the O of a carbonyl group", "The H of a methyl group and the O of a carbonyl group", "The H of a C-H bond and the O of water", "The H of a sulfhydryl group and the C of a methyl group"], "a": 0, "why": "A hydrogen bond needs H on O or N (donor) and an O or N with a lone pair (acceptor). Hydroxyl H to carbonyl O fits.", "trap": "H bonded to carbon cannot hydrogen bond, and carbon is not an acceptor.", "src": "Toughest · donors and acceptors"}, {"id": "b13-t7", "ch": 3, "topic": "Electronegativity", "heat": "orange", "q": "In formaldehyde (H2C=O), which atom carries a partial positive charge from the C=O bond?", "o": ["The oxygen", "Both hydrogens, strongly", "No atom, because the molecule is nonpolar", "The carbon"], "a": 3, "why": "Oxygen pulls the shared electrons, so O is partially negative and C is partially positive, just like C in CO2. C-H bonds are essentially nonpolar.", "trap": "The C=O double bond is polar even though C-H bonds are not.", "src": "Toughest · partial charges"}, {"id": "b13-t8", "ch": 3, "topic": "pH and equilibrium", "heat": "orange", "q": "In blood: CO2 + H2O ⇌ H2CO3 ⇌ H+ + HCO3-. A person hyperventilates and breathes out extra CO2. What happens to blood pH?", "o": ["It falls, because more H2CO3 forms", "It stays the same, because blood is buffered completely", "It rises, because removing CO2 shifts the equilibrium left and lowers H+", "It falls, because breathing adds H+"], "a": 2, "why": "Removing a reactant pulls everything toward the reactant side, using up H+. Less H+ means higher pH.", "trap": "pH goes in the opposite direction to H+ concentration.", "src": "Toughest · blood CO2"}, {"id": "b13-t9", "ch": 3, "topic": "Enzymes and structure", "heat": "orange", "q": "Raising the temperature from 37 °C to 70 °C makes a human enzyme's rate drop sharply. What is the best explanation?", "o": ["Heat breaks the peptide bonds of the enzyme", "Heat disrupts the noncovalent interactions holding tertiary structure, so the active site loses its shape", "Heat makes the reaction's ΔG positive", "Higher temperature always slows reactions"], "a": 1, "why": "Folding depends on weak interactions. Too much heat unfolds the enzyme (denaturation), destroying the active site even though the sequence is intact.", "trap": "Denaturation does not break peptide bonds.", "src": "Toughest · denaturation"}, {"id": "b13-t10", "ch": 3, "topic": "Enzyme kinetics", "heat": "orange", "q": "An enzyme is already working at its maximum rate. Doubling the substrate concentration will:", "o": ["Barely change the rate, because all active sites are already occupied", "Double the rate", "Halve the rate", "Change ΔG"], "a": 0, "why": "At saturation every active site is busy. More substrate cannot speed things up; only more enzyme could.", "trap": "Rate rises with substrate only until the enzyme is saturated.", "src": "Toughest · saturation"}, {"id": "b13-t11", "ch": 3, "topic": "Condensation and hydrolysis", "heat": "orange", "q": "Four glucose molecules (C6H12O6) are joined into a chain by condensation. What is the formula of the product?", "o": ["C24H48O24", "C24H40O20", "C24H44O22", "C24H42O21"], "a": 3, "why": "Four glucose: C24H48O24. Joining four units makes three linkages, releasing three H2O: C24H42O21. The course's 10-glucose example works the same way (C60H102O51).", "trap": "n monomers make n - 1 linkages, not n.", "src": "Toughest · formula"}, {"id": "b13-t12", "ch": 3, "topic": "Nucleic acids", "heat": "orange", "q": "A double-stranded DNA sample is 18% thymine. What percent is guanine?", "o": ["18%", "36%", "32%", "64%"], "a": 2, "why": "A = T = 18%, so A + T = 36%. That leaves 64% for G + C, which split evenly: 32% each.", "trap": "Split the remainder between G and C.", "src": "Toughest · Chargaff"}, {"id": "b13-t13", "ch": 3, "topic": "Membrane permeability", "heat": "orange", "q": "Which crosses a pure phospholipid bilayer fastest unaided?", "o": ["Glucose", "O2", "Na+", "An amino acid"], "a": 1, "why": "Small and nonpolar is the winning combination. Glucose is polar, Na+ is charged, and an amino acid is charged at both ends at physiological pH.", "trap": "Amino acids, even hydrophobic ones, carry charged NH3+ and COO- groups.", "src": "Toughest · ranking"}, {"id": "b13-t14", "ch": 3, "topic": "Membrane transport", "heat": "orange", "q": "Glucose enters a cell through a GLUT protein, moving from high to low concentration with no ATP used. This is:", "o": ["Facilitated diffusion", "Simple diffusion", "Active transport", "Osmosis"], "a": 0, "why": "A protein is needed but no energy, because glucose moves down its gradient.", "trap": "Using a protein does not make transport active. Active means against the gradient with an energy cost.", "src": "Toughest · classify"}, {"id": "b13-t15", "ch": 3, "topic": "Thermodynamics", "heat": "orange", "q": "A reaction has ΔG = -30 kcal/mol, but no product forms after days at room temperature. What best explains this?", "o": ["ΔG must be positive", "The reaction is at equilibrium", "Product forms, but it is invisible", "It has a very high activation energy, so it is favorable but extremely slow without a catalyst"], "a": 3, "why": "Thermodynamics says it CAN go. Kinetics says how fast. A high activation barrier can make a favorable reaction take forever.", "trap": "Spontaneous does not mean fast.", "src": "Toughest · spontaneous vs fast"}, {"id": "b13-n1", "ch": 4, "topic": "Linkages", "heat": "yellow", "q": "Which linkage joins the nucleotides of a nucleic acid strand?", "o": ["Glycosidic", "Peptide", "Phosphodiester", "Ester"], "a": 2, "why": "Nucleic acids: phosphodiester. Carbohydrates: glycosidic. Proteins: peptide. Lipids: ester.", "trap": "Glycosidic joins sugars.", "src": "Niche"}, {"id": "b13-n2", "ch": 4, "topic": "Linkages", "heat": "yellow", "q": "Which linkage attaches fatty acids to glycerol in a triglyceride?", "o": ["Glycosidic", "Ester", "Phosphodiester", "Peptide"], "a": 1, "why": "A carboxyl group on the fatty acid condenses with an -OH on glycerol to form an ester.", "trap": "Triglycerides have no phosphate, so not phosphodiester.", "src": "Niche"}, {"id": "b13-n3", "ch": 4, "topic": "Nucleotides", "heat": "yellow", "q": "Which bases are purines?", "o": ["Adenine and guanine", "Cytosine and thymine", "Cytosine and uracil", "Adenine and thymine"], "a": 0, "why": "Purines are the double-ring bases, A and G. Pyrimidines are single-ring: C, T, U.", "trap": "Memory hook: Pure As Gold = purines are A and G.", "src": "Niche"}, {"id": "b13-n4", "ch": 4, "topic": "DNA vs RNA", "heat": "yellow", "q": "All of the following describe RNA EXCEPT:", "o": ["It contains uracil instead of thymine", "Its sugar is ribose", "It is usually single-stranded", "Its sugar lacks an -OH on the 2' carbon"], "a": 3, "why": "RNA's ribose HAS a 2' -OH. DNA's deoxyribose lacks it. That is how the course's no-2'-OH strand was identified as DNA.", "trap": "EXCEPT: find the false one.", "src": "Niche"}, {"id": "b13-n5", "ch": 4, "topic": "Valence", "heat": "yellow", "q": "Nitrogen has 5 valence electrons. How many covalent bonds does it usually form?", "o": ["5", "4", "3", "1"], "a": 2, "why": "It needs 3 more electrons to fill its shell, so it forms 3 bonds. That is a valence number of 3.", "trap": "Valence electrons (5) are not the same as bonds formed (3).", "src": "Niche"}, {"id": "b13-n6", "ch": 4, "topic": "Monosaccharides", "heat": "yellow", "q": "Glucose is best classified as:", "o": ["A ketohexose", "An aldohexose", "An aldopentose", "A ketopentose"], "a": 1, "why": "Six carbons with the carbonyl at the end (an aldehyde). Fructose is the ketohexose.", "trap": "Aldo = carbonyl at the end; keto = carbonyl inside the chain.", "src": "Niche"}, {"id": "b13-n7", "ch": 4, "topic": "Polarity", "heat": "yellow", "q": "Which bond is nonpolar?", "o": ["C-H", "O-H", "N-H", "C-O"], "a": 0, "why": "Carbon and hydrogen have similar electronegativity. The course also lists C-S and S-H as nonpolar.", "trap": "Bonds to O or N are polar.", "src": "Niche"}, {"id": "b13-n8", "ch": 4, "topic": "Lipids", "heat": "yellow", "q": "Which is NOT one of the three major types of lipid in cells?", "o": ["Triglycerides (fats)", "Phospholipids", "Steroids", "Cholesterol esters"], "a": 3, "why": "Per the course key, the major types are triglycerides, phospholipids and steroids.", "trap": "Cholesterol is a steroid, but cholesterol esters are not a major class.", "src": "Niche"}, {"id": "b13-n9", "ch": 4, "topic": "Cell types", "heat": "yellow", "q": "Which structure is found ONLY in eukaryotic cells?", "o": ["Ribosomes", "The plasma membrane", "The nucleus", "DNA"], "a": 2, "why": "Eukaryotes are defined by a nucleus and membrane-bound organelles. Ribosomes, membranes and DNA are in both cell types.", "trap": "Prokaryotes have ribosomes too.", "src": "Niche"}, {"id": "b13-n10", "ch": 4, "topic": "Chemical interactions", "heat": "yellow", "q": "Rank these from strongest to weakest in water: covalent bond, ionic bond, hydrogen bond.", "o": ["Ionic > covalent > hydrogen", "Covalent > ionic > hydrogen", "Hydrogen > ionic > covalent", "Covalent > hydrogen > ionic"], "a": 1, "why": "This is the course key ranking in water. Water weakens ionic bonds a lot, but they still beat hydrogen bonds.", "trap": "In water, ionic bonds are much weaker than covalent ones.", "src": "Niche"}, {"id": "b13-n11", "ch": 4, "topic": "Functional group charges", "heat": "yellow", "q": "Which functional group is UNCHARGED at pH 7?", "o": ["Hydroxyl (-OH)", "Carboxyl (-COOH)", "Amino (-NH2 / -NH3+)", "Phosphate"], "a": 0, "why": "Carboxyl and phosphate are negative and amino is positive at pH 7. Hydroxyl is polar but does not ionize.", "trap": "Polar does not mean charged.", "src": "Niche"}, {"id": "b13-n12", "ch": 4, "topic": "Polysaccharides", "heat": "yellow", "q": "Which polysaccharide forms the cell walls of fungi and the exoskeletons of insects?", "o": ["Cellulose", "Glycogen", "Starch", "Chitin"], "a": 3, "why": "Chitin is structural in fungi and arthropods, cellulose in plants. Glycogen and starch store energy in animals and plants.", "trap": "Cellulose is plants only.", "src": "Niche"}, {"id": "b13-n13", "ch": 4, "topic": "Protein structure", "heat": "yellow", "q": "What stabilizes an alpha helix?", "o": ["Disulfide bonds between R groups", "Ionic bonds between R groups", "Hydrogen bonds between backbone C=O and N-H groups", "Hydrophobic interactions between R groups"], "a": 2, "why": "Secondary structure comes from backbone hydrogen bonds. R-group interactions build tertiary and quaternary structure.", "trap": "Course example: the gp41 helices are held by hydrogen bonds.", "src": "Niche"}, {"id": "b13-n14", "ch": 4, "topic": "Membrane transport", "heat": "yellow", "q": "Facilitated diffusion requires:", "o": ["Energy but no protein", "A transport protein but no energy input", "Both a protein and ATP", "Neither a protein nor energy"], "a": 1, "why": "It is passive (down the gradient), but the molecule needs a protein pathway through the bilayer.", "trap": "Protein does not mean active.", "src": "Niche"}, {"id": "b13-n15", "ch": 4, "topic": "Protein folding", "heat": "yellow", "q": "Which molecules help other proteins fold into their most stable shape?", "o": ["Molecular chaperones", "Prions", "Ribozymes", "Lipases"], "a": 0, "why": "Chaperones assist folding. Prions do the opposite: they cause misfolding through hydrophobic aggregation.", "trap": "Prions misfold proteins; chaperones help them fold.", "src": "Niche"}, {"id": "b13-n16", "ch": 4, "topic": "Fatty acids", "heat": "yellow", "q": "A saturated fatty acid has:", "o": ["One or more double bonds, which create kinks", "A charged tail", "A phosphate head group", "No carbon-carbon double bonds, so its tail is straight"], "a": 3, "why": "Saturated means saturated with hydrogens: no double bonds, straight tails, tight packing.", "trap": "Kinks come from unsaturation.", "src": "Niche"}, {"id": "b13-n17", "ch": 4, "topic": "Triglycerides", "heat": "yellow", "q": "Why can't triglycerides form a membrane bilayer?", "o": ["They are too polar", "They contain phosphate groups", "They lack a polar head group, so they have no hydrophilic end to face water", "They are made of amino acids"], "a": 2, "why": "A bilayer needs molecules with a polar head and nonpolar tails. Triglycerides are almost entirely nonpolar.", "trap": "Phospholipids have the polar phosphate head; triglycerides do not.", "src": "Niche"}, {"id": "b13-n18", "ch": 4, "topic": "Tonicity", "heat": "yellow", "q": "In kidney failure, a patient's blood becomes hypertonic to their cells. What happens to the cells?", "o": ["They gain water and swell", "They lose water and shrink", "Nothing, because cells pump water", "They burst"], "a": 1, "why": "Water leaves the cells toward the more concentrated blood. This is a course key fact.", "trap": "Water moves toward higher solute concentration.", "src": "Niche"}, {"id": "b13-d1", "ch": 5, "topic": "Valence and formulas", "heat": "orange", "q": "What is the molecular formula of the molecule shown? Every unlabeled vertex is a carbon with enough hydrogens to make four bonds.", "o": ["C4H7NO3", "C4H9NO3", "C4H9NO2", "C5H9NO3"], "a": 1, "why": "Count the carbons: four (the CH3 end, the carbon with OH, the alpha carbon, and the carboxyl carbon). Hydrogens: 3 on the CH3, 1 on the CH(OH) carbon, 1 on that OH, 1 on the alpha carbon, 2 on NH2, 1 on COOH, for 9. One N, three O (OH, C=O, and the OH of COOH). This is threonine.", "trap": "C4H7NO3 is what you get by counting only the H atoms that are written out. The carbons' implicit hydrogens still count.", "src": "Diagram · structure", "fig": {"src": "fig/b13d-1.svg", "alt": "Skeletal structure: a four-carbon chain. Carbon 1 is a methyl end, carbon 2 carries an OH, carbon 3 carries an NH2, carbon 4 is a carboxyl group (C=O and OH). Hydrogens on carbons are not drawn."}}, {"id": "b13-d2", "ch": 5, "topic": "Condensation and hydrolysis", "heat": "red", "q": "The dipeptide shown was made by a condensation reaction between two amino acids, alanine (C3H7NO2) and serine (C3H7NO3). What is the molecular formula of the dipeptide?", "o": ["C6H12N2O4", "C6H14N2O5", "C6H10N2O3", "C6H12N2O5"], "a": 0, "why": "Condensation joins the two amino acids and releases one water. C3H7NO2 + C3H7NO3 = C6H14N2O5, minus H2O gives C6H12N2O4. You can confirm by counting the drawing: 6 C, 12 H, 2 N, 4 O.", "trap": "C6H14N2O5 just adds the two amino acids and forgets the water that leaves when the peptide bond forms.", "src": "Diagram · structure", "fig": {"src": "fig/b13d-2.svg", "alt": "Skeletal structure of a dipeptide: H2N on the left on a carbon that carries a CH3, then a C=O bonded to an N-H (the peptide bond), then a carbon carrying CH2OH, then a COOH on the right. Hydrogens on carbons are not drawn."}}, {"id": "b13-d3", "ch": 5, "topic": "Protease cut sites", "heat": "red", "q": "Trypsin cleaves peptide bonds on the carboxyl (C-terminal) side of basic amino acids. The polypeptide is drawn in its non-ionized form. If trypsin is applied to it, what are the products?", "o": ["A single amino acid and a tripeptide", "Two single amino acids and a dipeptide", "No change, it remains a tetrapeptide", "Two dipeptides"], "a": 3, "why": "Find the N-terminus first: the backbone NH2 at the lower left, on a CH2 next to a C=O (glycine). The NH2 at the far left is the end of lysine's side chain. Reading N to C the residues are glycine (H as R group), lysine (a four-carbon chain ending in NH2, basic), phenylalanine (benzene ring) and serine (CH2OH). Lysine is the only basic residue, and trypsin cuts the peptide bond on its C side, between lysine and phenylalanine. That gives Gly-Lys and Phe-Ser: two dipeptides.", "trap": "The NH2 at the far left is the end of lysine's R group, not the N-terminus. The N-terminus is the amino group on the backbone.", "src": "Redacted Q10 · fill-in D (diagram)", "fig": {"src": "fig/b13d-3.svg", "alt": "Skeletal structure of a tetrapeptide, non-ionized. The NH2 at the far left is the END OF LYSINE'S SIDE CHAIN (four CH2 groups). The backbone starts at the lower left: an NH2-CH2-C(=O) unit (glycine, the N-terminal residue) bonded through N-H to lysine's alpha carbon. The backbone then runs right: lysine, then phenylalanine (CH2 attached to a benzene ring, drawn above), then serine (CH2OH, drawn below) carrying the free COOH at the far right (C-terminus)."}}, {"id": "b13-d4", "ch": 5, "topic": "Protease cut sites", "heat": "red", "q": "Trypsin cleaves peptide bonds on the carboxyl (C-terminal) side of basic amino acids. The polypeptide is drawn in its non-ionized form, and it is NOT necessarily drawn N-terminus on the left. If trypsin is applied to it, what are the products?", "o": ["A single amino acid and a tripeptide", "Two dipeptides", "No change, it remains a tetrapeptide", "Two single amino acids and a dipeptide"], "a": 2, "why": "Orient first. The free COOH is on the LEFT, so the C-terminus is on the left and the N-terminus (free NH2 on the backbone) is on the right. Reading N to C (right to left): serine, alanine, glycine, lysine. Lysine is basic but it is the C-terminal residue, so there is no peptide bond on its C side to cut. Nothing is cleaved.", "trap": "If you read left to right as if the left end were the N-terminus, lysine looks like residue 1 and you cut after it, getting a single amino acid and a tripeptide. Always find the free backbone NH2 and the free COOH before reading a sequence.", "src": "Redacted Q10 · fill-in E (diagram)", "fig": {"src": "fig/b13d-4.svg", "alt": "Skeletal structure of a tetrapeptide drawn right to left. The free COOH (C-terminus) is at the far LEFT, on a residue whose side chain is four CH2 groups ending in NH2 (lysine). Moving right: a residue with no side chain (glycine), a residue with CH3 (alanine), and at the far right a residue with CH2OH (serine) carrying the free backbone NH2 (N-terminus)."}}, {"id": "b13-d5", "ch": 5, "topic": "Functional group charges", "heat": "red", "q": "The tripeptide is drawn in its non-ionized form. What is its net charge at physiological pH (about 7.4)?", "o": ["-2", "-1", "0", "+1", "+2"], "a": 1, "why": "At pH 7.4 every amino group is protonated (+1) and every carboxyl group is deprotonated (-1). Count them on the drawing: amino groups are the N-terminal NH2 and lysine's side-chain NH2, so +2. Carboxyl groups are the C-terminal COOH plus the side chains of aspartate and glutamate, so -3. Net charge -1.", "trap": "Peptide-bond nitrogens are amides, not amino groups, and carry no charge. Count only the free NH2 and COOH groups.", "src": "Redacted Q9 · fill-in D (diagram)", "fig": {"src": "fig/b13d-5.svg", "alt": "Skeletal structure of a tripeptide, non-ionized: free NH2 at the left end, free COOH at the right end. Residue 1 has a CH2COOH side chain (aspartate). Residue 2 has a side chain of four CH2 groups ending in NH2 (lysine). Residue 3 has a CH2CH2COOH side chain (glutamate). Two peptide bonds (C=O bonded to N-H)."}}, {"id": "b13-d6", "ch": 5, "topic": "Peptide orientation", "heat": "red", "q": "Four atoms in the tripeptide are labeled 1 to 4. Which labeled atom belongs to the N-terminus of the tripeptide?", "o": ["Atom 1", "Atom 2", "Atom 3", "Atom 4"], "a": 1, "why": "The N-terminus is the free amino group on the backbone of the first amino acid: the NH2 bonded directly to an alpha carbon that also carries a C=O. That is atom 2. Atom 1 is the NH2 at the end of lysine's side chain, atom 3 is a nitrogen inside a peptide bond, and atom 4 is the OH of the C-terminal carboxyl group.", "trap": "Atom 1 is an NH2 too, but it hangs off the R group. A terminal amino group sits on the backbone, next to the alpha carbon.", "src": "Diagram · structure", "fig": {"src": "fig/b13d-6.svg", "alt": "Skeletal structure of a tripeptide drawn right to left. Atom 2 is the backbone NH2 on the right-hand residue (lysine), whose alpha carbon also carries a C=O and a side chain of four CH2 groups ending in NH2, which is labeled atom 1. Atom 3 is the N-H nitrogen of the first peptide bond. Atom 4 is the OH oxygen of the free COOH at the far left (C-terminus, on an alanine with a CH3 side chain)."}}, {"id": "b13-d7", "ch": 5, "topic": "Functional group charges", "heat": "orange", "q": "Cadaverine, shown here, builds up in decaying tissue. Based on its functional groups, what happens to the pH of an aqueous solution as cadaverine accumulates?", "o": ["The pH decreases, because amino groups release H+ into solution", "The pH increases, because amino groups accept H+ from solution", "The pH does not change, because cadaverine is nonpolar", "The pH decreases, because the carbon chain releases H+"], "a": 1, "why": "Both ends are amino groups (-NH2). Amino groups act as bases: they pick up H+ to become -NH3+. Removing H+ from solution raises the pH. This is the mirror image of the lactate question, where a carboxyl group releases H+ and lowers the pH.", "trap": "Releasing H+ is what carboxyl groups do. Amino groups take H+ up.", "src": "Diagram · structure", "fig": {"src": "fig/b13d-7.svg", "alt": "Skeletal structure of cadaverine: a straight chain of five carbons with an NH2 group on each end."}}, {"id": "b13-d8", "ch": 5, "topic": "C
